eased risk of developing food allergy in future", "B. Predicts poor appetite and being picky in toddlerhood", "C. Associated with later risk of obesity & metabolic syndrome", "D. Normal catch up growth indicating in-utero growth restriction", "E. Predicts tall final adult height"], "ans": "C", "ansText": "C. Associated with later risk of obesity & metabolic syndrome", "jx": "Rapid early weight gain associated with: Insulin resistance Obesity Cardiovascular diseaseR apid weight gain in early infancy (especially doubling birth weight before 4–6 months) predisposes to childhood obesity, diabetes, and cardiovascular disease in later life. Monitoring and avoiding overfeeding even with breast milk is important.", "img": []}, {"id": "5b63f532e41702db", "m": "08", "letter": "H", "inMod": 25, "code": "H25", "q": "A 12-year-old girl with obesity reports spending most of her free time watching streaming videos or playing computer games. She eats fast food 4 times a week. Which of the following lifestyle factors has the strongest evidence for increasing obesity risk in children?", "opts": ["A. Screen time >2 hours/day", "B. Eats breakfast daily", "C. Low Fruits/vegetables intake", "D. Paticipating in Sports ≥1 hour per day", "E. Sleeping >9 hours per night"], "ans": "A", "ansText": "A. Screen time >2 hours/day", "jx": "Prolonged screen time (>2 hours/day) is strongly correlated with obesity due to decreased activity , exposure to food advertising , and increased snacking . In contrast, daily breakfast, balanced diet, physical activity, and adequate sleep are protective behaviors against obesity.", "img": []}, {"id": "9a73b0687ec17f96", "m": "08", "letter": "H", "inMod": 26, "code": "H26", "q": "A mother with gestational diabetes delivers a baby weighing 4.2 kg. The baby grows rapidly during the first 6 months. What is the baby most at risk of developing later in life?", "opts": ["A. Iron deficiency anaemia", "B. Type 2 diabetes & obesity", "C. Coeliac disease", "D. Multiple food allergies", "E. Precoccious puberty"], "ans": "B", "ansText": "B. Type 2 diabetes & obesity", "jx": "Both maternal overnutrition and gestational diabetes lead to fetal overexposure to glucose and insulin, predisposing the child to metabolic diseases such as diabetes and obesity in adulthood.", "img": []}, {"id": "3511309f202bfceb", "m": "09", "letter": "I", "inMod": 1, "code": "I1", "q": "Vignette: A 2-year-old boy presents with intermittent severe abdominal pain. He draws up his legs and cries during episodes. Between episodes he appears tired. His parents report vomiting and passage of red, jelly-like stool. On examination, a sausage-shaped mass is felt in the right abdomen. Question: What is the most likely diagnosis?", "opts": ["A. Appendicitis", "B. Intussusception", "C. Gastroenteritis", "D. Meckel diverticulum", "E. Acute pancreatitis"], "ans": "B", "ansText": "B. Intussusception", "jx": "Common between 6 months and 3 years.A. Appendicitis – Incorrect. Pain becomes constant and localised ; currant jelly stool is not typical.B. Intussusception – Correct. Classic triad: Intermittent colicky pain “Currant jelly” stool (blood + mucus) Sausage-shaped abdominal massC. Gastroenteritis – Incorrect. Would cause diffuse pain and watery diarrhoea , not episodic pain with bloody mucus stool.D. Meckel diverticulum – Incorrect. May cause painless rectal bleeding, but not episodic colicky pain with palpable mass.E. Acute pancreatitis – Incorrect. Rare in toddlers; presents with epigastric pain radiating to back.", "img": []}, {"id": "41a0f97e6565a532", "m": "09", "letter": "I", "inMod": 2, "code": "I2", "q": "Vignette: A 9-month-old girl presents with severe dehydration due to gastroenteritis. She is lethargic, has a dry mouth, no tears when she cries, and a capillary refill time of 4 seconds. Question: What is the most appropriate initial treatment for this infant?", "opts": ["A. Oral Rehydration Solution", "B. Intravenous fluid resuscitation", "C. Intravenous antibiotics", "D. Intravenous anti-emetics", "E. Intravenous Glucose"], "ans": "B", "ansText": "B. Intravenous fluid resuscitation", "jx": "Severe dehydration requires rapid IV fluid resuscitation.", "img": []}, {"id": "ca0a827d810f1ba5", "m": "09", "letter": "I", "inMod": 3, "code": "I3", "q": "A 4-year-old girl who has been complaining of pain in her tummy for a month. It is worse when she goes to the toilet; her stools were firm and she was opening her bowels only every 2–3 days until recently. For the last 2 weeks her stools have become loose. On examination she has a mass in the left iliac fossa. What is the most likely diagnosis?", "opts": ["A. Appendix mass", "B. Constipation", "C. Gastroenteritis", "D. Inguinal hernia", "E. Wilms tumour"], "ans": "B", "ansText": "B. Constipation", "jx": "1. An appendix mass would be in the right iliac fossa following appendicitis.\n2. Correct. The loose stool is overflow from her constipation. Children may present with loose stools when they actually have constipation.\n3. Gastroenteritis is unlikely as there is no vomiting and the problem has been going on for a month.\n4. An inguinal hernia is not associated with loose stools. It may be associated with pain in the groin or abdomen if it is strangulated, which is not the case in this child. It is also much less common in girls than boys.\n5. Wilms tumour usually presents as an abdominal mass but as it is a renal mass it would not be confined to the left iliac fossa. Blood in the urine may be present.", "img": []}, {"id": "4e62bc66f8f49d87", "m": "09", "letter": "I", "inMod": 4, "code": "I4", "q": "A boy aged 9 months, has had a 3-day history of diarrhoea and vomiting. On examination he is found to be quiet but alert, is tachypnoeic, has a tachycardia but normal pulses, dry mouth, no mottling of the skin but reduced skin turgor and a sunken fontanelle. Capillary refill time is 2 seconds. His blood pressure is normal for his age. He continues to vomit even with oral rehydration solution given via a nasogastric tube. His plasma sodium is found to be 156 mmol/L (normal range, 135–145 mmol/L). He needs intravenous fluid as he continues to vomit. How would this fluid best be replaced?", "opts": ["A. Immediate bolus of 10 ml/kg of balanced isotonic crystalloid followed by reassessment", "B. Rehydration over 6 hours followed by repeat urea and electrolyte measurement and maintenance fluid", "C. Rehydration over 24 hours with 0.18% sodium chloride/5% glucose solution", "D. Rehydration over 24 hours with 0.9% sodium chloride/5% glucose solution", "E. Rehydration over 48 hours"], "ans": "E", "ansText": "E. Rehydration over 48 hours", "jx": "1. A bolus of intravenous fluid is not warranted as he is not in shock. Although the pulse rate is not provided, a normal capillary refill time and normal blood pressure confirm this.\n2. As he has hypernatraemic dehydration, rapid rehydration should not be given to avoid potential brain damage from cerebral oedema. This is therefore not a safe plan.\n3. Rapid rehydration should be avoided to avoid potential brain damage from cerebral oedema. In this case the use of hypotonic sodium chloride solution is dangerous as a rapid fall in serum sodium increases this child’s risk of cerebral oedema. The use of 0.18% sodium chloride solutions is now restricted in the UK.\n4. In most circumstances rehydration over 24 hours is appropriate; however, in hypernatraemic dehydration it is important to make the correction more slowly.\n5. Correct. He has hypernatraemic dehydration, so rehydration must be slow, i.e. over 48 hours to avoid cerebral oedema. In hypernatraemic dehydration the brain cells are contracted as water has moved to the extracellular compartment, as this has a higher osmolality. Changes in extracellular osmolality need to be slow to avoid rapid expansion of cells in the brain.", "img": []}, {"id": "a3b7840cd767f914", "m": "09", "letter": "I", "inMod": 5, "code": "I5", "q": "A 9-month-old infant is brought to a local health care clinic. His parents are residents of a country in West Africa and recently arrived in Europe as refugees. On examination, the infant appears malnourished and has hyperkeratotic lesions and severely dry eyes. An ophthalmic examination shows corneal abrasions.In addition to energy-calorie malnutrition, deficiency of which of the following vitamin classes best explains these findings?", "opts": ["A. Vitamin A", "B. Vitamin B", "C. Vitamin C", "D. Vitamin D", "E. Vitamin E"], "ans": "A", "ansText": "A. Vitamin A", "jx": "1. Correct. Vitamin A deficiency can be present in children with severe malnutrition. Dermatologic findings include phrynoderma, follicular papules with a central keratotic plug that tend to affect extensor surfaces. Affected patients can also have generalized xerosis (dry skin), and sparse, fragile hair. Ocular effects include night blindness, xerophthalmia (dryness), white conjunctival patches called Bitot spots, and keratomalacia (softness of the cornea).\n2. Deficiencies of B vitamins, particularly vitamin B6 (pyridoxine), vitamin B2 (riboflavin), and vitamin B3 (niacin) produce mucosal changes in the mouth, lips, and tongue. Cheilitis and glossitis are particularly common with vitamin B6 deficiency.\n3. Vitamin C deficiency is also called scurvy. In infants, it can lead to hemorrhage into the gastrointestinal and genitourinary tracts. It can also cause spongy, bleeding gingivae and corkscrew hairs with perifollicular erythema or hemorrhage in all ages.\n4. Severe and longstanding vitamin D deficiency can cause symptomatic hypocalcemia, manifesting as fasciculations, carpopedal spasm, irritability, or seizures, and musculoskeletal complications such as craniotabes, genu varum or valgum, or thickening of the wrists and ankles.\n5. Vitamin E deficiency is associated with ophthalmoplegia, anemia, and central and peripheral neuropathy.", "img": []}, {"id": "95a923627cff6204", "m": "09", "letter": "I", "inMod": 6, "code": "I6", "q": "A 3-year-old boy presents with a 3-day history of watery diarrhoea and vomiting. He has mild fever (38.2°C) but is alert and drinking small amounts. There is no blood in the stool and no recent travel history. Several children at his nursery have had similar symptoms. What is the most common cause of acute diarrhoea in this child?", "opts": ["A. Salmonella infection", "B. Viral gastroenteritis", "C. Parasitic infection (Giardia)", "D. Lactose intolerance", "E. Appendicitis"], "ans": "B", "ansText": "B. Viral gastroenteritis", "jx": "A. Salmonella infection – Incorrect.Bacterial diarrhoea more often presents with high fever, abdominal pain, and possibly blood or mucus in stool.B. Viral gastroenteritis – Correct.In children under 5, viral gastroenteritis (e.g., rotavirus, norovirus) is the most common cause of acute diarrhoea. Features include:Watery stoolsMild feverVomitingCommunity outbreaksC. Giardia – Incorrect.Typically causes chronic diarrhoea, bloating, and weight loss, not acute 3-day illness.D. Lactose intolerance – Incorrect.Causes chronic symptoms after milk ingestion, not acute febrile illness with outbreak exposure.E. Appendicitis – Incorrect.Causes abdominal pain (often localised to right iliac fossa), vomiting, and fever, but diarrhoea is not the main feature.", "img": []}, {"id": "89644f7829ea4574", "m": "09", "letter": "I", "inMod": 7, "code": "I7", "q": "A 2-month-old baby who is seen in the paediatric outpatient department. She was born at term, weighing 3.5 kg and is exclusively breastfed. Her mother is concerned as she has vomited some of the milk after most feeds since birth. She cries when she vomits. She is continuing to grow along the 50th centile. What is the most likely diagnosis?", "opts": ["A. Gastro-oesophageal reflux", "B. Helicobacter pylori infection", "C. Infant colic", "D. Overfeeding", "E. Pyloric stenosis"], "ans": "A", "ansText": "A. Gastro-oesophageal reflux", "jx": "1. Correct. Gastro-oesophageal reflux is caused by the involuntary passage of gastric contents into the lower oesophagus. Affected infants can vomit several times per day but still continue to gain weight appropriately. If complications are present, it is called gastro-oesophageal reflux disease and needs treatment.\n2. Helicobacter pylori infection presents with abdominal pain, typically in an older child.\n3. Whilst this is common, it is typified by incessant crying, often worse in the early evening lasting for a few hours.\n4. Whilst this is a common cause of vomiting, it is uncommon in breastfed babies. The clue in an examination will be that the feed volumes are significantly higher than you would expect. For a formula-fed infant, the feed volume will often be in excess of 200 ml/kg per day (normal 150 ml/kg/day).\n5. This infant is at the upper age limit for pyloric stenosis, which usually presents with progressively worsening vomiting starting 2-8 weeks after birth. It may become projectile. By 8 weeks, the weight would have plateaued or there would be weight loss. Babies are typically hungry but may become lethargic from dehydration. It is also much less common than gastro-oesophageal reflux.", "img": []}, {"id": "d3a519d568268742", "m": "09", "letter": "I", "inMod": 8, "code": "I8", "q": "A 2-year-old girl presents with fever of 39 °C and irritability. Mother reported that she was rigoring with the fever and her urine has been foul-smelling. What is the most likely diagnosis?", "opts": ["A. Viral illness", "B. Urinary tract infection", "C. Gastroenteritis", "D. Appendicitis", "E. Constipation"], "ans": "B", "ansText": "B. Urinary tract infection", "jx": "Fever + rigoring +odorous urine → UTI. Young children do not always complain of dysuria.", "img": []}, {"id": "87a34309abe57a91", "m": "09", "letter": "I", "inMod": 9, "code": "I9", "q": "An 8-month-old infant presents with 2 days of vomiting and diarrhoea. He is irritable and lethargic. Blood gas shows metabolic acidosis. Capillary refill time is 3 seconds. What is the most likely underlying cause of the metabolic acidosis?", "opts": ["A. Intestinal obstruction", "B. Pyloric stenosis", "C. Inherited metabolic disorder", "D. Gastroenteritis with dehydration", "E. Gastro-oesophageal reflux"], "ans": "D", "ansText": "D. Gastroenteritis with dehydration", "jx": "A. Intestinal obstruction – Incorrect.Would cause bilious vomiting, abdominal distension, and often constipation.B. Pyloric stenosis – Incorrect.Causes metabolic alkalosis (due to gastric acid loss), not acidosis.C. Inherited metabolic disorder – Incorrect.Would present earlier, often with hypoglycaemia, seizures, or failure to thrive.D. Gastroenteritis with dehydration – Correct.Diarrhoea leads to bicarbonate loss in stool → metabolic acidosis. Poor perfusion due to dehydration also increases lactic acid production.E. GERD – Incorrect.Does not cause dehydration or metabolic acidosis.", "img": []}, {"id": "c21357bd8a6dae1f", "m": "09", "letter": "I", "inMod": 10, "code": "I10", "q": "A 2-week-old male infant, presents to the emergency department with vomiting, diarrhoea and poor feeding.Investigations show:• sodium 112 mmol/L （normal range 133–145 mmol/L）• potassium 6.8 mmol/L （normal range 3.5–6.0 mmol/L）• urea 7.8 mmol/L （normal range 2.5–8.0 mmol/L）• creatinine 30 mmol/L （normal range 20–65 mmol/L）• blood glucose 1.7 mmol/L （normal range >2.6 mmol/L）• infection screen – negative What is the most likely cause?", "opts": ["A. Acute kidney injury", "B. Congenital adrenal hyperplasia", "C. Congenital adrenal hypoplasia", "D. Cushing syndrome", "E. Gastroenteritis"], "ans": "B", "ansText": "B. Congenital adrenal hyperplasia", "jx": "1.Hyponatraemia and hyperkalaemia may be a feature of acute kidney injury, but this child has a normal plasma urea and creatinine.\n2.Correct. The combination of marked hyponatraemia, hyperkalaemia and hypoglycaemia are suggestive of glucocorticoid deficiency, as seen in congenital adrenal hyperplasia.\n3.Much rarer than congenital adrenal hyperplasia but also can result in hyponatremia, hyperkalaemia and hypoglycaemia.\n4.An excess of glucocorticoids, as seen in Cushing syndrome, causes an intolerance to carbohydrates （hyperglycaemia）, rather than the hypoglycaemia seen in this child.\n5.Gastroenteritis can lead to hyponatraemic dehydration, but the urea would be raised and the potassium normal.", "img": []}, {"id": "7eb51ba5b1cd586b", "m": "09", "letter": "I", "inMod": 11, "code": "I11", "q": "A 2-week-old infant presents with vomiting, poor feeding, dehydration, and hyperpigmentation of the skin. Lab results show sodium 108 mmol/L, potassium 7.3 mmol/L, and low cortisol. Which enzyme deficiency most likely explains this presentation?", "opts": ["A. 11β-hydroxylase deficiency", "B. 17α-hydroxylase deficiency", "C. 21-hydroxylase deficiency", "D. Aromatase deficiency", "E. 5α-reductase deficiency"], "ans": "C", "ansText": "C. 21-hydroxylase deficiency", "jx": "21-hydroxylase deficiency is the most common cause of CAH and results in cortisol and aldosterone deficiency. The salt-losing crisis (hyponatremia, hyperkalemia, dehydration) and hyperpigmentation due to elevated ACTH levels are diagnostic clues. Lifelong hormone replacement is required.", "img": []}, {"id": "3e54f5b0003c9110", "m": "09", "letter": "I", "inMod": 12, "code": "I12", "q": "3-year-old with edema, hepatomegaly, thin limbs.A 3-year-old from a low-income family presents with generalized oedema and hepatomegaly. On examination, she has moon facies and thin limbs with a protruding abdomen. What is the most likely diagnosis?", "opts": ["A. Marasmus", "B. Kwashiorkor", "C. Nephrotic syndrome", "D. Obesity", "E. Cushing’s syndrome"], "ans": "B", "ansText": "B. Kwashiorkor", "jx": "Kwashiorkor results from protein deficiency with adequate calorie intake, characterized by pitting edema, hepatomegaly, moon facies, and apathy.By contrast, marasmus shows severe wasting without edema, due to overall calorie deficiency.", "img": []}, {"id": "dbb0e0602c986850", "m": "09", "letter": "I", "inMod": 13, "code": "I13", "q": "A 6-week-old male infant presents with progressively worsening vomiting after feeds. The vomiting is forceful and projectile but non-bilious. The mother reports that he remains hungry after vomiting and wants to feed again. Over the past week, he has had fewer wet nappies. On examination, he appears mildly dehydrated. A small, firm mass is palpable in the right upper abdomen. What is the most likely diagnosis?", "opts": ["A. Gastro-oesophageal reflux disease (GERD)", "B. Infantile hypertrophic pyloric stenosis", "C. Viral gastroenteritis", "D. Cow’s milk protein allergy", "E. Duodenal atresia"], "ans": "B", "ansText": "B. Infantile hypertrophic pyloric stenosis", "jx": "A. GERD – Incorrect.GERD causes effortless regurgitation rather than projectile vomiting. Infants are usually thriving and not dehydrated. There is no palpable mass.B. Infantile hypertrophic pyloric stenosis – Correct.This infant has classical features of pyloric stenosis:Age 2–8 weeksProjectile, non-bilious vomitingHungry after vomitingDehydrationPalpable “olive” in epigastriumThe obstruction is proximal to the duodenum, so vomiting is non-bilious. Untreated cases develop hypochloraemic, hypokalaemic metabolic alkalosis.C. Viral gastroenteritis – Incorrect.Typically associated with diarrhoea, systemic symptoms, and occurs at any age. Vomiting is not progressively worsening after feeds and would not produce a palpable abdominal mass.D. Cow’s milk protein allergy – Incorrect.Often presents with vomiting plus diarrhoea, blood in stools, eczema, or irritability. It does not cause projectile vomiting with a palpable mass.E. Duodenal atresia – Incorrect.Presents in the neonatal period (within first 24–48 hours) with bilious vomiting and a “double bubble” sign on X-ray.", "img": []}, {"id": "0f5d0af60915c302", "m": "09", "letter": "I", "inMod": 14, "code": "I14", "q": "A 4-month-old male infant, presents with a history of vomiting and diarrhoea. On examination he has a heart rate of 160 beats/min; his capillary refill time is 2–3 seconds and he is lethargic. A bedside blood test showed that he is hypoglycaemic. A diagnosis of Addison disease is considered. Which of the following combination of biochemical results would be most likely with Addison disease?", "opts": ["A. Hypernatraemia and hyperkalaemia with low cortisol", "B. Hypernatraemia and hypokalaemia with high cortisol", "C. Hyponatraemia and hyperkalaemia with high cortisol", "D. Hyponatraemia and hypokalaemia with low cortisol", "E. Hyponatraemia and hyperkalaemia with low cortisol"], "ans": "E", "ansText": "E. Hyponatraemia and hyperkalaemia with low cortisol", "jx": "1.The laboratory findings in Addison disease are low sodium.\n2.Wrong way around.\n3.The cortisol level would be low.\n4.The potassium is typically high.\n5.Correct. In Addison disease, there is hyponatraemia, hyperkalaemia and hypoglycaemia. The plasma cortisol is low and the plasma ACTH （adrenocorticotropic hormone） concentration is high.", "img": []}, {"id": "823ff06727a27950", "m": "09", "letter": "I", "inMod": 15, "code": "I15", "q": "A 13-year-old girl presents with a prolonged afebrile seizure. She has a history of muscle aches, cramps and diarrhoea. Blood investigations reveal a low serum calcium, high serum phosphate, a normal alkaline phosphatase and high parathyroid hormone.From the following list of conditions what is the most likely diagnosis?", "opts": ["A. Hyperparathyroidism", "B. Hypoparathyroidism", "C. Nutritional rickets", "D. Pseudohypoparathyroidism", "E. Pseudopseudohypoparathyroidism"], "ans": "D", "ansText": "D. Pseudohypoparathyroidism", "jx": "1.In hyperparathyroidism, PTH will be high but calcium will also by elevated and phosphate will be low or normal.\n2.Hypoparathyroidism in infancy is most commonly due to a congenital deficiency of the parathyroid glands. In older children it is usually autoimmune and is associated with Addison disease. It results in low serum calcium, high phosphate but low PTH.\n3.Vitamin D deficiency results in a low serum calcium with typically a high alkaline phosphatase as a result of increased bone turnover.\n4.Correct. Pseudohypoparathyroidism is the result of end-organ resistance to PTH. Serum calcium and phosphate will be low but PTH will be normal or high.\n5.Pseudopseudohypoparathyroidism is a rare condition with clinical features similar to pseudohypoparathyroidism but normal blood parameters.", "img": []}, {"id": "dc672b0c566e69a6", "m": "09", "letter": "I", "inMod": 16, "code": "I16", "q": "A 3-day-old term Chinese infant who has not passed meconium since birth. On examination his abdomen is distended but the remainder of the examination is normal. An X-ray of the abdomen shows distended loops throughout the bowel. What is the most likely diagnosis?", "opts": ["A. Congenital hypothyroidism", "B. Cystic fibrosis", "C. Duodenal atresia", "D. Hirschsprung disease", "E. Rectal atresia"], "ans": "D", "ansText": "D. Hirschsprung disease", "jx": "1. Whilst babies with untreated congenital hypothyroidism may develop constipation, it does not cause bowel obstruction.\n2. Meconium ileus, which is usually a manifestation of cystic fibrosis, causes abdominal distension from bowel obstruction and in some cases a mass may be present. Distension of the colon and rectum would not be a feature. Rare in Chinese.\n3. Duodenal atresia causes bile-stained vomiting.\n4. Correct. Hirschsprung disease is caused by the absence of ganglion cells from the myenteric and submucosal plexuses of part of the large bowel, which results in a narrow, contracted segment. The abnormal bowel extends from the rectum for a variable distance proximally, ending in a normally innervated, dilated colon.\n5. Rectal atresia causes large bowel obstruction but examination of his perineum is normal.", "img": []}, {"id": "2745a87bd2305060", "m": "09", "letter": "I", "inMod": 17, "code": "I17", "q": "During a health promotion talk, a mother asks whether her 2 year old needs follow on “formula No. 4” to grow taller and stronger. The child eats a varied diet of grains, vegetables, beans, and small portions of meat and fish. What is the most appropriate advice?", "opts": ["A. Continue formula as it is specially made for this age group", "B. Continue Exclusive breastfeeding", "C. Transition to family diet, ensure diet is balanced and includes a variety of plant-based sources such as pulses, fruits and vegetables", "D. Ensure high protein diet especially in the form of beef to encourage height gain", "E. Extra cow’s milk only"], "ans": "C", "ansText": "C. Transition to family diet, ensure diet is balanced and includes a variety of plant-based sources such as pulses, fruits and vegetables", "jx": "By 2 years, healthy children should eat family foods that provide balanced nutrition. Excess animal protein or prolonged formula use contributes to obesity and high cholesterol seen in Hong Kong cohorts. A predominantly plant based diet with moderate animal foods supports lifelong health.", "img": []}, {"id": "4e8b2efe7f055e46", "m": "09", "letter": "I", "inMod": 18, "code": "I18", "q": "A boisterous 2-year-old Chinese boy, has had diarrhoea for the last 3 months. He produces up to four stools a day, which are loose, brown in colour and usually contain undigested food. The rest of the family are well. He has never been abroad. Examination is normal and his personal child health record shows that he is growing along the 50th centile. What is the most likely diagnosis?", "opts": ["A. Chronic non-specific diarrhoea", "B. Coeliac disease", "C. Cow’s milk protein allergy", "D. Inflammatory bowel disease", "E. Lactose intolerance"], "ans": "A", "ansText": "A. Chronic non-specific diarrhoea", "jx": "1. Correct. In chronic non-specific diarrhoea there are loose stools with undigested food present. The children grow well and have plenty of energy.\n2. Although coeliac disease is now relatively common, in Caucasian population it is very rare. These are not characteristic clinical features.\n3. Although this is common, affecting at least 1 in 50 children, stools containing undigested food are not characteristic and it is usually accompanied by some atopic markers such as eczema. Parents often report flecks of blood in the stool.\n4. Diarrhoea with blood and colicky abdominal pain are characteristic of ulcerative colitis. Crohn disease usually presents with diarrhoea, abdominal pain and weight loss and general ill health; oral lesions and perianal skin tags are other features.\n5. Althogh primary lactose intolerance is common in Asian population after infancy. Bloating, discomfort and acidic stool causing perianal soreness are more suggestive. A trial of lactose-free diet can be helpful in diagnostic uncertainty. The presence of undigested food in the stool and normal growth are against this diagnosis.", "img": []}, {"id": "5c19dd8a87a8eef2", "m": "09", "letter": "I", "inMod": 19, "code": "I19", "q": "An 18-month-old Caucasian girl who is seen in the outpatient department. She stays in Shenzhen with her family from Australia. She presents with loose stools two to three times each day, with no blood in them. She is generally difficult and it has become a battle to get her to feed. Examination of her abdomen is unremarkable apart from being distended. She is not on any medication. Her weight was on the 9th centile and is now below the 0.4th centile. What is the most likely cause for the weight loss?", "opts": ["A. Chronic non-specific diarrhoea", "B. Coeliac disease", "C. Hirschsprung disease", "D. Lactose intolerance", "E. Ulcerative colitis"], "ans": "B", "ansText": "B. Coeliac disease", "jx": "1. This is not the characteristic history for this condition.\n2. Correct. Coeliac disease (gluten-sensitive enteropathy) may present at age 8 to 24 months with abnormal stools, faltering growth, abdominal distension, wasting of the muscles of the buttocks (a difficult clinical sign), and irritability. Can also present with short stature or anaemia or non-specific symptoms and signs. It is increasingly detected on screening high-risk groups and at older ages. Condition rare in Asian population.\n3. Hirschsprung disease presents with constipation and a distended abdomen.\n4. Lactose intolerance develops after a bout of gastroenteritis with the child continuing to have diarrhoea. It is usually transient.\n5. Ulcerative colitis usually presents with bloody diarrhoea in older children. Nocturnal waking to defecate associated with abdominal pain should alert one to inflammatory bowel disease.", "img": []}, {"id": "42176a8f1b9f751b", "m": "09", "letter": "I", "inMod": 20, "code": "I20", "q": "A healthy 5½ month old exclusively breast fed baby shows good head control and interest in watching family meals.According to current recommendations, what is the most appropriate time to introduce solid foods?", "opts": ["A. 3 months if the baby seems hungry after feeds", "B. Around 6 months, when infant shows readiness cues", "C. 12 months to encourage breast feeding as long as possible", "D. After first tooth eruption", "E. Anytime convenient for the parents"], "ans": "B", "ansText": "B. Around 6 months, when infant shows readiness cues", "jx": "Guidelines recommend introducing solids around 6 months.By this age most infants can sit with support, have adequate head and neck control, and show interest in food. Too early weaning (< 4 months) increases allergy and infection risk; too late (> 8 months) risks iron deficiency and feeding difficulties.", "img": []}, {"id": "b89b72b293b088bc", "m": "09", "letter": "I", "inMod": 21, "code": "I21", "q": "A 7-year-old girl, has had abdominal pain for the last 6 months. On several occasions it has been sufficiently severe for her to be sent home early from school. The pain happens once or twice a week in the afternoon or early evening. It is periumbilical in nature. It does not wake her at night. She has not had vomiting or diarrhoea. She is growing well. Her examination is normal. Her urine is clear on dipstick testing. What is the most likely cause for her pain?", "opts": ["A. Functional abdominal pain disorder", "B. Peptic ulcer disease", "C. Hepatitis A", "D. Crohn disease", "E. Meckel diverticulum"], "ans": "A", "ansText": "A. Functional abdominal pain disorder", "jx": "1. Correct. The pain is periumbilical and is not associated with any other symptoms. The pain has been going on for 6 months and Claire is well in herself. The pain is causing her distress and a detailed history is required. In some children this is a manifestation of stress or anxiety.\n2. The pain of peptic ulcer disease is usually epigastric. It may wake the child at night, may radiate through to the back, or there may be a history of peptic ulceration in a first-degree relative. If this is the case, refer for endoscopy.\n3. A common infection worldwide but would usually present with jaundice and dark urine.\n4. An important cause of recurrent abdominal pain, but there will often be faltering growth, diarrhoea which may contain blood, night-time waking or mouth ulcers. Some have painless perianal ulceration.5. 2% of the population have a Meckel diverticulum but in the majority it causes no symptoms. When it does it can be a diagnostic conundrum but it usually presents with either melaena or fresh blood in the stool. It can also be mistaken for acute appendicitis.", "img": []}, {"id": "59bec6f617eb1938", "m": "09", "letter": "I", "inMod": 22, "code": "I22", "q": "A 6-year-old boy who is seen in the paediatric emergency department. He has been vomiting and has had diarrhoea for 3 days. His stool is watery and foul smelling but has no blood in it. He lives in Shenzhen since he was born. Examination reveals mild dehydration but is otherwise normal. What is the most likely organism that has caused his symptoms?", "opts": ["A. Campylobacter", "B. Escherichia coli", "C. Giardia lamblia", "D. Norovirus", "E. Shigella"], "ans": "D", "ansText": "D. Norovirus", "jx": "1. A most common cause of bloody diarrhoea. All bacterial forms are notifiable diseases.\n2. This occurs in outbreaks. Verotoxin-producing strains can result in haemolytic uraemic syndrome.\n3. Giardia lamblia is a parasitic infection and may be acquired if low quality water supply, although there are rare cases in the UK. Persistent diarrhoea would warrant testing for this organism.\n4. Correct. Norovirus causes foul-smelling, watery diarrhoea. Escherichia coli, Shigella, and Campylobacter also cause explosive watery diarrhoea but can be associated with blood in the stools and in the UK are much less common than viral infection. Unlike rotavirus, there is no vaccine in the childhood immunization schedule against norovirus. The incidence of rotavirus has declined by about 60-80% since the introduction of rotavirus vaccine into standard childhood immunization schedule.\n5. Consider this if there is blood in the stool.", "img": []}, {"id": "d4b8d9af4e27ec59", "m": "09", "letter": "I", "inMod": 23, "code": "I23", "q": "A mother of a 6-year-old boy with chronic diarrhea brings him to a district health care clinic for an evaluation. The mother says the diarrhea has been present, off and on, for about one month. During this time, the child has had a poor appetite and has lost weight. He has been acting tired and seems to have pain with bowel movements. The mother and child live on a farm, and the boy often plays in the nearby fields. Physical examination is unremarkable except for mild abdominal tenderness to palpation. Laboratory tests later show a 5% eosinophilia and microcytic anemia. Microscopic examination of a stool sample shows football-shaped eggs with a polar plug. What is the child’s diagnosis?", "opts": ["A. Ascaris lumbricoides infection", "B. Cryptosporidium parvum infection", "C. Entamoeba histolytica infection", "D. Strongyloides stercoralis infection", "E. Trichuris trichiura infection"], "ans": "E", "ansText": "E. Trichuris trichiura infection", "jx": "1. lumbricoides worms may cause small bowel obstruction when they hatch in large numbers and accumulate in the lumen. They also may invade the small intestinal mucosa and travel through the bloodstream to the lungs, where they may cause hypersensitivity reactions with peripheral eosinophilia. The egg morphology in the patient’s stool sample is not diagnostic for infection by this organism.\n2. Cryptosporidium is a protozoan parasite that was first associated with human gastrointestinal disease in 1976. C. parvum causes most human infections. A voluminous, watery diarrhea may ensue. Damage to intestinal microvilli may cause secondary malabsorption and steatorrhea. The egg morphology in the patient’s stool sample is not diagnostic for infection by this organism.\n3. E. histolytica is an amoeba, which can produce symptoms similar to whipworm infection. The egg morphology in the patient’s stool sample is not diagnostic for infection by this organism.\n4. S. stercoralis is a nematode that tends to produce a fulminant illness in its victims, particularly in those who are immunocompromised. Transmitted primarily through cutaneous contact with infected soil, Strongyloides may cause damage and inflammatory reactions in soft tissues as the larvae migrate, severe diarrhea with abdominal pain, and even pulmonary infiltrates as with ascariasis. The egg morphology in the patient’s stool sample is not diagnostic for infection by this organism.\n5. Correct T. trichiura is the whipworm, which generally causes severe diarrhea, particularly in children. The clinical history and symptoms are typical for this infection, which is relatively rare in the United States. The egg morphology in the patient’s stool sample is diagnostic for infection by this organism. In cases of heavy infection, children can present with rectal prolapse and nocturnal stooling.", "img": []}, {"id": "64dbf73b250f0d02", "m": "10", "letter": "J", "inMod": 1, "code": "J1", "q": "Vignette: A 6-month-old infant with severe congenital heart disease is being considered for end-of-life care. The parents are struggling with the decision to withdraw life-sustaining treatment. Question: What should be emphasized to the parents during this discussion?", "opts": ["A. The importance of continuing all treatments till the end", "B. The need to prioritise the child’s comfort and dignity", "C. Avoid discussing end of life issues", "D. Discuss the risks associated with withdrawing treatment", "E. The necessity of involving all extended family members in the decision"], "ans": "B", "ansText": "B. The need to prioritise the child’s comfort and dignity", "jx": "Child’s comfort and best interests are central.", "img": []}, {"id": "a115f1e17299f524", "m": "10", "letter": "J", "inMod": 2, "code": "J2", "q": "Vignette: A terminally ill teenager is experiencing significant pain and distress. The healthcare team is discussing the appropriate management strategies to ensure comfort. Question: What is the most effective initial approach to managing this teenager's symptoms?", "opts": ["A. Increase fluid administration", "B. Administer high-dose opioids", "C. Suggest Traditional Chinese Medicine therapy", "D. Provide cognitive behavioural therapy", "E. Provide physiotherapy"], "ans": "B", "ansText": "B. Administer high-dose opioids", "jx": "Opioids are first-line for severe cancer pain. Adequate analgesia is ethical priority.", "img": []}, {"id": "1412a03c5b15841c", "m": "10", "letter": "J", "inMod": 3, "code": "J3", "q": "A 2-year-old African boy, is admitted to hospital for an elective repair of an inguinal hernia. He has no other medical problems. His preoperative assessment reveals the following results and his blood film is shown below:• Hb (haemoglobin): 86 g/L• MCV (mean cell volume): 68 fL (normal: 75–87 fL)• MCHC (mean corpuscular haemoglobin concentration): 22 g/dl (normal: 32–35 g/dl)• WBC (white blood cell count): 11.2×109/L• platelets: 262×109/L• HB electrophoresis: haemoglobin A (HbA) 98%; haemoglobin A2 (HbA2) 2%What is the most likely diagnosis?", "opts": ["A. β-Thalassaemia trait", "B. Glucose-6-phosphate dehydrogenase deficiency", "C. Iron deficiency anaemia", "D. Normal variation for age and ethnicity", "E. Sickle cell trait"], "ans": "C", "ansText": "C. Iron deficiency anaemia", "jx": "1. In β-thalassaemia trait, the haemoglobin A (HbA) would be approximately 90%. There would be extra fetal haemoglobin (HbF) and haemoglobin A2 (HbA2).\n2. Usually presents as either neonatal jaundice or acute haemolysis. Here the mean corpuscular volume and the mean corpuscular haemoglobin are low, suggesting a more chronic problem.\n3. Correct. A common diagnosis in children that results in these findings. The blood film shows characteristic changes of hypochromic, microcytic red blood cells. The most common cause is dietary insufficiency.\n4. At 6 weeks of age children are in the ‘physiological trough’ for haemoglobin concentration and the lower limit of normal is 100 g/L. From 1 year to 12 years of age anaemia is a haemoglobin less than 110g/L.\n5. In sickle cell trait, there is inheritance of sickle haemoglobin (HbS) from one parent, so approximately 40% of the haemoglobin is HbS. Whilst carriers are asymptomatic, this is easily detectable on haemoglobin electrophoresis.", "img": []}, {"id": "3233a72c6b7c33ef", "m": "10", "letter": "J", "inMod": 4, "code": "J4", "q": "A boy aged 9 months presents to the emergency department. His family are from West Africa. He has a 6-hour history of pain in his fingers. He has had an upper respiratory tract infection for the past 24 hours. He has no other medical history and is not on any medication.The appearance of his left hand is shown in picture below. What is the most likely diagnosis?", "opts": ["A. Acute lymphoblastic leukaemia", "B. β-Thalassaemia major", "C. Glucose-6-phosphate dehydrogenase deficiency", "D. Haemophilia A", "E. Sickle cell disease"], "ans": "E", "ansText": "E. Sickle cell disease", "jx": "1. Although a small number of children present with bony pain, it would be unusual to have pain in the fingers.\n2. Would present with anaemia and, if severe, this could lead to heart failure with peripheral oedema but pain would be unusual and there would be other signs.\n3. After the neonatal period, this would present with acute haemolysis precipitated by infection, drugs or fava beans. Haemolysis is predominantly intravascular and is associated with fever, malaise and dark urine.\n4. Haemophilia typically presents with bleeding into the larger joints.\n5. Correct. He is experiencing a vaso-occlusive crisis. A common clinical feature in late infancy is the hand–foot syndrome, in which there is dactylitis, with swelling and pain of the fingers and/or feet.", "img": ["images/3233a72c6b7c33ef_0.jpg"]}, {"id": "1ec6c97611d764de", "m": "10", "letter": "J", "inMod": 5, "code": "J5", "q": "A 13 months old girl is admitted to hospital following her first febrile convulsion. Upon recovery she is noted to be pale. Her haemoglobin is 67 g/L. A blood film reveals microcytosis and iron deficiency anaemia is diagnosed. At the suggestion of her grandmother, her mother has switched her to full fat cow’s milk 3 months ago because she was struggling to gain weight. The family is vegetarian, but the girl prefers the milk. She is started on iron and is ready for discharge.From the following list which diet advice is best to give?", "opts": ["A. Breakfast cereal has plenty of iron and increasing intake will prevent recurrence", "B. Cow’s milk should provide sufficient iron", "C. Infant formula should be restarted and continued until 15 months", "D. Red meat should be introduced into her diet", "E. Vitamin C will increase the absorption of iron from vegetable sources"], "ans": "E", "ansText": "E. Vitamin C will increase the absorption of iron from vegetable sources", "jx": "1. Iron is added to breakfast cereals. Unfortunately, when iron is provided in this form it is poorly bioavailable. Absorption can be increased by adding vitamin C. Some cereal manufacturers show an image of fresh fruit juice alongside their products as a ‘serving suggestion’ for this reason.\n2. Cow’s milk does contain iron. However, it is poorly absorbed. That is why breast milk or infant formula is recommended until 12 months of age and should accompany a diet containing iron-rich food.\n3. Infant formula has additional folic acid and iron. However, this will not treat her severe iron deficiency, which is why she has been prescribed oral iron supplementation. She will need a repeat full blood count in 6–8 weeks to ensure that her iron deficiency has been adequately treated.\n4. Meat consumption is not essential for optimal health and prevention of iron deficiency anaemia. Recommending meat for this vegetarian family would be inappropriate. Rather, they need advice on how to encourage her to eat suitable iron-rich vegetables.\n5. Correct. Iron absorption from all sources is increased when eaten with food rich in vitamin C (fresh fruit and vegetables) and is inhibited by tannin in tea.", "img": []}, {"id": "2df808f6d19b492c", "m": "10", "letter": "J", "inMod": 6, "code": "J6", "q": "A 9-month-old infant is diagnosed with hereditary spherocytosis after presenting with jaundice and splenomegaly. The pediatrician discusses management options with the parents. What is the most common treatment option for this condition?", "opts": ["A. Iron supplementation", "B. Splenectomy", "C. Bone marrow transplant", "D. Steroids supplementation", "E. Vitamin K administration"], "ans": "B", "ansText": "B. Splenectomy", "jx": "Splenectomy reduces hemolysis by removing site of RBC destruction. Usually delayed until >5 years due to infection risk.Iron supplements unnecessary unless deficient.", "img": []}, {"id": "2c48df4b1743e24b", "m": "10", "letter": "J", "inMod": 7, "code": "J7", "q": "A 5-year-old boy presents to hospital with a recent history of bruising easily. Two weeks ago he had an upper respiratory tract infection which resolved spontaneously. On examination today he is afebrile but has many, widespread bruises with some scattered petechiae.Investigations reveal:• Hb (haemoglobin): 116 g/L• WBC (white blood cell count): 10.2×109/L• platelet count: 32×109/L• prothrombin time: 15 seconds (control: 12–15 s)• activated partial thromboplastin time: 30 seconds (control: 25–35 s)• fibrinogen: 2.5 g/L (normal: 2–4 g/L) What is the most likely diagnosis?", "opts": ["A. Acute lymphoblastic leukaemia", "B. Haemophilia A", "C. Immune thrombocytopenic purpura", "D. Non-accidental injury", "E. Vitamin D deficiency"], "ans": "C", "ansText": "C. Immune thrombocytopenic purpura", "jx": "1. In acute lymphoblastic leukaemia you would expect a range of abnormal clinical features.\n2. In haemophilia A, thrombocytopenia is not a feature and the clotting profile would not be normal.\n3. Correct. Affected children develop petechiae, purpura, and/or superficial bruising. The platelet count can be very low (single digits) but treatment is not usually required and most cases resolve spontaneously.\n4. Non-accidental injury can present with unusual bruising but this boy has a low platelet count, which explains the bruising.\n5. In vitamin D deficiency, thrombocytopenia is not a feature.", "img": []}, {"id": "e57eaedbfcfd8a0b", "m": "10", "letter": "J", "inMod": 8, "code": "J8", "q": "A 10-year-old girl is being treated for non-Hodgkin lymphoma. Following her chemotherapy regimen, she develops severe mucositis. What is the most important aspect of supportive care for this patient?", "opts": ["A. Bed rest", "B. Pain management", "C. Administer prophylactic antibiotics", "D. Dietary restrictions", "E. Encourage increase fluid intake"], "ans": "B", "ansText": "B. Pain management", "jx": "Pain management allows oral intake and improves quality of life.", "img": []}, {"id": "e58667c7929584d7", "m": "10", "letter": "J", "inMod": 9, "code": "J9", "q": "A 14-year-old girl with a history of heavy menses is seen by her pediatrician for severe fatigue. Her vital signs are normal. On examination, she is pale and appears tired. There is pallor of the oral mucosa and conjunctiva. Labs show the following: ● Hematocrit: 23% (female normal 36%-46%) ● Serum ferritin: 6 ng/mL (female normal 12-150 ng/ml) ● Transferrin saturation: 5% (female normal 12-45%) Which of the following laboratory findings would be most consistent with her condition?", "opts": ["A. Bite cells on peripheral blood smear", "B. Decreased mean corpuscular hemoglobin", "C. Decreased red blood cell distribution width", "D. Increased mean corpuscular volume", "E. Ringed iron deposits in on blood smear"], "ans": "B", "ansText": "B. Decreased mean corpuscular hemoglobin", "jx": "1. Bite cells are an indication that the anemia is due to increased splenic destruction of RBCs. Smear findings in iron deficiency anemia typically show hypochromic red cells.\n2. Correct. Mean corpuscular hemoglobin concentration (MCHC) reflects the hemoglobin content of each cell, accounting for cell volume. MCHC is decreased in iron deficiency anemia.\n3. As iron stores run out, new red blood cells are smaller but coexist with older cells produced before the deficiency started. An anisocytosis develops, and the red blood cell distribution width increases, often before the anemia and microcytosis develops.\n4. Iron deficiency anemia is microcytic with decreased mean corpuscular volumes. Normal mean corpuscular volume (MCV) values range from 78 to 102 fL.\n5. Ringed mitochondrial iron deposits are characteristic of sideroblastic anemia.", "img": []}, {"id": "21ed3ed89be4df8d", "m": "10", "letter": "J", "inMod": 10, "code": "J10", "q": "A 12-year-old girl presents with fatigue, pallor, and a family history of anaemia . Blood tests reveal a low hemoglobin level and microcytic red blood cells. What is the most likely cause of her anaemia ?", "opts": ["A. Vitamin B12 deficiency", "B. Iron deficiency anaemia", "C. Haemolytic anaemia", "D. Aplastic anaemia", "E. Sickle cell anaemia"], "ans": "B", "ansText": "B. Iron deficiency anaemia", "jx": "Microcytic + adolescent girl → menstrual loss likely.", "img": []}, {"id": "681763568457f862", "m": "10", "letter": "J", "inMod": 11, "code": "J11", "q": "A 2 months old girl was born at 37 weeks’ gestation without difficulty and she is exclusively breastfed. She attended the emergency department with a temperature and cough last week. As part of her assessment, she had a full blood count. This was reported on the automated results system as normal apart from her haemoglobin which was 102 g/L. The doctor signing results in the emergency department rings you to ask you what action is required.From the following options pick the best advice.", "opts": ["A. Arrange for a repeat full blood count in primary care", "B. Contact her GP and arrange for a review", "C. No further action is required", "D. Prescribe folic acid", "E. Ring the family to ask how the child is now"], "ans": "C", "ansText": "C. No further action is required", "jx": "1. This is not necessary. It is quite common for automated hospital systems to flag this result as abnormal. At 2 months Fredrika’s haemoglobin will have fallen to its lowest level. Any level above 100 g/L is within the normal range.\n2. This is not necessary. It is tempting to arrange for an experienced review in these circumstances but it places an unnecessary burden on primary care services.\n3. Correct. Although this feels uncomfortable, it is the right response. In this case the automated system has generated an electronic ‘red herring’ and it should be ignored. An infant’s haemoglobin decreases over the first two months of life, as HbA replaces HbF.\n4. Folic acid is recommended for all breastfed infants born at <34 weeks’ gestation. However, there is no history of this.\n5. Whilst this might feel like the correct response, ringing a family ‘out of the blue’ rarely reassures them and often heightens their anxieties.", "img": []}, {"id": "f1a3edffd66cc8cd", "m": "10", "letter": "J", "inMod": 12, "code": "J12", "q": "A 10-year-old boy presents with easy bruising, prolonged bleeding after a minor cut, and a family history of similar symptoms. A platelet count reveals thrombocytopenia. What is the most likely diagnosis?", "opts": ["A. Hemophilia A", "B. Immune thrombocytopenic purpura", "C. Von Willebrand disease", "D. Thalassemia", "E. Sickle cell disease"], "ans": "B", "ansText": "B. Immune thrombocytopenic purpura", "jx": "ITP: Isolated low platelets Normal Hb/WBC Post-viral common Autoimmune destructionHemophilia → normal platelets .", "img": []}, {"id": "aa5625fe60268f0b", "m": "10", "letter": "J", "inMod": 13, "code": "J13", "q": "A newborn is screened for hemoglobinopathies, and the results indicate the presence of hemoglobin E. The pediatrician explains the significance of this finding to the parents. What is the most likely clinical implication of hemoglobin E in this newborn?", "opts": ["A. Severe anemia", "B. No clinical significance", "C. Risk of sickle cell crisis", "D. Mild thalassemia phenotype", "E. Increased risk of thrombotic events"], "ans": "D", "ansText": "D. Mild thalassemia phenotype", "jx": "HbE commonly causes mild microcytosis. Severe disease occurs if combined with β-thalassemia.", "img": []}, {"id": "2e976b9f4b713cee", "m": "10", "letter": "J", "inMod": 14, "code": "J14", "q": "A 10-year-old boy presents with sudden onset of joint pain and swelling. The physician notes that he has a family history of bleeding disorders. Lab tests reveal a significant deficiency in factor VIII. What is the most likely diagnosis?", "opts": ["A. Hemophilia A", "B. Hemophilia B", "C. Von Willebrand disease", "D. ITP", "E. Vitamin K deficiency"], "ans": "A", "ansText": "A. Hemophilia A", "jx": "A. Correct. Hemophilia A: X-linked Factor VIII deficiency Hemarthrosis Prolonged APTT Normal platelet countB. Hemophilia B – Incorrect. Factor IX deficiency.C. vWD – Incorrect. Mucosal bleeding; mild factor VIII reduction but not severe deficiency.D. ITP – Incorrect. Platelet disorder, not clotting factor deficiency.E. Vitamin K deficiency – Incorrect. Affects multiple clotting factors; usually neonates.", "img": []}, {"id": "54a483ba8e593331", "m": "10", "letter": "J", "inMod": 15, "code": "J15", "q": "An 8-year-old boy with advanced neuroblastoma is admitted to the pediatric ward. His condition has deteriorated, and the medical team informs the parents that he has no realistic hope for cure. They discuss transitioning to palliative care. What is the primary focus of palliative care in this context?", "opts": ["A. To support the siblings (if applicable)", "B. To provide symptom control and improve quality of life", "C. To initiate aggressive chemotherapy", "D. To provide other experimental therapies", "E. hospitalization To provide hospitalized care till death"], "ans": "B", "ansText": "B. To provide symptom control and improve quality of life", "jx": "Palliative care: Relieves pain and distress Supports family Improves quality of life Does not aim for cureAggressive treatment is no longer goal when cure not possible.", "img": []}, {"id": "e422429e0ec1f503", "m": "10", "letter": "J", "inMod": 16, "code": "J16", "q": "A 10-year-old boy, whose parents come from South East Asia, presents to his general practitioner. This evening he is more lethargic than usual and his urine has become dark in colour. There is no history of excessive exercise or beetroot consumption; in fact, they had a festive meal of chicken, fish, broad beans and rice for lunch. His examination is normal and he is afebrile. He has no medical history of note. He has not had a recent upper respiratory tract infection. What is the most likely diagnosis?", "opts": ["A. Acute lymphoblastic leukaemia", "B. β-Thalassaemia trait", "C. Glucose-6-phosphate dehydrogenase deficiency", "D. Pyelonephritis", "E. Sickle cell disease"], "ans": "C", "ansText": "C. Glucose-6-phosphate dehydrogenase deficiency", "jx": "1. Acute lymphatic leukaemia is unlikely as he does not have abnormal clinical signs.\n2. Thalassaemia trait patients rarely have symptoms but may be found to have anaemia.\n3. Correct. In G6PD deficiency, acute haemolysis may be precipitated by infection, the most common precipitating factor. Certain drugs including nitrofurantoin, fava beans (broad beans) and naphthalene in mothballs can also precipitate haemolysis. The urine is dark as it contains haemoglobin as well as urobilinogen.\n4. Pyelonephritis is unlikely as the child is afebrile and has no pain.\n5. Sickle cell disease is seen in Black children and adults. The meal described would not have provoked a sickle cell crisis.", "img": []}, {"id": "0cfcd4778e3db78c", "m": "10", "letter": "J", "inMod": 17, "code": "J17", "q": "A 12-year old boy with known hemophilia A develops a swollen painful knee after after sustaining a minor injury during a sports activity. What is the most appropriate immediate management for this boy?", "opts": ["A. Apply ice, elevate the leg and observe", "B. Administer factor VIII replacement therapy first", "C. Perform Joint aspiration first", "D. Perform knee x-ray first", "E. Apply compression bandage and provide NSAIDs"], "ans": "B", "ansText": "B. Administer factor VIII replacement therapy first", "jx": "B. Correct. Immediate factor replacement stops bleeding and prevents joint damage. Delay increases risk of chronic arthropathy.Joint aspiration only after factor correction.NSAIDs contraindicated due to bleeding risk.", "img": []}, {"id": "bebe25f504ce576f", "m": "10", "letter": "J", "inMod": 18, "code": "J18", "q": "A 3-year-old boy with a diagnosis of neuroblastoma undergoes imaging studies that reveal a large abdominal mass and metastasis to the bone. What is the most conventional initial treatment?", "opts": ["A. Surgery resection", "B. Radiotherapy", "C. Chemotherapy", "D. Watchful waiting", "E. Immunotherapy"], "ans": "C", "ansText": "C. Chemotherapy", "jx": "Advanced disease requires systemic therapy first.", "img": []}, {"id": "4eba304a52e0b5d2", "m": "10", "letter": "J", "inMod": 19, "code": "J19", "q": "A 4-year-old White European girl is referred to the paediatric ward by her general practitioner as her mother noted that she had a yellow tinge to her eyes since developing an upper respiratory tract infection. She is well in herself and has no history of weight loss. There is no family history of any blood disorders. On examination she was pale and her spleen was enlarged 3 cm below the costal margin. You perform a full blood count, which reveals: • Hb (haemoglobin): 60 g/L • WBC (white blood cell count): 8×109/L• platelet count: 255×109/L • blood film: small red cells • MCV (mean cell volume): 60 fL (normal: 75–87 fL) What is the most likely diagnosis?", "opts": ["A. Acute lymphoblastic leukaemia", "B. Glucose-6-phosphate dehydrogenase (G6PD) deficiency", "C. Hereditary spherocytosis", "D. Sickle cell disease", "E. Thalassaemia"], "ans": "C", "ansText": "C. Hereditary spherocytosis", "jx": "1. Acute lymphoblastic leukaemia is unlikely as she is well, has not had weight loss, and her splenomegaly is not accompanied by hepatomegaly or lymphadenopathy. Her blood count only shows anaemia, with normal white cell and platelet counts.\n2. G6PD deficiency may be associated with acute haemolysis but there would not usually be splenomegaly. In girls, clinical abnormalities are uncommon.\n3. Correct. In hereditary spherocytosis the anaemia is usually mild (Hb 90–110 g/L), but the haemoglobin level may transiently fall during infections. The small red cells on blood film are spherocytes. Mild to moderate splenomegaly is common.\n4. Sickle cell disease would not be likely at all in a White European child.\n5. Thalassaemia is usually encountered in children from the Indian subcontinent, Mediterranean, and Middle East and is less common in White European children.", "img": []}, {"id": "7e3e0f284e29dd1d", "m": "10", "letter": "J", "inMod": 20, "code": "J20", "q": "A 5-year-old girl is diagnosed with retinoblastoma after her parents notice a white reflex in her left eye during photographs. What is the inheritance pattern of this condition?", "opts": ["A. Autosomal dominant", "B. Autosomal recessive", "C. X-linked recessive", "D. Mitochondrial inheritance", "E. Multifactorial inheritance"], "ans": "A", "ansText": "A. Autosomal dominant", "jx": "RB1 mutation inherited in autosomal dominant pattern with incomplete penetrance.", "img": []}, {"id": "1c69a827e586a37a", "m": "10", "letter": "J", "inMod": 21, "code": "J21", "q": "A 2-year-old Bangladeshi boy has eczema. His general practitioner is undertaking a routine review of his care and notices that he is pale. The remainder of his examination is normal. His mother reports that he has been eating bits of carpet from his room recently.Investigations reveal:• Hb (haemoglobin): 66 g/L• WBC (white blood cell count): 10.2×109/L• platelet count: 350×109/L• MCV (mean cell volume): 60 fL (normal: 75–87 fL) What is the most appropriate treatment?", "opts": ["A. Dietary advice", "B. Folic acid", "C. Iron supplements", "D. Multivitamin tablets", "E. Vitamin B12 injections"], "ans": "C", "ansText": "C. Iron supplements", "jx": "1. Dietary advice is required but iron therapy is indicated as his anaemia is severe.\n2. An important supplement for women periconceptionally as it reduces the risk of neural tube defects in the fetus.\n3. Correct. Iron deficiency anaemia is the most likely diagnosis and iron therapy is indicated. The presence of ‘pica’ strongly suggests iron deficiency. He may well be a picky eater and survives on cow's milk and little else. In some children anaemia can be due to a β-thalassaemia trait. The blood parameters should be repeated after a course of treatment and if there has not been a response he should be tested for β-thalassaemia trait.\n4. Vitamins are recommended for all preschool children but with such a low haemoglobin and other results suggestive of iron deficiency, a treatment course of iron is indicated.\n5. A macrocytosis is usually seen in vitamin B12 deficiency, which is rare in children.", "img": []}, {"id": "c77b76465e8e10bf", "m": "10", "letter": "J", "inMod": 22, "code": "J22", "q": "A 9-year-old presents with fatigue, recurrent infections, and unexplained bruising over the last few months. What is the most important diagnosis to exclude?", "opts": ["A. Acute lymphoblastic leukemia (ALL)", "B. ITP", "C. Aplastic anaemia", "D. Iron deficiency", "E. Haemophilia"], "ans": "A", "ansText": "A. Acute lymphoblastic leukemia (ALL)", "jx": "ALL: Most common childhood cancer Bone marrow infiltration Pancytopenia Blasts on smearITP has isolated thrombocytopenia.", "img": []}, {"id": "c908875345da7474", "m": "10", "letter": "J", "inMod": 23, "code": "J23", "q": "A 6-month-old infant is brought to the clinic with a history of intermittent jaundice and dark urine. A blood test reveals a significant deficiency in glucose-6-phosphate dehydrogenase (G6PD). The parents express concern about foods that could trigger hemolytic episodes. What food should this infant avoid to prevent hemolytic anemia?", "opts": ["A. Milk", "B. Fava beans", "C. Rice", "D. Banana", "E. Carrots"], "ans": "B", "ansText": "B. Fava beans", "jx": "Fava beans trigger oxidative hemolysis in G6PD deficiency.", "img": []}, {"id": "5ac4bf2935aa48c8", "m": "10", "letter": "J", "inMod": 24, "code": "J24", "q": "A 5-year-old boy presents to the clinic for periodic high fevers over the past 2 weeks (average 39 °C). His mother states that he recently arrived from a holiday in East Africa approximately 3 weeks ago. His adoptive mother also reports that the child has complained of headaches, fatigue, and mild generalized abdominal pain. His last measured fever at home was 3 days ago. On physical examination, vital signs are notable for temperature of 40 °C, heart rate 155 bpm, and blood pressure 95/55 mmHg. He is ill-appearing and pale with scleral icterus noted. There is no nuchal rigidity or skin rash. Abdominal examination is significant for a large, tender spleen. Serum laboratory studies were performed with results noted below: ● Hemoglobin - 7.5 g/dL ● Hematocrit - 22%. ● WBC ‐ 3500 x 109 /L ● Neutrophils - 35%. ● Lymphocytes - 20%. ● Monocytes - 45%. ● Platelets - 350,000 x 109 /L ● Total bilirubin - 10.0mg/dL ● Direct bilirubin - 1.5mg/dL Which of the following additional tests will confirm the suspected diagnosis?", "opts": ["A. Bacterial blood culture", "B. Thick and thin blood smear", "C. Bone marrow aspiration", "D. Liver biopsy", "E. Viral serology/PCR"], "ans": "B", "ansText": "B. Thick and thin blood smear", "jx": "1. This patient’s clinical presentation and laboratory data support malaria as the likely diagnosis. Malaria is endemic in certain developing countries, including many within South East Asia and Africa (sparing northern countries in both regions). Malaria is a parasitic infection caused by various Plasmodium species. A bacterial blood culture may be useful in ruling out other potential causes of this child’s symptoms and fever but will not result in parasitic growth needed to diagnose malaria.\n2. Correct A relapsing high fever, anemia, and splenomegaly strongly suggest malaria, especially in a patient who has recently arrived from a suspected endemic area. Jaundice can also be visualized (skin, sclera, underside of tongue). Children may also complain of non-specific symptoms, including headache, fatigue, and abdominal discomfort. Laboratory values supporting this diagnosis include anemia with evidence of hemolysis (elevated indirect bilirubin). Lymphopenia and monocytosis are less specific markers but can also occur with a malarial infection. Diagnosis is confirmed with parasite visualization via light microscopy using thick and thin peripheral blood smears (see image). Blood smear from patient with P falciparum malaria. Intraerythrocytic parasite forms are visible in nearly 20% of red blood cells, some of which are doubly-infected. Arrows: typical signet ring, headphones, and appliqué forms of the parasite.\n3. While certain diseases affecting cell lines, including red blood cells, require a bone marrow aspirate to properly diagnose, malaria affects red blood cells peripherally once they have been formed, rather than at the production stage in the bone marrow itself. Furthermore, a bone marrow biopsy is an invasive procedure and would be inappropriate in this patient.\n4. Although malaria causes an inflammatory infiltration of the liver sinusoids, performing a liver biopsy would have low yield (inflammatory cells are generally a non-specific marker and would not confirm the diagnosis) and be unnecessarily invasive.\n5. Viral serologies, and DNA PCR if applicable, are beneficial in a patient with suspected viral infection. However, given the patient's clinical presentation, this would not be beneficial in a suspected parasitic infection.", "img": []}, {"id": "0fb920960e64ca07", "m": "11", "letter": "K", "inMod": 1, "code": "K1", "q": "An 8-year-old boy presents with low-grade fever, arthritis, colicky abdominal pain, and a purpuric rash limited to the lower extremities. Laboratory studies show a guaiac-positive stool, and urinalysis shows red blood cell casts and a mild proteinuria. Platelet count is 210,000/ μL. Which is the most likely underlying mechanism of this child's disease?", "opts": ["A. Activation of autoreactive T and B cells against nucleic acids and their binding proteins", "B. Antigen exposure stimulating immunoglobulin complexes to be deposited in target organs", "C. Autoantibodies to platelet membrane glycoproteins and phagocytosis by splenic macrophages", "D. In situ immune complex formation within glomeruli", "E. Intracellular bacteria propagating within the endothelial cells lining vasculature"], "ans": "B", "ansText": "B. Antigen exposure stimulating immunoglobulin complexes to be deposited in target organs", "jx": "1. This describes the underlying mechanism in systemic lupus erythematosus (SLE). Autoreactive cells produce antibodies such as antinuclear antibodies (highly sensitive but poorly specific), anti-dsDNA antibodies and anti-Smith antibodies (both highly specific but poorly sensitive), and more. SLE is associated with fevers, arthralgia, proteinuria, and rash, but the rash typically has a malar or \"butterfly\" distribution across the face. Symptoms usually begin in young adulthood. Treatment is highly dependent on manifestations and severity of disease, and includes lifestyle modifications, anti-inflammatory and immunosuppressant medications, and treatment of comorbid conditions.\n2. Correct This describes Henoch-Schönlein purpura (HSP), the most common vasculitis in childhood. It is characterized by leukocytoclastic vasculitis and IgA deposition in the small vessels of the skin, joints, gastrointestinal tract, and kidney. It classically occurs 10 days after an upper respiratory infection, but has also occurred after insect bites, immunization, medication usage, or with no identifiable trigger. The hallmark of HSP is its rash: palpable purpura beginning as pink macules and developing into petechiae or raised purpura of the lower extremities. Affected patients have normal platelet counts. Gastrointestinal manifestations occur in about 85% of patients and commonly include colicky pain, melanotic stools, and hematemesis. More rarely, intussusception, perforation, and pancreatitis can occur. Joint swelling occurs in about 75% of patients and may be arthritis or periarticular swelling. Renal involvement occurs in about 50% of patients and can range from mild hematuria or proteinuria to end-stage renal disease. Berger disease (IgA glomerulonephritis) is believed to be the renal manifestations of HSP without the rash. The majority of HSP patients self-resolve within 4 weeks, but up to 40% may have at least one recurrence. Treatment is mainly supportive with hydration, pain relief, and bowel rest, but a course of corticosteroids with a slow taper can be used for severe cases.\n3. This describes acute idiopathic thrombocytopenic purpura (ITP), an autoimmune phenomenon characterized by thrombocytopenia and a purpuric rash which is most common in ages 2-6 years. A viral prodrome commonly occurs within 3 weeks of its onset. In most cases, antibodies against platelet membrane glycoproteins coat platelets and render them susceptible to opsonization and phagocytosis by splenic macrophages. This leads to a platelet count that typically drops below 20,000/ μL. A petechial rash develops, primarily on the pressure points where there may be microscopic vessel damage, such as where the elastic band of clothing touches the skin. The course is self-limited, and treatment is supportive. Steroids and IV immunoglobulin therapy can be given in patients with active bleeds.\n4. This describes the most likely mechanism in poststreptococcal glomerulonephritis (PSGN), although several mechanisms have been proposed. PSGN is thought to be caused by specific nephritogenic strains of group A beta-hemolytic streptococcus. It usually occurs 10 days after strep pharyngitis or scarlet fever, or 3 weeks after group A strep skin infection. The clinical presentation varies from asymptomatic microscopic hematuria to acute nephritic syndrome, with proteinuria, edema, hypertension, elevation in serum creatinine, and red to brown urine. It does not typically involve a rash. Treatment is usually supportive, but those with evidence of persistent strep infection should receive a course of antibiotic therapy.\n5. This describes the mechanism of Rocky Mountain spotted fever (RMSF), the most lethal and frequently reported rickettsial illness in the United States. It is spread to humans by the Dermacentor tick. The R. rickettsii bacterium, a gram negative, obligate intracellular pathogen, multiplies in the endothelial cells of arterioles and venules, causing a vasculitis. Initial signs of RMSF include fever, headache, and myalgias, followed by a maculopapular-turned-petechial rash with a “centripetal” spread, meaning it begins in the extremities and spreads toward the trunk. Thrombocytopenia is present and becomes more severe throughout the course of the disease. Abdominal pain, cough, and edema, especially in children, may also be present. Curative treatment is oral or IV doxycycline ‐ it is one of the only instances in which a tetracycline is recommended in a child. Chloramphenicol is recommended for pregnant women.", "img": ["images/0fb920960e64ca07_0.jpg"]}, {"id": "c6091d425a99b7d1", "m": "11", "letter": "K", "inMod": 2, "code": "K2", "q": "An 8-year-old boy presents with joint pain. His mother reports that since yesterday he has been refusing to walk, as his legs are so painful. On examination his temperature is 37°C and his heart rate is 100 beats/min. He is settled at rest and playing a computer game on his iPad. On further examination you notice a rash over his lower limbs, buttocks, and forearms (Figure). The rash comprises some large (5–15 mm), red, raised lesions, and multiple pin-point lesions, which do not blanch on pressure. His peripheries are warm and he has a good pulse volume with a normal capillary refill time. There is some generalized swelling around his knees and ankles. He has pain on passive movement of both knees and ankles. What is the most likely diagnosis?", "opts": ["A. Henoch– Schönlein purpura", "B. Immune thrombocytopenic purpura", "C. Meningococcal septicaemia", "D. Reactive arthritis (transient synovitis)", "E. Systemic-onset juvenile idiopathic arthritis"], "ans": "A", "ansText": "A. Henoch– Schönlein purpura", "jx": "1. Correct. Henoch– Schönlein purpura is the most common vasculitis of childhood, and presents with a purpuric rash over the lower legs and buttocks, but which can also involve the extensor surface of the elbows. It is often associated with arthritis of the ankles or knees. In this case the child presented with the arthritis rather than the rash. Other features are abdominal pain, haematuria and proteinuria.\n2. The raised rash suggests a vasculitis rather than purpura from low platelets. Also the distribution in Henoch– Schönlein purpura and immune thrombocytopenic purpura is different.\n3. Meningococcal sepsis is unlikely as he is afebrile, and the purpura is restricted to his lower limbs and elbows, in a distribution characteristic of Henoch– Schönlein purpura.\n4. Reactive arthritis is unlikely as there is usually a preceding or accompanying infection, and the rash would not have this distribution and certainly would not be purpuric.\n5. Systemic-onset juvenile idiopathic arthritis is accompanied by a high fever in a child who is systemically unwell; the salmon-pink coloured rash is widespread and blanches.", "img": ["images/c6091d425a99b7d1_0.jpg"]}, {"id": "a204e6d3afa0618d", "m": "11", "letter": "K", "inMod": 3, "code": "K3", "q": "A 14-year-old girl has developed a right-sided limp that has been present for 2 weeks. She is now complaining of pain in her right hip and knee. On examination, she has a temperature of 37.4°C. She is overweight (95th centile), with a body mass index of 26 kg/m2. She has a decreased range of movement of the right hip. Blood tests, including a full-blood count and a C-reactive protein are taken and are normal.Her hip X-ray is shown in the figure. What is the most likely diagnosis?", "opts": ["A. Osgood–Schlatter disease", "B. Osteomyelitis", "C. Perthes disease", "D. Septic arthritis", "E. Slipped capital femoral epiphysis"], "ans": "E", "ansText": "E. Slipped capital femoral epiphysis", "jx": "1.Osgood–Schlatter disease affects the knees.\n2.Osteomyelitis is less likely as she is not systemically unwell, for example there is no fever.\n3.Perthes disease usually affects children aged 5–10 years. There is degeneration of the femoral head – which is not seen here.\n4.Septic arthritis is less likely as she is not systemically unwell.\n5. Correct. She has a slipped capital femoral epiphysis (also known as slipped upper femoral epiphysis). This results in displacement of the epiphysis of the femoral head postero-inferiorly (Figure below, arrow). It is most common at 10–15 years of age during the adolescent growth spurt, particularly in obese individuals. It is slightly more common in boys.", "img": ["images/a204e6d3afa0618d_0.jpg"]}, {"id": "d2fcaf44f059421c", "m": "11", "letter": "K", "inMod": 4, "code": "K4", "q": "A 15-year-old post-pubertal girl attends A&E with a 2-month history of lower back pain which worsens throughout the day. She is tender on deep palpation of the paraspinal muscles of the lower back. Examination reveals that she is well grown. Her height is 170 cm (90th centile ) and her weight is 74 kg (98th centile). What is the most likely diagnosis?", "opts": ["A. Ankylosing spondylitis", "B. Discitis", "C. Musculoskeletal back pain", "D. Osteoid osteoma", "E. Rhabdomyosarcoma"], "ans": "C", "ansText": "C. Musculoskeletal back pain", "jx": "1.Ankylosing spondylitis is a rare condition, which makes this less likely. In the later stages there is limitation of flexion of the spine. Pain and stiffness often improve with activity.\n2.Discitis is rare in older children and adults. There is usually fever and pain which results in distress for the child. Palpation usually is painful over the spine rather than the paraspinal areas.\n3.Correct . Muscular pain presents with pain and tenderness in the muscles, usually the paraspinal muscles, rather than in the spine itself. It usually relates to a biomechanical imbalance with overuse of a particular group of muscles. The specific cause of the pain may be difficult to pinpoint and may well be multifactorial.\n4.This is rare but tumours must be considered if there are red flags. These include weight loss, focal neurology, night waking, fever and young age. Osteoid osteomas would usually present with bony pain.\n5.This is also rare but tumours must be considered if there are red flags (see above). Rhabdomyosarcomas would usually present with swelling, pain and asymmetry.", "img": []}, {"id": "dfa27df7e0640d28", "m": "11", "letter": "K", "inMod": 5, "code": "K5", "q": "A girl, aged 5 years, presents to her general practitioner. She has been unwell for 2 weeks with lethargy, fever and painful wrists and knees. On examination she has a temperature of 38.5°C and a subtle erythematous rash on her trunk. You identify that several joints are swollen, warm, and painful to move, including the wrists, her right elbow, the knees, her left ankle and left hip. She has some cervical lymphadenopathy and her spleen is palpable. She has no previous medical problems and her mother has been giving her paracetamol. You perform some blood tests and get the following results:• Hb (haemoglobin), 85 g/L; WBC (white blood count), 17×109/L; neutrophils, 10.4×109/L; platelets, 366×109/L• blood film: normal, no atypical lymphocytes• ESR (erythrocyte sedimentation rate): 70 mm/hour• ANA (antinuclear antibody): negative• double-stranded DNA: negative• antistreptolysin O titre: normal. What is the most likely diagnosis?", "opts": ["A. Acute lymphoblastic leukaemia", "B. Epstein–Barr virus infection", "C. Post-streptococcal arthritis", "D. Systemic lupus erythematosus (SLE)", "E. Systemic-onset juvenile idiopathic arthritis"], "ans": "E", "ansText": "E. Systemic-onset juvenile idiopathic arthritis", "jx": "1.Acute lymphoblastic leukaemia needs to be considered, but is less likely as she has numerous joints affected and the blood film is normal.\n2.Epstein–Barr virus is unlikely as it rarely causes widespread arthritis.\n3.Post-streptococcal arthritis is unlikely as the antistreptolysin O titre is normal, although a repeat blood test is required to confirm that the titre remains low.\n4.SLE may have similar clinical features but is unlikely as the ANA (antinuclear antibody) and double-stranded DNA are negative. SLE is also very uncommon at this age.\n5.Correct . Systemic-onset juvenile idiopathic arthritis is the most likely diagnosis, as she has a systemic illness, polyarthritis (more than four joints) and a salmon-pink rash. The raised neutrophil count and markedly raised ESR are consistent with the diagnosis.", "img": []}, {"id": "4277ac1991187321", "m": "11", "letter": "K", "inMod": 6, "code": "K6", "q": "A 7-year-old girl presents with 2 months history of swelling and stiffness of her knees and wrists. Her mother reports that the symptoms are worse in the morning and improve throughout the day. Blood tests show elevated CRP and ESR, and ANA is positive. No evidence of infection or malignancy is found. What is the most likely diagnosis?", "opts": ["A. Septic arthritis", "B. Juvenile idiopathic arthritis (JIA)", "C. Rheumatic fever", "D. Systemic lupus erythematosus", "E. Chronic recurrent multifocal osteomyelitis (CRMO)"], "ans": "B", "ansText": "B. Juvenile idiopathic arthritis (JIA)", "jx": "Chronic arthritis >6 weeks, exclusion diagnosis.", "img": []}, {"id": "2604a005c0eae1d9", "m": "11", "letter": "K", "inMod": 7, "code": "K7", "q": "A 12-year-old girl sees her specialist for a condition that has developed slowly over the past 18 months. Today her hands appear as shown in the figure. Which of the following findings is most strongly associated with her underlying condition?", "opts": ["A. Human leukocyte antigen B27", "B. Lymphocytosis", "C. Poor response to non-steroidal anti-inflammatory drugs", "D. Skin nodules", "E. Thrombocytopenia"], "ans": "D", "ansText": "D. Skin nodules", "jx": "1.Human leukocyte antigen B27 is associated with ankylosing spondylitis and sacroiliitis.\n2.Lymphocytosis is rare in juvenile rheumatoid arthritis. Once patients are started on immunosuppression, however, they can become leukopenic.\n3.Patients with juvenile rheumatoid arthritis who respond poorly to nonsteroidal anti-inflammatory drugs often d
