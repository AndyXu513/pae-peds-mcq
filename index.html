<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#156082">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="儿科MCQ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>儿科 MCQ 刷题 · PAE 275 题</title>
<style>
:root{
  --bg:#F4F7FA; --card:#fff; --ink:#0E2841; --muted:#6B7A8C;
  --teal:#156082; --teal-d:#0E4560; --teal-l:#E8F1F6;
  --green:#01AD56; --green-l:#EAF9F1; --red:#C00000; --red-l:#FDECEC;
  --amber:#E97132; --border:#E1E8EF; --shadow:0 1px 2px rgba(14,40,65,.06),0 8px 24px rgba(14,40,65,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:clip}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:18px;
  padding:12px 22px; background:rgba(255,255,255,.9); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15.5px;letter-spacing:.2px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-l)}
.sub{font-size:12px;color:var(--muted);font-weight:450;margin-left:-4px}
.bar{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.track{flex:1;height:7px;border-radius:99px;background:#E6EDF3;overflow:hidden;min-width:60px}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),#2E8BA8);transition:width .35s ease}
.nums{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.nums b{color:var(--ink);font-weight:650}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtn{
  font-size:12.5px;padding:7px 13px;border-radius:9px;border:1px solid var(--border);
  background:#fff;color:var(--ink);transition:.16s;white-space:nowrap
}
.hbtn:hover{border-color:#C9D6E2;background:#FBFDFE}
.hbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.hbtn.danger:hover{border-color:var(--red);color:var(--red)}



/* ---------- layout ---------- */
main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1180px;margin:0 auto;min-height:calc(100vh - 57px)}
aside{padding:18px 12px 40px 22px;border-right:1px solid transparent;position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto}
.cat{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 11px;margin-bottom:2px;border-radius:9px;font-size:13.2px;color:#3D5165;transition:.14s
}
.cat:hover{background:#EBF1F6}
.cat.on{background:var(--teal-l);color:var(--teal-d);font-weight:650}
.cat .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.on .cnt{color:var(--teal)}
.cat .cnt .dn{color:var(--green)}
.cat .bar2{width:0;height:3px;border-radius:2px;background:var(--teal);opacity:.5}
.cathead{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#95A3B3;padding:6px 11px 8px;font-weight:650}

/* ---------- stage ---------- */
section{padding:26px 30px 80px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
  background:var(--teal-l);color:var(--teal-d);white-space:nowrap
}
.badge.code{background:var(--teal);color:#fff;font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.qnum{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.state{margin-left:auto;font-size:12px;font-weight:650}
.state.ok{color:var(--green)} .state.no{color:var(--red)}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px 24px;box-shadow:var(--shadow)}
.stem{font-size:16.5px;line-height:1.72;margin:0 0 6px;font-weight:480;letter-spacing:.05px}
.stem em{font-style:normal;background:linear-gradient(transparent 62%,#FFF1D6 62%);padding:0 1px}
.figure{margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:12px}
.figure img{max-width:340px;max-height:320px;border-radius:10px;border:1px solid var(--border);background:#fff}

.opts{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 15px;border:1.5px solid var(--border);border-radius:11px;background:#fff;
  font-size:14.6px;line-height:1.55;transition:.15s;color:var(--ink)
}
.opt:hover:not(.locked){border-color:#B9CBD9;background:#FBFDFF;transform:translateY(-1px)}
.opt .k{
  flex:0 0 25px;height:25px;border-radius:7px;background:#F0F4F8;color:#52657A;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;margin-top:1px
}
.opt .t{flex:1}
.opt.locked{cursor:default}
.opt.pick{border-color:var(--teal);background:var(--teal-l)}
.opt.pick .k{background:var(--teal);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-l)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt .mark{font-weight:800;font-size:14px;margin-left:4px}

/* ---------- explanation ---------- */
.jx{
  margin-top:20px;border-radius:12px;border:1px solid #DDE9F1;background:linear-gradient(180deg,#F7FBFD,#F2F8FB);
  padding:0 18px;overflow:hidden;max-height:0;opacity:0;transition:max-height .4s ease,opacity .3s ease,padding .3s ease
}
.jx.open{max-height:4000px;opacity:1;padding:16px 18px}
.jx .ans{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--green);margin-bottom:10px;font-size:14.5px}
.jx .ans span{font-weight:650;color:var(--ink)}
.jx .ans i{font-style:normal;font-size:11.5px;background:var(--green);color:#fff;padding:2px 7px;border-radius:5px;font-weight:650}
.jx .lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#7A8CA0;font-weight:700;margin:2px 0 6px}
.jx p{margin:0;font-size:14.1px;line-height:1.75;color:#33475C;white-space:pre-wrap}

/* ---------- footer nav ---------- */
.nav{display:flex;align-items:center;gap:10px;margin-top:22px}
.nav .spacer{flex:1}
.nbtn{
  padding:11px 18px;border-radius:11px;border:1px solid var(--border);background:#fff;font-size:13.5px;
  font-weight:560;transition:.15s;display:flex;align-items:center;gap:7px
}
.nbtn:hover:not(:disabled){border-color:#B9CBD9;background:#FBFDFF}
.nbtn:disabled{opacity:.4;cursor:not-allowed}
.nbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nbtn.primary:hover{background:var(--teal-d)}
.nbtn.ghost{font-size:12.5px;color:var(--muted);padding:9px 12px}
.nbtn.dash{border-style:dashed;border-color:#B7CBD8;color:var(--teal-d);font-size:13px;font-weight:600}
.nbtn.dash:hover{background:var(--teal-l);border-color:var(--teal)}
.kbd{font-size:11px;color:#9AAABA;margin-top:10px;letter-spacing:.02em}
.kbd kbd{background:#EDF2F6;border-radius:4px;padding:1px 5px;font-family:inherit;font-size:10.5px;color:#5A6E82}

.empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:14px}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:650}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% 10%,#EAF3F8 0%,#DDE9F2 40%,#C9DCEA 100%);padding:20px}
.gate.hide{display:none}
.gatebox{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:34px 30px 28px;
  box-shadow:0 24px 60px rgba(14,40,65,.18),0 2px 6px rgba(14,40,65,.08);text-align:center;
  animation:pop .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.gatebox.shake{animation:shk .38s}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.gatebox .ic{font-size:34px;line-height:1;margin-bottom:10px}
.gatebox h2{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:.2px}
.gatebox .gq{margin:14px 0 16px;font-size:19px;font-weight:650;color:var(--teal-d);line-height:1.5}
.gatebox input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;
  font-size:15px;text-align:center;outline:none;transition:.15s;font-family:inherit}
.gatebox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(21,96,130,.12)}
.gatebox button{width:100%;margin-top:12px;padding:12px;border-radius:11px;background:var(--teal);color:#fff;
  font-size:14.5px;font-weight:650;transition:.15s}
.gatebox button:hover{background:var(--teal-d)}
.gmsg{min-height:18px;font-size:12.5px;color:var(--red);margin-top:9px}
.ghint{font-size:11.5px;color:#98A6B6;margin-top:12px}
.gok{color:var(--green);font-size:13px;font-weight:650;margin-top:9px;min-height:18px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);z-index:150;
  background:#0E2841;color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;
  display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(14,40,65,.28);
  opacity:0;pointer-events:none;transition:.28s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:rgba(255,255,255,.16);color:#fff;padding:5px 11px;border-radius:7px;font-size:12.5px}
#toast button:hover{background:rgba(255,255,255,.28)}

/* ---------- 错题本视图 ---------- */
.wpage-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.wpage-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
.wpage-head .wsub{font-size:12.5px;color:var(--muted)}
.wpage-head .wact{margin-left:auto;display:flex;gap:8px}
.wgroup{margin-top:22px}
.wgroup-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.wgroup-h .wt{font-size:13.5px;font-weight:650;color:var(--teal-d)}
.wgroup-h .wc{font-size:11.5px;color:var(--muted);background:#EBF1F6;padding:1px 8px;border-radius:99px}
.wgroup-h .wline{flex:1;height:1px;background:var(--border)}
.wcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;margin-bottom:9px;transition:.15s;box-shadow:0 1px 2px rgba(14,40,65,.04)}
.wcard:hover{border-color:#BFD3E0;transform:translateY(-1px);box-shadow:0 6px 18px rgba(14,40,65,.07)}
.wcard .wtop{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.wcard .wno{font-size:11.5px;color:#95A3B3;font-variant-numeric:tabular-nums}
.wcard .wq{font-size:14px;line-height:1.55;color:#25384B;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.wcard .wans{display:flex;gap:14px;margin-top:9px;font-size:12px;align-items:center}
.wcard .wans .bad{color:var(--red)}
.wcard .wans .good{color:var(--green);font-weight:600}
.wcard .wgo{margin-left:auto;font-size:12px;color:var(--teal);font-weight:600}

/* ---------- exam ---------- */
.hbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:650}
.hbtn.primary:hover{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.exbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.exbar .exlab{font-size:13px;font-weight:650;color:var(--teal-d)}
.exbar .exnum{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.exbar .extrack{flex:1;height:7px;border-radius:99px;background:#E6EDF3;overflow:hidden;min-width:80px}
.exbar .extrack i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2E8BA8);border-radius:99px;transition:width .3s}
.opt.sel{border-color:var(--teal);background:var(--teal-l)}
.opt.sel .k{background:var(--teal);color:#fff}
.exnote{font-size:11.5px;color:#98A6B6;margin-top:10px}

.scorebox{background:#fff;border:1px solid var(--border);border-radius:18px;padding:30px 28px;box-shadow:var(--shadow);text-align:center}
.scorebox .big{font-size:56px;font-weight:750;line-height:1;color:var(--teal-d);font-variant-numeric:tabular-nums}
.scorebox .big span{font-size:22px;font-weight:600;color:#95A3B3}
.scorebox .pct{margin-top:10px;font-size:14px;color:var(--muted)}
.scorebox .pct b{color:var(--ink);font-weight:700}
.modbars{margin:24px auto 6px;max-width:520px;text-align:left}
.mbrow{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px}
.mbrow .mbl{width:150px;color:#52657A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbrow .mbt{flex:1;height:8px;border-radius:99px;background:#EDF2F6;overflow:hidden}
.mbrow .mbt i{display:block;height:100%;border-radius:99px;background:var(--green)}
.mbrow .mbt i.bad{background:var(--red)}
.mbrow .mbv{width:52px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.scoreacts{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.scoreacts button{padding:11px 18px;border-radius:11px;border:1px solid var(--border);background:#fff;font-size:13.5px;font-weight:560}
.scoreacts button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.scoreacts button:hover{border-color:#B9CBD9;background:#FBFDFE}
.scoreacts button.primary:hover{background:var(--teal-d)}
@media (max-width:820px){
  .scorebox{padding:22px 16px}
  .scorebox .big{font-size:44px}
  .mbrow .mbl{width:96px;font-size:11px}
  .exbar .extrack{min-width:50px}
}

/* ---------- jump ---------- */
.jumpwrap{display:inline-flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:10px;
  background:#fff;overflow:hidden;height:40px}
.jumpwrap input{width:66px;border:none;outline:none;padding:0 8px;font-size:13px;height:100%;
  text-align:center;font-variant-numeric:tabular-nums;background:transparent}
.jumpwrap input::placeholder{color:#A9B7C5}
.jumpwrap button{padding:0 12px;height:100%;font-size:12.5px;color:var(--teal);font-weight:600;
  border-left:1px solid var(--border)}
.jumpwrap button:hover{background:var(--teal-l)}

.gatebox.jp{max-width:660px;text-align:left;padding:24px 24px 18px}
.gatebox.jp h2{margin:0 0 12px;font-size:17px;text-align:center}
#jumpSearch{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;outline:none;text-align:left;transition:.15s}
#jumpSearch:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(21,96,130,.12)}
.jp-body{max-height:52vh;overflow:auto;margin:14px 0 6px;padding-right:4px}
.jp-g{margin-bottom:14px}
.jp-g-h{font-size:11.5px;color:#7A8CA0;font-weight:650;letter-spacing:.04em;margin-bottom:6px}
.jp-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.gatebox .jcell{height:32px;border-radius:7px;border:1px solid var(--border);background:#fff;color:#6B7A8C;
  font-size:12px;font-variant-numeric:tabular-nums;transition:.12s;padding:0;margin:0;font-weight:500}
.gatebox .jcell:hover{border-color:var(--teal);color:var(--teal);background:#F4FAFD}
.gatebox .jcell.ok{background:var(--green-l);border-color:#BFE8D2;color:#028A45;font-weight:650}
.gatebox .jcell.no{background:var(--red-l);border-color:#F3C7C7;color:#A80000;font-weight:650}
.gatebox .jcell.cur{outline:2px solid var(--teal);outline-offset:1px;font-weight:750;color:var(--teal-d);background:#EAF4F9}
.jp-empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}
.jp-hint{font-size:11.5px;color:#98A6B6;text-align:center;margin-top:8px}
@media (max-width:820px){
  .gatebox.jp{padding:18px 16px 14px}
  .jp-body{max-height:46vh}
  .jumpwrap{height:36px}
  .jumpwrap input{width:52px}
}

/* ---------- backup modal ---------- */
.gatebox.bk{max-width:520px;text-align:left;padding:26px 26px 22px}
.gatebox.bk h2{margin:0 0 6px;font-size:17px;text-align:center}
.bkdesc{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 16px}
.bkrow{display:flex;gap:8px;margin:10px 0}
.gatebox .bkbtn{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#fff;
  font-size:13px;font-weight:560;color:var(--ink);transition:.15s;margin-top:0}
.gatebox .bkbtn:hover{border-color:#B9CBD9;background:#FBFDFE}
.gatebox .bkbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.gatebox .bkbtn.primary:hover{background:var(--teal-d)}
.bklab{font-size:11.5px;color:#7A8CA0;margin:14px 0 6px}
#bkInput{width:100%;height:74px;resize:vertical;border:1.5px solid var(--border);border-radius:10px;
  padding:9px 11px;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#33475C;
  background:#FBFDFE;text-align:left;outline:none;word-break:break-all}
#bkInput:focus{border-color:var(--teal)}
.bkmsg{font-size:12.5px;min-height:18px;margin-top:8px;text-align:center}
.bknote{font-size:11.5px;color:#98A6B6;line-height:1.6;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}

@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr);width:100%;max-width:100%}
  aside{position:static;max-height:none;border-right:none;padding:12px 14px;display:flex;gap:6px;overflow-x:auto;white-space:nowrap;min-width:0;max-width:100%}
  aside .cathead{display:none}
  .cat{width:auto;margin:0;flex-shrink:0;padding:7px 12px;background:#fff;border:1px solid var(--border)}
  .cat .cnt{margin-left:6px}
  section{padding:16px 14px 60px;min-width:0;max-width:100%}
  header{padding:10px 12px;gap:8px;flex-wrap:nowrap;min-width:0}
  .brand{display:none}
  .hbtns{width:100%;justify-content:space-between;gap:5px}
  .hbtn{flex:1;text-align:center;padding:7px 2px;font-size:10.5px}
  .nbtn.dash{font-size:12px;padding:9px 11px}
  .brand .sub,.track,.nums{display:none}
  .hbtns{gap:6px}
  .hbtn{padding:6px 10px;font-size:12px}
  .card{padding:18px 15px;overflow-wrap:anywhere}
  .stem{font-size:15px;overflow-wrap:anywhere}
  .opt{font-size:14px;padding:11px 12px}
  .figure img{max-width:100%;height:auto}
  .nav{flex-wrap:wrap}
  .wcard{padding:12px 13px}
  .wcard .wq{font-size:13.5px}
  .wcard .wans{flex-direction:column;align-items:flex-start;gap:2px;margin-top:8px;font-size:11.5px}
  .wcard .wans .wgo{display:none}
  .wcard .wtop::after{content:"\203A";margin-left:auto;color:#B9CBD9;font-size:18px;line-height:1}
  .wpage-head .wact{width:100%;margin-left:0}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatebox" id="gatebox">
    <div class="ic">🎫</div>
    <h2>进门先对暗号</h2>
    <p class="gq">龙大彭于晏是谁？</p>
    <input id="gateInput" placeholder="输入答案后回车" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="gateBtn">进入刷题</button>
    <div class="gmsg" id="gateMsg"></div>
    <div class="ghint">答对了才放你进去 😉</div>

</div>

<script>
const DATA = {"modules": [{"c": "01", "t": "01 呼吸系统", "letter": "A"}, {"c": "02", "t": "02 感染与免疫接种", "letter": "B"}, {"c": "03", "t": "03 新生儿", "letter": "C"}, {"c": "04", "t": "04 心血管", "letter": "D"}, {"c": "05", "t": "05 急救与重症", "letter": "E"}, {"c": "06", "t": "06 肾脏与泌尿", "letter": "F"}, {"c": "07", "t": "07 神经系统", "letter": "G"}, {"c": "08", "t": "08 内分泌·生长与青春期", "letter": "H"}, {"c": "09", "t": "09 营养与消化", "letter": "I"}, {"c": "10", "t": "10 血液与肿瘤", "letter": "J"}, {"c": "11", "t": "11 风湿免疫", "letter": "K"}, {"c": "12", "t": "12 发育·行为与社会儿科", "letter": "L"}, {"c": "13", "t": "13 遗传与代谢", "letter": "M"}, {"c": "14", "t": "14 临床技能与沟通", "letter": "N"}], "questions": [{"id": "86540ca3f1b29f3b", "m": "01", "letter": "A", "inMod": 1, "code": "A1", "q": "A 10-year-old girl, has frequent attacks of asthma. She attends the emergency department with increasing difficulty in breathing over the last 12 hours. Initial observation shows that she is anxious, sitting upright, has a marked tracheal tug and is unable to complete a sentence. Which of the following statements is most likely to be correct?", "opts": ["A. Her asthma attack is of moderate severity", "B. Her condition is likely to improve if she is encouraged to lie flat", "C. Her oxygen saturation should be measured", "D. She should be taken promptly to the X-ray department for a chest X-ray", "E. The lack of wheeze should make you consider a panic attack"], "ans": "C", "ansText": "C. Her oxygen saturation should be measured", "jx": "1. Sarah's attack is severe as she is unable to complete a sentence.\n2. Sitting upright assists lung mechanics and enables her to use her accessory muscles.\n3. Correct. Oxygen saturation should be measured to further assess the severity of the asthma attack and to guide treatment.\n4. The priority is to treat Sarah's asthma. If a chest X-ray is indicated, then a portable X-ray machine should be brought to any patient who is significantly unwell.\n5. The absence of wheeze implies that little air is moving in and out of the chest and would indicate severe bronchoconstriction.", "img": []}, {"id": "0a3065778cb1d6e8", "m": "01", "letter": "A", "inMod": 2, "code": "A2", "q": "Vignette: An 18-month-old boy woke up from sleep with a barking cough and breathlessness. On arrival to the emergency department, he has a low-grade fever but remains alert and playful. Oxygen saturation is 94% on room air. On examination, he has a barking cough, hoarse voice and an inspiratory stridor. Question: Which of the following is the most appropriate initial management?", "opts": ["A. Intubation and intravenous antibiotics", "B. Nebulised adrenaline and intravenous hydrocortisone", "C. Oral dexamethasone and minimal handling", "D. Chest X-ray", "E. Nebulised salbutamol"], "ans": "C", "ansText": "C. Oral dexamethasone and minimal handling", "jx": "Croup is a clinical diagnosis, typically caused by a viral laryngotracheitis leading to airway oedema. Management aims to reduce inflammation (e.g. dexamethasone) and avoid agitation (minimal handling). Nebulised adrenaline is reserved for moderate to severe respiratory distress. Investigations like CXR add no value and may aggravate distress.", "img": []}, {"id": "10ada4eb076c70ef", "m": "01", "letter": "A", "inMod": 3, "code": "A3", "q": "A 3-year-old boy presents to the emergency department in severe respiratory distress. The parents have been trying to calm him and make him feel better using warm baths and home remedies for the past several hours, with no improvement. He has been refusing to eat since his symptoms began a few hours ago. They tell the attending that their son is not fully immunized. On examination, the child is febrile with a temperature of 40.5°C (104.9°F). He is leaning forward with his chin hyperextended, and he is drooling with his tongue protruding from his mouth. There is an audible inspiratory stridor with associated coughing, and he has subcostal and intercostal retractions. Which of the following is the most appropriate initial step in management?", "opts": ["A. Albuterol treatment and monitor response", "B. Broad-spectrum IV antibiotics", "C. Corticosteroid treatment", "D. Prepare to intubate", "E. Racemic epinephrine treatment"], "ans": "D", "ansText": "D. Prepare to intubate", "jx": "1. Albuterol, also known as salbutamol, is a beta-2-agonist that relaxes bronchial smooth muscles. It is used to treat bronchospasm of any etiology, including asthma or COPD. Side effects to monitor include tachycardia, hypokalemia, and arrhythmia. This patient has airway inflammation rather than bronchospasm, so albuterol is not indicated.\n2. Antibiotics such as cefotaxime, ceftriaxone, or meropenem should be given in suspected epiglottitis, pending culture and susceptibility reports, because 10-40% of H. influenzae type b cases are resistant to ampicillin. However, the first priority in epiglottitis is always securing an airway, and vascular access should not be attempted because the added stress can be detrimental to the airway. After an artificial airway is established, antibiotics should be initiated and continued for at least 10 days. Epiglottitis typically resolves after a few days of antibiotics, and then the patient can be extubated.Antibiotics, with or without surgical drainage, are also important in the case of retropharyngeal abscess (RPA) or peritonsillar abscess (PTA). RPA and PTA must also be considered in a patient with respiratory distress, stridor, fever, and drooling. However, both RPA and PTA typically have slower disease progression.\n3. Corticosteroids are indicated for laryngotracheobronchitis, or croup — a viral infection of the upper respiratory tract that can lead to upper airway occlusion due to swelling. A patient with croup can tolerate eating, unlike this patient, because the point of irritation is below the level of the glottis, and neither food nor fluid will cause direct irritation of the subglottic tissues. Even in mild croup, the anti-inflammatory action of oral corticosteroids has been shown to reduce hospitalization time and frequency, and alsi decrease the need for subsequent interventions, such as epinephrine administration. However, corticosteroids, like epinephrine, are ineffective in epiglottitis.\n4. Correct The patient most likely has epiglottitis from a Haemophilus influenza type B infection. The clinical triad of drooling, dysphagia, and distress is a classic presentation of a swollen epiglottis. Other typical signs that are seen in this patient include high fever, stridor, tongue protrusion, refusal to eat, and chest retractions while breathing. This patient also has an incomplete immunization history which makes this bacterium more likely. Because a swollen epiglottis could close a patient’s airway at any moment, the first step in suspected epiglottitis is to ensure airway patency with endotracheal or nasotracheal intubation, or, less commonly, tracheostomy. As many as 6% of children without an artificial airway die from epiglottitis, compared to <1% with an artificial airway. All patients should also receive 100% humidified oxygen by mask en route to the operating room or intensive care unit, unless the mask causes excessive agitation.If the diagnosis is unclear and the patient is not in respiratory distress, a lateral neck radiograph can be taken to confirm the diagnosis. It will show a markedly thickened epiglottis (white arrow), which is referred to as the thumb sign. It may also show aryepiglottic fold thickening (black arrow).\n5. Racemic epinephrine, given in nebulized form, is useful for less urgent cases of airway edema and obstruction. It stimulates alpha and beta-adrenergic receptors to produce vascular smooth muscle contraction, which decreases capillary blood flow and shrinks upper respiratory mucosa. Racemic epinephrine was historically chosen over 1-epinephrine to minimize anticipated cardiovascular side effects of tachycardia and hypertension. It is indicated for croup and acute laryngeal swelling due to allergy. However, racemic epinephrine, like corticosteroids, is ineffective in epiglottitis. Epiglottitis is a true medical emergency that requires urgent, expert airway management.", "img": []}, {"id": "36154e7fddbf6e61", "m": "01", "letter": "A", "inMod": 4, "code": "A4", "q": "Vignette: A 14-year-old girl presents with a chronic dry cough lasting over six months. The cough worsens with laughter and weather changes but is not associated with nocturnal symptoms or exercise limitation. Examination shows normal growth, no clubbing, and a clear chest. Her father smokes, and she has allergic rhinitis. Question: What is the most likely diagnosis?", "opts": ["A. Pneumonia", "B. Tuberculosis", "C. Asthma", "D. Bronchiectasis", "E. Chronic aspiration"], "ans": "C", "ansText": "C. Asthma", "jx": "Cough-variant asthma: Dry cough Triggered by cold/laughter Atopy history Normal baseline examBronchiectasis → wet cough. TB → systemic symptoms.", "img": []}, {"id": "c23da72da5589060", "m": "01", "letter": "A", "inMod": 5, "code": "A5", "q": "A 5-month-old Caucasian infant, is admitted to hospital with breathing problems and poor feeding. On examination he has a respiratory rate of 50 breaths/min. On auscultation of the chest he has widespread crackles. He has moderate intercostal recession, and oxygen saturation of 92% in air. He was born at term with a birthweight of 3.6 kg (50th centile). His weight is now 5.2 kg (<0.4th centile). This is his first admission to hospital but he ‘is always chesty’. You suspect a diagnosis of cystic fibrosis. When he is stabilized, which would be the most appropriate investigation to perform?", "opts": ["A. Genetic screening for cystic fibrosis", "B. Heel prick for immunoreactive trypsin", "C. Measurement of faecal elastase", "D. Measurement of serum bilirubin", "E. Sweat test"], "ans": "E", "ansText": "E. Sweat test", "jx": "1. Phe508del is the most common mutation in cystic fibrosis, but is not diagnostic as some children with cystic fibrosis will have a different mutation. Even screening for the most common mutations will miss some affected children. If the sweat test is positive or borderline, then genetic screening is helpful in determining prognosis. Some mutations are associated with milder disease or may be amenable to treatment.\n2. Immunoreactive trypsin remains high (elevated) only for a few weeks before returning to normal levels. This test is used for newborn screening.\n3. Children with untreated cystic fibrosis will have low faecal elastase and faltering weight. This confirms pancreatic insufficiency. However, cystic fibrosis is not the only cause for this and a sweat test will still be required.\n4. Cystic fibrosis can cause prolonged jaundice (>14 days of age), but this is not specific.\n5. Correct. Abnormal function of the sweat glands results in excessive concentrations of sodium and chloride in the sweat, and this is the basis of the essential diagnostic test for cystic fibrosis.", "img": []}, {"id": "b0c6bd7d42b8ecad", "m": "01", "letter": "A", "inMod": 6, "code": "A6", "q": "A 3-year-old boy, is seen by his general practitioner because of recurrent wheezing associated with upper respiratory tract infections. Which of the following features most supports the diagnosis of asthma?", "opts": ["A. Daytime cough", "B. Finger clubbing", "C. Peak-flow variability diary", "D. Persistent moist cough", "E. The presence of symptoms between coughs and colds"], "ans": "E", "ansText": "E. The presence of symptoms between coughs and colds", "jx": "1. Nocturnal cough is classically experienced with asthma. A cough that always resolves during sleep is likely to be habitual (psychogenic).\n2. Clubbing suggests suppurative lung disease or congenital heart disease.\n3. He is too young to perform peak flow reliably.\n4. This suggests persistent bacterial bronchitis.\n5. Correct. The presence of interval symptoms and atopic conditions (eczema/hay fever) helps to distinguish asthma from viral-induced wheeze.", "img": []}, {"id": "22c030b114f969d1", "m": "01", "letter": "A", "inMod": 7, "code": "A7", "q": "Vignette: A 3-year-old boy presents to the emergency department with palpitations and irritability. His heart rate is 240 bpm, regular. This is the trace on the cardiac monitor. Question: What is the most appropriate next step in management?", "opts": ["A. Intravenous Adenosine", "B. Intravenous Verapamil", "C. Digoxin infusion", "D. Asynchornised Cardioversion", "E. Intravenous Propranolol"], "ans": "A", "ansText": "A. Intravenous Adenosine", "jx": "Adenosine terminates AV nodal re-entrant tachycardia.Verapamil contraindicated in infants.", "img": ["images/22c030b114f969d1_0.jpg"]}, {"id": "774b3e8cd75eab83", "m": "01", "letter": "A", "inMod": 8, "code": "A8", "q": "Vignette: A 6 year old boy presents with frequent asthma exacerbations despite medication. His mother reports the family lives in a small apartment shared with his grandparents, who smoke indoors. Question: What additional history would be most helpful in assessing his risk factors?", "opts": ["A. Confirm his Immunization status", "B. Ask about school performance", "C. Ask about home ventilation, smoke exposure and housing condition", "D. Ask about recent foreign travel", "E. Ask about potential food triggers"], "ans": "C", "ansText": "C. Ask about home ventilation, smoke exposure and housing condition", "jx": "A complete social and environmental history helps identify triggers and modifiable risk factors (e.g., smoke exposure). Home conditions, family routines, and caregiver practices directly influence paediatric health.Poorly controlled asthma is a risk factor for having severe food allergy", "img": []}, {"id": "177f8cfef9ed1795", "m": "01", "letter": "A", "inMod": 9, "code": "A9", "q": "An 18-month-old girl, presents to her family doctor with coryza, cough and a mild fever for 3 days. She feeds poorly and is unsettled at night. Her respiratory rate is normal and there is no chest recession. What is the most likely diagnosis?", "opts": ["A. Bronchiolitis", "B. Frontal sinusitis", "C. Pneumonia (lower respiratory tract infection)", "D. Tonsillitis", "E. Upper respiratory tract infection"], "ans": "E", "ansText": "E. Upper respiratory tract infection", "jx": "1. Her chest has no abnormal signs on auscultation. With bronchiolitis, you would expect to hear crepitations and wheeze, and to see signs of respiratory distress.\n2. This is unusual in children of this age because frontal sinuses do not develop until late childhood.\n3. Young children with pneumonia can sometimes present without chest signs on auscultation, but there would be respiratory distress including a raised respiratory rate.\n4. Examination of the oropharynx would show intense inflammation of the tonsils, often with a purulent exudate.\n5. Correct. This child has an upper respiratory tract infection, most likely a common cold.", "img": []}, {"id": "13fd53e68529cbb5", "m": "01", "letter": "A", "inMod": 10, "code": "A10", "q": "Vignette: A 5-year-old girl presents to the emergency department with severe wheezing, tachypnoea (RR 40 breaths per min) and oxygen saturation 93% in air. She has multiple previous hospital admissions for asthma exacerbations. Question: Which is the first medicine that should be administered for this patient?", "opts": ["A. Oral steroids", "B. Nebulised salbutamol", "C. IV magnesium", "D. IV antibiotics", "E. IV Antihistamine"], "ans": "B", "ansText": "B. Nebulised salbutamol", "jx": "First-line for acute asthma: inhaled SABA.Steroids are added but not first bronchodilator.", "img": []}, {"id": "4d13bccd0ca41e8e", "m": "01", "letter": "A", "inMod": 11, "code": "A11", "q": "Vignette: A 14-year-old girl newly diagnosed with asthma was given a short-acting bronchodilator (Ventolin) by her paediatrician, which she uses 1–2 times per month for symptom relief. You are reviewing her asthma control and treatment regimen. Question: Which of the following medications would be most appropriate to add if her cough persists?", "opts": ["A. Oral Antibiotics", "B. Inhaled corticosteroid", "C. Oral Antihistamines", "D. Oral Mucolytics", "E. Oral leukotriene modifier"], "ans": "B", "ansText": "B. Inhaled corticosteroid", "jx": "ICS treats airway inflammation — cornerstone of persistent asthma management.", "img": []}, {"id": "99ae830e52e560b9", "m": "01", "letter": "A", "inMod": 12, "code": "A12", "q": "Vignette: A 1-year-old ex-premature girl is brought to the emergency department with shortness of breath, rhinorrhoea, tachypnoea and audible expiratory wheeze. SpO₂ is 91% on room air. On auscultation, widespread wheeze and diffuse crepitations were present in both lung fields. She had similar episodes with previous viral illnesses. Question: Which of the following is the most likely diagnosis?", "opts": ["A. Croup", "B. Asthma", "C. Bronchiolitis", "D. Pneumonia", "E. Foreign body"], "ans": "C", "ansText": "C. Bronchiolitis", "jx": "Bronchiolitis is common in infants and presents after a viral prodrome (e.g. coryza, low-grade fever) with wheeze, crepitations, and respiratory distress. Viral-induced asthma is rare below 12 months. Pneumonia usually has focal chest signs and higher fever.", "img": []}, {"id": "271ece7846b28275", "m": "01", "letter": "A", "inMod": 13, "code": "A13", "q": "Vignette: A 7-year-old boy known to have asthma is admitted to the emergency department with shortness of breath. He is tachypnoeic (RR 30/min), has SpO₂ 91% on room air, suprasternal retractions, and diffuse expiratory wheeze. He is tired and reluctant to talk. Question: What is the most likely severity of his asthma attack?", "opts": ["A. Mild", "B. Moderate", "C. Severe asthma", "D. Life-threatening", "E. Viral cough"], "ans": "C", "ansText": "C. Severe asthma", "jx": "Severe features: SpO₂ <94% Unable to complete sentences Marked recessionLife-threatening = silent chest, altered consciousness.", "img": []}, {"id": "64045d2960329974", "m": "01", "letter": "A", "inMod": 14, "code": "A14", "q": "A 4-year-old boy, presents to his family doctor with a history of eczema, rhinitis, chronic nocturnal cough and intermittent wheeze. Asthma is suspected and a bronchodilator is prescribed. How should his bronchodilator be delivered?", "opts": ["A. Dry powder inhaler", "B. Metered dose inhaler (MDI)", "C. Metered dose inhaler with spacer", "D. Nebulizer", "E. Syrup"], "ans": "C", "ansText": "C. Metered dose inhaler with spacer", "jx": "1. Dry powder inhalers are not appropriate for use in children less than 6 years of age.\n2. Children should be prescribed a MDI with spacer as they cannot co-ordinate a MDI alone. It is always preferable to use a spacer, even in adults as delivery is more reliable.\n3. Correct. The best mode of delivery is direct to the lungs. Children under 5 years of age should be prescribed a MDI with spacer as they cannot co-ordinate a MDI alone.\n4. Nebulizers provide very effective delivery of bronchodilators. However, home nebulizers are driven with air. Air-driven nebulizers are less safe than MDI and spacers as they result in greater degrees of hypoxia. They are also more expensive. In hospital the nebulizers are driven by oxygen to offset the risk of hypoxia.\n5. Syrup should not be used as it results in high blood levels and unacceptable side-effects.", "img": []}, {"id": "7005494d26e5f214", "m": "01", "letter": "A", "inMod": 15, "code": "A15", "q": "A 10-month-old boy presents to the emergency department with a 2-day history of fever and runny nose. He has been otherwise well. During the night he gradually developed a barking cough in association with a loud noise on inspiration. On examination he has a temperature of 38°C and noisy inspiration accompanied by marked sternal recession ( see picture below ). His capillary refill time is normal.Select the ONE most likely diagnosis from the list below.", "opts": ["A. Acute epiglottitis", "B. Anaphylaxis", "C. Bronchiolitis", "D. Laryngeal foreign body", "E. Laryngotracheobronchitis (croup)"], "ans": "E", "ansText": "E. Laryngotracheobronchitis (croup)", "jx": "1. Epiglottitis would present with a shorter history, and the child would be extremely unwell (toxic). It is also very rare in countries with Haemophilus influenzae type b immunization. (But not in China)2. Anaphylaxis may cause stridor but also causes other symptoms, usually including an urticarial rash. It would not cause a fever.3. Bronchiolitis causes wheeze and crepitations rather than stridor as in this child.4. The child has a fever and a gradual onset of symptoms.5. Correct. Laryngotracheobronchitis (croup) is mucosal inflammation and increased secretions affecting the upper airway. Croup occurs from 6 months to 6 years of age. Fever suggests infection. Inspiratory noises suggest upper airway obstruction.", "img": ["images/7005494d26e5f214_0.jpg"]}, {"id": "b98bcf19302a9028", "m": "01", "letter": "A", "inMod": 16, "code": "A16", "q": "A 3-year-old Asian boy, presents to his family doctor. He has a ‘hacking’ cough that started several weeks ago and has failed to respond to two courses of antibiotics. He is otherwise well and has had no previous chest problems. On examination there is decreased air entry in the right lower zone with normal percussion note. His growth is normal. Which is the most appropriate next step?", "opts": ["A. Admit for intravenous antibiotic therapy", "B. Assess bronchodilator response", "C. Organize for ultrasound-guided drainage of his pleural effusion", "D. Request a chest X-ray", "E. Request a sweat test and evaluation of immunoglobulins and functional antibodies"], "ans": "D", "ansText": "D. Request a chest X-ray", "jx": "1. He has already failed to respond to two courses of antibiotics, so further investigation is warranted.\n2. There is no wheeze on examination and so inhaled bronchodilator is unlikely to be effective.\n3. His signs are not consistent with a pleural effusion. The percussion note would be stony dull if this was a pleural effusion..\n4. Correct. The most likely diagnosis is the inhalation of a foreign body, e.g. a peanut. He also has focal chest signs and so needs a chest X-ray to be performed.\n5. A sweat test is used to diagnose cystic fibrosis but is not indicated here because this is his first episode of chest problems and he is growing normally. Functional antibodies and immunoglobulins are useful screening tests for possible immunodeficiency and this ‘triad’ of investigations is often used in children with faltering growth and/or recurrent respiratory infections.", "img": []}, {"id": "803c06f21b533997", "m": "01", "letter": "A", "inMod": 17, "code": "A17", "q": "A 9-month-old girl, presents with a 4-day history of coughing spasms which are followed by vomiting. Whooping cough (Bordetella pertussis infection) is suspected. Which of the following tests would be most useful in confirming the diagnosis?", "opts": ["A. Blood culture", "B. Chest X-ray", "C. Full blood count and film", "D. Nasopharyngeal aspirate", "E. Pernasal swab"], "ans": "E", "ansText": "E. Pernasal swab", "jx": "1. It is incredibly rare to isolate Bordetella pertussis from blood cultures.\n2. Chest X-ray changes can occur in whooping cough but are not diagnostic.\n3. A marked lymphocytosis is characteristic of pertussis, but not diagnostic. The lymphocytosis is secondary to pertussis toxin.\n4. Immunofluorescence of a nasopharyngeal aspirate is used to identify respiratory syncytial virus, which causes bronchiolitis, but is not helpful in the diagnosis of pertussis.\n5. Correct. Culturing a pernasal swab allows the pathogen (Bordetella pertussis) to be identified (though polymerase chain reaction [PCR] is more sensitive). This can also be helpful in isolating the related Bordetella parapertussis.", "img": []}, {"id": "25e27535cdb44c58", "m": "01", "letter": "A", "inMod": 18, "code": "A18", "q": "A 5-year-old refugee from North Afirca, presents acutely unwell to the emergency department. He has a 1-day history of sore throat and a high temperature (40.1°C). Over the last 8 hours he has been having increasing difficulty breathing with quiet stridor. He has never been immunized. He is noted to be unable to swallow his saliva. The picture below was taken when he was intubated. What is the most likely diagnosis?", "opts": ["A. Bacterial tracheitis", "B. Croup", "C. Epiglottitis", "D. Foreign body", "E. Laryngomalacia"], "ans": "C", "ansText": "C. Epiglottitis", "jx": "1. The child would have loud, harsh stridor and would not have an enlarged epiglottis as shown in the figure.\n2. The child would be less seriously unwell or ‘toxic’ and would have a mild fever and loud stridor and would not have the abnormal appearance shown in the figure.\n3. Correct. The photograph shows the characteristic grossly enlarged ‘cherry red’ epiglottis of acute epiglottitis. It is caused by Haemophilus influenzae type b. In many countries (but not in China), the introduction of universal H. influenzae type b immunization in infancy has led to a >99% reduction in the incidence of epiglottitis and other invasive H. influenzae type b infections.\n4. The history would be of a sudden onset of cough or respiratory distress, and there would not be a high fever.\n5. The child would not be unwell and would have had recurrent or continuous stridor since infancy. Laryngomalacia generally resolves within the first year of life.", "img": ["images/25e27535cdb44c58_0.jpg"]}, {"id": "a4f85c8a6b7e9472", "m": "02", "letter": "B", "inMod": 1, "code": "B1", "q": "6-month-old with itchy red patches on cheeks/extensors. A 6-month-old baby presents with dry, itchy, red patches on the cheeks and extensor surfaces of the arms and legs. There is a family history of allergic rhinitis. What is the most appropriate first-line management for this condition?", "opts": ["A. Oral coticosteroids", "B. Emollients and topical corticosteroids", "C. Antibiotic ointment", "D. Phototherapy", "E. Oral Antihistamines only"], "ans": "B", "ansText": "B. Emollients and topical corticosteroids", "jx": "Core treatment:Barrier repair (emollients)Anti-inflammatory controlThe baby has atopic eczema, a common inflammatory skin condition associated with atopy. Management includes skin hydration using emollients and control of inflammation with topical corticosteroids. Systemic steroids or antibiotics are reserved for severe or infected cases.", "img": ["images/a4f85c8a6b7e9472_0.jpg"]}, {"id": "9b5e7b51b654f8a0", "m": "02", "letter": "B", "inMod": 2, "code": "B2", "q": "A 6-month-old infant is brought to clinic because of a flat, pink patch at the nape of the neck present since birth. It becomes more noticeable when the baby cries. It has faded slightly since birth. What is the most likely diagnosis?", "opts": ["A. Port-wine stain", "B. Mongolian spot", "C. Salmon patch (nevus simplex)", "D. Infantile haemangioma", "E. Naevus sebaceous"], "ans": "C", "ansText": "C. Salmon patch (nevus simplex)", "jx": "A. Port-wine stain – Incorrect. Port-wine stains are permanent capillary malformations, darker red/purple, do not fade, and may be associated with Sturge-Weber syndrome if in trigeminal distribution.C. Salmon patch – Correct. Nevus simplex (“stork bite”) is a common benign capillary vascular lesion: Present at birth Flat, pink Often on nape of neck or glabella Becomes more prominent with crying Fades with timeB. Mongolian spot – Incorrect. These are bluish-grey patches over the sacrum, due to dermal melanocytosis — not pink vascular lesions.D. Infantile haemangioma – Incorrect. These are raised, proliferative lesions that enlarge rapidly after birth before involuting.E. Naevus sebaceous – Incorrect. Typically involves the scalp but can present on the face and upper body. Lesion is well circumscribed plaques. Benign and malignant tumours may arise in these naevi.", "img": []}, {"id": "d516b5cb41234a44", "m": "02", "letter": "B", "inMod": 3, "code": "B3", "q": "Many rashes in childhood are itchy and can cause a lot of discomfort for the child. Which of the following rashes is least likely to be itchy?", "opts": ["A. Atopic eczema", "B. Chickenpox", "C. Infantile seborrhoeic dermatitis", "D. Pityriasis rosea", "E. Scabies"], "ans": "C", "ansText": "C. Infantile seborrhoeic dermatitis", "jx": "1. A key feature of eczema is itch. This causes the child to scratch, which exacerbates the condition and predisposes to local infection.\n2. This is very itchy, particularly in the healing phase. Scratching can lead to permanent scarring and is often treated with calamine lotion.\n3. Correct. The causes of itchy rashes are: atopic eczema, chickenpox, urticaria, allergic reactions, contact dermatitis, insect bites, scabies, fungal infections and pityriasis rosea. All the conditions listed in the question are itchy other than seborrhoeic dermatitis, which is not itchy.\n4. A typical feature is itch.\n5. If the itch is shared between household members, always consider scabies. Indeed, any persistent itchy rash should be considered as scabies until this has been excluded.", "img": []}, {"id": "ce4a9758d90c6d38", "m": "02", "letter": "B", "inMod": 4, "code": "B4", "q": "A 10-year-old boy presents with an intensely itchy rash, especially at night. Examination reveals excoriated papules and burrow marks on his hands, wrists, and between the fingers. The itching has spread to other family members. What is the most appropriate treatment?", "opts": ["A. Oral Antibiotics", "B. Topical corticosteroids", "C. Topical Permethrin for child and household members", "D. Topical Antifungal cream", "E. Oral antihistamine"], "ans": "C", "ansText": "C. Topical Permethrin for child and household members", "jx": "Treat patient and close contacts simultaneously.The nocturnal itch and distribution are classic for scabies caused by Sarcoptes scabiei. Treatment involves topical permethrin (or other scabicides) applied to the whole body (below the neck in older children, entire body in infants), and all close contacts must be treated simultaneously to prevent reinfestation.", "img": ["images/ce4a9758d90c6d38_0.jpg"]}, {"id": "2018cc00379b7c44", "m": "02", "letter": "B", "inMod": 5, "code": "B5", "q": "Vignette: A 4-year-old presents to the emergency department with fever 40.5°C, lethargy and reduced interaction with parents. No clear focus identified during examination. Question: What must be urgently assessed?", "opts": ["A. Hydration status", "B. Skin rash", "C. Signs of meningitis", "D. Blood glucose level", "E. Travel history"], "ans": "C", "ansText": "C. Signs of meningitis", "jx": "High fever + lethargy → rule out CNS infection immediately.Other assessments important but secondary.", "img": []}, {"id": "9c1835adf02abf03", "m": "02", "letter": "B", "inMod": 6, "code": "B6", "q": "A previously well 8-year-old boy presents to the emergency department with a fever and arthralgia for 2 days, which is getting worse. On examination, he is noticed to have a painful, raised rash on his shins (Figure). Which of the following is the most likely cause?", "opts": ["A. Football injuries", "B. Henoch– Schönlein purpura", "C. Herpes simplex infection", "D. Mycoplasma pneumoniae infection", "E. Streptococcal infection"], "ans": "E", "ansText": "E. Streptococcal infection", "jx": "1. Injury alone would not explain the fever or arthralgia. The appearance here is not typical of bruising.\n2. Whilst joints are painful, the skin rash seen in HSP is not usually painful. The rash of HSP is characteristically seen over the buttocks.\n3. Herpes simplex can cause erythema multiforme. Erythema multiforme usually develops rapidly and often starts on the hands or feet. It initially consists of small red spots which may develop into raised patches a few centimetres in size with a dark red centre with a blister or crust surrounded by a pale pink ring and a darker outermost ring, giving them a target, or ‘bulls-eye’ appearance. They are sometimes itchy.\n4. Mycoplasma pneumoniae can cause erythema multiforme.\n5. Correct. This boy has erythema nodosum and the causes include streptococcal infection, primary tuberculosis, inflammatory bowel disease, drug reaction or idiopathic. It is usually painful upon palpation.", "img": ["images/9c1835adf02abf03_0.jpg"]}, {"id": "7ca442f6a34bd02a", "m": "02", "letter": "B", "inMod": 7, "code": "B7", "q": "A 9-month-old infant is brought to the clinic for a persistent rash in the diaper area. What is the most likely diagnosis?", "opts": ["A. Candida infection", "B. Irritant dermatitis", "C. Seborrhoeic dermatitis", "D. Psoriasis", "E. Atopic eczema"], "ans": "B", "ansText": "B. Irritant dermatitis", "jx": "Candida involves skin folds + satellite lesions.Irritant napkin dermatitis commonly affects areas in direct contact with urine or feces, sparing the skin folds. The absence of satellite pustules differentiates it from Candida napkin dermatitis, which involves intertriginous areas with satellite lesions.", "img": ["images/7ca442f6a34bd02a_0.jpg"]}, {"id": "5ed5660065eb4371", "m": "02", "letter": "B", "inMod": 8, "code": "B8", "q": "A 12-year-old boy develops fever and malaise followed by a rapidly progressing rash with blistering and painful erosions involving the oral mucosa and conjunctiva. He recently started taking an anticonvulsant for seizures. What is the most likely diagnosis?", "opts": ["A. Urticaria", "B. Erythema multiforme minor", "C. Stevens-Johnson syndrome", "D. Toxic epidermal necrolysis", "E. Morbiliform drug-induced exanthem"], "ans": "C", "ansText": "C. Stevens-Johnson syndrome", "jx": "Drug-induced severe mucocutaneous reaction (<10% BSA). TEN involves >30%.", "img": ["images/5ed5660065eb4371_0.jpg"]}, {"id": "0def1bfa4eae5527", "m": "02", "letter": "B", "inMod": 9, "code": "B9", "q": "Vignette: A well-appearing 6-month-old has fever 38.8°C. He has been feeding and playing normally. There are no significant respiratory or abdominal symptoms. Question: What is the most appropriate initial management for this infant?", "opts": ["A. Administer antibiotics", "B. Perform lumbar puncture", "C. Provide antipyretics and observation", "D. Admit for IV fluids", "E. Perform a full blood count and CRP"], "ans": "C", "ansText": "C. Provide antipyretics and observation", "jx": "Well child with mild fever → supportive care.", "img": []}, {"id": "9eb8e3ccb0ab164c", "m": "02", "letter": "B", "inMod": 10, "code": "B10", "q": "Vignette: A 3-year-old presents with fever 39°C for 48 hours. He is well and alert but miserable with reduced appetite. No vomiting, dislike of light or rash. No recent foreign travel and infection contact Question: Most likely cause?", "opts": ["A. Bacterial meningitis", "B. Viral infection", "C. Teething", "D. Heat exposure", "E. Malaria"], "ans": "B", "ansText": "B. Viral infection", "jx": "In well-appearing child in this age group with short duration fever and no focal signs → viral most likely.Teething does not cause high fever.", "img": []}, {"id": "18d0496d6c7d1471", "m": "02", "letter": "B", "inMod": 11, "code": "B11", "q": "A newborn has a large unilateral red-purple stain covering the forehead and upper eyelid in the distribution of the ophthalmic branch of the trigeminal nerve. Which condition is most strongly associated with this lesion?", "opts": ["A. Infantile haemangioma", "B. Sturge-Weber syndrome", "C. Neurofibromatosis type 1", "D. Erythema toxicum", "E. Seborrhoeic dermatitis"], "ans": "B", "ansText": "B. Sturge-Weber syndrome", "jx": "A. Infantile haemangioma – Incorrect. Raised lesion appearing after birth, not a flat congenital capillary malformation.B. Sturge-Weber syndrome – Correct. Facial port-wine stain in V1 distribution is associated with: Leptomeningeal angiomas Seizures Developmental delay GlaucomaC. NF1 – Incorrect. Associated with café-au-lait spots, not port-wine stains.D. Erythema toxicum – Incorrect. Benign transient neonatal pustular rash.E. Seborrhoeic dermatitis – Incorrect. Yellow greasy scales on scalp.", "img": []}, {"id": "28c150b5c6cb5453", "m": "02", "letter": "B", "inMod": 12, "code": "B12", "q": "A 10-month-old infant, has been unsettled and febrile with a runny nose for 2 days. Her family doctor examines her ear canal and the tympanic membrane appears as in the picture below. What is the most likely diagnosis?", "opts": ["A. Acute otitis externa", "B. Cholesteatoma", "C. Chronic otitis externa", "D. Foreign body in the external ear canal", "E. Otitis media with effusion"], "ans": "E", "ansText": "E. Otitis media with effusion", "jx": "1. Acute otitis externa is an infection of the outer ear canal, not of the tympanic membrane.\n2. A rare problem in children. The two most common symptoms are persistent, often smelly, discharge from the affected ear and gradual loss of hearing in the affected ear.\n3. Chronic otitis externa is an infection of the outer ear canal, not of the tympanic membrane. Fiona's history is only 2 days long and therefore not chronic.\n4. She has symptoms of an upper respiratory tract infection and fever, and no foreign body is seen on examination.\n5. Correct. Here the ear drum is dull and bulging.", "img": ["images/28c150b5c6cb5453_0.jpg"]}, {"id": "77c16465c64e2a48", "m": "02", "letter": "B", "inMod": 13, "code": "B13", "q": "A 5-year-old child presents with multiple small, umbilicated, flesh-colored papules on the trunk and arms. The lesions are not itchy or painful. The child’s sibling also has similar lesions. What is the most likely cause of this skin condition?", "opts": ["A. Bacterial infection", "B. Fungal infection", "C. Viral infection", "D. Allergic reaction", "E. Autoimmune condition"], "ans": "C", "ansText": "C. Viral infection", "jx": "Molluscum contagiosum is caused by poxvirus and spread by direct contact. It presents as umbilicated papules and is self-limiting. Awareness of its contagious nature and avoidance of shared items (towels, toys) are important preventive measures.", "img": ["images/77c16465c64e2a48_0.jpg"]}, {"id": "6652e00fab409056", "m": "02", "letter": "B", "inMod": 14, "code": "B14", "q": "A 3-month-old infant presents with a raised, bright red lesion on the forehead that has enlarged rapidly over several weeks. The lesion was first noticed at 3 weeks of age. It is soft and compressible.What is the most likely diagnosis?", "opts": ["A. Capillary haemangioma (infantile haemangioma)", "B. Cavernous haemangioma", "C. Keloid", "D. Neurofibroma", "E. Dermoid cyst"], "ans": "A", "ansText": "A. Capillary haemangioma (infantile haemangioma)", "jx": "A. Infantile haemangioma – Correct. Features: Not always obvious at birth Rapid growth phase Bright red (“strawberry”) Spontaneous involution over yearsB. Cavernous haemangioma – Incorrect. Deeper, bluish lesion, not superficial bright red.C. Keloid – Incorrect. Scar tissue after trauma.D. Neurofibroma – Incorrect. Soft skin nodules associated with NF1.E. Dermoid cyst – Incorrect. Firm subcutaneous mass, not vascular.", "img": []}, {"id": "6ef614eb40a13ca4", "m": "02", "letter": "B", "inMod": 15, "code": "B15", "q": "A 2-year-old boy, developed acute otitis media of his left ear whilst on holiday, and was treated with paracetamol for his discomfort. It initially improved, but 5 days later he has a fever of 38.4°C, is not his usual lively self, and complains that it is sore in and behind his ear. posterior cervical lymph node measuring 16 mm. He has a pink maculopapular rash on the trunk and extremities. His hands and feel are red and swollen. The pediatrician recommends admission. What is the most likely cause of his clinical features shown in the pictures?", "opts": ["A. Acute otitis media", "B. Chronic otitis media", "C. Left facial nerve palsy", "D. Mastoiditis", "E. Mumps"], "ans": "D", "ansText": "D. Mastoiditis", "jx": "1. He is likely to have acute otitis media but this is not the cause of his clinical features.\n2. This would not cause the clinical features shown.\n3. He does not have facial weakness.\n4. Correct. This is a rare complication of acute otitis media but important to recognize as it can cause serious complications. He shows the characteristic clinical features of the affected ear being displaced downward and outward. He requires urgent specialist investigation and antibiotic treatment.\n5. Can be unilateral but mumps causes swelling of the parotid gland.", "img": ["images/6ef614eb40a13ca4_0.jpg"]}, {"id": "9cced85c973e3393", "m": "02", "letter": "B", "inMod": 16, "code": "B16", "q": "A 7-year-old boy, complains to his family doctor of a sore throat and has a mild fever. The appearance of his throat is as shown in the picture below. What is the most likely diagnosis?", "opts": ["A. Diphtheria", "B. Glandular fever (Epstein–Barr virus)", "C. Group A streptococcal tonsillitis", "D. Measles", "E. Herpes simplex stomatitis"], "ans": "C", "ansText": "C. Group A streptococcal tonsillitis", "jx": "1. Diphtheria is extremely rare if children are immunized in the UK. Also the appearance is not ‘typical’. In diphtheria a thick grey pharyngeal membrane is characteristic.\n2. Infection with Epstein–Barr virus can lead to tonsillitis although typically the tonsils are coated with a grey membrane. Palatal petechiae (pinpoint spots on the soft palate) may also be seen.\n3. Correct. There is intense inflammation of the tonsils with purulent exudates. In this age group, group A beta-haemolytic Streptococcus is the most likely causative pathogen.\n4. In measles there may be white spots (Koplik spots) visible on the buccal mucosa.\n5. There are lesions on the lips, gums and tongue.", "img": ["images/9cced85c973e3393_0.jpg"]}, {"id": "170f765ea61c5604", "m": "02", "letter": "B", "inMod": 17, "code": "B17", "q": "A 5-year-old presents with high fever, right knee pain and a rapidly spreading purpuric rash. What is the most likely diagnosis?", "opts": ["A. Viral exanthem", "B. Scarlet fever", "C. Kawasaki disease", "D. Meningococcemia", "E. Chickenpox"], "ans": "D", "ansText": "D. Meningococcemia", "jx": "Rapid purpura + high fever and joint pain = meningococcal sepsis until proven otherwise.", "img": ["images/170f765ea61c5604_0.jpg"]}, {"id": "704270490a2ae77d", "m": "02", "letter": "B", "inMod": 18, "code": "B18", "q": "A 6-year-old boy has prolonged cough and low-grade fever. TST is 15 mm. Chest X-ray shows right paratracheal lymphadenopathy. What is the most likely diagnosis?", "opts": ["A. Bacterial pneumonia", "B. Viral bronchiolitis", "C. Primary pulmonary TB with intrathoracic lymphadenopathy", "D. Asthma", "E. Fungal pneumonia"], "ans": "C", "ansText": "C. Primary pulmonary TB with intrathoracic lymphadenopathy", "jx": "Primary TB in children: Hilar or mediastinal lymphadenopathy Mild symptoms Positive TSTChildren often have negative sputum smears due to low bacillary load.Other diagnoses do not explain lymph node enlargement with positive TST.", "img": []}, {"id": "08dfa6b640f25748", "m": "02", "letter": "B", "inMod": 19, "code": "B19", "q": "A 5-year-old girl presents with low-grade fever followed by bright red cheeks giving a “slapped-cheek” appearance. Two days later, a lacy reticular rash appears on her arms. She is otherwise well. What is the most likely causative organism?", "opts": ["A. Coxsackie virus", "B. Parvovirus B19", "C. Epstein-Barr virus", "D. Human herpesvirus 6", "E. Varicella-zoster virus"], "ans": "B", "ansText": "B. Parvovirus B19", "jx": "A. Coxsackie virus – Incorrect. Causes hand-foot-mouth disease with vesicles on hands, feet, and mouth.B. Parvovirus B19 – Correct. Erythema infectiosum (fifth disease) presents with: Slapped cheek rash Lacy rash on limbs Mild prodromeImportant in pregnancy (risk of hydrops fetalis) and haemolytic anaemias (aplastic crisis).C. EBV – Incorrect. Causes infectious mononucleosis (fever, lymphadenopathy, hepatosplenomegaly).D. HHV-6 – Incorrect. Causes roseola infantum (high fever followed by trunk rash).E. Varicella – Incorrect. Produces vesicular rash in different stages.", "img": []}, {"id": "96d086e46de579b1", "m": "02", "letter": "B", "inMod": 20, "code": "B20", "q": "A 3 month old girl is admitted with high fever, irritability, and a bulging fontanelle. Examination shows prolonged capillary refill time (3–4 s) and small petechial spots on her chest. Which of the following diagnoses best explains her presentation?", "opts": ["A. Viral meningitis", "B. Meningococcal sepsis with meningitis", "C. Kawasaki disease", "D. Pneumonia", "E. Jaundice"], "ans": "B", "ansText": "B. Meningococcal sepsis with meningitis", "jx": "The combination of fever, irritability, poor perfusion, and petechiae in an infant is highly suggestive of meningococcal disease. Meningococcal meningitis commonly presents with nonspecific features early on; the presence of petechiae or purpura differentiates it from viral meningitis and indicates a life threatening infection .", "img": []}, {"id": "281fb5eb6ee894c2", "m": "02", "letter": "B", "inMod": 21, "code": "B21", "q": "A 7-year-old child presents to the children's outpatient department. His mother is concerned regarding a number of skin marks, which she has noticed over the last year. She was not initially concerned about them, but they are becoming more numerous and larger in size. She reports that the child's father also had similar skin marks before he passed away from ‘cancer’. On examining the child you see the skin lesions shown in Picture below. He also has a large number of freckles in his axilla region. He has no other medical problems and is not on any medications. What is the most likely diagnosis?", "opts": ["A. Ataxia telangiectasia", "B. Friedreich ataxia", "C. Neurofibromatosis", "D. Sturge–Weber syndrome", "E. Tuberous sclerosis"], "ans": "C", "ansText": "C. Neurofibromatosis", "jx": "1. The skin lesions in ataxia telangiectasia are small dilated blood vessels near the surface of the skin or the mucous membranes.\n2. Friedreich ataxia does not present with skin lesions.\n3. Correct. The lesions seen in the image are café-au-lait spots. This is an autosomal dominant disorder. There are criteria for making the diagnosis. This boy meets the diagnosis as he has six or more café-au-lait spots, has axilla freckles and it is likely he has a family history, related to his father.\n4. In Sturge–Weber syndrome there is a port-wine stain present on the face.\n5. In tuberous sclerosis there are a number of different skin lesions: depigmented, ‘ash leaf’-shaped patches, which fluoresce under ultraviolet light (Wood's light), roughened patches of skin (shagreen patches) usually over the lumbar spine and/or adenoma sebaceum (angiofibromata) in a butterfly distribution over the bridge of the nose and cheeks.", "img": ["images/281fb5eb6ee894c2_0.jpg"]}, {"id": "f243ab83d2999aa3", "m": "02", "letter": "B", "inMod": 22, "code": "B22", "q": "A 3-year-old girl presents with 2 weeks of low-grade fever and persistent cough. Chest X-ray shows right hilar lymphadenopathy. She spends most afternoons with her grandfather, who has had a chronic cough for several months. What is the most likely source of her tuberculosis infection?", "opts": ["A. Other children in kindergarten", "B. Her grandfather with chronic cough", "C. Reactivation of latent infection", "D. Community exposure", "E. BCG vaccination failure"], "ans": "B", "ansText": "B. Her grandfather with chronic cough", "jx": "A. Kindergarten – Incorrect. Transmission between young children is uncommon.B. Correct. Children usually acquire TB from close contact with an infectious adult, typically within the household.Young children rarely transmit TB due to low bacillary load and weak cough.The grandfather’s chronic cough strongly suggests a smear-positive pulmonary TB case.C. Reactivation – Incorrect. Reactivation occurs later in life; young children typically develop primary TB.D. Community exposure – Incorrect. Close contact exposure is far more likely.E. BCG failure – Incorrect. BCG does not fully prevent pulmonary TB; it reduces risk of severe forms.", "img": []}, {"id": "c36f4aadc96c82cf", "m": "02", "letter": "B", "inMod": 23, "code": "B23", "q": "A 5-year-old boy is screened after household exposure to TB. TST shows 12 mm induration. He is asymptomatic and chest X-ray is normal. What is the most appropriate diagnosis?", "opts": ["A. Active pulmonary TB", "B. Latent TB infection (LTBI)", "C. False positive due to previous BCG vaccination", "D. Nontuberculous mycobacteria infection", "E. No infection"], "ans": "B", "ansText": "B. Latent TB infection (LTBI)", "jx": "A. Active TB – Incorrect. Would show symptoms or radiographic changes.B. Latent TB infection ( LTBI) Correct . A positive TST with normal X ray and no symptoms indicates LTBI. BCG vaccination can cause minor reactions, but induration ≥ 10 mm in a recent household contact should be considered true infection. LTBI warrants chemoprophylaxis to prevent progression.C. BCG false positive – Incorrect. BCG may cause mild reaction but significant induration in exposed child suggests true infection.D. NTM – Less likely. Usually small TST reaction and no known TB contact.E. No infection – Incorrect. Positive TST indicates infection.", "img": []}, {"id": "39e411d02c19ba1e", "m": "02", "letter": "B", "inMod": 24, "code": "B24", "q": "A 3 year old asymptomatic boy is identified as a close contact of a smear positive TB case. On investigation, TST = 11 mm and chest X ray normal. He has no underlying disease. Which is the preferred treatment regimen for this child’s LTBI?", "opts": ["A. Daily isoniazid for 6 months", "B. No treatment required with repeat TST in 6 months", "C. Four-drug TB therapy for 6 months", "D. Weekly isoniazid and rifapentine for 12 weeks (DOT)", "E. Oral corticosteroids only"], "ans": "A", "ansText": "A. Daily isoniazid for 6 months", "jx": "LTBI treatment: For children <5 with confirmed LTBI and normal imaging, isoniazid (10 mg/kg daily) for 6 months is standard prophylaxis. Rifampin based or short DOT regimens are alternatives but Isoniazid for 6 months is effective, simple, and well tolerated.Prevents progression to active TBYoung children have higher risk of progression → treatment essential.", "img": []}, {"id": "5ed074c6e0feda6b", "m": "02", "letter": "B", "inMod": 25, "code": "B25", "q": "A 2-year-old develops fever and diarrhoea after visiting a petting zoo. Which pathogen should be considered?", "opts": ["A. Influenza", "B. Salmonella", "C. Varicella", "D. Measles", "E. Borrelia"], "ans": "B", "ansText": "B. Salmonella", "jx": "Animal exposure → Salmonella risk.Other pathogens unrelated to animal contact or symptoms does not match", "img": []}, {"id": "115e4212d5e62322", "m": "02", "letter": "B", "inMod": 26, "code": "B26", "q": "A 12 year old boy is diagnosed with meningococcal meningitis (serogroup B). His 10 year old sister shared a bedroom with him in the week before he became unwell. Their parents ask what preventive action is required. Which of the following best describes the recommended approach for close contacts?", "opts": ["A. Observation only", "B. Chemoprophylaxis with an appropriate antibiotic ± vaccination", "C. Routine Vaccination only", "D. Hospital Admission for 7 day observation", "E. Single nasopharyngeal swab to screen for N. meningitidis"], "ans": "B", "ansText": "B. Chemoprophylaxis with an appropriate antibiotic ± vaccination", "jx": "Rifampicin or ciprofloxacin eradicates carriage.Close household or overnight contacts require chemoprophylaxis (e.g., rifampicin or ciprofloxacin) to eradicate carriage. They may also be offered meningococcal vaccine depending on the infecting serogroup. This reduces transmission and secondary cases within the home.", "img": []}, {"id": "0e28e15b84017d09", "m": "02", "letter": "B", "inMod": 27, "code": "B27", "q": "A 5 year old boy presents with fever, hypotension, and confusion. Meningococcal infection is strongly suspected. What is the most appropriate empiric first line antibiotic to give immediately?", "opts": ["A. IV amoxicillin", "B. IV ceftriaxone", "C. IV vancomycin only", "D. IV Gentamicin", "E. IV Azithromycin"], "ans": "B", "ansText": "B. IV ceftriaxone", "jx": "IV Ceftriaxone (100 mg/kg, up to 2 g) is the first line treatment for suspected meningococcal disease in children. It covers N. meningitidis effectively and penetrates the CNS. If immediate transfer to hospital is delayed, benzylpenicillin can be given as an alternative in primary care.", "img": []}, {"id": "d92d47c272bd60cf", "m": "02", "letter": "B", "inMod": 28, "code": "B28", "q": "A 4-year-old boy has not received the measles vaccine because his parents believe most other children are immunised . In his community, vaccination coverage is approximately 70%. Why is this child still at significant risk of contracting measles?", "opts": ["A. Measles has low transmissibility", "B. Herd protection for measles requires very high vaccination coverage", "C. Unvaccinated adults cannot transmit measles", "D. Maternal antibodies protect until 5 years of age", "E. Herd immunity does not apply to viral infections"], "ans": "B", "ansText": "B. Herd protection for measles requires very high vaccination coverage", "jx": "A. Incorrect. Measles is highly transmissible.B. Correct. Measles is one of the most contagious infectious diseases, with an R₀ of 12–18. This means: One infected individual can infect 12–18 susceptible people. Herd immunity threshold must exceed 90–95% coverage to interrupt transmission.At 70% coverage, herd immunity is insufficient, and outbreaks can occur easily.C. Incorrect. Adults can transmit measles if infected.D. Incorrect. Maternal antibodies wane by 6–9 months of age.E. Incorrect. Herd immunity is fundamental in controlling viral infections.", "img": []}, {"id": "84c6a59c56ea5d4f", "m": "02", "letter": "B", "inMod": 29, "code": "B29", "q": "Public health officials evaluate the introduction of rotavirus vaccination. They compare cost per DALY averted with other health programs. What type of economic evaluation is being performed?", "opts": ["A. Cost-minimisation analysis", "B. Cost-effectiveness analysis", "C. Cost-utility analysis", "D. Cost-benefit analysis", "E. Break-even analysis"], "ans": "C", "ansText": "C. Cost-utility analysis", "jx": "A. Cost-minimisation – Incorrect. Used when outcomes are equivalent; compares cost only.B. Cost-effectiveness – Incorrect. Measures natural units (e.g., cases prevented), not DALYs.C. Cost-utility analysis – Correct. Cost-utility analysis: Measures outcomes in QALYs or DALYs Allows comparison across different health interventions Widely used in vaccination policy decisionsD. Cost-benefit – Incorrect. Converts outcomes into monetary value.E. Break-even – Incorrect.", "img": []}, {"id": "32608945f82f329d", "m": "02", "letter": "B", "inMod": 30, "code": "B30", "q": "An 11-month-old child with perinatally acquired HIV is stable on antiretroviral therapy. He has moderate immune suppression but no severe immunodeficiency. He is due for MMR vaccination. How should this vaccination be managed?", "opts": ["A. Avoid all vaccines because he is immunocompromised", "B. Administer MMR if immunosuppression is not severe", "C. Give half-dose MMR to reduce side-effects", "D. Postpone all vaccines indefinitely", "E. Administer inactivated vaccines only"], "ans": "B", "ansText": "B. Administer MMR if immunosuppression is not severe", "jx": "A. Incorrect. Avoiding all vaccines increases infection risk.B. Correct. Live attenuated vaccines (e.g., MMR): Are contraindicated in severe immunosuppression. May be administered safely in mild to moderate immunosuppression under specialist guidance.Children with HIV who are clinically stable and not severely immunocompromised benefit from vaccination.C. Incorrect. Vaccines are never given in half doses.D. Incorrect. Delaying indefinitely increases preventable disease risk.E. Incorrect. Live vaccines are not absolutely contraindicated unless immunosuppression is severe.", "img": []}, {"id": "e912c76e4b0c5c79", "m": "02", "letter": "B", "inMod": 31, "code": "B31", "q": "A 6-month-old infant develops mild fever and a tender swelling at the injection site 24 hours after DTP vaccination. What is the most appropriate advice?", "opts": ["A. This is a normal mild reaction; give paracetamol and continue schedule", "B. This is anaphylaxis reaction, avoid all future DTP boosters", "C. This is due to vaccine contamination, report as serious event", "D. This indicates vaccine failure", "E. Investigate for immunodeficiency"], "ans": "A", "ansText": "A. This is a normal mild reaction; give paracetamol and continue schedule", "jx": "A. Correct. Common vaccine reactions: Local redness/swelling Mild fever IrritabilityThese are signs of immune response (reactogenicity) and are not contraindications to further doses.B. Incorrect. Anaphylaxis presents with: Urticaria Airway compromise Hypotension Rapid onsetC. Incorrect. Mild local reactions does not Indicate vaccine contaminationD. Incorrect. Local reaction does not indicate vaccine failure.E. Incorrect. No features of immune deficiency present.", "img": []}, {"id": "09bf6b165ec1a208", "m": "02", "letter": "B", "inMod": 32, "code": "B32", "q": "During a global health seminar, students discuss WHO’s Global Vaccine Action Plan (2011–2020 ). One student asks what principle underpins the plan’s implementation at country level. Which principle underpins GVAP implementation?", "opts": ["A. Vaccine programmes should be donor-led rather than country-owned", "B. Equitable access to immunisation as a right to health", "C. Vaccination only in high-income countries", "D. Uniform global vaccination schedules without adaptation", "E. Innovation only after disease eradication"], "ans": "B", "ansText": "B. Equitable access to immunisation as a right to health", "jx": "B. Correct. GVAP principles include: Country ownership Shared responsibility Equity Sustainability Integration InnovationImmunisation is recognized as part of the fundamental right to health.Other options contradict GVAP principles: Not donor-driven Not restricted to wealthy nations Schedules may be adapted locally Innovation and strengthening occur concurrently", "img": []}, {"id": "7b4b60354d1f45fe", "m": "02", "letter": "B", "inMod": 33, "code": "B33", "q": "A 2-year-old boy presents to the emergency department with a high temperature and cries when his right leg is moved. This has been present for 2 days and is getting worse. He had an abscess on his right finger 2 weeks ago for which he was prescribed oral antibiotics. On examination he has a temperature of 39°C. There is an area of redness and swelling over the right upper tibia which is painful when touched or moved. The white cell count and C-reactive protein level are raised. What is the most likely causative organism of his infection?", "opts": ["A. Haemophilus influenzae", "B. Mycobacterium tuberculosis", "C. Salmonella spp.", "D. Staphylococcus aureus", "E. Streptococcus viridans"], "ans": "D", "ansText": "D. Staphylococcus aureus", "jx": "1.Haemophilus influenzae may cause osteomyelitis, but has become rare since routine Hib immunization.\n2.Tuberculosis may cause osteomyelitis but is uncommon and usually presents more insidiously. It might be difficult to exclude. Consider a chest X-ray and Mantoux test or IGRA (interferon-gamma release assay) if his condition does not resolve.\n3.In sickle cell disease, there is an increased risk of Salmonella osteomyelitis, but this does not apply to him.\n4.Correct . The boy is most likely to have osteomyelitis, usually caused by Staphylococcus aureus.\n5.Most infections are caused by Staphylococcus aureus but other pathogens include group A streptococcus species.", "img": []}, {"id": "e178cf1465532ca2", "m": "03", "letter": "C", "inMod": 1, "code": "C1", "q": "An 800-g (1 lb 8 oz) newborn girl born at 28 weeks’ gestation is mechanically ventilated in a neonatal intensive care unit secondary to respiratory distress. After 1 week, her need for supplementa
