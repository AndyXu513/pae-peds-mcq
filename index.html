05", "letter": "E", "inMod": 6, "code": "E6", "q": "Vignette: An 8-year-old boy is brought to the emergency department after collapsing during a 5km run in school . He is tachycardic (HR 140 bpm), tachypnoea (RR 35 breaths per minute), pale, and sweaty.Question: What is the most appropriate initial management step for this child?", "opts": ["A. Start chest compressions", "B. Give IV adrenaline", "C. Provide facial oxygen", "D. Perform full neurological exam", "E. Give antibiotics"], "ans": "C", "ansText": "C. Provide facial oxygen", "jx": "ABC approach: Airway and Breathing first.Compressions only if pulseless.", "img": []}, {"id": "811a5d9e0e5363e2", "m": "05", "letter": "E", "inMod": 7, "code": "E7", "q": "A 3-year-old boy presents to the emergency department with difficulty swallowing and inability to manage his secretions well over the past 2 hours. The mother reports witnessing the child playing with a bottle of liquid industrial-strength bleach with the lid removed; she is unsure if he drank any. She reports giving him milk to drink while she called Poison Control to soothe his throat once she noticed him crying and coughing. He seemed to have a significant amount of discomfort while attempting to drink the milk. On examination, vital signs are stable with an unremarkable examination of the oral cavity and no signs of respiratory distress. Which of the following would be the best next step in management of this patient?", "opts": ["A. CT abdomen/pelvis", "B. CT chest", "C. Discharge to home on a liquid diet for 48 to 72 hours", "D. Esophagoscopy within 24 hours of ingestion", "E. Laryngoscopy and intubation"], "ans": "D", "ansText": "D. Esophagoscopy within 24 hours of ingestion", "jx": "1. CT scan of the abdomen and pelvis would provide detailed information about the digestive tract and associated organs, including any obstructions, masses, or inflammation. However, it would not provide direct visualization of the esophagus to assess for alkali burns resulting from bleach ingestion.\n2. Chest CT scan would be useful if mediastinitis was suspected. In this patient, however, this would have low yield and expose the child to significant radiation. If esophageal rupture were suspected due to severe damage of the esophageal lining, a gastrografin study would be more appropriate. A chest x-ray would be useful in this case to evaluate for other causes of dysphagia (e.g., foreign body ingestion).\n3. Contrary to popular belief, burns caused by alkaline substances, such as bleach, cause more damage compared to acidic substances (alkaline substances penetrate further into tissues, leading to liquefactive necrosis). Thorough evaluation and management of this child is warranted given the potential for extensive burns and corrosive damage to the esophagus. Discharge home on a liquid diet would be inappropriate.\n4. Correct. Absence of lesions in the oral cavity does not reliably depict the extent of damage to the esophagus and stomach, especially since this patient is experiencing symptoms (dysphagia). Esophagoscopy +/- gastroscopy with a flexible endoscope within 24 hours is recommended to visualize the extent of damage and to direct management.\n5. Occasionally, ingestion-related burns involve the larynx and epiglottis that may require evaluation with laryngoscopy and subsequent intubation. Airway damage is often associated more with acid ingestions (due to gagging and choking from the taste). Vital signs are normal in this patient, and he does not appear to be in respiratory distress. The airway should be closely monitored for any compromise, but laryngoscopy is not indicated at this time for this child.", "img": []}, {"id": "f527888f7445dfc0", "m": "05", "letter": "E", "inMod": 8, "code": "E8", "q": "A 6 year old boy presents with septic shock. Laboratory results show thrombocytopenia, deranged coagulation, and Gram negative diplococci seen on microscopy of blood film. Which organism is most likely responsible for this presentation?", "opts": ["A. Neisseria meningitidis", "B. Streptococcus pneumoniae", "C. Staphylococcus aureus", "D. Haemophilus influenzae type b", "E. Escherichia coli"], "ans": "A", "ansText": "A. Neisseria meningitidis", "jx": "Neisseria: Gram-negative diplococci Rapid septic shock DICNeisseria meningitidis is a Gram negative diplococcus that causes invasive meningococcal disease, often with septic shock, low platelets, and abnormal clotting due to disseminated intravascular coagulation. Early recognition from the blood film allows prompt antibiotic therapy, which improves outcomes.", "img": []}, {"id": "81a559a9ed70f7a0", "m": "05", "letter": "E", "inMod": 9, "code": "E9", "q": "A 2-week-old infant is being resuscitated after experiencing a cardiac arrest. The team has successfully restored a pulse, but the infant remains unresponsive. What is the most important focus of care following the return of spontaneous circulation ?", "opts": ["A. Immediate discharge to paediatric ward", "B. Administer intravenous antibiotics", "C. Targeted temperature management", "D. Initiate Nasogastric Feeding", "E. Brain MRI immediately"], "ans": "C", "ansText": "C. Targeted temperature management", "jx": "Targeted temperature management improves neurological outcomes after cardiac arrest.", "img": []}, {"id": "8207383abcad5bab", "m": "06", "letter": "F", "inMod": 1, "code": "F1", "q": "A 15-year-old boy presents to the emergency department with extreme pain in his scrotum that began suddenly upon waking five hours earlier. He has recently become sexually active and denies use of barrier protection. On examination, his scrotum is erythematous, swollen, and exquisitely tender, particularly on the right. There is no discharge from the penis and no indication of trauma. Support of the right testicle through a lifting maneuver does not provide relief, but the entire testicle is tender to palpation. Which of the following is the most appropriate next step in management?", "opts": ["A. Intramuscular ceftriaxone injection and discharge home", "B. DNA PCR for Neisseria gonorrhoeae and Chlamydia", "C. Urinalysis and culture", "D. Ibuprofen and observation for 24 hours", "E. Doppler scan of testicles to assess blood flow"], "ans": "E", "ansText": "E. Doppler scan of testicles to assess blood flow", "jx": "1. Ceftriaxone is often used to treat gonorrhea, in combination with either doxycycline or azithromycin to treat chlamydia. Although the patient has been having unprotected sexual intercourse, putting him at an increased risk for contracting a STI, he would either be asymptomatic or have painful urination with accompanying penile discharge. His clinical presentation does not support that of an STI. Furthermore, his exam does not support epididymitis, which would also be treated with the above antibiotics, due to a negative Prehn's sign (lifting of the affected testicle relieves pain) and no localized tenderness along the epididymis.\n2. Obtaining PCR studies for common sexually transmitted infections is not appropriate in the acute setting. Testing for STIs and advising of safe sex practices should be conducted after his more urgent problem is addressed.\n3. While obtaining a urine sample and culture to diagnose a urinary tract infection is a valid option, this would delay management of the patient's more urgent issue. Furthermore, the patient does not report complaints often associated with a urinary tract infection, including dysuria and urinary frequency and urgency. While UTIs are relatively common in women, they are less common in men.\n4. Although pain management is important for patients experiencing discomfort, merely observing this patient would be inappropriate given the nature of his presentation and likely occurrence of testicular torsion for which early surgical intervention improves outcomes.\n5. Correct This patient's presentation is consistent with testicular torsion. The acute onset of severe testicular and/or groin pain with associated swelling, high riding and horizontal lie of the affected testicle, and absence of cremasteric reflex in an otherwise healthy adolescent male should direct thinking towards this diagnosis. The primary goal of care if torsion is suspected is to restore blood flow to the testicle in hopes of preserving its viability. Doppler ultrasound should be performed immediately to assess blood flow. If suspicion is very high, urology should be consulted immediately, even before results of the ultrasound are available. If blood flow is decreased or absent, the patient should be managed emergently in the operating room. Increased blood flow, epididymal tenderness, and positive Prehn's sign would suggest epididymitis as a diagnosis.", "img": []}, {"id": "0b088d2ba58d18d1", "m": "06", "letter": "F", "inMod": 2, "code": "F2", "q": "A 13-year-old boy, has developed an acutely painful red scrotum. On examination, his right testis is found to be swollen and lying higher in the scrotum than the left. It is tender on palpation. What is the most important diagnosis to exclude?", "opts": ["A. Epididymitis", "B. Hydrocele", "C. Idiopathic scrotal oedema", "D. Torsion of the appendage of the testes (hydatid of Morgagni)", "E. Torsion of the testis"], "ans": "E", "ansText": "E. Torsion of the testis", "jx": "1. This diagnosis is not the most common or dangerous cause of an acute red scrotum in this age group.\n2. A hydrocele should not be red or present acutely.\n3. This is not usually painful.\n4. More common than torsion but not as dramatic clinical features. Usually before puberty.\n5. Correct. Surgical exploration is mandatory unless torsion can be excluded, because it must be relieved within 6–12 hours of the onset of symptoms for there to be a good chance of testicular viability.", "img": []}, {"id": "6401d8faba3ac87b", "m": "06", "letter": "F", "inMod": 3, "code": "F3", "q": "A 2-month-old infant, is referred urgently to outpatients because of an intermittent swelling in both groins as shown in picture below.", "opts": ["A. Needs immediate emergency surgical repair", "B. Needs surgical repair promptly on next routine surgical list", "C. Place on the waiting list for routine surgical repair", "D. Reassess at 1 year of age to determine if surgery is still required", "E. Reassure that this will resolve spontaneously"], "ans": "B", "ansText": "B. Needs surgical repair promptly on next routine surgical list", "jx": "1. This boy has bilateral inguinal hernias, which are present intermittently and therefore are reducible and do not pose an immediate threat to the contents of the hernia.2. Correct. Repair should be done on the next routine operating list because of the risk of strangulation.3. The risk of strangulation is high in infants. Therefore surgery should be done promptly.4. The hernia is due to a patent processus vaginalis, which will not close spontaneously. Surgery should be done promptly to avoid strangulation.5. The hernia is due to a patent processus vaginalis, which will not close spontaneously. Therefore surgery is necessary.", "img": ["images/6401d8faba3ac87b_0.jpg"]}, {"id": "4b913475d8e7cad3", "m": "06", "letter": "F", "inMod": 4, "code": "F4", "q": "A boy’s mother has noticed that his foreskin ‘balloons’ when he urinates. He has an excellent urinary stream. What is the best advice to offer?", "opts": ["A. An ultrasound of the bladder and kidneys will identify if there is functional obstruction", "B. Circumcision will solve the problem", "C. He should have a urine sample taken each time he gets a fever", "D. It will improve over time and no intervention is necessary", "E. She should gently retract the foreskin when she bathes him"], "ans": "D", "ansText": "D. It will improve over time and no intervention is necessary", "jx": "1. It would, but it is not necessary for ballooning of the foreskin.\n2. Circumcision is not necessary.\n3. A urine sample should be taken in a baby or child with a fever without an obvious cause, or in a child with new urinary symptoms.\n4. Correct. Ballooning is commonly reported but requires no intervention.\n5. This is not necessary and in many infants it is not possible to retract the foreskin. Almost all boys have a non-retractile foreskin at birth. The inner foreskin is attached to the glans. Foreskin adhesions break down and form smegma pearls which are extruded. The process of retractility is spontaneous and does not require manipulation.", "img": []}, {"id": "d086b578d94eeb42", "m": "06", "letter": "F", "inMod": 5, "code": "F5", "q": "An 8-year-old boy presents to the emergency department with cola-coloured urine for 2 days. Two weeks ago, he had a sore throat that resolved without antibiotics. He has mild periorbital puffiness and blood pressure is mildly elevated. Urinalysis shows hematuria and mild proteinuria. What is the most likely diagnosis?", "opts": ["A. Acute nephritic syndrome (post-streptococcal)", "B. Urinary tract infection", "C. Nephrotic syndrome", "D. Hemolytic uremic syndrome", "E. IgA nephropathy"], "ans": "A", "ansText": "A. Acute nephritic syndrome (post-streptococcal)", "jx": "A. Correct.Post-streptococcal glomerulonephritis (PSGN) presents:1–3 weeks after streptococcal infectionHematuria (“cola urine”)HypertensionMild edemaMild proteinuriaComplement C3 is typically low.B. UTI – Incorrect.Would present with dysuria and frequency; hematuria may occur but not hypertension and edema.C. Nephrotic syndrome – Incorrect.Characterized by heavy proteinuria, hypoalbuminemia, and generalized edema.D. HUS – Incorrect.Triad: hemolytic anemia, thrombocytopenia, renal failure; often follows diarrheal illness.E. IgA nephropathy – Incorrect.Hematuria occurs within days of URTI (synpharyngitic), not weeks later.", "img": []}, {"id": "7a7811f5a2e4506b", "m": "06", "letter": "F", "inMod": 6, "code": "F6", "q": "A 7-year-old girl with recurrent UTIs was found to have hydronephrosis on renal ultrasound. What is the most important complication to exclude?", "opts": ["A. Vesicoureteric reflux", "B. Renal scarring", "C. Pyelonephritis", "D. Diabetes insipidus", "E. Nephrotic syndrome"], "ans": "B", "ansText": "B. Renal scarring", "jx": "Recurrent infections and reflux lead to renal scarring.", "img": []}, {"id": "4600181b6f30bf23", "m": "06", "letter": "F", "inMod": 7, "code": "F7", "q": "A 10-year-old girl came to clinic with her mother. She was toilet trained at 3 years old and has been dry during the day since then. However, she continues to wet the bed at night. Her mother express concern about her self-esteem. What is the most appropriate first-line management strategy for her?", "opts": ["A. Desmopressin", "B. Enuresis alarm", "C. Anticholinergic medication", "D. Regular nighttime wakenings", "E. Refer to psychiatrist"], "ans": "B", "ansText": "B. Enuresis alarm", "jx": "Best long-term cure. Desmopressin useful short-term (e.g., camps).", "img": []}, {"id": "9931a90360e801be", "m": "06", "letter": "F", "inMod": 8, "code": "F8", "q": "A 6-month-old infant presents to the emergency department with fever, vomiting and irritability. A urine dipstick test was positive for leukocyte esterase, blood and nitrites. Which are the b approrpiate urine collection methods to confirm a urinary tract infection in this infant?", "opts": ["A. Urine bag, Cotton ball method, clean catch midstream urine", "B. Clean catch midstream urine, urethral catheterization, suprapubic catherterisation", "C. urethral catheterization, suprapubic aspiration", "D. suprapubic aspiration", "E. Cotton ball method, clean catch midstream urine"], "ans": "B", "ansText": "B. Clean catch midstream urine, urethral catheterization, suprapubic catherterisation", "jx": "Minimises contamination in non-toilet trained infants. Urethral catherization and suprapublic catherisation are invasive hence not routinely undertaken. Risk of contaimination using clean catch midstream urine if not cleaned and performed properly.", "img": []}, {"id": "c992ea5375ff5c99", "m": "06", "letter": "F", "inMod": 9, "code": "F9", "q": "An infant presents with reduced urine output after severe gastroenteritis. Laboratory tests reveal elevated serum creatinine and urinalysis shows hematuria and proteinuria. What is the most critical initial management for this infant?", "opts": ["A. Administer intravenous fluid", "B. Initiate dialysis", "C. Perform renal biopsy", "D. Start steroids", "E. Start antibiotic therapy"], "ans": "A", "ansText": "A. Administer intravenous fluid", "jx": "A. Correct.Most AKI in children is pre-renal due to dehydration. Restore perfusion first.Dialysis reserved for severe electrolyte imbalance or fluid overload.", "img": []}, {"id": "cf009aff6b064d3d", "m": "06", "letter": "F", "inMod": 10, "code": "F10", "q": "A 3 year old boy develops hematuria and hypertension 2 weeks after having a sore throat. Parents reported he has been more tired recently. What is the most likely underlying cause of this child's condition?", "opts": ["A. IgA nephropathy", "B. Minimal change disease", "C. Post-infectious Glomerulonephritis", "D. Lupus nephritis", "E. Haemolytic Uraemic Syndrome"], "ans": "C", "ansText": "C. Post-infectious Glomerulonephritis", "jx": "Classic timing (1–3 weeks after infection) with hematuria and hypertension indicates post-streptococcal glomerulonephritis.", "img": []}, {"id": "dffb9c1ee87fd283", "m": "06", "letter": "F", "inMod": 11, "code": "F11", "q": "A child previously had acute kidney injury (AKI) following perinatal asphyxia. What is an critical aspect of long-term follow-up?", "opts": ["A. Routine blood pressure monitoring", "B. Renal ultrasound annually", "C. Continuous oxygen therapy", "D. Liver function tests", "E. ECG annually"], "ans": "A", "ansText": "A. Routine blood pressure monitoring", "jx": "A. Correct.AKI increases risk of:Chronic kidney diseaseHypertensionEarly BP monitoring allows detection of long-term renal sequelae.Other options are not routinely required.", "img": []}, {"id": "5232ae324b9457fd", "m": "06", "letter": "F", "inMod": 12, "code": "F12", "q": "A 11-year-old girl is evaluated by her pediatrician for hematuria. She states that she first noticed a brown coloring to her urine after having a sore throat with cough and nasal congestion a few days ago. The patient is otherwise healthy with no other physical complaints. On physical examination, her blood pressure is mildly elevated with no other findings. Urinalysis reveals persistent microscopic hematuria and mild proteinuria. Laboratory studies are pending. Which of the following diagnoses is most consistent with her clinical presentation?", "opts": ["A. Alport syndrome", "B. Hemolytic-uremic syndrome (HUS)", "C. IgA nephropathy", "D. Membranoproliferative glomerulonephritis", "E. Poststreptococcal glomerulonephritis"], "ans": "C", "ansText": "C. IgA nephropathy", "jx": "1. Alport syndrome can present similarly; however, it is less common overall and is often accompanied by sensorineural hearing loss.\n2. HUS generally follows a gastrointestinal infection caused by Escherichia coli O157:H7. This results in hemolytic anemia, kidney injury, and thrombocytopenia. Most children affected are less than 10 years of age. This is less consistent with this patient’s presentation.\n3. Correct IgA nephropathy (Berger nephropathy) is a syndrome of recurrent asymptomatic hematuria that typically follows several days after an upper respiratory illness. Mild hypertension may occur. Despite its name, IgA nephropathy is a nephritic syndrome. Given the patient's presentation, this is the most likely diagnosis.\n4. This condition has a similar clinical profile to IgA nephropathy but is less common in children and is associated with significant hypertension.\n5. Poststreptococcal glomerulonephritis (PSGN) generally develops 1-2 weeks following a Group A beta-hemolytic streptococcal skin or pharyngeal infection. Streptococcus-specific antigens (ASO and anti-DNase B) are usually positive with more pronounced renal dysfunction.", "img": []}, {"id": "c0534c994db86e64", "m": "06", "letter": "F", "inMod": 13, "code": "F13", "q": "A 5-year-old presents with recurrent urinary tract infection and was found to havevesicoureteral reflux on further investigation. What is the potential long-term complication associated with untreated vesicoureteral reflux?", "opts": ["A. Incontinence", "B. Renal scarring", "C. Bladder cancer", "D. Diabetes insipidus", "E. Acute appendicitis"], "ans": "B", "ansText": "B. Renal scarring", "jx": "Recurrent infections → renal scarring → hypertension & CKD.", "img": []}, {"id": "ed16a82330e259e6", "m": "06", "letter": "F", "inMod": 14, "code": "F14", "q": "A 10-year-old boy with recurrent UTIs presents with new-onset hypertension and proteinuria. Which condition might this patient have", "opts": ["A. Vesicoureteral reflux", "B. Minimal change disease", "C. Acute pyelonephritis", "D. Renal calculi", "E. Diabetes mellitus"], "ans": "A", "ansText": "A. Vesicoureteral reflux", "jx": "Recurrent UTIs → reflux nephropathy → scarring → hypertension.", "img": []}, {"id": "884d46dbc674b9fd", "m": "06", "letter": "F", "inMod": 15, "code": "F15", "q": "A 7-year-old boy is brought in to see his pediatrician after behavioral modifications have been unsuccessful in controlling his night-time bedwetting. His parents are frustrated that they haven’t seen any improvement despite limiting his water intake in the evening. Urinalysis and testing for elevated blood glucose have been unremarkable, and there is no history of life changes or stresses that may be contributing to his bedwetting. Most recently, a bed wetting alarm has not been able to help his nocturnal enuresis consistently. Which of the following medications may be of benefit to use in conjunction with behavioral modifications?", "opts": ["A. Bethanechol", "B. Desmopressin", "C. Imipramine", "D. Oxytocin", "E. Positive reinforcement"], "ans": "B", "ansText": "B. Desmopressin", "jx": "1. Bethanechol is a parasympathomimetic agent used to treat urinary retention. It would not be appropriate to use in a child who has nighttime urinary incontinence issues.\n2. Correct Desmopressin is an analogue to anti-diuretic hormone. It can be used as a first line medication in children with nocturnal enuresis who have proven refractory to behavioral modifications. Accompanying bedwetting alarms are encouraged, as management with medication alone tends to only temporarily improve bedwetting behaviors.\n3. Medications such as imipramine are reserved for the treatment of refractory cases in which behavioral modifications and desmopressin have been unsuccessful. This is due to the numerous and often unpleasant side effects associated with tricyclic anti-depressant medications.\n4. Oxytocin is an anterior pituitary hormone, stored in the posterior pituitary, that acts to stimulate uterine muscles during labor. It has no effect on the bladder and would not be helpful in this case.\n5. Positive reinforcement along with other behavioral modifications (e.g., water intake limitation, bedwetting alarms) is the first line approach to older children who cannot maintain urinary continence while asleep. This child has been evaluated for organic causes that may contribute to nocturnal enuresis (i.e., diabetes, urinary tract infection) and has not responded well to multiple behavioral modifications and a bed alarm. Medication is the next step to use adjunctively with behavioral support.", "img": []}, {"id": "6badeaa03d128b5e", "m": "06", "letter": "F", "inMod": 16, "code": "F16", "q": "A 5-year-old girl had a myelomeningocele repaired shortly after birth. She uses a wheelchair for mobility. She has a 4-day history of fever, lethargy, vomiting and abdominal pain. She normally opens her bowels twice a week and does intermittent urinary catheterization three times a day with the help of her mother but despite this she is dribbling urine. What is the most likely cause of her new symptoms.", "opts": ["A. Constipation", "B. Hydrocephalus", "C. Hypertension and renal failure", "D. Tethering of the spinal cord", "E. Urinary tract infection"], "ans": "E", "ansText": "E. Urinary tract infection", "jx": "1. The constipation is not a new symptom but does predispose Olive to urinary tract infection.\n2. Hydrocephalus would cause lethargy and vomiting, but not the other symptoms.\n3. This is insidious and often presents as an incidental finding or with faltering growth.\n4. Would not cause fever.\n5. Correct. She had a myelomeningocele that has caused a neurogenic bladder (she has to use catheterization to maintain continence) and neurogenic bowel dysfunction (she is usually constipated). A neurogenic bladder predisposes to developing a urinary tract infection, due to the stagnant urine lying in the bladder. Her symptoms of fever, abdominal pain, vomiting, and urinary incontinence are most likely to be due to a urinary tract infection.", "img": []}, {"id": "0b2de14f4beaf70c", "m": "06", "letter": "F", "inMod": 17, "code": "F17", "q": "A 6-year-old girl woke up with periorbital swelling and was brought to the emergency department. Her abdomen is distended and urine dipstick shows 4+ protein, no blood. Serum albumin is low. What is the most likely underlying cause of her symptoms?", "opts": ["A. Acute nephritic syndrome", "B. Minimal change diseaes", "C. IgA nephropathy", "D. Focal segmental glomerulosclerosis", "E. HSP nephritis"], "ans": "B", "ansText": "B. Minimal change diseaes", "jx": "B. Correct.Most common cause of nephrotic syndrome in children:Heavy proteinuriaHypoalbuminemiaEdemaNormal BPResponds well to steroids.Other options involve hematuria or hypertension.", "img": ["images/0b2de14f4beaf70c_0.jpg"]}, {"id": "f4ebe8751325625f", "m": "06", "letter": "F", "inMod": 18, "code": "F18", "q": "An 8-year-old boy has recurrent urinary tract infections. He complains of frequent abdominal discomfort, increased urgency to urinate and sometimes has nocturnal enuresis. He opens his bowels once every 4-5 days. Which of the following is the most likely contributing factor for the recurrent urinary tract infection in this boy?", "opts": ["A. Poor fluid intake", "B. Constipation", "C. Poor personal hygiene after defaecation", "D. Swimming", "E. School attendance"], "ans": "B", "ansText": "B. Constipation", "jx": "Constipation → bladder outlet obstruction & residual urine.", "img": []}, {"id": "fc2d126cbd0fa835", "m": "06", "letter": "F", "inMod": 19, "code": "F19", "q": "A previously healthy 3-year-old girl is brought to the physician for pain during urination and increasing irritability. She was previously toilet trained but has had 2 accidents in the past 24 hours. She had a similar episode 1 year ago and responded well to treatment with antibiotics. Besides these episodes, she is healthy and takes no medications. She has had all age-appropriate immunizations. Review of systems is negative for blood in the urine or stool, diarrhea, nausea, or vomiting. On physical examination, her temperature is 39.5˚C (103.1˚F), and she has mild suprapubic abdominal tenderness to palpation. Genitourinary examination reveals normal genitalia for age with no tenderness or erythema, and the remainder of her examination is within normal limits. Urine dipstick is positive for leukocyte esterase and nitrites, and urinalysis shows 45 white blood cells/mL. Urine culture is sent, and empiric antibiotics are started. Which of the following is the most appropriate next step?", "opts": ["A. Bladder and renal ultrasound", "B. Dimercaptosuccinic acid renal scan", "C. No further management", "D. Retrograde urethrogram", "E. Voiding cystourethrogram"], "ans": "A", "ansText": "A. Bladder and renal ultrasound", "jx": "1. Correct This patient has a febrile urinary tract infection (UTI) based on clinical symptoms and the positive urine dip/urinalysis. Bladder and renal ultrasonography is indicated in children younger than 24 months with the first febrile UTI and in all children with recurrent UTIs. Given that this patient is on her second episode of similar symptoms and the first episode occurred while she was less than 24 months of age, bladder and renal ultrasound should be completed to assess for urinary tract abnormalities such as vesicoureteral reflux.\n2. Dimercaptosuccinic acid (DMSA) renal scan is primarily used to assess for renal parenchymal abnormalities and should be used when there is a concern for reduced renal function. It involves injecting a mix of DMSA and radioactive technetium-99m and imaging with a gamma camera to evaluate radioactive uptake in the kidneys. It can be considered in children with complicated or recurrent UTI but is rarely used and would not be the first step in the evaluation.\n3. This patient has now had two febrile UTIs. This is concerning for an underlying abnormality that may be causing recurrent infection or inadequate clearance of a previous infection. If there is no further workup, this child is at risk of further infections and permanent renal scarring.\n4. Retrograde urethrogram is a diagnostic test used primarily in men when there is a suspicion for urethral trauma. It involves injection of contrast into the urethra and subsequent radiography. If there is urethral disruption, extravasation of contrast into surrounding tissue would be seen on the x-ray. When a female patient needs urethral evaluation, a voiding cystourethrogram is typically used instead.", "img": []}, {"id": "d53b989699a688a2", "m": "06", "letter": "F", "inMod": 20, "code": "F20", "q": "A child with nephrotic syndrome develops abdominal pain and vomiting. Which complication must be urgently considered?", "opts": ["A. Electrolyte imbalance", "B. Infection", "C. Thromboembolic event", "D. Hypertension", "E. Acute appendicitis"], "ans": "C", "ansText": "C. Thromboembolic event", "jx": "Nephrotic syndrome causes hypercoagulability due to:Loss of antithrombin IIIIncreased fibrinogenRenal vein thrombosis is classic.", "img": []}, {"id": "f9d1b174beb57454", "m": "06", "letter": "F", "inMod": 21, "code": "F21", "q": "A 1-year-old infant, is brought to the emergency department by his mother because he has a swollen and red foreskin. It has become worse over the last few days and there is a discharge from the end of his penis. He has not suffered from anything like this before. Which of the following represents the best treatment plan?", "opts": ["A. Broad-spectrum antibiotic and warm baths", "B. Broad-spectrum antibiotics followed by circumcision", "C. Circumcision on an elective list", "D. Ice-cold baths", "E. Immediate circumcision on the emergency list"], "ans": "A", "ansText": "A. Broad-spectrum antibiotic and warm baths", "jx": "1. Correct. This boy is suffering from balanoposthitis. Treatment is with warm baths and a broad-spectrum antibiotic.\n2. The antibiotics will treat the condition, and circumcision will not be required.\n3. Circumcision is only indicated for recurrent balanoposthitis.\n4. There is active inflammation and infection, and this will not be treated by an ice-cold bath.\n5. This is balanoposthitis (inflammation of the glans and foreskin); recurrent attacks of balanoposthitis are uncommon, and only then is circumcision indicated.", "img": []}, {"id": "6f596093bda7f19c", "m": "07", "letter": "G", "inMod": 1, "code": "G1", "q": "A 15-month-old boy had been unwell with a runny nose and cough for a day when his father brings him to the emergency department. At lunch he suddenly became stiff, his eyes rolled upwards and both his arms and legs started jerking for 2 minutes. He felt very hot at the time. When examined 2 hours later, he has recovered fully. This is the first time this has happened. He has a normal neurological examination and is acquiring his developmental milestones normally. He has no other medical problems. The triage nurse performed a blood glucose test, which indicated a glucose level of 4.2 mmol/L (within normal range). What would be the most appropriate investigation?", "opts": ["A. CT scan of the brain", "B. ECG", "C. EEG (electroencephalography)", "D. No investigation required", "E. Oral glucose tolerance test"], "ans": "D", "ansText": "D. No investigation required", "jx": "1. Persistent signs, particularly asymmetric ones, should prompt imaging.\n2. Cardiac causes usually occur ‘out of the blue’ or following a specific trigger: exercise (hypertrophic obstructive cardiomyopathy) or shock (ventricular tachycardia). They do not usually occur in conjunction with a fever.\n3. Will be ‘abnormal’ in a significant proportion of normal children. This will lead to significant ‘overdiagnosis’ of epilepsy. Not indicated here.\n4. Correct. He had a simple febrile seizure, secondary to a respiratory tract infection. A febrile seizure is a clinical diagnosis and does not require investigation. Indeed, there is no confirmatory test.\n5. This is not required as the blood glucose is normal. It is rarely required in children to diagnose diabetes.", "img": []}, {"id": "d6a290a0416b6950", "m": "07", "letter": "G", "inMod": 2, "code": "G2", "q": "A 14-year-old boy with a known seizure disorder is brought by his parents to the emergency department with concern for a prolonged seizure. He was given lorazepam intravenously in the ambulance and a second dose following arrival to the emergency department without cessation of the seizure. His heart rate is 140/min, blood pressure is 135/86 mm Hg, respiration rate is 12/min, and oxygen saturations of 85% with a nonrebreather mask. Physical examination is notable for generalized tonic clonic movement with left eye deviation. He is unresponsive to tactile stimulus, and his seizure duration is estimated at 15 minutes. Which of the following is the most appropriate next step in management of his condition?", "opts": ["A. Basic metabolic panel", "B. Electroencephalogram (EEG)", "C. Endotracheal intubation", "D. Intravenous midazolam", "E. Intravenous phenytoin"], "ans": "C", "ansText": "C. Endotracheal intubation", "jx": "1. While it will be useful to know about any electrolyte abnormalities that may be the cause or trigger of the seizure, this can be delayed until after an airway is secured.\n2. EEGs are often used to assist in seizure diagnosis and management but are not performed when a patient is clinically unstable. After airway management and empiric seizure therapy, an EEG may be warranted.\n3. Correct. Rapid sequence intubation (RSI) is necessary in this patient given his decreased respiratory effort and hypoxemia using supplemental oxygen. A patient who is unable to protect the airway while manifesting respiratory problems is at risk for further clinical decompensation.\n4. Although intravenous midazolam and other benzodiazepines are important in seizure management, this patient is hypoxemic and hypopneic with the aid of supplemental oxygen support via a nonrebreather and requires emergent management of his airway prior to proceeding with additional seizure treatment.\n5. Fosphenytoin or phenytoin are often used following benzodiazepines if seizures continue. The patient first needs placement of a definitive airway.", "img": []}, {"id": "89f2e1a1065605a7", "m": "07", "letter": "G", "inMod": 3, "code": "G3", "q": "A 12-year-old girl has had occasional headaches for the last 3 months. Today was her first day at secondary school. During maths class she developed her usual throbbing left-sided headache, associated with nausea. Over the next hour, she lost her temporal vision in her right eye and found she only had minimal movement in her right arm. The left side of her mouth was drooping. Her parents were called, who rushed her to hospital. She is now feeling much better, has normal vision and can move her arm, although she has some residual weakness of her mouth. She has no significant medical history except some episodes of abdominal pain as a younger child. Her mother tells you that she also suffers from headaches. What is the most likely diagnosis?", "opts": ["A. Idiopathic intracranial hypertension", "B. Migraine", "C. Raised intracranial pressure due to a space-occupying lesion", "D. Subarachnoid haemorrhage", "E. Tension headache"], "ans": "B", "ansText": "B. Migraine", "jx": "1. Idiopathic intracranial hypertension would typically be worse on lying and/or straining. Often there is papilloedema.\n2. Correct. The headache described is typical of a migraine, being unilateral and throbbing, and associated with nausea. However, this is a complicated migraine because it is associated with neurological phenomena (monoplegia and hemianopia) and this necessitates neuroimaging to exclude a vascular abnormality or structural problem.\n3. No red flags.\n4. A subarachnoid haemorrhage is rare in a child of this age. Besides, the pain is often occipital and the neurological symptoms would not improve over this period.\n5. A tension headache would be symmetrical, and the pain is not typically throbbing. In tension headaches there would not be weakness or visual disturbance.", "img": []}, {"id": "454f47a3e6f7c594", "m": "07", "letter": "G", "inMod": 4, "code": "G4", "q": "A 5-year-old girl is seen by her general practitioner. Her mother and school teacher have noticed she has episodes where she stops her activity for a few seconds, stares blankly ahead and then resumes the activity as if she had never stopped. These episodes happen many times a day. She has no other medical problems and there is no family history of note. The EEG during an episode is shown. Choose the most likely diagnosis.", "opts": ["A. Childhood epilepsy with centrotemporal spikes", "B. Childhood absence epilepsy", "C. Juvenile myoclonic epilepsy", "D. Lennox–Gastaut syndrome", "E. Infantile spasms (West syndrome"], "ans": "B", "ansText": "B. Childhood absence epilepsy", "jx": "1. This condition comprises 15% of all childhood epilepsies. The EEG shows focal sharp waves from the centrotemporal area. Important to recognize as it is relatively benign and may not require antiepileptic drugs. Occurs in 4–10-year-olds and remits in adolescence. Antonia's history does not correspond with this diagnosis. See Table 29.1 in Illustrated Textbook of Paediatrics, 6th edn for more details of epilepsy syndromes.\n2. Correct. The history suggests this diagnosis. In addition, the EEG corresponds with it, showing 3/s spike and wave discharge, which is bilaterally synchronous during, and sometimes between, attacks.\n3. Typically affects 10- to 20-year-olds. Antonia's history does not correspond with this diagnosis. See Table 29.1 in Illustrated Textbook of Paediatrics, 6th edn for more details of epilepsy syndromes.\n4. This condition affects children 1–3 years old, who have multiple seizure types, but mostly atonic, atypical (subtle) absences and tonic seizures in sleep with neurodevelopmental regression and behaviour disorder. Antonia's history does not correspond with this diagnosis.\n5. Her history does not correspond with this diagnosis.", "img": ["images/454f47a3e6f7c594_0.jpg"]}, {"id": "9adc99036c27146b", "m": "07", "letter": "G", "inMod": 5, "code": "G5", "q": "A baby boy is reviewed at 24 hours of age. He weighs 3.2 kg and is struggling to establish feeds. Examination reveals a hypotonic infant. Which combination of physical signs would make spinal muscular atophy (SMA) the most likely diagnosis?", "opts": ["A. Arthrogryposis and ptosis", "B. Cataract and tachypnoea", "C. Hyporeflexia and peripheral muscle weakness", "D. Intercostal recession and tongue fasciculation", "E. Seizures and hypotonia"], "ans": "D", "ansText": "D. Intercostal recession and tongue fasciculation", "jx": "1. Although fetal movements in utero may be reduced in SMA babies, arthrogryposis is not a feature. Ptosis with arthrogryposis suggests congenital myasthenia.\n2. Cataracts and tachypnoea can be a sequelae of congenital infection which also present variably with IUGR, skin rashes, jaundice and other clinical features.\n3. Reflexes will be reduced and the child will be weak if they have SMA or a muscular dystrophy. This pattern therefore won’t establish a likely diagnosis.\n4. Correct. Tongue fasciculation is pathognomonic of SMA. If the diaphragm is affected then other respiratory muscles are used to help maintain adequate ventilation.\n5. Seizures and hypotonia are early features of hypoxic–ischaemic encephalopathy (HIE). Hypertonia and hyperreflexia develop later.", "img": []}, {"id": "b86e2e13b1be8c70", "m": "07", "letter": "G", "inMod": 6, "code": "G6", "q": "A 6-year-old boy with known epilepsy presents to the emergency department with generalized seizure lasting 20 minutes. D iazepam administered at home without effect. What is the next most appropriate step in management?", "opts": ["A. Repeat another dose of diazepam", "B. IV Midazo lam", "C. IV phenytoin first", "D. Intubate immediately", "E. Observe"], "ans": "B", "ansText": "B. IV Midazo lam", "jx": "First-line for status epilepticus: IV benzodiazepine.Second-line: phenytoin, levetiracetam, or valproate.Avoid repeated benzodiazepine doses due to respiratory depression.", "img": []}, {"id": "c643fa6596af7f2c", "m": "07", "letter": "G", "inMod": 7, "code": "G7", "q": "A girl is 8 years old with recurrent seizures. She has three or four seizures a month, where she lets out a cry, her arms and legs become stiff, her eyes roll upwards and then she jerks her arms and legs. This lasts about 3 minutes. Afterwards she sleeps for 2 hours and is then back to normal. She is doing well at school but is sometimes missing school because of her seizures. She is currently not on any medication and has no other medical problems. What would be the best intervention for this child?", "opts": ["A. Anti-epileptic drug therapy", "B. Home schooling", "C. Ketogenic diet", "D. No intervention required", "E. Vagal nerve stimulation"], "ans": "A", "ansText": "A. Anti-epileptic drug therapy", "jx": "1. Correct. This child should be started on an anti-epileptic drug. She has recurrent generalized tonic–clonic seizures which are affecting her quality of life as she is missing school.\n2. The solution to her missing school is control of her seizures.\n3. Ketogenic diets are sometimes used in children with seizures that have not responded to multiple different anti-epileptic drug treatments.\n4. The seizures are impacting upon schooling and quality of life, and therefore treatment should be started.\n5. Vagal nerve stimulation is used in certain children with intractable seizures but neurosurgical intervention is not a first-line treatment.", "img": []}, {"id": "be9d9f2e3d406561", "m": "07", "letter": "G", "inMod": 8, "code": "G8", "q": "A 10-year-old boy presents to the emergency department with severe headaches and blurred vision. An MRI reveals increased intracranial pressure due to a mass effect. What is the most likely diagnosis?", "opts": ["A. Brain tumor", "B. Meningitis", "C. Migraine", "D. Sinusitis", "E. Idiopathic intracranial hypertension"], "ans": "A", "ansText": "A. Brain tumor", "jx": "Raised ICP + mass effect → tumor until proven otherwise.", "img": []}, {"id": "962467de1bc521e7", "m": "07", "letter": "G", "inMod": 9, "code": "G9", "q": "A 2-year-old girl develops a generalized tonic-clonic seizure lasting 4 minutes during a fever of 39.2°C. She has been otherwise healthy with normal development. Immunizations is up to date. After the event, she recovers fully and is alert and neurologically normal. Which of the following is the most appropriate next step in her management?", "opts": ["A. Urgent MRI brain", "B. Start daily anticonvulsant therapy", "C. Perform lumbar puncture immediately", "D. Reassure parents and educate about fever management", "E. Arrange EEG to predict recurrence"], "ans": "D", "ansText": "D. Reassure parents and educate about fever management", "jx": "A. MRI – Incorrect. Not indicated with normal exam and simple febrile seizure.B. Daily anticonvulsants – Incorrect. Not recommended due to side effects outweighing benefit.C. Lumbar puncture – Incorrect. Only if signs of meningitis or incomplete immunisation.D. Correct. This is a simple febrile seizure: Age 6 months–5 years Generalized <15 minutes Single episode in 24 hours Complete recoveryManagement is reassurance and parental education. Risk of epilepsy is only slightly increased.E. EEG – Incorrect. Does not predict recurrence risk.", "img": []}, {"id": "fcd9420aab005b91", "m": "07", "letter": "G", "inMod": 10, "code": "G10", "q": "A 4-year-old boy is brought to his pediatrician to evaluate progressive muscular weakness. The parents indicate the boy has become noticeably weaker over the last year. On exam, the boy is able to rise easily from a sitting position and has a normal gait. There is an inverted V shape of the upper lip and moderate atrophy of the temporalis muscles bilaterally and of the distal regions of the upper and lower extremities. Delayed relaxation phase of deep tendon reflexes is present. An electrocardiogram shows a PR interval of 300 msec. Which of the following would best explain this boy's symptoms?", "opts": ["A. Duchenne muscular dystrophy", "B. Eaton-Lambert syndrome", "C. Myasthenia gravis", "D. Myophosphorylase deficiency syndrome", "E. Myotonic dystrophy"], "ans": "E", "ansText": "E. Myotonic dystrophy", "jx": "1. Duchenne muscular dystrophy is characterized by proximal, not distal, weakness, and a 4-year-old would most likely have a positive Gower sign and Trendelenburg gait. Children with Duchenne muscular dystrophy develop pseudohypertrophy, not wasting, of the calves.\n2. Eaton-Lambert syndrome is characterized by the gradual onset of muscle weakness, especially of the pelvic and thigh muscles. This typically occurs in adults and is not the description of the regional muscle weakness in the patient.\n3. Rapid fatigue of muscles is characteristic of myasthenia gravis, which may manifest as ptosis, poor head control, facial weakness, and difficulty feeding. There is no associated myotonia.\n4. This condition is also known as McArdle disease or glycogen storage disease type\n5. The condition is caused by phosphorylase B deficiency resulting in accumulation of glycogen in muscle tissue. Symptoms are muscular pain, fatigability, and muscle cramping following exercise. This is not consistent with the information presented in the vignette.\n5. Correct. Myotonic dystrophy is characterized by distal wasting and the facial characteristics noted in the vignette. Cardiac and smooth muscles may also be affected. Myotonia (slow relaxation after muscle contraction) is classic for this disorder.", "img": []}, {"id": "b2853b5fee34e985", "m": "07", "letter": "G", "inMod": 11, "code": "G11", "q": "A 2-year-old girl presents to her general practitioner as she has been unsteady on her feet for a day, having had diarrhoea during the previous week. On examination she is afebrile, has reduced muscle power and tone and no tendon reflexes can be elicited in her lower limbs. She is referred urgently to the paediatric hospital and 6 hours later she is unable to stand and the tendon reflexes in her upper limbs are now absent. She has no other medical problems and has been fully immunized. What is the most likely diagnosis?", "opts": ["A. Guillain–Barré syndrome", "B. Myasthenia gravis", "C. Myotonic dystrophy", "D. Poliomyelitis", "E. Spinal muscular atrophy"], "ans": "A", "ansText": "A. Guillain–Barré syndrome", "jx": "1. Correct. Guillain–Barré syndrome (post-infectious polyneuropathy). The classical presentation is with ascending weakness. It may follow campylobacter gastroenteritis. She must be closely monitored, as a serious complication is respiratory failure. To monitor her respiratory function, you can ask her to cough (or sing) to assess diaphragmatic function and involvement of the nerves supplying the chest muscles.\n2. Myasthenia gravis presents as abnormal muscle fatigability, which improves with rest or anticholinesterase drugs. It is incredibly rare!\n3. Her illness is acute, with a relatively rapid onset. Myotonic dystrophy is a lifelong condition which often is more severe in early life, improves and then very gradually progresses.\n4. Poliomyelitis is a very important differential diagnosis here, but as the child is immunized and as polio has been eradicated in most countries it is highly unlikely. It is on the verge of eradication globally.\n5. Spinal muscular atrophy is an autosomal recessive group of disorders causing degeneration of the anterior horn cells, leading to progressive weakness and wasting of skeletal muscles. They are chronic disorders and would not present acutely as in this child.", "img": []}, {"id": "d578cfe355525093", "m": "07", "letter": "G", "inMod": 12, "code": "G12", "q": "A 1-year-old boy presents with a 20-minute focal seizure involving the right side of the body during a febrile illness. He remains drowsy for several hours afterward. What is the most appropriate initial investigation(s)?", "opts": ["A. No investigations and observe", "B. Perform EEG", "C. MRI brain and lumbar puncture", "D. Perform FBC and CRP", "E. Perform ECG"], "ans": "C", "ansText": "C. MRI brain and lumbar puncture", "jx": "C. Correct. This is a complex febrile seizure: Focal >15 minutes Postictal drowsinessRequires evaluation to exclude: CNS infection Structural lesionOther options are inadequate given red flags.", "img": []}, {"id": "7a23d8a1d12e2981", "m": "07", "letter": "G", "inMod": 13, "code": "G13", "q": "A newborn is diagnosed with cerebral palsy after showing delayed motor milestones and abnormal muscle tone. The parents ask about the long-term outlook for their child. What is a common long-term complication associated with cerebral palsy?", "opts": ["A. Hypertension", "B. Osteoporosis", "C. Asthma", "D. Diabetes", "E. Cataracts"], "ans": "B", "ansText": "B. Osteoporosis", "jx": "Limited mobility → reduced bone mineral density.", "img": []}, {"id": "b83c31e91bbf8557", "m": "07", "letter": "G", "inMod": 14, "code": "G14", "q": "A 9-month-old girl presents with recurrent prolonged febrile hemiclonic seizures. MRI and EEG are normal, but a genetic test shows an SCN1A mutation. What is the most likely diagnosis?", "opts": ["A. Dravet syndrome", "B. Lennox-Gastaut", "C. West syndrome", "D. Absence epilepsy", "E. Benign rolandic epilepsy"], "ans": "A", "ansText": "A. Dravet syndrome", "jx": "Dravet: Onset infancy Febrile prolonged seizures SCN1A mutation Worsened by sodium channel blockersOther syndromes have different age and seizure types.", "img": []}, {"id": "d6ba3592bcfbbaaf", "m": "07", "letter": "G", "inMod": 15, "code": "G15", "q": "An 8-year-old girl is being evaluated for recurrent seizures. The family reports that she experiences episodes characterized by staring and unresponsiveness, lasting a few seconds. What yype of seizure is most likely?", "opts": ["A. Tonic-clonic", "B. Absence seizure", "C. Myoclonic", "D. Atonic", "E. Focal motor"], "ans": "B", "ansText": "B. Absence seizure", "jx": "Brief staring episodes with rapid recovery are characteristic of absence seizures.", "img": []}, {"id": "a8e3c5b6dd38a8cd", "m": "07", "letter": "G", "inMod": 16, "code": "G16", "q": "A 3 month old infant presents with lethargy, seizures, and vomiting. There is no history of trauma. CT brain shows bilateral subdural hematomas. Fundoscopic exam reveals retinal hemorrhages. What is the most likely diagnosis ?", "opts": ["A. Birth injury", "B. Accidental fall", "C. Abusive head trauma (shaken baby syndrome)", "D. Intracranial vascular malformation", "E. Meningitis"], "ans": "C", "ansText": "C. Abusive head trauma (shaken baby syndrome)", "jx": "Classic triad: Subdural hemorrhage Retinal hemorrhage Encephalopathy The triad of subdural hemorrhage, retinal hemorrhages, and encephalopathy in infancy without a plausible explanation indicates abusive head trauma , often due to violent shaking. This is the most common cause of death in physical abuse in infants under 6 months.", "img": []}, {"id": "725e175f58745cda", "m": "08", "letter": "H", "inMod": 1, "code": "H1", "q": "An 18-day-old female infant, has congenital adrenal hypoplasia. She presents having vomited all her feeds today. She has become lethargic and will no longer feed. On examination she has tachycardia, with a heart rate of 160 beats/min and a capillary refill time of 3 seconds. A bedside blood test shows that she is hypoglycaemic. What is the best immediate management?", "opts": ["A. Intravenous glucose alone for 24 hours", "B. Intravenous balanced isotonic crystalloid, glucose and hydrocortisone", "C. Oral rehydration", "D. Oral rehydration and oral glucocorticoid", "E. Oral rehydration, sodium supplements and oral glucocorticoid"], "ans": "B", "ansText": "B. Intravenous balanced isotonic crystalloid, glucose and hydrocortisone", "jx": "1.No. The child is having a salt-losing crisis.\n2.Correct. She is having an adrenal crisis. This requires urgent treatment with intravenous balanced isotonic crystalloid, glucose and hydrocortisone. Long-term treatment is with glucocorticoid and mineralocorticoid replacement and oral sodium chloride may be needed during infancy. The dose of glucocorticoid needs to be increased at times of illness.\n3.Always helpful but in this case not sufficient treatment.\n4.This child is seriously ill. There isn't time to lose.\n5.All the correct things are being replaced here but this is an emergency and it requires more rapid correction.", "img": []}, {"id": "a42dd3ab42a95c59", "m": "08", "letter": "H", "inMod": 2, "code": "H2", "q": "A baby is born with a disorder of sexual differentiation. Congenital adrenal hyperplasia is suspected. What blood result would confirm the diagnosis?", "opts": ["A. A low testosterone", "B. A markedly lowered plasma 17α-hydroxyprogesterone", "C. A markedly raised cortisol level", "D. A markedly raised plasma 17α-hydroxyprogesterone", "E. A raised blood glucose"], "ans": "D", "ansText": "D. A markedly raised plasma 17α-hydroxyprogesterone", "jx": "1.In congenital adrenal hyperplasia the testosterone would be raised.\n2.In most cases, the 17α–hydroxyprogesterone is markedly raised. You might see this in the much less common congenital adrenal hypoplasia though.\n3.In congenital adrenal hyperplasia the cortisol level would be low.\n4.Correct. Most children with congenital adrenal hyperplasia have 21-hydroxylase deficiency （see Fig. 26.14 in Illustrated Textbook of Paediatrics, 6th edn）. The diagnosis is made by finding markedly raised levels of the metabolic precursor 17α-hydroxyprogesterone.\n5.It would typically be low.", "img": []}, {"id": "b74a5c94db54cd28", "m": "08", "letter": "H", "inMod": 3, "code": "H3", "q": "A 7-year-old boy was 110 cm in height last year and is now 114 cm tall. His height remains at the 5th percentile. He is otherwise healthy, with normal examination findings. What is your interpretation of his growth pattern?", "opts": ["A. Pathological growth failure", "B. Normal growth velocity", "C. GH deficiency", "D. Constitutional growth delay", "E. Hypothyroidism"], "ans": "B", "ansText": "B. Normal growth velocity", "jx": "Normal pre-pubertal growth:4–6 cm per yearThis child grew 4 cm → normal.Absolute percentile less important than growth velocity.", "img": []}, {"id": "1d957c46511e3c2c", "m": "08", "letter": "H", "inMod": 4, "code": "H4", "q": "A 12 year old boy is the shortest in his class. He is normally well and screening blood results were normal. His bone age corresponds to 10 years. There is a history of late puberty in his father. Which diagnosis best fits his presentation?", "opts": ["A. Familial short stature", "B. Constitutional growth delay", "C. GH deficiency", "D. Malnutrition", "E. Klinefelter syndrome"], "ans": "B", "ansText": "B. Constitutional growth delay", "jx": "Delayed bone age with normal investigations, family history of late maturation, and normal growth trend indicate constitutional (physiologic) delay.Unlike familial short stature, final height usually reaches the genetically expected range after delayed puberty.Klinefelter syndrome results in tall stature.", "img": []}, {"id": "2cc70d84dfe67259", "m": "08", "letter": "H", "inMod": 5, "code": "H5", "q": "A 14 year old boy with a BMI of 31 kg/m² and a strong family history of diabetes presents for lifestyle counseling. He drinks two 500ml cups of full cream milk daily and eats mostly meat and white rice. His parents ask about the best dietary approach. Which is of the following is most consistent with international recommendation?", "opts": ["A. Increase red meat and diary intake to ensure adequate protein intake for growth", "B. Restrict all carbohydrates including fruits and vegetables", "C. Avoid processed meat such as sausages", "D. Start Growth Hormone therapy to increase muscle mass and metabolism", "E. Increase complex carbohydrate, whole grains, fruits and vegetables but reduce red meat and refined carbohydrate and processed foods"], "ans": "E", "ansText": "E. Increase complex carbohydrate, whole grains, fruits and vegetables but reduce red meat and refined carbohydrate and processed foods", "jx": "Plant-based, high-fiber diet:Improves insulin sensitivityReduces cardiovascular riskSustainable long-termPlant based, high fiber, low fat diets with whole grains and legumes in preventing and managing obesity, dyslipidemia, and diabetes. Excessive animal protein, milk, and red meat were linked to Hong Kong’s historic rise in cholesterol and obesity rates.", "img": []}, {"id": "acb80b7f18e4f225", "m": "08", "letter": "H", "inMod": 6, "code": "H6", "q": "A girl, aged 15 years, has had type 1 diabetes mellitus for 7 years. Her insulin regimen has remained unchanged for the last 7 months. Her HbA1C has increased from 58 mmol/mol （7.5%） to 90 mmol/mol （10.3%） （desired level <58 mmol/mol）. The most recent blood glucose levels as recorded in her book are shown in picture below. What is the most likely explanation for these findings?", "opts": ["A. During the summer holidays she took less exercise", "B. She has reduced her insulin dosage to try to lose weight", "C. She is taking more insulin than she needs", "D. She is regularly eating snacks and indulging in high carbohydrate food", "E. Some of the blood glucose measurements are fictitious"], "ans": "E", "ansText": "E. Some of the blood glucose measurements are fictitious", "jx": "1.She would be expected to have had more exercise over the summer holidays. But if she did take less exercise, you would expect the deterioration in her HbA1c to be accompanied by numerous high blood glucose measurements in her diary.\n2.Reducing the insulin dose would result in high blood glucose levels and not the normal values shown in the diary.\n3.More insulin than she needs would result in low blood glucose levels and the HbA1C would not have increased.\n4.Regularly eating snacks and indulging in high carbohydrate food would result in high blood glucose levels and not the normal values shown in the diary.\n5.Correct. Some of the blood glucose measurements are fictitious. Most of the values recorded are normal but her diabetic control has deteriorated and is no longer in the desired range.", "img": ["images/acb80b7f18e4f225_0.jpg"]}, {"id": "45a2a242c71a259f", "m": "08", "letter": "H", "inMod": 7, "code": "H7", "q": "An 11-year-old boy is referred for evaluation of short stature. His height is below the 9th percentile, and parents report he has always been the smallest in class. He is usually fit and well. His father recalls that he started growing taller at age 16 and did not reach full height until early twenties. On assessment, he has no dysmorphic features and pre-pubertal. His bone age is 9 years. What is the most likely diagnosis?", "opts": ["A. Familial short stature", "B. Growth hormone deficiency", "C. Hypothyroidism", "D. Constitutional growth delay", "E. Turner syndrome"], "ans": "D", "ansText": "D. Constitutional growth delay", "jx": "A. Familial short stature – Incorrect.In familial short stature:Bone age = chronological agePuberty occurs at normal timeFinal height consistent with parental heightThis patient has delayed bone age and delayed puberty.B. Growth hormone deficiency – Incorrect.Would show:Reduced growth velocityDelayed bone agePossibly increased weight for heightThis child’s growth velocity is normal.C. Hypothyroidism – Incorrect.Would present with:Reduced growth velocityWeight gainFatigueDelayed bone ageNo systemic features described.D. Constitutional growth delay – Correct.Key features:Short stature with normal growth velocityDelayed bone ageFamily history of late pubertyDelayed pubertal onsetUltimately normal adult heightThis is a normal variant. The delayed bone age indicates remaining growth potential.E. Turner syndrome – Incorrect.Occurs in females (45,XO), not boys.", "img": ["images/45a2a242c71a259f_0.jpg"]}, {"id": "5c1695330ce43bfe", "m": "08", "letter": "H", "inMod": 8, "code": "H8", "q": "A 7-year-old girl presents with progressive breast enlargement and pubic hair development noted over the past year. Her height is on the 90th percentile. Bone age is 10½ years. MRI shows a small hypothalamic hamartoma. What is the most appropriate treatment?", "opts": ["A. Estrogen therapy", "B. Gonadotropin-releasing hormone (GnRH) analogue", "C. High-dose corticosteroids", "D. Surgical removal of hamartoma", "E. Radiotherapy"], "ans": "B", "ansText": "B. Gonadotropin-releasing hormone (GnRH) analogue", "jx": "Central precocious puberty:Early activation of HPG axisNormal pubertal sequenceAdvanced bone ageGnRH analogue suppresses LH/FSH, preventing premature epiphyseal closure.This child has central (true) precocious puberty, characterized by normal pubertal sequence and advanced bone age due to early activation of the hypothalamic-pituitary-gonadal axis.Treatment with a GnRH analogue suppresses LH/FSH release to halt pubertal progression and premature epiphyseal closure. Surgery is unnecessary for benign hamartomas unless mass effect exists.", "img": []}, {"id": "85c83431aa2ffe89", "m": "08", "letter": "H", "inMod": 9, "code": "H9", "q": "A 12-year-old boy with type 1 diabetes mellitus, is reviewed in the outpatient clinic. In spite of maintaining good control of his diabetes, his height has remained static for 9 months. He says his appetite is alright, but he has lost interest in football, which is his passion, as he says he can't keep up with the other boys any more. He just stays at home and watches TV, but wants to be out playing football and getting back his energy. A full blood count and C-reactive protein are normal and his HbA1C is satisfactory. What is the most likely diagnosis?", "opts": ["A. Anorexia nervosa", "B. Depression", "C. Growth hormone deficiency", "D. Hypothyroidism", "E. Inflammatory bowel disease"], "ans": "D", "ansText": "D. Hypothyroidism", "jx": "1.Eating disorders can co-exist with diabetes mellitus but he does not have the clinical features of anorexia nervosa.\n2.Depression is also important to consider, but in this case it is not the most likely cause as he is continuing to maintain good control of his diabetes and is not expressing negative feelings.\n3.Not an autoimmune problem. Would not explain his lethargy.\n4.Correct. Children with type 1 diabetes mellitus are at increased risk of thyroid disease and should be screened annually. His static height and his lethargy would support this diagnosis. He is also at increased risk of coeliac disease and this should also be considered but is less likely as his appetite is good and his weight is satisfactory.\n5.Blood and mucus in the stool would be expected with ulcerative colitis and anorexia and malaise and abnormal full blood count and C-reactive protein would be expected with Crohn disease.", "img": []}, {"id": "a73704aab4eb8793", "m": "08", "letter": "H", "inMod": 10, "code": "H10", "q": "A girl aged 8 years is rapidly putting on weight. She was born at 28 weeks’ gestation and had required ventilatory support for a week and oxygen for 3 months. She is currently on treatment for asthma and inflammatory bowel disease. A photograph of her is shown in below. She has truncal obesity and striae on her abdomen. What is the most likely cause for this?", "opts": ["A. Corticosteroid cream for severe eczema", "B. Daily oral prednisolone therapy for the last 6 months", "C. Ectopic ACTH （adrenocorticotropic hormone）-producing tumour", "D. High-dose corticosteroid therapy for lung disease when she was a premature baby", "E. Long-term use of inhaled corticosteroids"], "ans": "B", "ansText": "B. Daily oral prednisolone therapy for the last 6 months", "jx": "1.Topical steroids do not cause this because the doses absorbed systemically are low.\n2.Correct. Children requiring high dose oral corticosteroid therapy, e.g. for Crohn disease or nephrotic syndrome, may develop the features of Cushing syndrome. Minimized by decreasing the dose as soon as possible.\n3.Extremely rare in children. However, must be considered if there is no history of steroid use.\n4.A short course of steroids in the premature period, even if high-dose, would not cause features of Cushing syndrome at this age.\n5.She has Cushing syndrome. Inhaled steroids are unlikely to cause this because the doses absorbed systemically are low.", "img": ["images/a73704aab4eb8793_0.jpg"]}, {"id": "22532e88f03df14f", "m": "08", "letter": "H", "inMod": 11, "code": "H11", "q": "In a baby born with congenital hypothyroidism in a high income country. What is the most likely underlying cause?", "opts": ["A. Autoimmune destruction of the thyroid", "B. Complete or partial athyrosis", "C. Dyshormonogenesis", "D. Iodine deficiency", "E. TSH deficiency"], "ans": "B", "ansText": "B. Complete or partial athyrosis", "jx": "1.This is the most common cause of acquired hypothyroidism.\n2.Correct. Most children with congenital hypothyroidism have a combination of maldescent and partial or complete agenesis of the thyroid gland. If untreated, they develop clinical features of hypothyroidism, which include faltering growth, prolonged jaundice and constipation. Identified by elevated thyroid-stimulating hormone （TSH） on newborn blood spot screening.\n3.This does cause congenital hypothyroidism but only accounts for 5%–10% of cases. It is often inherited in an autosomal recessive manner.\n4.This is the most common cause of hypothyroidism worldwide but not in high income country as food is usually supplemented with iodine.\n5.This is a possible cause but rare, affecting <1% of cases. TSH deficiency from central hypothyroidism will not be detectable on newborn blood spot screening though as this relies on detection of an elevated thyroid-stimulating hormone （TSH）.", "img": []}, {"id": "acaa8b19e8fdecee", "m": "08", "letter": "H", "inMod": 12, "code": "H12", "q": "A 12-year-old girl presents with nervousness, tremor, palpitations, and weight loss despite increased appetite. Examination reveals a diffusely enlarged, smooth thyroid gland, warm skin, and mild exophthalmos. What is the most likely diagnosis?", "opts": ["A. Hashimoto thyroiditis", "B. Graves disease", "C. Subacute thyroiditis", "D. Iodine deficiency goiter", "E. Thyroid hormone resistance"], "ans": "B", "ansText": "B. Graves disease", "jx": "Autoimmune TSH receptor stimulation → hyperthyroidism + ophthalmopathy.This patient has autoimmune hyperthyroidism (Graves disease) due to thyroid-stimulating antibodies activating TSH receptors. Clinical features include goiter, tremor, heat intolerance, and exophthalmos. Hashimoto thyroiditis causes hypothyroidism; subacute thyroiditis has a tender thyroid and transient thyrotoxicosis.", "img": []}, {"id": "3fb19103f426d50b", "m": "08", "letter": "H", "inMod": 13, "code": "H13", "q": "A boy aged 11 years, has type 1 diabetes mellitus. While playing football during the mid-morning break at a holiday camp, he suddenly feels faint. His classmates call the supervisor, who finds him lying unresponsive in the playground. What should be his immediate management?", "opts": ["A. Call an ambulance", "B. Check blood glucose", "C. Give a glucose drink", "D. Give buccal glucose gel", "E. Give insulin"], "ans": "D", "ansText": "D. Give buccal glucose gel", "jx": "1.This will be required if he does not respond to initial treatment. The holiday camp should be prepared for treatment of hypoglycaemia in a known diabetic.\n2.He has the clinical features of hypoglycaemia and immediate treatment is indicated.\n3.This is appropriate if he can take fluids, but he is unresponsive.\n4.Correct. He is hypoglycaemic, brought on by exercise. Glucose is absorbed quickly from buccal glucose gel, and he should rapidly wake up. He will need to have a carbohydrate-containing drink and snack to maintain his blood glucose.\n5.His blood glucose needs to be raised rather than lowered.", "img": []}, {"id": "7e326e6c608bf405", "m": "08", "letter": "H", "inMod": 14, "code": "H14", "q": "A 6-year-old girl develops pubic hair and mild body odor but no breast development. Her growth rate is normal, bone age corresponds to her chronological age, and hormonal evaluation shows normal gonadotropin levels. What is the most likely diagnosis?", "opts": ["A. Central precocious puberty", "B. Peripheral precocious puberty", "C. Premature adrenarche", "D. Premature thelarche", "E. Congenital adrenal hyperplasia"], "ans": "C", "ansText": "C. Premature adrenarche", "jx": "Adrenal androgen production only → pubic hair/body odor without breast development.Premature adrenarche is due to early adrenal androgen production, causing sexual hair or body odor without other pubertal signs or accelerated growth. Unlike central puberty, breast development is absent, and bone age is not advanced. It is usually benign.", "img": []}, {"id": "b3a5c4d27602e310", "m": "08", "letter": "H", "inMod": 15, "code": "H15", "q": "A 14-year-old boy with a BMI above the 98th percentile presents for routine check-up. His examination reveals acanthosis nigricans. Liver enzymes (ALT) are elevated. Which of the following complications is most consistent with his presentation?", "opts": ["A. Type 1 diabetes", "B. Non-alcoholic fatty liver disease (NAFLD)", "C. Iron deficiency", "D. Hyperthyroidism", "E. Rickets"], "ans": "B", "ansText": "B. Non-alcoholic fatty liver disease (NAFLD)", "jx": "In childhood obesity, NAFLD is a common and early metabolic complication associated with insulin resistance and elevated ALT. Acanthosis nigricans is also a clinical sign of insulin resistance. Type 1 diabetes and hyperthyroidism are not associated with obesity.", "img": []}, {"id": "4108c9472258ea7b", "m": "08", "letter": "H", "inMod": 16, "code": "H16", "q": "A 3-year-old boy is referred to the paediatric clinic because of concern about the development of pubic and axillary hair. His testes are 1.5 ml in size. His blood pressure is 100/75 mmHg. Gonadotrophin levels are undetectable and his bone age is 5 years. What is the most likely cause of his early pubertal development?", "opts": ["A. Adrenal tumour", "B. Brain tumour", "C. Idiopathic precocious puberty", "D. Prader–Willi syndrome", "E. Testicular tumour"], "ans": "A", "ansText": "A. Adrenal tumour", "jx": "1. Correct. Premature sexual development in boys is uncommon and usually has an organic （rather than constitutional or familial） cause. With his prepubertal testes （<4 ml in size）, hypertension and normal gonadotrophin levels （undetectable before the onset of puberty）, the abnormality is most likely to be in his adrenal glands.\n2. The boy has prepubertal testes; therefore he does not have true precocious puberty and the cause is not likely to be central.\n3. He has prepubertal testes so does not have precocious puberty.\n4. Boys with Prader–Willi syndrome have delayed puberty.\n5. He has symmetrical prepubertal testes; therefore, he does not have precocious puberty and the cause is not likely to be coming from his testes.", "img": []}, {"id": "eede493517d7f46a", "m": "08", "letter": "H", "inMod": 17, "code": "H17", "q": "A 9-month-old female infant is seen by her family doctor because of concern that she is not growing fast enough. She is on the 5th centile for height and 2nd centile for weight. What is the greatest influence on her growth rate at her age?", "opts": ["A. Genes", "B. Growth hormone", "C. Nutrition", "D. Oestrogen", "E. Testosterone"], "ans": "C", "ansText": "C. Nutrition", "jx": "1. Genes are important but without adequate nutrition a child’s growth potential will not be achieved.\n2. Growth hormone is particularly important in determining growth after infancy and continues to exert an effect until growth ceases.\n3. Correct. Along with good health, happiness and thyroid hormones, infant growth (from birth to 12 months of age) is most dependent on good nutrition. Growth in the first year of life contributes about 15% to final adult height.\n4. The sex hormones cause the back to lengthen and boost growth hormone secretion. This occurs during the pubertal growth spurt.\n5. The sex hormones cause the back to lengthen and boost growth hormone secretion. This occurs during the pubertal growth spurt.", "img": []}, {"id": "da44ce71add65a7e", "m": "08", "letter": "H", "inMod": 18, "code": "H18", "q": "A 9-year-old girl presents with short stature; her height is at the 2nd percentile. Her parents’ heights are 158 cm (mother) and 170 cm (father). Examination is unremarkable, with normal growth velocity and bone age consistent with chronological age. Which feature best supports the diagnosis of familial short stature?", "opts": ["A. Delayed puberty", "B. Normal bone age with positive family history", "C. Slowed growth velocity", "D. Dysmorphic features", "E. Bone age delay"], "ans": "B", "ansText": "B. Normal bone age with positive family history", "jx": "A. Delayed puberty – Incorrect.Suggests constitutional delay.B. Correct.Familial short stature is characterized by:Height tracking along low percentileNormal growth velocityBone age consistent with chronological ageParental heights shortIn familial short stature, bone age equals chronological age, growth velocity is normal, and parental heights define the “target height range.” Families often have a consistent pattern of shorter stature across generations.C. Slowed growth velocity – Incorrect.Suggests pathology.D. Dysmorphism – Incorrect.Raises suspicion of syndromic cause.E. Bone age delay – Incorrect.Seen in constitutional delay or endocrine disorders.", "img": ["images/da44ce71add65a7e_0.jpg"]}, {"id": "5c29ea7d4ec247c3", "m": "08", "letter": "H", "inMod": 19, "code": "H19", "q": "A 5-year-old boy is evaluated for short stature. His upper-to-lower body segment ratio (U/L) is 1.7 at birth and 1.3 at age 3. Currently, it is 1.8. He has short limbs compared to his trunk, a large head, and frontal bossing. What is the most likely diagnosis?", "opts": ["A. Rickets", "B. Growth hormone deficiency", "C. Skeletal dysplasia (achondroplasia)", "D. Constitutional growth delay", "E. Chronic systemic illness"], "ans": "C", "ansText": "C. Skeletal dysplasia (achondroplasia)", "jx": "C. Correct.Disproportionate short stature:Limb shortening > trunkIncreased U/L ratioMacrocephalyFrontal bossingAchondroplasia is caused by FGFR3 mutation.Other options cause proportionate short stature.", "img": []}, {"id": "3c78b71b16e14cce", "m": "08", "letter": "H", "inMod": 20, "code": "H20", "q": "A 7-year-old girl is newly diagnosed with diabetes mellitus. She has been drinking lots of fluid and has had to pass urine frequently. She has a markedly raised blood glucose （20 mmol/L） and heavy glycosuria. Which of the following is most likely to be true about her diabetes?", "opts": ["A. Her diagnosis should be confirmed with an oral glucose tolerance test", "B. She can be managed with oral hypoglycaemic agents and dietary modification", "C. She will have gained weight in the last few weeks", "D. The incidence in the UK is falling", "E. There is autoimmune pancreatic β-cell damage"], "ans": "E", "ansText": "E. There is autoimmune pancreatic β-cell damage", "jx": "1.An oral glucose tolerance test is not required as her clinical presentation and investigations have established the diagnosis. The test is seldom required to diagnose diabetes in children, though it may be used to screen for cystic fibrosis–related diabetes mellitus.\n2.She requires insulin.\n3.Weight loss is a feature at presentation.\n4.She has type 1 diabetes mellitus. In the UK its incidence is increasing and now affects 2 per 1000 children under 16 years of age.\n5.Correct. Almost all （>95%） children in the UK have type 1 diabetes mellitus which occurs as a result of autoimmune destruction of pancreatic β-cells by T cells.", "img": []}, {"id": "e4b294d520c501ea", "m": "08", "letter": "H", "inMod": 21, "code": "H21", "q": "A boy aged 15 years, has had 3 months of diarrhoea, weight loss and palpitations. You suspect hyperthyroidism. Which is the most likely combination of thyroid function test results?", "opts": ["A. High TSH and high T4 levels", "B. High TSH and low T4 levels", "C. Low TSH and high T4 levels", "D. Low TSH and low T4 levels", "E. Normal TSH and high T4 levels"], "ans": "C", "ansText": "C. Low TSH and high T4 levels", "jx": "1.Central causes for hyperthyroidism are rare.\n2.Suggests that thyroid gland is not working. Would result in hypothyroidism.\n3.Correct. Hyperthyroidism usually results from autoimmune thyroiditis （Graves disease） secondary to the production of thyroid-stimulating immunoglobulins （TSIs）. The levels of thyroxine （T4） and/or tri-iodothyronine （T3） are elevated and TSH levels are suppressed to very low levels.\n4.Central hypothyroidism.\n5.Very early change. Would soon be followed by a fall in TSH.", "img": []}, {"id": "8cca8ee8bf056309", "m": "08", "letter": "H", "inMod": 22, "code": "H22", "q": "An 8-year-old girl is < 0.4 th percentile for height. She has webbed neck and shield chest. Growth velocity is reduced. What is the most appropriate initial investigation?", "opts": ["A. GH stimulation test", "B. Bone age X-ray", "C. Karyotype analysis", "D. Thyroid function test", "E. Serum calcium, phosphate and parathyroid hormone"], "ans": "C", "ansText": "C. Karyotype analysis", "jx": "C. Correct.Turner syndrome suspected due to:Short statureWebbed neckCharacteristic dysmorphismKaryotype confirms diagnosis (45,XO).Other tests may be supportive but karyotype is diagnostic.", "img": ["images/8cca8ee8bf056309_0.jpg"]}, {"id": "5cf697e6cc7b6de2", "m": "08", "letter": "H", "inMod": 23, "code": "H23", "q": "Parents ask about global obesity trends.A 10-year-old boy is overweight. His parents are concerned because he rarely exercises and eats fast food and snacks frequently. They ask whether childhood obesity is a growing problem globally. Which of the following statements about global childhood obesity trends is most accurate ?", "opts": ["A. Childhood obesity rates have been declining globally since 2000", "B. Childhood obesity prevalence has remained stable since 2010", "C. Childhood obesity continues to rise globally , especially in high-income countries", "D. Childhood obesity is only a problem in developing countries", "E. Childhood obesity is no longer associated to socioeconomic status"], "ans": "C", "ansText": "C. Childhood obesity continues to rise globally , especially in high-income countries", "jx": "Recent data show that childhood obesity has not plateaued —it continues an upward trajectory worldwide, with the highest prevalence (about 9–10%) in high-income countries and regions . Rising trends parallel changes in urban living, sedentary lifestyle, and dietary habits.", "img": []}, {"id": "782c8f8e74e2b7b4", "m": "08", "letter": "H", "inMod": 24, "code": "H24", "q": "A 2 month old infant’s weight has moved from the 50th to the 90th percentile, now doubling his birth weight by 2 months. He is fully breast fed and appears well. What is the long term health implication of such rapid weight gain in early infancy?", "opts": ["A. Incr
