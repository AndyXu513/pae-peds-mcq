evelop significant disability. The use of methotrexate has significantly improved the outlook for this subset of patients.\n4.Correct The figure shows swelling of the wrists, metacarpal and interphalangeal joints, and early swan-neck deformities of the fingers. More than five joints are affected, and there is symmetric involvement of the small bones of the hands. These findings are consistent with rheumatoid arthritis, specifically the polyarticular variant. Subcutaneous nodules are firm nontender nodules beneath the skin and are the most common cutaneous finding in rheumatoid arthritis.\n5.Polyarticular juvenile arthritis is the most likely diagnosis that can present with a reactive thrombocytosis. Thrombocytopenia is rare in juvenile rheumatoid arthritis and would suggest an alternative diagnosis such as systemic lupus erythematosus.", "img": ["images/2604a005c0eae1d9_0.jpg"]}, {"id": "32c677343954b201", "m": "11", "letter": "K", "inMod": 8, "code": "K8", "q": "A 12-year-old girl presents with fatigue, low-grade fever, and a rash over her cheeks that spares the nasolabial folds. She has proteinuria and anemia on lab evaluation. ANA and anti-dsDNA antibodies are positive, and complement levels (C3, C4) are low. What is the most likely diagnosis?", "opts": ["A. Systemic lupus erythematosus (SLE)", "B. Dermatomyositis", "C. Henoch-Schönlein purpura", "D. Rheumatic fever", "E. Juvenile idiopathic arthritis"], "ans": "A", "ansText": "A. Systemic lupus erythematosus (SLE)", "jx": "This classic presentation — malar rash, renal involvement, autoantibodies, and low complement levels — is typical of SLE. Recognizing these characteristic systemic findings is key for early diagnosis and management.", "img": ["images/32c677343954b201_0.jpg"]}, {"id": "806fdf38c0c1666f", "m": "11", "letter": "K", "inMod": 9, "code": "K9", "q": "A 5-year-old boy has daily high, unremitting fevers for two weeks accompanied by a pink evanescent rash that appears with each fever spike. Examination reveals swollen joints, hepatosplenomegaly, and a small pericardial effusion on echocardiogram. What is the most likely subtype of JIA in this child?", "opts": ["A. Polyarticular", "B. Psoriatic", "C. Enthesitis-related", "D. Systemic-onset JIA", "E. Chronic recurrent multifocal osteomyelitis (CRMO)"], "ans": "D", "ansText": "D. Systemic-onset JIA", "jx": "Characterised by systemic inflammatory features.", "img": []}, {"id": "363ff5b115bac472", "m": "11", "letter": "K", "inMod": 10, "code": "K10", "q": "A 9-year-old girl is diagnosed with polyarticular JIA. Initially started on NSAIDs, she continues to have significant joint inflammation. The rheumatologist plans to start additional therapy with a disease-modifying drug. Which of the following is a conventional disease-modifying antirheumatic drug ( cDMARD ) appropriate for use in this patient?", "opts": ["A. Methotrexate", "B. Etanercept", "C. Tocilizumab", "D. Prednisolone", "E. Tofacitinib"], "ans": "A", "ansText": "A. Methotrexate", "jx": "Traditionally, Methotrexate is a first-line cDMARD for JIA when NSAIDs are insufficient.1. Etanercept and Tocilizumab are biologic DMARDs ( bDMARDs ),2. Tofacitinib is a targeted synthetic DMARD ( tDMARD ),3. Prednisolone is a corticosteroid used for acute control, not long-term disease modification.", "img": []}, {"id": "877386ee1c22d485", "m": "11", "letter": "K", "inMod": 11, "code": "K11", "q": "A 3-year-old girl presents with an acute onset limp which was not present on the previous day. Her mother reports that she was unwell 2 weeks ago with a coryzal illness. The pain is in her right leg and is present only on walking. On examination she has a temperature of 37°C. The hip and leg look normal but on passive movement of her right hip, there is decreased external rotation. What is the most likely diagnosis from the list below?", "opts": ["A. Bone tumour", "B. Perthes disease", "C. Transient synovitis", "D. Septic arthritis", "E. Slipped capital femoral epiphysis"], "ans": "C", "ansText": "C. Transient synovitis", "jx": "1.A bone tumour is rare at this age and usually presents insidiously.\n2.Perthes disease usually occurs in children between 5 and 10 years of age.\n3.Correct . This is the most common cause of acute hip pain in children. It occurs in children aged 2–12 years of age. It often follows or is accompanied by a viral infection. Presentation is with sudden onset of pain in the hip or a limp. There is no pain at rest, but there is decreased range of movement, particularly external rotation.\n4.Septic arthritis of the hip joint can be difficult to differentiate from reactive arthritis (transient synovitis) but is far less common. Children with septic arthritis are usually systemically unwell and have a fever. There may be erythema and swelling around the joint, but this may not be evident at the hip. There is severe pain on any movement of the leg, and refusal to weight bear. If necessary, a normal ultrasound scan and C-reactive protein evaluation will help exclude it.\n5.Slipped capital femoral epiphysis usually occurs in children between 5 and 10 years of age.", "img": []}, {"id": "d42239f3d5f149f2", "m": "11", "letter": "K", "inMod": 12, "code": "K12", "q": "A 14-year-old boy presents to the emergency department. He is a good footballer, and after training today he complained of pain in his left knee. He has had the pain for a while and it gets worse when he exercises. On examination there is swelling over the left tibial tuberosity. He is afebrile. There is no night pain or pain on waking. What is the most likely diagnosis?", "opts": ["A. Osteomyelitis", "B. Osgood–Schlatter disease", "C. Perthes disease", "D. Septic arthritis", "E. Slipped capital femoral epiphysis"], "ans": "B", "ansText": "B. Osgood–Schlatter disease", "jx": "1.Would be a very unusual cause, particularly without fever.\n2.Correct . This is osteochondritis of the patellar tendon insertion at the knee, often affecting adolescent males who are physically active (particularly football or basketball). It usually presents with knee pain after exercise, localized tenderness and sometimes swelling over the tibial tuberosity. There is often hamstring tightness. It is bilateral in 25%–50% of cases.\n3.Whilst pain might be referred to the knees from the hips, it is unlikely in this boy.\n4.Fever absent – and he can still weight bear.\n5.Affects the hip. There would not be swelling over the tibial tuberosity.", "img": []}, {"id": "db5565df445ded29", "m": "11", "letter": "K", "inMod": 13, "code": "K13", "q": "A boy, aged 3 years, woke up complaining of pain in his right leg. Yesterday he refused to play in the garden with his older brother, preferring to watch television. Since then he has become more unwell and his mother reports he is lethargic. On examination he has a temperature of 39°C, a heart rate of 180 beats/min, and a respiratory rate of 25 breaths/min. His right knee is red and swollen and he cries if it is extended or flexed. On further examination you note a small healing insect bite on his right ankle. He has no other medical problems and is not currently on any medication. What is the most likely diagnosis?", "opts": ["A. Henoch– Schönlein purpura arthritis", "B. Juvenile idiopathic arthritis", "C. Osteomyelitis", "D. Septic arthritis", "E. Trauma"], "ans": "D", "ansText": "D. Septic arthritis", "jx": "1.The arthritis of Henoch– Schönlein purpura would usually be accompanied by a rash and a high fever would not be present.\n2.Does not usually present so acutely with a single red swollen joint.\n3.The main differential diagnosis.\n4.Correct . Septic arthritis. Needs to be differentiated from osteomyelitis. The boy’s knee joint itself is red and swollen, with pain on movement, making septic arthritis more likely. An ultrasound and aspiration of the joint should be performed to confirm this.\n5.There is no history of trauma.", "img": []}, {"id": "a8146d13d73beebe", "m": "12", "letter": "L", "inMod": 1, "code": "L1", "q": "A 13-year-old boy was caught drinking beer during a class gathering. His friends say it helps him “fit in.” You discuss the risks of underage drinking with his parents. What is the main reason underage drinking is particularly dangerous in adolescents?", "opts": ["A. Adolescents are able to metabolize alcohol faster", "B. Adolescent brain is more resistant to effect of alcohol", "C. Alcohol is a neurotoxin to the developing brain", "D. Alcohol can precipitate fatty liver in adolescent even when consumed in small amounts", "E. Alcohol helps to relieve stress but adolescents can develop addiction more easily compared to adult"], "ans": "C", "ansText": "C. Alcohol is a neurotoxin to the developing brain", "jx": "Alcohol has profound effects on the developing adolescent brain, impairing memory, learning, and emotional regulation. Early drinking is associated with a sixfold risk of addiction and increased rates of violence, absenteeism, and cognitive deficits. Prevention and education are key.", "img": []}, {"id": "59aa645d6ee02853", "m": "12", "letter": "L", "inMod": 2, "code": "L2", "q": "A 2-year-old boy is brought to the clinic for a developmental assessment after his parents noticed he is not yet walking independently. He has been meeting other milestones, such as sitting and crawling, but has difficulty with balance and coordination. What is the most appropriate initial step in the management of this child?", "opts": ["A. Physiotherapy referral", "B. Schedule a follow-up in 6 months", "C. Brain MRI immediately", "D. Genetic testing", "E. Check a Creatine Kinase level"], "ans": "A", "ansText": "A. Physiotherapy referral", "jx": "Gross motor delay isolated → early intervention appropriate.", "img": []}, {"id": "13891d50f77672f2", "m": "12", "letter": "L", "inMod": 3, "code": "L3", "q": "A 10-year-old boy is seen in the special school clinic with his mother, who is just recovering from cataract surgery. He has moderate learning difficulties and is teased because of his marked facial weakness. He is unable to walk long distances. His mother says that he struggles to release things once he grabs them. He has no other medical problems. He has not had any investigations performed. Select the most useful diagnostic test from the list.", "opts": ["A. DNA testing for trinucleotide repeat expansion", "B. Electromyography (EMG)", "C. Muscle biopsy", "D. Nerve conduction studies", "E. Serum creatine kinase"], "ans": "A", "ansText": "A. DNA testing for trinucleotide repeat expansion", "jx": "1. Correct. The most useful diagnostic test here would be DNA testing for trinucleotide repeat expansion of myotonic dystrophy. The clinical history suggests myotonic dystrophy because of his learning difficulties, myotonia, facial weakness and limb weakness. It was dominantly inherited from his mother, who has cataracts as a result.\n2. You can test for the myotonia clinically rather than using electromyography, so DNA testing is the test most likely to give you the diagnosis.\n3. Muscle biopsies are performed when one needs to differentiate between muscle and neuronal pathology, and for mitochondrial cytopathies.\n4. Difficult, costly and painful in comparison to blood tests.\n5. Serum creatine kinase is helpful in diagnosing muscular dystrophies, such as Duchenne.", "img": []}, {"id": "c815f84383c7aeb6", "m": "12", "letter": "L", "inMod": 4, "code": "L4", "q": "A 17-year-old girl presents with poor sleep and recent conflict with her parents. You decide to perform a psychosocial assessment using the HEADSSS framework. Which of the following is NOT part of the HEADSSS assessment?", "opts": ["A. Home and family", "B. Education", "C. Activities and Peer relationships", "D. Diet and nutritional details", "E. Sexuality and Mental health issues"], "ans": "D", "ansText": "D. Diet and nutritional details", "jx": "HEADSSS: The HEADSSS framework covers Home, Education/Employment, Activities, Drugs/Smoking/Alcohol, Sexuality, Safety, and Suicide/Depression/Stress. Although diet is important, it is not a core element of the HEADSSS structure; nutrition is usually assessed in general health history.", "img": []}, {"id": "28e02d44c894ffc1", "m": "12", "letter": "L", "inMod": 5, "code": "L5", "q": "A 5-year-old girl is evaluated for persistent speech delay. Her parents report that she has good comprehension but rarely speaks and struggles with social interactions. Which condition should be considered in the differential diagnosis?", "opts": ["A. Autism Spectrum Disorder", "B. Attention Deficit Hyperactivity Disorder", "C. Cerebral palsy", "D. Hearing impairment", "E. Down syndrome"], "ans": "A", "ansText": "A. Autism Spectrum Disorder", "jx": "Core deficit: social communication impairment + restricted behaviors.", "img": []}, {"id": "b1c7953fbb21a806", "m": "12", "letter": "L", "inMod": 6, "code": "L6", "q": "A 2-year-old boy cannot sit independently, says no words, and has limited social interaction. Examination shows generalized hypotonia. Delays are present in motor, language, and social domains. Which diagnosis best describes this presentation?", "opts": ["A. Isolated speech delay", "B. Isolated motor delay", "C. Global developmental delay", "D. Autism spectrum disorder", "E. ADHD"], "ans": "C", "ansText": "C. Global developmental delay", "jx": "A. Isolated speech delay – Incorrect. Motor delay also present.B. Isolated motor delay – Incorrect. Language and social delays also present.C. Global developmental delay – Correct. Global developmental delay (GDD) is defined as significant delay in two or more developmental domains, including: Gross motor Fine motor Speech/language Cognitive SocialThis child has delay across multiple domains → consistent with GDD.D. Autism spectrum disorder – Incorrect. ASD primarily affects social communication and behaviour ; motor delay is not typically global and severe.E. ADHD – Incorrect. Diagnosed in older children; does not present with motor delay.", "img": []}, {"id": "ee10ded630dfb236", "m": "12", "letter": "L", "inMod": 7, "code": "L7", "q": "A 14-year-old boy is increasingly withdrawn, skips school, and complains of persistent sadness. His mother dismisses it as “just teenage moodiness.” However, you recall that 50% of all mental health problems begin by this age. Which of the following is the leading cause of disease burden among adolescents globally?", "opts": ["A. Substance abuse", "B. Depression", "C. Epilepsy", "D. Eating disorders", "E. School and Peer pressure"], "ans": "B", "ansText": "B. Depression", "jx": "According to WHO, depression is the leading contributor to adolescent disease burden, with 50% of all mental health conditions starting before age 14. Many cases remain undiagnosed or untreated due to stigma and limited access to mental health services.", "img": []}, {"id": "f7a924ac674ec654", "m": "12", "letter": "L", "inMod": 8, "code": "L8", "q": "A 3-year-old boy from a low-income household presents with stunted growth, poor attention, and delayed speech development. Examination shows no focal neurological deficit. Which of the following is the most appropriate next step in managing this child’s developmental delay?", "opts": ["A. Immediate autism diagnosis", "B. Start stimulant medication", "C. Assess nutritional and psychosocial environment", "D. Brain MRI to exclude brain abnormality", "E. Refer to speech therapist for immediate intervention"], "ans": "C", "ansText": "C. Assess nutritional and psychosocial environment", "jx": "Development can be impaired by both biological and environmental factors. Chronic malnutrition or poor psychosocial stimulation can mimic or worsen developmental delays. Assessment should always include nutritional status, family environment, and social background before labeling a child with a neurodevelopmental disorder.", "img": []}, {"id": "304e30548e7f3b17", "m": "12", "letter": "L", "inMod": 9, "code": "L9", "q": "An 8-year-old boy has difficulty staying seated in class, interrupts his teachers, and often loses his books. These symptoms have persisted for over six months both at school and at home.According to DSM-5, which criterion is essential for diagnosing Attention Deficit Hyperactivity Disorder (ADHD)?", "opts": ["A. Symptoms occur only during stressful situations", "B. Symptoms persist ≥6 months in ≥2 settings", "C. Symptoms start after age 12", "D. Aggressive behaviour towards other children", "E. Single teacher or parent report of inattentiveness"], "ans": "B", "ansText": "B. Symptoms persist ≥6 months in ≥2 settings", "jx": "ADHD diagnosis requires: ≥6 symptoms, ≥6 months duration, Present in ≥2 settings, Onset before age 12; Ensures symptoms are persistent and impairing.", "img": []}, {"id": "fda56058836e84b3", "m": "12", "letter": "L", "inMod": 10, "code": "L10", "q": "During a well-baby visit, a 15-month-old girl happily waves “bye-bye,” stacks two cubes, and walks independently. The physician notices that she avoids eye contact and does not respond to her name. Which developmental domain requires urgent assessment?", "opts": ["A. Gross motor", "B. Hearing and speech", "C. Fine motor", "D. Vision", "E. Social-emotional development"], "ans": "E", "ansText": "E. Social-emotional development", "jx": "A & C. Motor domains – Incorrect. Motor milestones are appropriate.B. Hearing – Partially relevant but not primary issue. Hearing assessment is important, but lack of eye contact suggests social deficit beyond hearing alone.D. Vision – Incorrect. No visual impairment signs described.E. Social-emotional development – Correct.Failure to: Make eye contact Respond to nameRaises red flags for autism spectrum disorder (ASD).Social communication deficits are early hallmark signs.", "img": []}, {"id": "d8b420cac8f60d08", "m": "12", "letter": "L", "inMod": 11, "code": "L11", "q": "An 8-year-old healthy child with no risk factors is referred for routine TST before school entry. What is the best approach?", "opts": ["A. Universal TST screening once before school entry", "B. Interferon-gamma release assay (IGRA) for all children", "C. Perform TST only in children with risk factors or exposure", "D. TST plus routine chest X-ray for all school entrants", "E. No child is susceptible, therefore no testing required"], "ans": "C", "ansText": "C. Perform TST only in children with risk factors or exposure", "jx": "TB screening is targeted, not universal.Indications include: Household exposure Immunocompromise Travel to endemic regionsUniversal testing increases false positives and unnecessary treatment.Routine universal testing is no longer recommended. Current guidelines advocate targeted testing , using a risk assessment tool to identify children likely to have been exposed. This avoids false positives, unnecessary interventions, and anxiety.", "img": []}, {"id": "50b4a37d75e8f65b", "m": "12", "letter": "L", "inMod": 12, "code": "L12", "q": "A 15-year-old boy presents with academic decline, irritability, and increased time spent gaming online. His parents are divorced, and he often stays up late. Physical examination shows normal pubertal development. Which of the following best explains this adolescent’s overall health condition?", "opts": ["A. Biological changes alone determine adolescent behavior.", "B. Recent parental separation accounts for these symptoms", "C. Biopsychosocial model which considers physical, psychological, and social factors together", "D. Academic and peer pressure accounts for these symptoms", "E. Hormones and academic pressure contributing to defiant behaviour"], "ans": "C", "ansText": "C. Biopsychosocial model which considers physical, psychological, and social factors together", "jx": "Adolescent health must be viewed holistically. The biopsychosocial model integrates biological (puberty, brain maturation), psychological (emotions, cognitive changes), and social (family, peers, school) influences. Addressing only one component is insufficient for understanding adolescent problems.", "img": []}, {"id": "550b470e823ebe62", "m": "12", "letter": "L", "inMod": 13, "code": "L13", "q": "During a school health talk, a group of students admits experimenting with vaping, alcohol, and online gambling. One student says, “Vaping is safer than smoking.”Which of the following statements about vaping (e-cigarettes) is CORRECT?", "opts": ["A. Vaping is harmless and safe for adolescents", "B. Vaping is less addictive compared to cigarettes", "C. WHO considers vaping harmful to children and adolescents", "D. Smoking cessation method should be recommended for adolescents who vape", "E. E-cigarettes contain no hazardous chemicals"], "ans": "C", "ansText": "C. WHO considers vaping harmful to children and adolescents", "jx": "The WHO emphasizes that vaping and e-cigarettes are harmful and not safe, especially for adolescents. These products contain nicotine and other toxins, leading to lung injury and dependency. Hong Kong has banned e-cigarettes and related products since 2022.", "img": []}, {"id": "8c28e9306def9bb0", "m": "12", "letter": "L", "inMod": 14, "code": "L14", "q": "A 4-year-old boy lines up toys for hours and becomes distressed when his daily schedule is changed. He rarely plays with other children and uses repetitive speech. Which feature is required for ASD diagnosis (DSM-5)?", "opts": ["A. Gross motor delay", "B. Restricted repetitive behaviours", "C. Aggression", "D. Intellectual disability", "E. Selective mutism"], "ans": "B", "ansText": "B. Restricted repetitive behaviours", "jx": "DSM-5 requires:1. Persistent deficits in social communication\n2. Restricted, repetitive behaviours or interestsBoth are required for diagnosis.Other options: Motor delay not mandatory Aggression not diagnostic criterion Intellectual disability may co-exist but not required Selective mutism is separate anxiety disorder", "img": []}, {"id": "ae8a09a9c79439d1", "m": "12", "letter": "L", "inMod": 15, "code": "L15", "q": "An 18-month-old boy is brought to the emergency department as he has stopped walking and his mother is worried his left leg is painful. On examination he will not weight bear, and cries when his left leg is moved passively. He is afebrile and the rest of his examination is normal, except that you think his sclera has a slight blue tinge. An X-ray is performed, which shows a fracture of his femur, but there is also a comment that the bones look osteoporotic. On further questioning from his mother, she cannot give any history of trauma or any incident that could have caused the fracture. On looking back through the notes you note that he broke his left arm 4 months ago and again his mother could not give any explanation as to why this had happened. His older sister is with them and has her arm in a splint having recently fractured it. What is the most likely diagnosis for the boy?", "opts": ["A. Accidental injury (unwitnessed)", "B. Non-accidental injury", "C. Osteogenesis imperfecta", "D. Osteomyelitis", "E. Osteopetrosis"], "ans": "C", "ansText": "C. Osteogenesis imperfecta", "jx": "1.Possible, but this would not explain the recurrent pattern and abnormality of the bones?\n2.Although non-accidental injury needs to be considered, the abnormality of the bones on X-ray makes osteogenesis imperfecta more likely. In clinical settings, safeguarding concerns must be addressed in parallel with investigation for osteogenesis imperfecta and other medical conditions.\n3.Correct . The boy is likely to have osteogenesis imperfecta (type 1). It presents with fractures in early childhood and the bones look osteoporotic on X-ray. The children often have blue sclera but this can be difficult to identify with confidence. The condition is autosomal dominant and it is likely his older sister has it as well.\n4.Osteomyelitis does present with a painful leg, but would usually be associated with fever and redness over the area. The X-ray is usually normal at presentation.\n5.Osteopetrosis is also an autosomal dominant disease that can present in its milder form with fractures, but the bones look dense on X-ray.", "img": []}, {"id": "197b16fefb5de17b", "m": "12", "letter": "L", "inMod": 16, "code": "L16", "q": "A 14 years old boy presents to his general practitioner as he is conscious of his physical appearance. He is the tallest boy in his class and he does not like getting changed for sport at school because the other boys mock him. On examination his height is above the 98th centile, he has long fingers, and a wide arm span. You inspect his chest (Figure). Select the most likely diagnosis.", "opts": ["A. Harrison’s sulci", "B. Kyphosis", "C. Pectus excavatum", "D. Pectus carinatum", "E. Scoliosis"], "ans": "C", "ansText": "C. Pectus excavatum", "jx": "1.This would lead to indentation at points of insertion of the diaphragm.\n2.There would be excessive convex curvature of the spine.\n3.Correct . Pectus excavatum is also known as ‘hollow chest’ or ‘funnel chest’. This boy probably has Marfan syndrome, but it also occurs in otherwise normal children.\n4.This is also known as a ‘pigeon chest’ and results in a protrusion of the sternum.\n5.There would be excessive lateral curvature of the spine and rib humping when bending over.", "img": ["images/197b16fefb5de17b_0.jpg"]}, {"id": "fa53e767c8c7cd68", "m": "12", "letter": "L", "inMod": 17, "code": "L17", "q": "A 4 year old boy with poor hygiene and malnutrition is frequently left unattended at home. His mother reports prolonged work hours and admits he is often left without meals or supervision. The child is withdrawn and has developmental delay. What long term consequence can chronic neglect have on this child’s development?", "opts": ["A. Temporary behaviour change with improves with age and maturity", "B. No effect if nutrition improves", "C. Permanent brain structural changes and function", "D. Enhanced cognitive performance", "E. Improved independence and resilience"], "ans": "C", "ansText": "C. Permanent brain structural changes and function", "jx": "Chronic neglect leads to toxic stress , which disrupts normal brain development. Prolonged stress and lack of nurturing relationships cause atrophy of unused brain areas, impaired executive function, and altered stress responses — effects that can persist into adulthood.", "img": []}, {"id": "dd3893721050775d", "m": "12", "letter": "L", "inMod": 18, "code": "L18", "q": "A multidisciplinary case conference is convened to manage a suspected child abuse case. Team members disagree about custody placement. As the paediatrician , you recall that the central principle of child protection must guide decision making.According to child protection principles, whose interest should always take precedence?", "opts": ["A. Parent’s right to custody", "B. Hospital’s risk management policy", "C. Alleged perpetrator’s presumption of innocence", "D. Child’s safety and best interests", "E. Local legal policy of child’s registered place of residence"], "ans": "D", "ansText": "D. Child’s safety and best interests", "jx": "All child protection actions must be child focused and prioritize safety first . While family participation and multidisciplinary cooperation are key, decisions should safeguard the child’s immediate and long term wellbeing , even above parental rights or consent disputes.", "img": []}, {"id": "0f2a77d639080792", "m": "12", "letter": "L", "inMod": 19, "code": "L19", "q": "A 9-month-old infant is brought to the emergency department with multiple bruises of different ages on the back and thigh. The mother reports that the infant \"fell while learning to walk.\" The child cannot stand unsupported and has bruises in unusual locations, some with clear pattern marks. Which of the following findings is most suggestive of non accidental (inflicted) injury ?", "opts": ["A. Bruises on shins of walking child", "B. Single bruise on forehead", "C. Multiple bruises of different ages on unusual sites", "D. Small abrasions on knees", "E. Scratch from pet"], "ans": "C", "ansText": "C. Multiple bruises of different ages on unusual sites", "jx": "Red flags: Non-mobile infant with bruising Bruises in protected areas (back, trunk) Different stages of healingAccidental bruises usually on bony prominences in mobile children.Infants rarely bruise before they become mobile. Multiple bruises in different stages of healing and in unusual locations (e.g., thighs, back, trunk) strongly suggest inflicted injury. Accidental bruises normally occur over bony prominences (forehead, knees, shins) in mobile children.", "img": []}, {"id": "965742f7e1d79f5d", "m": "12", "letter": "L", "inMod": 20, "code": "L20", "q": "A paediatrician suspects physical abuse in a 6 year old child due to suspicious bruising patterns and inconsistent caregiver explanations. Under the Mandatory Reporting of Child Abuse Bill (2023) in Hong Kong and the Law of the People's Republic of China on the Protection of Minors (2020) , which group of people is legally mandated to report suspected child abuse?", "opts": ["A. Doctors and nurses only", "B. Police only", "C. Specified professionals including healthcare, teachers, social workers", "D. Parents only", "E. All citizens"], "ans": "C", "ansText": "C. Specified professionals including healthcare, teachers, social workers", "jx": "Mandatory reporting applies to defined professional groups.The Mandatory Reporting of Child Abuse Bill (2023) applies to 25 categories of professionals such as doctors, nurses, teachers, social workers, child care staff, and psychologists. They are legally required to report suspected abuse and failure to report may result in penalties.The Law of the People's Republic of China on the Protection of Minors outlines 7 categories: civil servants, neighborhood committees (community workers), teachers, medical staff, child welfare social workers, hotels, and hostels", "img": []}, {"id": "289ea9d3702b23dc", "m": "12", "letter": "L", "inMod": 21, "code": "L21", "q": "A 9-year-old boy with obesity and sedentary habits attends a school program promoting healthy living. The program includes dietary education, group sports, and limiting screen time. Which component is most effective in reducing long-term obesity risk in children?", "opts": ["A. Parental BMI control only", "B. Rigid calorie restriction", "C. ≥60 minutes moderate physical activity daily", "D. Eliminate carbohydrates in diet", "E. Skip breakfast to reduce daily caloric intake"], "ans": "C", "ansText": "C. ≥60 minutes moderate physical activity daily", "jx": "WHO: Children should engage in ≥60 minutes of moderate-to-vigorous physical activity daily , which improves energy balance and cardiovascular health. Successful interventions are multifaceted , incorporating activity, healthy diet, and family involvement rather than restrictive diets or skipping meals.", "img": []}, {"id": "a9767ae6b07e4a8c", "m": "12", "letter": "L", "inMod": 22, "code": "L22", "q": "A 3-month-old boy is brought to the emergency department following several episodes of vomiting over the past 12 hours. The infant is fussy and cries throughout the encounter. Vital signs are normal for his age. On examination, mucous membranes are moist with good tear production and normal skin turgor. There is a swollen area over the left side of his head that is tender to light palpation, and subsequent head CT reveals a linear skull fracture of the left parietal bone with no evidence of intracranial injury. Further questioning of the mother reveals that the infant rolled off the sofa onto a carpeted floor yesterday. Which of the following would be the most appropriate next step?", "opts": ["A. Discharge home after 4 hours of observation", "B. Discharge home immediately with instructions concerning precautions for head injuries", "C. Give a 20 mL/kg IV bolus of normal saline", "D. Take the parents aside and start accusing them of child abuse", "E. Order a skeletal survey"], "ans": "E", "ansText": "E. Order a skeletal survey", "jx": "1.Child abuse, or non-accidental trauma (NAT), should always be a consideration in infants and children who present with injuries inconsistent with their developmental stage. Discharging home after a brief period of observation would be appropriate in an otherwise healthy child, with no neurological signs/symptoms, stable vital signs, and where abuse is not suspected. Discharge home would not be appropriate in this patient until clearance following a full physical examination to assess for new and old injuries, additional imaging, and consultation and investigation by Child Protective Services.\n2.Aside from the concern regarding abuse, this would be inappropriate following the head injury. Given the episodes of vomiting, persistent fussiness, young age, and confirmed skull fracture, observation should occur for at least 4-24 hours. Ordering a MRI of the brain may also be a consideration.\n3.This would be an appropriate measure in a child with volume depletion requiring immediate and rapid fluid resuscitation. Based on the exam findings and normal vital signs, this child does not appear to be acutely dehydrated and would likely be able to take fluid orally once an anti-emetic was given.\n4.While it is important to contact the appropriate services if child abuse is suspected, confronting and accusing parents tends to inflame the situation. The parents themselves may not be hurting the child, and this may negatively impact their cooperation and understanding of your evaluation and investigation with CPS. Involving the parents and explaining your concerns regarding their child is the ideal approach while avoiding unnecessary confrontation.\n5.Correct . Non-accidental trauma must be considered in this case, and further history and imaging should be obtained. Linear skull fractures are associated with mechanisms of injury more severe than rolling off a sofa onto a carpeted floor. Furthermore, a 3 month old3-month-old infant would lack the gross motor ability required to roll completely over. Skeletal surveys are indicated for all infants who are suspected victims of abuse to document the presence of recent or healed fractures. If the skeletal survey is negative but there is high suspicion for NAT, a bone scan should be ordered.", "img": []}, {"id": "96c0b1d020543d90", "m": "12", "letter": "L", "inMod": 23, "code": "L23", "q": "A 6-month-old infant is being monitored for developmental milestones after experiencing a significant hypoxic event at birth. What is a common long-term complication associated with hypoxic ischemic encephalopathy?", "opts": ["A. Asthma", "B. Hearing loss", "C. Hypertension", "D. Type 1 diabetes", "E. Coeliac disease"], "ans": "B", "ansText": "B. Hearing loss", "jx": "B. Correct. HIE can cause: Cerebral palsy Intellectual disability Epilepsy Hearing impairmentAuditory pathways are vulnerable to hypoxic injury.Other options are unrelated to perinatal hypoxia.", "img": []}, {"id": "3ba688d6e8b8adee", "m": "13", "letter": "M", "inMod": 1, "code": "M1", "q": "A term baby girl is brought in by her mother for concern about vomiting and respiratory distress that occurs with breastfeeding. An abdominal radiograph shows a double bubble sign. In preparation for operative repair, an echocardiogram is performed and shows an endocardial cushion defect.Based on these findings, which of the following is the infant’s most likely underlying diagnosis?", "opts": ["A. Congenital rubella syndrome", "B. Fetal alcohol syndrome", "C. Isotretinoin embryopathy", "D. Trisomy 21", "E. Turner syndrome"], "ans": "D", "ansText": "D. Trisomy 21", "jx": "1.Congenital rubella syndrome causes deafness, cataracts, and patent ductus arteriosus with a blueberry muffin rash.\n2.Fetal alcohol syndrome is notable for facial dysmorphisms and neurobehavioral disorders. Cardiac defects are typically midline, such as atrial and ventricular septal defects, as well as conotruncal defects such as truncus arteriosus or tetralogy of Fallot.\n3.Isotretinoin is a teratogen that causes severe embryopathy affecting the central nervous system. It can sometimes cause conotruncal heart defects.\n4.Correct Endocardial cushion defects affect the atrial and ventricular septa, as well as tissues that would give rise to the mitral and tricuspid valves. Endocardial cushion defects occur in about 40% of newborns with Down syndrome (trisomy 21). Duodenal atresia is another important congenital anomaly that occurs in Down syndrome.\n5.Turner syndrome (XO) is associated with bicuspid aortic valve and aortic coarctation, as well as atrial and ventricular septal defects. It is not associated with duodenal atresia.", "img": []}, {"id": "5b1e7a2583ba4193", "m": "13", "letter": "M", "inMod": 2, "code": "M2", "q": "A 2 month old boy’s weight increased rapidly from the 50th to > 90th centile within 8 weeks, but by 6 months has fallen to the 50th centile again. The parents are worried the baby is “not growing well.”What is the best explanation for this pattern?", "opts": ["A. Failure to thrive", "B. Physiological catch-down growth", "C. Parental neglect leading to inadequate nutrition", "D. Underlying Metabolic disease", "E. Poor breast milk quality"], "ans": "B", "ansText": "B. Physiological catch-down growth", "jx": "Upward or downward crossing of centile lines in the first year can be physiological.Rapid early gain from abundant milk supply or maternal diet may be followed by self regulation of appetite as the infant reaches his genetically determined growth potential.Stable feeding and normal activity confirm healthy physiology, not pathology.", "img": []}, {"id": "189d11a4488b723c", "m": "13", "letter": "M", "inMod": 3, "code": "M3", "q": "A newborn screening program identifies a child with elevated alpha-fetoprotein (AFP) levels. The pediatrician is concerned about potential malignancies. What condition should be primarily suspected in this infant?", "opts": ["A. Hepatoblastoma", "B. Wilms tumor", "C. Neuroblastoma", "D. Retinoblastoma", "E. Leukemia"], "ans": "A", "ansText": "A. Hepatoblastoma", "jx": "AFP elevated in hepatoblastoma and yolk sac tumors.", "img": []}, {"id": "c403a574c4fbbbcf", "m": "13", "letter": "M", "inMod": 4, "code": "M4", "q": "A boy is born at term. It was a normal pregnancy though his mother did not have any antenatal ultrasound examinations as she was against medical procedures. He was born by vaginal delivery. Immediately, the midwife noticed the lesion shown. Which of the supplements listed would have reduced the risk of this problem if taken by the mother periconceptually?", "opts": ["A. Folic acid", "B. Iron", "C. Vitamin A", "D. Vitamin B12", "E. Vitamin D"], "ans": "A", "ansText": "A. Folic acid", "jx": "1. Correct. Folic acid prior to conception and early in pregnancy significantly reduces the chance of spina bifida (as shown in this image). It is the only vitamin supplement that reduces the risk of neural tube defects.\n2. Iron supplementation may be prescribed to treat anaemia during pregnancy.\n3. Vitamin A should not be supplemented in pregnancy as it can harm the developing fetus.\n4. Vitamin B12 is usually only considered if the mother is vegetarian or vegan.\n5. Vitamin D is recommended to be supplemented for healthy bone development.", "img": ["images/c403a574c4fbbbcf_0.jpg"]}, {"id": "8b745c247df23b36", "m": "13", "letter": "M", "inMod": 5, "code": "M5", "q": "Upon delivery, a full-term infant experiences apparent anatomical airway obstruction. On examination, the infant has a U-shaped cleft palate and insufficient room in the oral cavity for proper accommodation of the tongue. There are no other craniofacial dysmorphisms other than those shown in the figure. Which of the following diagnoses is most consistent with these findings?", "opts": ["A. Beckwith-Wiedemann syndrome", "B. DiGeorge syndrome", "C. Edwards syndrome", "D. Patau syndrome", "E. Pierre-Robin sequence"], "ans": "E", "ansText": "E. Pierre-Robin sequence", "jx": "1.The cardinal features of Beckwith-Wiedemann syndrome include hemihyperplasia, macroglossia, and anterior abdominal wall defects such as omphalocele. Hypoglycemia is the most immediate concern in neonates with Beckwith-Wiedemann syndrome.\n2.A defect in the third and fourth pharyngeal pouches results in DiGeorge syndrome, including wide-set eyes, low-set ears, and a shortened philtrum of the upper lip. Hypocalcemia and critical congenital heart disease are the most immediate concerns in the neonatal period.\n3.Micrognathia and microstomia are facial dysmorphisms associated with trisomy 18 (Edward syndrome). Among other findings, the head and neck stigmata include microcephaly, microphthalmia, and malformed ears but are not seen in this patient.\n4.Midline cleft palate is seen in trisomy 13 (Patau syndrome). However, other features such as microcephaly, hypotelorism, or holoprosencephaly and low-set malformed ears would also be present and are not seen in the figure.\n5.Correct. The three essential features of the Pierre-Robin sequence are micrognathia, a high-arched or U-shaped cleft palate, and glossoptosis. Because of the small mandible, the tongue is large for the airway and can cause airway obstruction. These infants are best positioned prone to keep the tongue from obstructing the airway.", "img": ["images/8b745c247df23b36_0.jpg"]}, {"id": "e23848e847d0f7f9", "m": "13", "letter": "M", "inMod": 6, "code": "M6", "q": "A newborn is noted to have low-set ears, flat nasal bridge, and hypotonia. No other anomalies are immediately evident. What is the most appropriate next step in the management of this infant?", "opts": ["A. Discharge with reassurance", "B. Karyotype analysis", "C. Full blood count only", "D. Renal ultrasound", "E. Hearing test only"], "ans": "B", "ansText": "B. Karyotype analysis", "jx": "A. Discharge – Incorrect. Further evaluation is required.B. Karyotype – Correct. Dysmorphic features raise suspicion of chromosomal abnormality (e.g., Down syndrome). Genetic testing confirms diagnosis and guides counselling.C. FBC – Incorrect. Not diagnostic.D. Renal US – May be needed later, but first confirm underlying syndrome.E. Hearing test – Important but not first priority in suspected chromosomal disorder.", "img": []}, {"id": "190dfd966b9239f0", "m": "13", "letter": "M", "inMod": 7, "code": "M7", "q": "A 5-day-old newborn undergoes routine metabolic screening using a heel-prick dried blood spot test. Results show markedly elevated phenylalanine levels. The infant appears clinically well. Which condition is most likely indicated by this result?", "opts": ["A. Galactosemia", "B. Maple syrup urine disease", "C. Phenylketonuria (PKU)", "D. Urea cycle disorder", "E. Tyrosinemia"], "ans": "C", "ansText": "C. Phenylketonuria (PKU)", "jx": "A. Galactosemia – Incorrect. Caused by galactose-1-phosphate uridyltransferase deficiency. Presents with: Vomiting Hypoglycaemia Jaundice Hepatomegaly Risk of E. coli sepsisIt does not cause elevated phenylalanine.B. Maple syrup urine disease – Incorrect. Caused by defective metabolism of branched-chain amino acids (leucine, isoleucine, valine). Characteristic maple syrup odor. Not associated with elevated phenylalanine.C. Phenylketonuria (PKU) – Correct. PKU is caused by deficiency of phenylalanine hydroxylase, leading to accumulation of phenylalanine. Untreated PKU results in: Intellectual disability Seizures Eczema Musty body odorEarly detection via newborn screening allows dietary phenylalanine restriction, preventing neurological damage. This is a classic example of the purpose of newborn metabolic screening: detect asymptomatic disease before irreversible harm occurs.D. Urea cycle disorder – Incorrect. Presents with hyperammonemia, lethargy, vomiting, and encephalopathy. Does not elevate phenylalanine.E. Tyrosinemia – Incorrect. Involves elevated tyrosine, liver dysfunction, and renal tubular issues — not phenylalanine.", "img": []}, {"id": "5a5c6f432c84686d", "m": "14", "letter": "N", "inMod": 1, "code": "N1", "q": "Vignette: A paediatric doctor is preparing to discuss the family's wishes regarding resuscitation status for their child with a life-limiting condition. The parents have expressed uncertainty about what they want. Question: What approach should the doctor take to facilitate this discussion?", "opts": ["A. Assume parents want full interventions", "B. Use hypothetical scenarios to explore their preferences", "C. Avoid discussing different levels of care to confuse parents", "D. Wait for acute deterioration before discussing full resuscitation", "E. Provide a detailed list of all possible interventions and level of care"], "ans": "B", "ansText": "B. Use hypothetical scenarios to explore their preferences", "jx": "Scenario discussion helps: Clarify values Explore fears Facilitate informed decisions", "img": []}, {"id": "bcb1e9727f8cf53b", "m": "14", "letter": "N", "inMod": 2, "code": "N2", "q": "Vignette: A junior doctor new to paediatrics takes an adult-style medical history for an 8 year old child with developmental delay, focusing only on the current illness. Question: Which key aspect has she most likely omitted?", "opts": ["A. Travel", "B. Past surgical history", "C. Growth & developmental history", "D. Family history", "E. Medication history"], "ans": "C", "ansText": "C. Growth & developmental history", "jx": "Paediatric assessment must always include: Growth parameters Milestones Nutrition Family contextChildren are not little adults; every paediatric assessment must include growth, nutrition, developmental milestones, and family environment. Adult oriented questions (e.g., alcohol intake, employment) are irrelevant, while developmental history guides diagnosis and health promotion.", "img": []}, {"id": "a57504057a0512b9", "m": "14", "letter": "N", "inMod": 3, "code": "N3", "q": "Vignette: While seeing a 10 month old girl with feeding problems, her mother becomes tearful and says she feels “to blame” for her baby’s slow weight gain. Question: What is the most appropriate response?", "opts": ["A. Quick reassurance and move on to discuss formula options", "B. Explore feeding and psychosocial factors together", "C. Refer immediately to dietician for assessment", "D. Refer immediately to speech and language therapist for potential oral sensitivity problem", "E. Ignore maternal emotion and continue the consultation"], "ans": "B", "ansText": "B. Explore feeding and psychosocial factors together", "jx": "Empathetic, family-centred approach improves care.Paediatric practice should be family centred and empathetic. Involving caregivers in information gathering validates their concerns and identifies psychosocial contributors.Rapid reassurance or early delegation may overlook key issues and erode trust.", "img": []}, {"id": "3d011de3eb545105", "m": "14", "letter": "N", "inMod": 4, "code": "N4", "q": "Vignette: A healthcare team is discussing a 5-year-old girl with a terminal brain tumour. The parents are anxious about her prognosis and want to know how to prepare for the end of life. Question: What is the most important aspect of communication with the family regarding the child's prognosis?", "opts": ["A. Avoid discussing difficult topics to prevent parental distress", "B. Provide general vague information to avoid parental blame", "C. Encourage open dialogue with parents to discuss their concerns and wishes", "D. Focus only on potential medical interventions available", "E. Give statistics only regarding cure rates and estimated life expectancy"], "ans": "C", "ansText": "C. Encourage open dialogue with parents to discuss their concerns and wishes", "jx": "Open communication: Builds trust Allows shared decision-making Respects parental autonomyAvoidance or false reassurance damages trust.", "img": []}, {"id": "e26c8cc0bf78e307", "m": "14", "letter": "N", "inMod": 5, "code": "N5", "q": "Vignette: You are about to examine a 3 year old boy with a cough. When you introduce yourself, he hides behind his mother and refuses to speak.Question: What is the most appropriate initial a const KEY = "pae_mcq_v3";
const L = ["A","B","C","D","E","F","G"];

let state = {answers:{}, cat:"all", ses:"all", wrongOnly:false, view:"quiz", idx:0};
try{
  const raw = localStorage.getItem(KEY);
  if(raw){ const s = JSON.parse(raw); state = Object.assign(state, s); }
}catch(e){}

const $ = s => document.querySelector(s);
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

function pool(){
  let qs = DATA.questions.filter(q => state.cat==="all" || q.m===state.cat);
  if(state.wrongOnly) qs = qs.filter(q => state.answers[q.id] && !state.answers[q.id].ok);
  return qs;
}
function cur(){ const p = pool(); return p[Math.min(state.idx, Math.max(0,p.length-1))]; }

function stats(){
  const all = DATA.questions, done = all.filter(q=>state.answers[q.id]);
  const ok = done.filter(q=>state.answers[q.id].ok).length;
  return {all:all.length, done:done.length, ok, acc: done.length? Math.round(ok/done.length*100):null};
}

function renderCats(){
  const box = $("#cats");
  const s = stats();
  let h = `<div class="cathead">课件模块</div>`;
  const inSes = DATA.questions;
  const wm = state.view === "wrong";
  const dnSes = wm
    ? inSes.filter(q=>{const r=state.answers[q.id];return r&&!r.ok;}).length
    : inSes.filter(q=>state.answers[q.id]).length;
  h += catRow("all", wm?"全部错题":"全部题目", dnSes, wm?dnSes:inSes.length, state.cat==="all");
  DATA.modules.forEach(m=>{
    const qs = DATA.questions.filter(q=>q.m===m.c);
    const dn = state.view === "wrong"
      ? qs.filter(q=>{const r=state.answers[q.id];return r&&!r.ok;}).length
      : qs.filter(q=>state.answers[q.id]).length;
    h += catRow(m.c, (m.letter||"") + " · " + m.t.replace(/^\d+\s*/,""), dn, qs.length, state.cat===m.c);
  });
  box.innerHTML = h;
  box.querySelectorAll(".cat").forEach(el=>{
    el.onclick = ()=>{ state.cat = el.dataset.c; state.idx = 0; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); };
  });
}
function catRow(code,label,dn,total,on){
  return `<button class="cat${on?" on":""}" data-c="${code}">
    <span>${label}</span><span class="cnt">${total?`<span class="${dn?"dn":""}">${dn}</span>/${total}`:"0"}</span></button>`;
}

function renderHeader(){
  const s = stats();
  $("#done").textContent = s.done;
  $("#total").textContent = s.all;
  $("#acc").textContent = s.acc===null ? "—" : s.acc + "%";
  $("#fill").style.width = (s.done/s.all*100).toFixed(1) + "%";
  $("#btnWrong").classList.toggle("on", state.view === "wrong");
  const be = $("#btnExam");
  if(be){
    const has = state.exam && !state.exam.submitted;
    be.textContent = has ? "继续模拟考" : "模拟考";
    be.classList.toggle("on", state.view === "exam");
  }
}

function wrongItems(){
  return DATA.questions.filter(q => {
    const r = state.answers[q.id];
    return r && !r.ok && (state.cat === "all" || q.m === state.cat);
  });
}

function gotoQuestion(q){
  state.view = "quiz"; state.ses = q.ses; state.cat = q.m; state.wrongOnly = false;
  const p = pool();
  const i = p.findIndex(x => x.id === q.id);
  state.idx = i < 0 ? 0 : i;
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

function renderWrong(stage){
  const all = wrongItems();
  const totalAll = DATA.questions.filter(q => { const r = state.answers[q.id]; return r && !r.ok; }).length;
  if(!all.length){
    stage.innerHTML = `<div class="wpage-head"><h2>错题本</h2>
        <span class="wsub"></span></div>
      <div class="empty"><b>${totalAll?"这个筛选下没有错题 🎉":"还没有错题，继续保持 💪"}</b>
      ${totalAll?`全部有 ${totalAll} 道错题，换个场次或模块看看。`:"往下刷题，答错的会自动收集到这里。"}</div>`;
    return;
  }
  const order = DATA.modules.map(m => m.c);
  const groups = {};
  all.forEach(q => { (groups[q.m] = groups[q.m] || []).push(q); });
  let h = `<div class="wpage-head"><h2>错题本</h2>
      <span class="wsub">${all.length} 道</span>
      <div class="wact">
        <button class="hbtn" id="wRedoAll">逐题重刷</button>
        <button class="hbtn danger" id="wClear">清空这批</button>
      </div></div>`;

  order.filter(c => groups[c]).forEach(code => {
    const list = groups[code];
    const mod = DATA.modules.find(m => m.c === code);
    h += `<div class="wgroup"><div class="wgroup-h">
        <span class="wt">${mod ? mod.t : code}</span><span class="wc">${list.length}</span>
        <span class="wline"></span></div>`;
    list.sort((a, b) => (a.ses - b.ses) || (a.no - b.no));
    list.forEach(q => {
      const r = state.answers[q.id];
      const qtxt = (q.q || "").replace(/\s+/g, " ");
      h += `<button class="wcard" data-id="${q.id}">
        <div class="wtop"><span class="badge code">${q.code}</span><span class="wno">${(DATA.modules.find(m=>m.c===q.m)||{}).t||""}</span></div>
        <div class="wq">${esc(qtxt)}</div>
        <div class="wans"><span class="bad">你选 ${r.pick}</span>
          <span class="good">正确 ${esc(((q.ansText||q.ans)||"").length > 70 ? ((q.ansText||q.ans).slice(0,70)+"…") : (q.ansText||q.ans))}</span>
          <span class="wgo">去做这题 →</span></div>
      </button>`;
    });
    h += `</div>`;
  });
  stage.innerHTML = h;

  stage.querySelectorAll(".wcard").forEach(el => {
    el.onclick = () => {
      const q = DATA.questions.find(x => x.id === el.dataset.id);
      if(q) gotoQuestion(q);
    };
  });
  const ra = $("#wRedoAll");
  if(ra) ra.onclick = () => {
    state.view = "quiz"; state.wrongOnly = true; state.idx = 0; save(); render();
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const wc = $("#wClear");
  if(wc) wc.onclick = () => {
    const snap = JSON.parse(JSON.stringify(state));
    all.forEach(q => { delete state.answers[q.id]; });
    save(); render();
    toast("已清空当前筛选下的 " + all.length + " 道错题", ()=>{ state = snap; save(); render(); });
  };
}

function render(){
  renderCats(); renderHeader();
  const stage = $("#stage");
  if(state.view === "exam"){ renderExam(stage); return; }
  if(state.view === "wrong"){ renderWrong(stage); return; }
  const p = pool();
  if(!p.length){
    stage.innerHTML = `<div class="empty"><b>${state.wrongOnly?"错题本是空的 🎉":"这个模块暂无题目"}</b>
      ${state.wrongOnly?"还没有答错的题，继续保持。":"本次抓到的 71 题里没有覆盖到这个课件模块。"}</div>`;
    return;
  }
  state.idx = Math.min(state.idx, p.length-1);
  const q = p[state.idx];
  const rec = state.answers[q.id];
  const mod = DATA.modules.find(m=>m.c===q.m);
  const modQs = DATA.questions.filter(x=>x.m===q.m);
  const inMod = modQs.findIndex(x=>x.id===q.id) + 1;

  let opts = q.opts.map((t,i)=>{
    const k = L[i];
    let cls = "opt";
    if(rec){
      cls += " locked";
      if(k===q.ans) cls += " right";
      else if(k===rec.pick) cls += " wrong";
    }
    let mark = "";
    if(rec){
      if(k===q.ans) mark = `<span class="mark" style="color:var(--green)">✓</span>`;
      else if(k===rec.pick) mark = `<span class="mark" style="color:var(--red)">✕</span>`;
    }
    return `<button class="${cls}" data-k="${k}" ${rec?"disabled":""}>
      <span class="k">${k}</span><span class="t">${esc(t)}</span>${mark}</button>`;
  }).join("");

  const figs = (q.img||[]).map(src=>`<img src="${src}" alt="配图">`).join("");

  stage.innerHTML = `
    <div class="qhead">
      <span class="badge code">${q.code}</span>
      <span class="badge">${mod?mod.t:q.m}</span>
      <span class="qnum">第 ${state.idx+1} / ${p.length} 题 · 本模块 ${inMod}/${modQs.length}</span>
      ${rec?`<span class="state ${rec.ok?"ok":"no"}">${rec.ok?"✓ 答对":"✕ 答错"}</span>`:""}
    </div>
    <div class="card">
      <p class="stem">${fmt(q.q)}</p>
      ${figs?`<div class="figure">${figs}</div>`:""}
      <div class="opts">${opts}</div>
      <div class="jx${rec?" open":""}" id="jx">
        <div class="ans"><i>正确答案</i><span>${esc(q.ansText || q.ans)}</span></div>
        <div class="lab">解析</div>
        <p>${esc(q.jx || "（此题未提供解析）")}</p>
      </div>
    </div>
    <div class="nav">
      <button class="nbtn" id="prev" ${state.idx===0?"disabled":""}>← 上一题</button>
      <button class="nbtn primary" id="next">${state.idx>=p.length-1?"回到第一题":"下一题 →"}</button>
      <button class="nbtn dash" id="nextUndone" title="跳到本模块下一道还没做的题">跳到未做</button>
      <span class="jumpwrap">
        <input id="jumpNo" type="text" inputmode="numeric" placeholder="题号" title="输题号回车直达">
        <button id="jumpGo">跳转</button>
      </span>
      <span class="spacer"></span>
      ${state.cat!=="all"?`<button class="nbtn ghost" id="clearCat">清空本模块</button>`:""}
      ${rec?`<button class="nbtn ghost" id="redo">重做本题</button>`:""}
    </div>
    <div class="kbd"><kbd>←</kbd><kbd>→</kbd> 切题 · 选完立即出解析</div>`;

  stage.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{ pick(el.dataset.k); };
  });
  $("#prev").onclick = ()=>{ state.idx--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  $("#next").onclick = ()=>{
    state.idx = state.idx>=p.length-1 ? 0 : state.idx+1; save(); render();
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const nu = $("#nextUndone");
  if(nu) nu.onclick = ()=>{
    const pp = pool();
    if(!pp.length) return;
    const curMod = pp[state.idx] ? pp[state.idx].m : null;
    const start = state.idx;
    let found = -1;
    for(let k = start + 1; k < pp.length; k++){
      const x = pp[k];
      if(curMod && x.m !== curMod) continue;
      if(!state.answers[x.id]){ found = k; break; }
    }
    if(found < 0){
      for(let k = 0; k <= start; k++){
        const x = pp[k];
        if(curMod && x.m !== curMod) continue;
        if(!state.answers[x.id]){ found = k; break; }
      }
    }
    if(found < 0){
      const mod = DATA.modules.find(m => m.c === curMod);
      toast((mod ? mod.letter + " · " + mod.t.replace(/^\d+\s*/, "") : "本模块") + " 的题都做完了 🎉");
      return;
    }
    state.idx = found; save(); render();
    window.scrollTo({top:0, behavior:"smooth"});
  };
  const rd = $("#redo"); if(rd) rd.onclick = ()=>{ delete state.answers[q.id]; save(); render(); };
  const jn = $("#jumpNo"), jg = $("#jumpGo");
  if(jn){
    jn.value = "";
    jn.placeholder = "C15";
    const go = () => {
      const v = jn.value.trim();
      if(!v) return;
      const pp = pool();
      let i = -1;
      const norm = v.replace(/\s+/g, "").toUpperCase();
      const cm = norm.match(/^([A-N])-?(\d+)$/);
      let target = null;
      if(cm){
        const want = cm[1] + (+cm[2]);
        target = DATA.questions.find(x => (x.code || "").toUpperCase() === want) || null;
      }else if(/^\d+$/.test(v)){
        const n = +v;
        const scope = DATA.questions.filter(x => state.cat === "all" || x.m === state.cat);
        target = scope.find(x => x.inMod === n) || DATA.questions[n - 1] || null;
      }
      if(!target){
        jn.value = ""; jn.placeholder = "无 " + v;
        setTimeout(() => { if(jn) jn.placeholder = "C15"; }, 1400);
        return;
      }
      if(state.cat !== "all" && target.m !== state.cat) state.cat = target.m;
      let pp2 = pool();
      i = pp2.findIndex(x => x.id === target.id);
      if(i < 0){ state.cat = "all"; pp2 = pool(); i = pp2.findIndex(x => x.id === target.id); }
      state.idx = i >= 0 ? i : 0;
      jn.value = ""; save(); render();
      window.scrollTo({top:0, behavior:"smooth"});
      return;
      if(i >= 0 && i < pp.length){ state.idx = i; jn.value = ""; save(); render(); }
      else { jn.value = ""; jn.placeholder = "无此题"; setTimeout(()=>{ if(jn) jn.placeholder = "题号"; }, 1200); }
    };
    jg.onclick = go;
    jn.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); go(); } });
  }
  const cc = $("#clearCat");
  if(cc) cc.onclick = ()=>{
    const snap = JSON.parse(JSON.stringify(state));
    const ids = DATA.questions.filter(x=>x.m===state.cat).map(x=>x.id);
    ids.forEach(id=>delete state.answers[id]);
    state.idx = 0; save(); render();
    toast("已清空本模块的作答记录", ()=>{ state = snap; save(); render(); });
  };
}

function pick(k){
  const q = cur(); if(!q || state.answers[q.id]) return;
  const ok = (k === (q.ans||"").trim().charAt(0));
  state.answers[q.id] = {pick:k, ok, t:Date.now()};
  save(); render();
  const jx = $("#jx"); if(jx){ setTimeout(()=>jx.classList.add("open"), 30); }
  const card = document.querySelector(".card");
  if(card){ const r = jx.getBoundingClientRect(); if(r.bottom > window.innerHeight-40) jx.scrollIntoView({block:"nearest",behavior:"smooth"}); }
}

function esc(s){ return String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){
  return esc(s).replace(/\b(Vignette|Question|Scenario)\s*:/gi, m=>`<em>${m}</em>`);
}

$("#btnWrong").onclick = ()=>{
  state.view = state.view === "wrong" ? "quiz" : "wrong";
  state.wrongOnly = false; state.idx = 0; save(); render();
  window.scrollTo({top:0,behavior:"smooth"});
};

/* ---- 一键清空（带撤销） ---- */
let undoFn = null, undoTimer = null;
function toast(msg, fn){
  $("#toastMsg").textContent = msg;
  $("#toastUndo").style.display = fn ? "" : "none";
  undoFn = fn || null;
  $("#toast").classList.add("on");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>{ $("#toast").classList.remove("on"); undoFn = null; }, 6000);
}
$("#toastUndo").onclick = ()=>{
  if(undoFn){ undoFn(); undoFn = null; }
  $("#toast").classList.remove("on");
};
$("#btnReset").onclick = ()=>{
  const snap = JSON.parse(JSON.stringify(state));
  state.answers = {}; state.idx = 0; state.wrongOnly = false; save(); render();
  toast("已清空全部作答记录，可以重新刷了", ()=>{ state = snap; save(); render(); });
};

/* ---- 门禁问答 ---- */
const GATE_KEY = "pae_gate_v1";
function gatePassed(){ try{ return localStorage.getItem(GATE_KEY) === "1"; }catch(e){ return false; } }
function initGate(){
  const gate = $("#gate");
  if(gatePassed()){ gate.classList.add("hide"); return; }
  const inp = $("#gateInput"), btn = $("#gateBtn"), msg = $("#gateMsg"), box = $("#gatebox");
  const OK = ["许先佑","xuxianyou","xianyouxu","xianyou","xu"];
  const norm = s => (s||"").replace(/[\s·.，,、]/g,"").toLowerCase();
  const submit = ()=>{
    const v = norm(inp.value);
    if(v && OK.some(a=>norm(a) === v)){
      msg.className = "gok"; msg.textContent = "对了，就是那位 ✅";
      try{ localStorage.setItem(GATE_KEY, "1"); }catch(e){}
      setTimeout(()=>gate.classList.add("hide"), 650);
    }else{
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      msg.className = "gmsg";
      msg.textContent = v ? "不对哦，再想想 🤔" : "先输入答案";
      inp.focus();
    }
  };
  btn.onclick = submit;
  inp.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
  setTimeout(()=>inp.focus(), 400);
}
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const ae = document.activeElement;
  if(ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable)) return;
  if(!$("#gate").classList.contains("hide")) return;
  const jm = $("#jumpModal"), bm = $("#bkModal");
  if((jm && !jm.classList.contains("hide")) || (bm && !bm.classList.contains("hide"))) return;
  if(state.view !== "quiz") return;
  const p = pool(); if(!p.length) return;
  if(e.key==="ArrowLeft" && state.idx>0){ state.idx--; save(); render(); }
  else if(e.key==="ArrowRight"){ state.idx = state.idx>=p.length-1?0:state.idx+1; save(); render(); }
});

/* ---- 模拟考 ---- */
const EXAM_N = 50;

function startExam(){
  const all = DATA.questions;
  const byMod = {};
  all.forEach(q => (byMod[q.m] = byMod[q.m] || []).push(q));
  const total = all.length;
  const mods = Object.keys(byMod);

  // 按模块题量比例分配名额，每模块至少 1 题
  const alloc = {};
  let used = 0;
  mods.forEach(m => {
    const n = Math.max(1, Math.floor(EXAM_N * byMod[m].length / total));
    alloc[m] = Math.min(n, byMod[m].length);
    used += alloc[m];
  });
  // 补齐/削减到正好 EXAM_N（按题量大小轮流调）
  const bySize = mods.slice().sort((a, b) => byMod[b].length - byMod[a].length);
  let guard = 0;
  while(used < EXAM_N && guard++ < 500){
    for(const m of bySize){
      if(used >= EXAM_N) break;
      if(alloc[m] < byMod[m].length){ alloc[m]++; used++; }
    }
  }
  guard = 0;
  while(used > EXAM_N && guard++ < 500){
    for(const m of bySize.slice().reverse()){
      if(used <= EXAM_N) break;
      if(alloc[m] > 1){ alloc[m]--; used--; }
    }
  }

  // 抽样
  const picked = [];
  mods.forEach(m => {
    const pool = byMod[m].slice();
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    picked.push(...pool.slice(0, alloc[m]));
  });
  // 打乱总序
  for(let i = picked.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [picked[i], picked[j]] = [picked[j], picked[i]];
  }

  state.exam = { ids: picked.map(q => q.id), ans: {}, i: 0, start: Date.now(), submitted: false, review: false };
  state.view = "exam";
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

function examItems(){
  const ex = state.exam;
  if(!ex) return [];
  return ex.ids.map(id => DATA.questions.find(q => q.id === id)).filter(Boolean);
}

function fmtDur(ms){
  const m = Math.floor(ms / 60000), sec = Math.floor((ms % 60000) / 1000);
  return m ? `${m} 分 ${sec} 秒` : `${sec} 秒`;
}

function renderExam(stage){
  if(!state.exam){
    stage.innerHTML = `<div class="wpage-head"><h2>模拟考</h2></div>
      <div class="empty"><b>从 14 个模块按比例抽 50 题</b>
      每次开考都是新的一套，交卷后看分数与逐题解析。<br>
      <button class="hbtn primary" id="exStart" style="margin-top:18px">开始模拟考</button></div>`;
    const b = $("#exStart"); if(b) b.onclick = startExam;
    return;
  }
  const ex = state.exam, items = examItems();

  /* ---- 成绩页 ---- */
  if(ex.submitted && !ex.review){
    let right = 0;
    const byMod = {};
    items.forEach(q => {
      const pick = (ex.ans[q.id] || "").charAt(0);
      const ok = pick === (q.ans || "").charAt(0);
      if(ok) right++;
      const g = byMod[q.m] = byMod[q.m] || { n: 0, ok: 0 };
      g.n++; if(ok) g.ok++;
    });
    const pct = Math.round(right / items.length * 100);
    const blankN = items.filter(q => !ex.ans[q.id]).length;
    let bars = "";
    DATA.modules.forEach(mod => {
      const g = byMod[mod.c];
      if(!g) return;
      const r = Math.round(g.ok / g.n * 100);
      bars += `<div class="mbrow"><span class="mbl">${mod.letter} · ${mod.t.replace(/^\d+\s*/, "")}</span>
        <span class="mbt"><i class="${r < 60 ? "bad" : ""}" style="width:${r}%"></i></span>
        <span class="mbv">${g.ok}/${g.n}</span></div>`;
    });
    stage.innerHTML = `<div class="wpage-head"><h2>模拟考成绩</h2>
        <span class="wsub">用时 ${fmtDur(Date.now() - ex.start)}</span></div>
      <div class="scorebox">
        <div class="big">${right}<span>/${items.length}</span></div>
        <div class="pct">正确率 <b>${pct}%</b> · ${pct >= 80 ? "很稳 💪" : pct >= 60 ? "还行，再刷刷错题" : "先回去补基础 📚"}${blankN ? ` · 未答 <b>${blankN}</b> 题` : ""}</div>
        <div class="modbars">${bars}</div>
        <div class="scoreacts">
          <button class="primary" id="exReview">逐题看解析</button>
          <button id="exAgain">再来一套</button>
          <button id="exExit">返回刷题</button>
        </div>
      </div>
      <div class="exnote" style="text-align:center">错题已自动收进错题本</div>`;
    $("#exReview").onclick = () => { state.exam.review = true; state.exam.i = 0; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    $("#exAgain").onclick = startExam;
    $("#exExit").onclick = () => { state.view = "quiz"; save(); render(); };
    return;
  }

  /* ---- 题目 / 复习 ---- */
  const q = items[Math.min(ex.i, items.length - 1)];
  if(!q){ return; }
  const answered = Object.keys(ex.ans).length;
  const reviewing = ex.submitted;
  const pick = ex.ans[q.id];
  const mod = DATA.modules.find(m => m.c === q.m);

  const opts = q.opts.map((t, i) => {
    const k = L[i];
    let cls = "opt";
    if(reviewing){
      cls += " locked";
      if(k === (q.ans || "").charAt(0)) cls += " right";
      else if(k === pick) cls += " wrong";
    }else if(k === pick){
      cls += " sel";
    }
    return `<button class="${cls}" data-k="${k}"><span class="k">${k}</span><span class="t">${esc(t)}</span></button>`;
  }).join("");

  const figs = (q.img || []).map(src => `<img src="${src}" alt="配图">`).join("");
  const pct = Math.round((ex.i + 1) / items.length * 100);

  let nav = "";
  if(reviewing){
    nav = `<div class="nav">
      <button class="nbtn" id="prev" ${ex.i === 0 ? "disabled" : ""}>← 上一题</button>
      <button class="nbtn primary" id="next">${ex.i >= items.length - 1 ? "回到第一题" : "下一题 →"}</button>
      <span class="spacer"></span>
      <button class="nbtn ghost" id="exBackScore">返回成绩</button>
    </div>`;
  }else{
    nav = `<div class="nav">
      <button class="nbtn" id="prev" ${ex.i === 0 ? "disabled" : ""}>← 上一题</button>
      <button class="nbtn primary" id="next">${ex.i >= items.length - 1 ? "交卷" : "下一题 →"}</button>
    </div>`;
  }

  stage.innerHTML = `
    <div class="exbar">
      <span class="exlab">${reviewing ? "解析模式" : "模拟考"}</span>
      <span class="exnum">第 ${ex.i + 1} / ${items.length} 题 · 已答 ${answered}/${items.length}</span>
      <span class="extrack"><i style="width:${pct}%"></i></span>
      ${reviewing ? "" : `<button class="hbtn" id="exSubmit2">交卷</button>`}
    </div>
    <div class="card">
      <p class="stem">${fmt(q.q)}</p>
      ${figs ? `<div class="figure">${figs}</div>` : ""}
      <div class="opts">${opts}</div>
      <div class="jx${reviewing ? " open" : ""}" id="jx">
        <div class="ans"><i>正确答案</i><span>${esc(q.ansText || q.ans)}</span></div>
        <div class="lab">解析</div>
        <p>${esc(q.jx || "（此题未提供解析）")}</p>
      </div>
      ${reviewing ? "" : `<div class="exnote">选完自动跳下一题 · 交卷后才看对错</div>`}
    </div>
    ${nav}`;

  if(!reviewing){
    stage.querySelectorAll(".opt").forEach(el => {
      el.onclick = () => {
        state.exam.ans[q.id] = el.dataset.k;
        save();
        if(state.exam.i < items.length - 1){
          state.exam.i++;
          render();
        }else{
          render();
        }
      };
    });
  }
  const prev = $("#prev"); if(prev) prev.onclick = () => { state.exam.i = Math.max(0, ex.i - 1); save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const next = $("#next"); if(next) next.onclick = () => {
    if(!reviewing && ex.i >= items.length - 1){ submitExam(); return; }
    state.exam.i = ex.i >= items.length - 1 ? 0 : ex.i + 1;
    save(); render(); window.scrollTo({top:0,behavior:"smooth"});
  };
  ["exSubmit", "exSubmit2"].forEach(id => {
    const b = $("#" + id); if(b) b.onclick = submitExam;
  });
  const bs = $("#exBackScore"); if(bs) bs.onclick = () => { state.exam.review = false; save(); render(); };
}

function submitExam(){
  const ex = state.exam;
  if(!ex) return;
  const items = examItems();
  // 结果写进主进度（错题自动进错题本）
  items.forEach(q => {
    const pick = (ex.ans[q.id] || "").charAt(0);
    if(!pick) return;
    state.answers[q.id] = { pick, ok: pick === (q.ans || "").charAt(0), t: Date.now() };
  });
  ex.submitted = true; ex.review = false; ex.end = Date.now();
  save(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

$("#btnExam").onclick = () => {
  if(state.exam && !state.exam.submitted){ state.view = "exam"; save(); render(); }
  else startExam();
};

/* ---- 快速跳题 ---- */
function openJump(){
  $("#jumpSearch").value = "";
  renderJump("");
  $("#jumpModal").classList.remove("hide");
  setTimeout(()=>$("#jumpSearch").focus(), 120);
}
function closeJump(){ $("#jumpModal").classList.add("hide"); }

function renderJump(filter){
  const p = pool();
  const cur = p[state.idx];
  const f = (filter || "").trim().toLowerCase();
  const CODE_M = f.match(/^([a-n])\s*-?\s*(\d+)$/i);
  let hit = p.map((q, i) => ({ q, i }));

  if(f){
    if(CODE_M){
      const want = CODE_M[1].toUpperCase() + (+CODE_M[2]);
      hit = hit.filter(x => (x.q.code || "").toUpperCase() === want);
    }else if(/^\d+$/.test(f)){
      const n = +f;
      const inMod = hit.filter(x => x.q.inMod === n);
      hit = inMod.length ? inMod : hit.filter(x => x.i === n - 1);
    }else{
      hit = hit.filter(x => (x.q.q || "").toLowerCase().includes(f));
    }
  }

  if(!hit.length){
    $("#jpBody").innerHTML = `<div class="jp-empty">没有匹配的题目<br><span style="font-size:11.5px">试试题号（30）、S2-30，或英文关键词</span></div>`;
    return;
  }

  // 分组：场次(全部时) + 模块
  const order = DATA.modules.map(m => m.c);
  const groups = {};
  hit.forEach(x => {
    const mod = DATA.modules.find(m => m.c === x.q.m) || { c: x.q.m, t: x.q.m };
    const k = (x.q.letter || "") + "|" + mod.t;
    (groups[k] = groups[k] || []).push(x);
  });
  const keys = Object.keys(groups).sort(
    (a, b) => order.indexOf(a.split("|")[0] && DATA.modules.find(m=>m.t===a.split("|")[1]).c)
            - order.indexOf(DATA.modules.find(m=>m.t===b.split("|")[1]).c));

  let h = "";
  keys.forEach(k => {
    const kLetter = k.split("|")[0], kName = k.split("|")[1];
    h += `<div class="jp-g"><div class="jp-g-h"><b style="color:var(--teal-d)">${kLetter}</b> · ${kName}　${groups[k].length} 题</div><div class="jp-cells">`;
    groups[k].forEach(({q, i}) => {
      const r = state.answers[q.id];
      let cls = "jcell";
      if(r) cls += r.ok ? " ok" : " no";
      if(cur && q.id === cur.id) cls += " cur";
      h += `<button class="${cls}" data-i="${i}" title="${q.code}">${q.inMod}</button>`;
    });
    h += `</div></div>`;
  });
  h += `<div class="jp-hint">绿色=答对 · 红色=答错 · 蓝框=当前题 · 点格子直接跳</div>`;
  $("#jpBody").innerHTML = h;

  $("#jpBody").querySelectorAll(".jcell").forEach(el => {
    el.onclick = () => {
      state.view = "quiz"; state.idx = +el.dataset.i; save(); render(); closeJump();
      window.scrollTo({top:0,behavior:"smooth"});
    };
  });
}

$("#btnJump").onclick = openJump;
$("#jumpClose").onclick = closeJump;
$("#jumpSearch").addEventListener("input", e => renderJump(e.target.value));
$("#jumpSearch").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    const first = $("#jpBody").querySelector(".jcell");
    if(first) first.click();
  }
});

document.addEventListener("keydown", e => {
  if(e.key === "/" && $("#gate").classList.contains("hide")
     && $("#jumpModal").classList.contains("hide")
     && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); openJump();
  }
});

/* ---- 进度备份 ---- */
const BK_PREFIX = "PAEMCQ1.";
function bkEncode(){
  const obj = { v: 1, t: Date.now(), a: {} };
  Object.keys(state.answers).forEach(id => {
    const r = state.answers[id];
    obj.a[id] = [r.pick, r.ok ? 1 : 0];
  });
  const json = JSON.stringify(obj);
  return BK_PREFIX + btoa(unescape(encodeURIComponent(json)));
}
function bkDecode(code){
  code = (code || "").trim();
  const i = code.indexOf(BK_PREFIX);
  if(i < 0) throw new Error("格式不对");
  const raw = code.slice(i + BK_PREFIX.length).replace(/\s+/g, "");
  const json = decodeURIComponent(escape(atob(raw)));
  return JSON.parse(json);
}
function bkRefresh(){
  const s = stats();
  $("#bkSummary").textContent = `已答 ${s.done} / ${s.all} 题 · 正确率 ${s.acc===null?"—":s.acc+"%"}`;
  $("#bkMsg").textContent = "";
}
$("#btnSave").onclick = async ()=>{
  const code = bkEncode();
  const kb = (code.length / 1024).toFixed(1);
  try{
    await navigator.clipboard.writeText(code);
    toast("备份码已复制到剪贴板（" + kb + " KB），到另一台设备点「备份」粘贴即可恢复");
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = code; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      toast("备份码已复制到剪贴板（" + kb + " KB）");
    }catch(e2){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([code], {type:"text/plain"}));
      a.download = "pae-mcq-progress.txt"; a.click();
      toast("剪贴板不可用，已下载备份文件");
    }
  }
};
$("#btnBackup").onclick = ()=>{ bkRefresh(); $("#bkModal").classList.remove("hide"); };
$("#bkClose").onclick = ()=> $("#bkModal").classList.add("hide");
$("#bkCopy").onclick = async ()=>{
  const code = bkEncode();
  try{
    await navigator.clipboard.writeText(code);
    $("#bkMsg").style.color = "var(--green)"; $("#bkMsg").textContent = "已复制到剪贴板（" + (code.length/1024).toFixed(1) + " KB）";
  }catch(e){
    $("#bkInput").value = code;
    $("#bkInput").select();
    $("#bkMsg").style.color = "var(--muted)"; $("#bkMsg").textContent = "已填入下方，请手动复制";
  }
};
$("#bkFile").onclick = ()=>{
  const code = bkEncode();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([code], {type:"text/plain"}));
  a.download = "pae-mcq-progress-" + new Date().toISOString().slice(0,10) + ".txt";
  a.click();
};
$("#bkImport").onclick = ()=>{
  try{
    const data = bkDecode($("#bkInput").value);
    let n = 0;
    Object.keys(data.a || {}).forEach(id => {
      if(!state.answers[id]) n++;
      state.answers[id] = { pick: data.a[id][0], ok: !!data.a[id][1], t: Date.now() };
    });
    save(); render(); bkRefresh();
    $("#bkMsg").style.color = "var(--green)";
    $("#bkMsg").textContent = "导入成功：合并 " + Object.keys(data.a||{}).length + " 条（新增 " + n + " 条）";
  }catch(e){
    $("#bkMsg").style.color = "var(--red)";
    $("#bkMsg").textContent = "导入失败：" + (e.message || "内容无法解析");
  }
};

/* ---- PWA ---- */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

render();
initGate();
