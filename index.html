ct. Useful within 1–2 hours of ingestion, but not antidote.D. Sodium bicarbonate – Incorrect. Used in TCA toxicity or severe metabolic acidosis.E. Atropine – Incorrect. Used in organophosphate poisoning.", "img": []}, {"id": "9f8c1657981843d4", "m": "05", "n": 54, "q": "Vignette: A 6-year-old boy visiting his grandfather suddenly develops vomiting, abdominal pain and bradycardia. ECG shows AV block and laboratory investigation identified a serum potassium of 6.5 mmol/L.Question: What is the most suitable antidote?", "opts": ["A. Calcium gluconate", "B. Digoxin-specific Fab fragments", "C. Magnesium sulfate", "D. Sodium bicarbonate", "E. Atropine alone"], "ans": "B", "ansText": "B. Digoxin-specific Fab fragments", "jx": "Digoxin toxicity: Arrhythmias AV block HyperkalaemiaFab fragments bind circulating digoxin and neutralize toxicity.This is classical digoxin poisoning presenting with arrhythmia, hyperkalaemia , and AV block . Digoxin-specific antibody fragments (Fab) bind and neutralize circulating digoxin, reversing toxicity. Calcium should be avoided due to risk of \"stone heart\" (precipitating severe arrhythmia).Calcium is avoided (“stone heart” risk).", "img": []}, {"id": "2860390abc5f72df", "m": "05", "n": 57, "q": "Vignette: A 9-month-old presents with shallow breathing, pinpoint pupils, and decreased consciousness after ingesting unknown cough mixture.Question: Which antidote should be administered immediately?", "opts": ["A. Flumazenil", "B. Atropine", "C. Naloxone", "D. Physostigmine", "E. Methylene blue"], "ans": "C", "ansText": "C. Naloxone", "jx": "Classic opioid triad: CNS depression Respiratory depression Pinpoint pupilsNaloxone is a competitive opioid receptor antagonist that reverses respiratory depression rapidly.Other options: Flumazenil → benzodiazepine toxicity Atropine → cholinergic poisoning Physostigmine → anticholinergic toxicity Methylene blue → methemoglobinemia", "img": []}, {"id": "d4f8d5d5348ebe40", "m": "05", "n": 66, "q": "Vignette: An 8-year-old boy is brought to the emergency department after collapsing during a 5km run in school . He is tachycardic (HR 140 bpm), tachypnoea (RR 35 breaths per minute), pale, and sweaty.Question: What is the most appropriate initial management step for this child?", "opts": ["A. Start chest compressions", "B. Give IV adrenaline", "C. Provide facial oxygen", "D. Perform full neurological exam", "E. Give antibiotics"], "ans": "C", "ansText": "C. Provide facial oxygen", "jx": "ABC approach: Airway and Breathing first.Compressions only if pulseless.", "img": []}, {"id": "88873a8271c4c548", "m": "05", "n": 68, "q": "Vignette: Two siblings present with slate-gray cyanosis and chocolate-colored lips after eating spinach soup. Their blood appears brown and does not turn red on exposure to air. Arterial blood gas shows normal PaO ₂.Question: What is the most appropriate treatment?", "opts": ["A. Oxygen only", "B. Hydroxocobalamin", "C. Sodium nitrite", "D. Methylene blue", "E. Activated charcoal"], "ans": "D", "ansText": "D. Methylene blue", "jx": "Methemoglobinemia: Iron oxidised to Fe³⁺ Cannot bind oxygen Chocolate-coloured bloodMethylene blue reduces Fe³⁺ back to Fe²⁺.Oxygen alone insufficient.The features are typical of methemoglobinemia , in which haemoglobin is oxidized to ferric iron (Fe³⁺) and cannot carry oxygen. Methylene blue acts as an electron donor via NADPH-methemoglobin reductase, converting methemoglobin back to functional haemoglobin . Oxygen alone is ineffective because the problem is with haemoglobin structure, not oxygen supply.", "img": []}, {"id": "087e4ed097911a2f", "m": "06", "n": 7, "q": "A 13-year-old boy, has developed an acutely painful red scrotum. On examination, his right testis is found to be swollen and lying higher in the scrotum than the left. It is tender on palpation.What is the most important diagnosis to exclude?", "opts": ["A. Epididymitis", "B. Hydrocele", "C. Idiopathic scrotal oedema", "D. Torsion of the appendage of the testes (hydatid of Morgagni)", "E. Torsion of the testis"], "ans": "E", "ansText": "E. Torsion of the testis", "jx": "1. This diagnosis is not the most common or dangerous cause of an acute red scrotum in this age group.2. A hydrocele should not be red or present acutely.3. This is not usually painful.4. More common than torsion but not as dramatic clinical features. Usually before puberty.5. Correct. Surgical exploration is mandatory unless torsion can be excluded, because it must be relieved within 6–12 hours of the onset of symptoms for there to be a good chance of testicular viability.", "img": []}, {"id": "88cee7616f3ce514", "m": "06", "n": 10, "q": "A 15-year-old boy presents to the emergency department with extreme pain in his scrotum that began suddenly upon waking five hours earlier. He has recently become sexually active and denies use of barrier protection. On examination, his scrotum is erythematous, swollen, and exquisitely tender, particularly on the right. There is no discharge from the penis and no indication of trauma. Support of the right testicle through a lifting maneuver does not provide relief, but the entire testicle is tender to palpation.Which of the following is the most appropriate next step in management?", "opts": ["A. Intramuscular ceftriaxone injection and discharge home", "B. DNA PCR for Neisseria gonorrhoeae and Chlamydia", "C. Urinalysis and culture", "D. Ibuprofen and observation for 24 hours", "E. Doppler scan of testicles to assess blood flow"], "ans": "E", "ansText": "E. Doppler scan of testicles to assess blood flow", "jx": "1. Ceftriaxone is often used to treat gonorrhea, in combination with either doxycycline or azithromycin to treat chlamydia. Although the patient has been having unprotected sexual intercourse, putting him at an increased risk for contracting a STI, he would either be asymptomatic or have painful urination with accompanying penile discharge. His clinical presentation does not support that of an STI. Furthermore, his exam does not support epididymitis, which would also be treated with the above antibiotics, due to a negative Prehn's sign (lifting of the affected testicle relieves pain) and no localized tenderness along the epididymis.2. Obtaining PCR studies for common sexually transmitted infections is not appropriate in the acute setting. Testing for STIs and advising of safe sex practices should be conducted after his more urgent problem is addressed.3. While obtaining a urine sample and culture to diagnose a urinary tract infection is a valid option, this would delay management of the patient's more urgent issue. Furthermore, the patient does not report complaints often associated with a urinary tract infection, including dysuria and urinary frequency and urgency. While UTIs are relatively common in women, they are less common in men.4. Although pain management is important for patients experiencing discomfort, merely observing this patient would be inappropriate given the nature of his presentation and likely occurrence of testicular torsion for which early surgical intervention improves outcomes.5. Correct This patient's presentation is consistent with testicular torsion. The acute onset of severe testicular and/or groin pain with associated swelling, high riding and horizontal lie of the affected testicle, and absence of cremasteric reflex in an otherwise healthy adolescent male should direct thinking towards this diagnosis. The primary goal of care if torsion is suspected is to restore blood flow to the testicle in hopes of preserving its viability. Doppler ultrasound should be performed immediately to assess blood flow. If suspicion is very high, urology should be consulted immediately, even before results of the ultrasound are available. If blood flow is decreased or absent, the patient should be managed emergently in the operating room. Increased blood flow, epididymal tenderness, and positive Prehn's sign would suggest epididymitis as a diagnosis.", "img": []}, {"id": "6401d8faba3ac87b", "m": "06", "n": 12, "q": "A 2-month-old infant, is referred urgently to outpatients because of an intermittent swelling in both groins as shown in picture below.", "opts": ["A. Needs immediate emergency surgical repair", "B. Needs surgical repair promptly on next routine surgical list", "C. Place on the waiting list for routine surgical repair", "D. Reassess at 1 year of age to determine if surgery is still required", "E. Reassure that this will resolve spontaneously"], "ans": "B", "ansText": "B. Needs surgical repair promptly on next routine surgical list", "jx": "1. This boy has bilateral inguinal hernias, which are present intermittently and therefore are reducible and do not pose an immediate threat to the contents of the hernia.2. Correct. Repair should be done on the next routine operating list because of the risk of strangulation.3. The risk of strangulation is high in infants. Therefore surgery should be done promptly.4. The hernia is due to a patent processus vaginalis, which will not close spontaneously. Surgery should be done promptly to avoid strangulation.5. The hernia is due to a patent processus vaginalis, which will not close spontaneously. Therefore surgery is necessary.", "img": ["images/6401d8faba3ac87b_0.jpg"]}, {"id": "2f3c488265c6a01c", "m": "07", "n": 8, "q": "A 14-year-old boy with a known seizure disorder is brought by his parents to the emergency department with concern for a prolonged seizure. He was given lorazepam intravenously in the ambulance and a second dose following arrival to the emergency department without cessation of the seizure. His heart rate is 140/min, blood pressure is 135/86 mm Hg, respiration rate is 12/min, and oxygen saturations of 85% with a nonrebreather mask. Physical examination is notable for generalized tonic clonic movement with left eye deviation. He is unresponsive to tactile stimulus, and his seizure duration is estimated at 15 minutes.Which of the following is the most appropriate next step in management of his condition?", "opts": ["A. Basic metabolic panel", "B. Electroencephalogram (EEG)", "C. Endotracheal intubation", "D. Intravenous midazolam", "E. Intravenous phenytoin"], "ans": "C", "ansText": "C. Endotracheal intubation", "jx": "1. While it will be useful to know about any electrolyte abnormalities that may be the cause or trigger of the seizure, this can be delayed until after an airway is secured.2. EEGs are often used to assist in seizure diagnosis and management but are not performed when a patient is clinically unstable. After airway management and empiric seizure therapy, an EEG may be warranted.3. Correct. Rapid sequence intubation (RSI) is necessary in this patient given his decreased respiratory effort and hypoxemia using supplemental oxygen. A patient who is unable to protect the airway while manifesting respiratory problems is at risk for further clinical decompensation.4. Although intravenous midazolam and other benzodiazepines are important in seizure management, this patient is hypoxemic and hypopneic with the aid of supplemental oxygen support via a nonrebreather and requires emergent management of his airway prior to proceeding with additional seizure treatment.5. Fosphenytoin or phenytoin are often used following benzodiazepines if seizures continue. The patient first needs placement of a definitive airway.", "img": []}, {"id": "1ebc67b814ef1801", "m": "07", "n": 9, "q": "A 15-month-old boy had been unwell with a runny nose and cough for a day when his father brings him to the emergency department. At lunch he suddenly became stiff, his eyes rolled upwards and both his arms and legs started jerking for 2 minutes. He felt very hot at the time. When examined 2 hours later, he has recovered fully. This is the first time this has happened. He has a normal neurological examination and is acquiring his developmental milestones normally. He has no other medical problems. The triage nurse performed a blood glucose test, which indicated a glucose level of 4.2 mmol/L (within normal range).What would be the most appropriate investigation?", "opts": ["A. CT scan of the brain", "B. ECG", "C. EEG (electroencephalography)", "D. No investigation required", "E. Oral glucose tolerance test"], "ans": "D", "ansText": "D. No investigation required", "jx": "1. Persistent signs, particularly asymmetric ones, should prompt imaging.2. Cardiac causes usually occur ‘out of the blue’ or following a specific trigger: exercise (hypertrophic obstructive cardiomyopathy) or shock (ventricular tachycardia). They do not usually occur in conjunction with a fever.3. Will be ‘abnormal’ in a significant proportion of normal children. This will lead to significant ‘overdiagnosis’ of epilepsy. Not indicated here.4. Correct. He had a simple febrile seizure, secondary to a respiratory tract infection. A febrile seizure is a clinical diagnosis and does not require investigation. Indeed, there is no confirmatory test.5. This is not required as the blood glucose is normal. It is rarely required in children to diagnose diabetes.", "img": []}, {"id": "3f06894456dc79c4", "m": "09", "n": 42, "q": "Vignette: A 2-year-old boy presents with intermittent severe abdominal pain. He draws up his legs and cries during episodes. Between episodes he appears tired. His parents report vomiting and passage of red, jelly-like stool. On examination, a sausage-shaped mass is felt in the right abdomen.Question: What is the most likely diagnosis?", "opts": ["A. Appendicitis", "B. Intussusception", "C. Gastroenteritis", "D. Meckel diverticulum", "E. Acute pancreatitis"], "ans": "B", "ansText": "B. Intussusception", "jx": "Common between 6 months and 3 years.A. Appendicitis – Incorrect. Pain becomes constant and localised ; currant jelly stool is not typical.B. Intussusception – Correct. Classic triad: Intermittent colicky pain “Currant jelly” stool (blood + mucus) Sausage-shaped abdominal massC. Gastroenteritis – Incorrect. Would cause diffuse pain and watery diarrhoea , not episodic pain with bloody mucus stool.D. Meckel diverticulum – Incorrect. May cause painless rectal bleeding, but not episodic colicky pain with palpable mass.E. Acute pancreatitis – Incorrect. Rare in toddlers; presents with epigastric pain radiating to back.", "img": []}, {"id": "fe85e4c9f53a9261", "m": "09", "n": 56, "q": "Vignette: A 9-month-old girl presents with severe dehydration due to gastroenteritis. She is lethargic, has a dry mouth, no tears when she cries, and a capillary refill time of 4 seconds.Question: What is the most appropriate initial treatment for this infant?", "opts": ["A. Oral Rehydration Solution", "B. Intravenous fluid resuscitation", "C. Intravenous antibiotics", "D. Intravenous anti-emetics", "E. Intravenous Glucose"], "ans": "B", "ansText": "B. Intravenous fluid resuscitation", "jx": "Severe dehydration requires rapid IV fluid resuscitation.", "img": []}, {"id": "487a31482ea27247", "m": "10", "n": 53, "q": "Vignette: A 6-month-old infant with severe congenital heart disease is being considered for end-of-life care. The parents are struggling with the decision to withdraw life-sustaining treatment.Question: What should be emphasized to the parents during this discussion?", "opts": ["A. The importance of continuing all treatments till the end", "B. The need to prioritise the child’s comfort and dignity", "C. Avoid discussing end of life issues", "D. Discuss the risks associated with withdrawing treatment", "E. The necessity of involving all extended family members in the decision"], "ans": "B", "ansText": "B. The need to prioritise the child’s comfort and dignity", "jx": "Child’s comfort and best interests are central.", "img": []}, {"id": "05b52ef8147172e7", "m": "10", "n": 58, "q": "Vignette: A healthcare team is discussing a 5-year-old girl with a terminal brain tumour. The parents are anxious about her prognosis and want to know how to prepare for the end of life.Question: What is the most important aspect of communication with the family regarding the child's prognosis?", "opts": ["A. Avoid discussing difficult topics to prevent parental distress", "B. Provide general vague information to avoid parental blame", "C. Encourage open dialogue with parents to discuss their concerns and wishes", "D. Focus only on potential medical interventions available", "E. Give statistics only regarding cure rates and estimated life expectancy"], "ans": "C", "ansText": "C. Encourage open dialogue with parents to discuss their concerns and wishes", "jx": "Open communication: Builds trust Allows shared decision-making Respects parental autonomyAvoidance or false reassurance damages trust.", "img": []}, {"id": "86d2c09bd7c7b2b2", "m": "10", "n": 61, "q": "Vignette: A paediatric doctor is preparing to discuss the family's wishes regarding resuscitation status for their child with a life-limiting condition. The parents have expressed uncertainty about what they want.Question: What approach should the doctor take to facilitate this discussion?", "opts": ["A. Assume parents want full interventions", "B. Use hypothetical scenarios to explore their preferences", "C. Avoid discussing different levels of care to confuse parents", "D. Wait for acute deterioration before discussing full resuscitation", "E. Provide a detailed list of all possible interventions and level of care"], "ans": "B", "ansText": "B. Use hypothetical scenarios to explore their preferences", "jx": "Scenario discussion helps: Clarify values Explore fears Facilitate informed decisions", "img": []}, {"id": "acbacea24fc33098", "m": "10", "n": 62, "q": "Vignette: A terminally ill teenager is experiencing significant pain and distress. The healthcare team is discussing the appropriate management strategies to ensure comfort.Question: What is the most effective initial approach to managing this teenager's symptoms?", "opts": ["A. Increase fluid administration", "B. Administer high-dose opioids", "C. Suggest Traditional Chinese Medicine therapy", "D. Provide cognitive behavioural therapy", "E. Provide physiotherapy"], "ans": "B", "ansText": "B. Administer high-dose opioids", "jx": "Opioids are first-line for severe cancer pain. Adequate analgesia is ethical priority.", "img": []}, {"id": "1e90009cc1a42f5e", "m": "11", "n": 31, "q": "An 8-year-old boy presents with joint pain. His mother reports that since yesterday he has been refusing to walk, as his legs are so painful. On examination his temperature is 37°C and his heart rate is 100 beats/min. He is settled at rest and playing a computer game on his iPad. On further examination you notice a rash over his lower limbs, buttocks, and forearms (Figure). The rash comprises some large (5–15 mm), red, raised lesions, and multiple pin-point lesions, which do not blanch on pressure. His peripheries are warm and he has a good pulse volume with a normal capillary refill time. There is some generalized swelling around his knees and ankles. He has pain on passive movement of both knees and ankles.What is the most likely diagnosis?", "opts": ["A. Henoch– Schönlein purpura", "B. Immune thrombocytopenic purpura", "C. Meningococcal septicaemia", "D. Reactive arthritis (transient synovitis)", "E. Systemic-onset juvenile idiopathic arthritis"], "ans": "A", "ansText": "A. Henoch– Schönlein purpura", "jx": "1. Correct. Henoch– Schönlein purpura is the most common vasculitis of childhood, and presents with a purpuric rash over the lower legs and buttocks, but which can also involve the extensor surface of the elbows. It is often associated with arthritis of the ankles or knees. In this case the child presented with the arthritis rather than the rash. Other features are abdominal pain, haematuria and proteinuria.2. The raised rash suggests a vasculitis rather than purpura from low platelets. Also the distribution in Henoch– Schönlein purpura and immune thrombocytopenic purpura is different.3. Meningococcal sepsis is unlikely as he is afebrile, and the purpura is restricted to his lower limbs and elbows, in a distribution characteristic of Henoch– Schönlein purpura.4. Reactive arthritis is unlikely as there is usually a preceding or accompanying infection, and the rash would not have this distribution and certainly would not be purpuric.5. Systemic-onset juvenile idiopathic arthritis is accompanied by a high fever in a child who is systemically unwell; the salmon-pink coloured rash is widespread and blanches.", "img": ["images/1e90009cc1a42f5e_0.jpg"]}, {"id": "21f9d4d381b53bbe", "m": "11", "n": 32, "q": "An 8-year-old boy presents with low-grade fever, arthritis, colicky abdominal pain, and a purpuric rash limited to the lower extremities. Laboratory studies show a guaiac-positive stool, and urinalysis shows red blood cell casts and a mild proteinuria. Platelet count is 210,000/ μL.Which is the most likely underlying mechanism of this child's disease?", "opts": ["A. Activation of autoreactive T and B cells against nucleic acids and their binding proteins", "B. Antigen exposure stimulating immunoglobulin complexes to be deposited in target organs", "C. Autoantibodies to platelet membrane glycoproteins and phagocytosis by splenic macrophages", "D. In situ immune complex formation within glomeruli", "E. Intracellular bacteria propagating within the endothelial cells lining vasculature"], "ans": "B", "ansText": "B. Antigen exposure stimulating immunoglobulin complexes to be deposited in target organs", "jx": "1. This describes the underlying mechanism in systemic lupus erythematosus (SLE). Autoreactive cells produce antibodies such as antinuclear antibodies (highly sensitive but poorly specific), anti-dsDNA antibodies and anti-Smith antibodies (both highly specific but poorly sensitive), and more. SLE is associated with fevers, arthralgia, proteinuria, and rash, but the rash typically has a malar or \"butterfly\" distribution across the face. Symptoms usually begin in young adulthood. Treatment is highly dependent on manifestations and severity of disease, and includes lifestyle modifications, anti-inflammatory and immunosuppressant medications, and treatment of comorbid conditions.2. Correct This describes Henoch-Schönlein purpura (HSP), the most common vasculitis in childhood. It is characterized by leukocytoclastic vasculitis and IgA deposition in the small vessels of the skin, joints, gastrointestinal tract, and kidney. It classically occurs 10 days after an upper respiratory infection, but has also occurred after insect bites, immunization, medication usage, or with no identifiable trigger. The hallmark of HSP is its rash: palpable purpura beginning as pink macules and developing into petechiae or raised purpura of the lower extremities. Affected patients have normal platelet counts. Gastrointestinal manifestations occur in about 85% of patients and commonly include colicky pain, melanotic stools, and hematemesis. More rarely, intussusception, perforation, and pancreatitis can occur. Joint swelling occurs in about 75% of patients and may be arthritis or periarticular swelling. Renal involvement occurs in about 50% of patients and can range from mild hematuria or proteinuria to end-stage renal disease. Berger disease (IgA glomerulonephritis) is believed to be the renal manifestations of HSP without the rash. The majority of HSP patients self-resolve within 4 weeks, but up to 40% may have at least one recurrence. Treatment is mainly supportive with hydration, pain relief, and bowel rest, but a course of corticosteroids with a slow taper can be used for severe cases.3. This describes acute idiopathic thrombocytopenic purpura (ITP), an autoimmune phenomenon characterized by thrombocytopenia and a purpuric rash which is most common in ages 2-6 years. A viral prodrome commonly occurs within 3 weeks of its onset. In most cases, antibodies against platelet membrane glycoproteins coat platelets and render them susceptible to opsonization and phagocytosis by splenic macrophages. This leads to a platelet count that typically drops below 20,000/ μL. A petechial rash develops, primarily on the pressure points where there may be microscopic vessel damage, such as where the elastic band of clothing touches the skin. The course is self-limited, and treatment is supportive. Steroids and IV immunoglobulin therapy can be given in patients with active bleeds.4. This describes the most likely mechanism in poststreptococcal glomerulonephritis (PSGN), although several mechanisms have been proposed. PSGN is thought to be caused by specific nephritogenic strains of group A beta-hemolytic streptococcus. It usually occurs 10 days after strep pharyngitis or scarlet fever, or 3 weeks after group A strep skin infection. The clinical presentation varies from asymptomatic microscopic hematuria to acute nephritic syndrome, with proteinuria, edema, hypertension, elevation in serum creatinine, and red to brown urine. It does not typically involve a rash. Treatment is usually supportive, but those with evidence of persistent strep infection should receive a course of antibiotic therapy.5. This describes the mechanism of Rocky Mountain spotted fever (RMSF), the most lethal and frequently reported rickettsial illness in the United States. It is spread to humans by the Dermacentor tick. The R. rickettsii bacterium, a gram negative, obligate intracellular pathogen, multiplies in the endothelial cells of arterioles and venules, causing a vasculitis. Initial signs of RMSF include fever, headache, and myalgias, followed by a maculopapular-turned-petechial rash with a “centripetal” spread, meaning it begins in the extremities and spreads toward the trunk. Thrombocytopenia is present and becomes more severe throughout the course of the disease. Abdominal pain, cough, and edema, especially in children, may also be present. Curative treatment is oral or IV doxycycline ‐ it is one of the only instances in which a tetracycline is recommended in a child. Chloramphenicol is recommended for pregnant women.", "img": ["images/21f9d4d381b53bbe_0.jpg"]}, {"id": "e6412f387a859818", "m": "12", "n": 59, "q": "Vignette: A junior doctor new to paediatrics takes an adult-style medical history for an 8 year old child with developmental delay, focusing only on the current illness.Question: Which key aspect has she most likely omitted?", "opts": ["A. Travel", "B. Past surgical history", "C. Growth & developmental history", "D. Family history", "E. Medication history"], "ans": "C", "ansText": "C. Growth & developmental history", "jx": "Paediatric assessment must always include: Growth parameters Milestones Nutrition Family contextChildren are not little adults; every paediatric assessment must include growth, nutrition, developmental milestones, and family environment. Adult oriented questions (e.g., alcohol intake, employment) are irrelevant, while developmental history guides diagnosis and health promotion.", "img": []}, {"id": "e26c8cc0bf78e307", "m": "12", "n": 70, "q": "Vignette: You are about to examine a 3 year old boy with a cough. When you introduce yourself, he hides behind his mother and refuses to speak.Question: What is the most appropriate initial approach to help establish cooperation?", "opts": ["A. Examine immediately to reduce distress to child", "B. Get down to child’s level and speak gently to him in simple language", "C. Restrain child to save time", "D. Ignore child, speak to mother only as child do not understand", "E. Provide technical explanation to both mother and child"], "ans": "B", "ansText": "B. Get down to child’s level and speak gently to him in simple language", "jx": "A developmentally sensitive approach considers the child’s age and fear of strangers. Gaining trust through eye level communication, simple language, and gentle interaction helps cooperation. Restraint or ignoring the child increases anxiety and damages rapport.", "img": []}, {"id": "3ba688d6e8b8adee", "m": "13", "n": 29, "q": "A term baby girl is brought in by her mother for concern about vomiting and respiratory distress that occurs with breastfeeding. An abdominal radiograph shows a double bubble sign. In preparation for operative repair, an echocardiogram is performed and shows an endocardial cushion defect.Based on these findings, which of the following is the infant’s most likely underlying diagnosis?", "opts": ["A. Congenital rubella syndrome", "B. Fetal alcohol syndrome", "C. Isotretinoin embryopathy", "D. Trisomy 21", "E. Turner syndrome"], "ans": "D", "ansText": "D. Trisomy 21", "jx": "1.Congenital rubella syndrome causes deafness, cataracts, and patent ductus arteriosus with a blueberry muffin rash.2.Fetal alcohol syndrome is notable for facial dysmorphisms and neurobehavioral disorders. Cardiac defects are typically midline, such as atrial and ventricular septal defects, as well as conotruncal defects such as truncus arteriosus or tetralogy of Fallot.3.Isotretinoin is a teratogen that causes severe embryopathy affecting the central nervous system. It can sometimes cause conotruncal heart defects.4.Correct Endocardial cushion defects affect the atrial and ventricular septa, as well as tissues that would give rise to the mitral and tricuspid valves. Endocardial cushion defects occur in about 40% of newborns with Down syndrome (trisomy 21). Duodenal atresia is another important congenital anomaly that occurs in Down syndrome.5.Turner syndrome (XO) is associated with bicuspid aortic valve and aortic coarctation, as well as atrial and ventricular septal defects. It is not associated with duodenal atresia.", "img": []}, {"id": "f2a3f3e2cdbef069", "m": "14", "n": 69, "q": "Vignette: While seeing a 10 month old girl with feeding problems, her mother becomes tearful and says she feels “to blame” for her baby’s slow weight gain.Question: What is the most appropriate response?", "opts": ["A. Quick reassurance and move on to discuss formula options", "B. Explore feeding and psychosocial factors together", "C. Refer immediately to dietician for assessment", "D. Refer immediately to speech and language therapist for potential oral sensitivity problem", "E. Ignore maternal emotion and continue the consultation"], "ans": "B", "ansText": "B. Explore feeding and psychosocial factors together", "jx": "Empathetic, family-centred approach improves care.Paediatric practice should be family centred and empathetic. Involving caregivers in information gathering validates their concerns and identifies psychosocial contributors.Rapid reassurance or early delegation may overlook key issues and erode trust.", "img": []}]};
const KEY = "pae_mcq_v1";
const L = ["A","B","C","D","E","F","G"];

let state = {answers:{}, cat:"all", wrongOnly:false, idx:0};
try{
  const raw = localStorage.getItem(KEY);
  if(raw){ const s = JSON.parse(raw); state = Object.assign(state, s); }
}catch(e){}

const $ = s => document.querySelector(s);
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

function pool(){
  let qs = DATA.questions.filter(q => state.cat==="all" || q.m===state.cat);
  if(state.wrongOnly) qs = qs.filter(q => state.answers[q.id] && !state.answers[q.id].ok);
  return qs;
}
function cur(){ const p = pool(); return p[Math.min(state.idx, Math.max(0,p.length-1))]; }

function stats(){
  const all = DATA.questions, done = all.filter(q=>state.answers[q.id]);
  const ok = done.filter(q=>state.answers[q.id].ok).length;
  return {all:all.length, done:done.length, ok, acc: done.length? Math.round(ok/done.length*100):null};
}

function renderCats(){
  const box = $("#cats");
  const s = stats();
  let h = `<div class="cathead">课件模块</div>`;
  h += catRow("all","全部题目", s.done, s.all, state.cat==="all");
  DATA.modules.forEach(m=>{
    const qs = DATA.questions.filter(q=>q.m===m.c);
    const dn = qs.filter(q=>state.answers[q.id]).length;
    h += catRow(m.c, m.t.replace(/^\d+\s*/,""), dn, qs.length, state.cat===m.c);
  });
  box.innerHTML = h;
  box.querySelectorAll(".cat").forEach(el=>{
    el.onclick = ()=>{ state.cat = el.dataset.c; state.idx = 0; save(); render(); };
  });
}
function catRow(code,label,dn,total,on){
  return `<button class="cat${on?" on":""}" data-c="${code}">
    <span>${label}</span><span class="cnt">${total?`<span class="${dn?"dn":""}">${dn}</span>/${total}`:"0"}</span></button>`;
}

function renderHeader(){
  const s = stats();
  $("#done").textContent = s.done;
  $("#total").textContent = s.all;
  $("#acc").textContent = s.acc===null ? "—" : s.acc + "%";
  $("#fill").style.width = (s.done/s.all*100).toFixed(1) + "%";
  $("#btnWrong").classList.toggle("on", state.wrongOnly);
}

function render(){
  renderCats(); renderHeader();
  const stage = $("#stage");
  const p = pool();
  if(!p.length){
    stage.innerHTML = `<div class="empty"><b>${state.wrongOnly?"错题本是空的 🎉":"这个模块暂无题目"}</b>
      ${state.wrongOnly?"还没有答错的题，继续保持。":"本次抓到的 71 题里没有覆盖到这个课件模块。"}</div>`;
    return;
  }
  state.idx = Math.min(state.idx, p.length-1);
  const q = p[state.idx];
  const rec = state.answers[q.id];
  const mod = DATA.modules.find(m=>m.c===q.m);
  const modQs = DATA.questions.filter(x=>x.m===q.m);
  const inMod = modQs.findIndex(x=>x.id===q.id) + 1;

  let opts = q.opts.map((t,i)=>{
    const k = L[i];
    let cls = "opt";
    if(rec){
      cls += " locked";
      if(k===q.ans) cls += " right";
      else if(k===rec.pick) cls += " wrong";
    }
    let mark = "";
    if(rec){
      if(k===q.ans) mark = `<span class="mark" style="color:var(--green)">✓</span>`;
      else if(k===rec.pick) mark = `<span class="mark" style="color:var(--red)">✕</span>`;
    }
    return `<button class="${cls}" data-k="${k}" ${rec?"disabled":""}>
      <span class="k">${k}</span><span class="t">${esc(t)}</span>${mark}</button>`;
  }).join("");

  const figs = (q.img||[]).map(src=>`<img src="${src}" alt="配图">`).join("");

  stage.innerHTML = `
    <div class="qhead">
      <span class="badge">${mod?mod.t:q.m}</span>
      <span class="qnum">第 ${state.idx+1} / ${p.length} 题 · 本模块 ${inMod}/${modQs.length}</span>
      ${rec?`<span class="state ${rec.ok?"ok":"no"}">${rec.ok?"✓ 答对":"✕ 答错"}</span>`:""}
    </div>
    <div class="card">
      <p class="stem">${fmt(q.q)}</p>
      ${figs?`<div class="figure">${figs}</div>`:""}
      <div class="opts">${opts}</div>
      <div class="jx${rec?" open":""}" id="jx">
        <div class="ans"><i>正确答案</i><span>${esc(q.ansText || q.ans)}</span></div>
        <div class="lab">解析</div>
        <p>${esc(q.jx || "（此题未提供解析）")}</p>
      </div>
    </div>
    <div class="nav">
      <button class="nbtn" id="prev" ${state.idx===0?"disabled":""}>← 上一题</button>
      <button class="nbtn primary" id="next">${state.idx>=p.length-1?"回到第一题":"下一题 →"}</button>
      <span class="spacer"></span>
      ${state.cat!=="all"?`<button class="nbtn ghost" id="clearCat">清空本模块</button>`:""}
      ${rec?`<button class="nbtn ghost" id="redo">重做本题</button>`:""}
    </div>
    <div class="kbd"><kbd>1</kbd>–<kbd>5</kbd> 选答案 · <kbd>←</kbd><kbd>→</kbd> 切题 · 选完立即出解析</div>`;

  stage.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{ pick(el.dataset.k); };
  });
  $("#prev").onclick = ()=>{ state.idx--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  $("#next").onclick = ()=>{
    state.idx = state.idx>=p.length-1 ? 0 : state.idx+1; save(); render();
    window.scrollTo({top:0,behavior:"smooth"});
  };
  const rd = $("#redo"); if(rd) rd.onclick = ()=>{ delete state.answers[q.id]; save(); render(); };
  const cc = $("#clearCat");
  if(cc) cc.onclick = ()=>{
    const snap = JSON.parse(JSON.stringify(state));
    const ids = DATA.questions.filter(x=>x.m===state.cat).map(x=>x.id);
    ids.forEach(id=>delete state.answers[id]);
    state.idx = 0; save(); render();
    toast("已清空本模块的作答记录", ()=>{ state = snap; save(); render(); });
  };
}

function pick(k){
  const q = cur(); if(!q || state.answers[q.id]) return;
  const ok = (k === (q.ans||"").trim().charAt(0));
  state.answers[q.id] = {pick:k, ok, t:Date.now()};
  save(); render();
  const jx = $("#jx"); if(jx){ setTimeout(()=>jx.classList.add("open"), 30); }
  const card = document.querySelector(".card");
  if(card){ const r = jx.getBoundingClientRect(); if(r.bottom > window.innerHeight-40) jx.scrollIntoView({block:"nearest",behavior:"smooth"}); }
}

function esc(s){ return String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){
  return esc(s).replace(/\b(Vignette|Question|Scenario)\s*:/gi, m=>`<em>${m}</em>`);
}

$("#btnWrong").onclick = ()=>{ state.wrongOnly = !state.wrongOnly; state.idx = 0; save(); render(); };

/* ---- 一键清空（带撤销） ---- */
let undoFn = null, undoTimer = null;
function toast(msg, fn){
  $("#toastMsg").textContent = msg;
  $("#toastUndo").style.display = fn ? "" : "none";
  undoFn = fn || null;
  $("#toast").classList.add("on");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>{ $("#toast").classList.remove("on"); undoFn = null; }, 6000);
}
$("#toastUndo").onclick = ()=>{
  if(undoFn){ undoFn(); undoFn = null; }
  $("#toast").classList.remove("on");
};
$("#btnReset").onclick = ()=>{
  const snap = JSON.parse(JSON.stringify(state));
  state.answers = {}; state.idx = 0; state.wrongOnly = false; save(); render();
  toast("已清空全部作答记录，可以重新刷了", ()=>{ state = snap; save(); render(); });
};

/* ---- 门禁问答 ---- */
const GATE_KEY = "pae_gate_v1";
function gatePassed(){ try{ return localStorage.getItem(GATE_KEY) === "1"; }catch(e){ return false; } }
function initGate(){
  const gate = $("#gate");
  if(gatePassed()){ gate.classList.add("hide"); return; }
  const inp = $("#gateInput"), btn = $("#gateBtn"), msg = $("#gateMsg"), box = $("#gatebox");
  const OK = ["许先佑","xuxianyou","xianyouxu","xianyou","xu"];
  const norm = s => (s||"").replace(/[\s·.，,、]/g,"").toLowerCase();
  const submit = ()=>{
    const v = norm(inp.value);
    if(v && OK.some(a=>norm(a) === v)){
      msg.className = "gok"; msg.textContent = "对了，就是那位 ✅";
      try{ localStorage.setItem(GATE_KEY, "1"); }catch(e){}
      setTimeout(()=>gate.classList.add("hide"), 650);
    }else{
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      msg.className = "gmsg";
      msg.textContent = v ? "不对哦，再想想 🤔" : "先输入答案";
      inp.focus();
    }
  };
  btn.onclick = submit;
  inp.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
  setTimeout(()=>inp.focus(), 400);
}
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!$("#gate").classList.contains("hide")) return;
  const p = pool(); if(!p.length) return;
  if(/^[1-5]$/.test(e.key)){ const k = L[+e.key-1]; if(k) pick(k); }
  else if(e.key==="ArrowLeft" && state.idx>0){ state.idx--; save(); render(); }
  else if(e.key==="ArrowRight"){ state.idx = state.idx>=p.length-1?0:state.idx+1; save(); render(); }
});

render();
initGate();
</script>
</body>
</html>
