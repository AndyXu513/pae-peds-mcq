l oxygen and ventilatory support has decreased, as measured by improvements in arterial blood gases and pH. She is maintained on low ventilator settings. However, at 2 weeks of age, her condition deteriorates, and her need for supplemental oxygen again increases. Physical examination is positive for bilateral, scattered crackles and rales on pulmonary auscultation as well as a systolic murmur. Blood cultures show no growth. A complete blood count shows a white blood count of 10,000/mm3, with 72% polymorphonuclear neutrophils and 12% lymphocytes. The infant remains afebrile. A chest radiograph reveals complete opacification of both lung fields, obscuring the heart borders and outline of the diaphragm. Which of the following is the likely cause of the deterioration of the patient’s condition?", "opts": ["A. Closure of the ductus arteriosus", "B. Development of a left-to-right shunt", "C. Development of a pneumothorax", "D. Exposure to a bacterial respiratory pathogen", "E. Exposure to a viral respiratory pathogen"], "ans": "B", "ansText": "B. Development of a left-to-right shunt", "jx": "1.Closure of the ductus arteriosus causes hypoxemia in children with certain heart or circulatory defects (e.g., parallel circulation). However, supplemental oxygen would be unlikely to help in these cases, and cyanosis would be present. It is more likely in this case that the child’s initial respiratory distress was caused by lung immaturity than by a congenital heart defect.\n2.Correct Patent ductus arteriosus is a common problem in premature infants because the smooth muscle in the wall of the preterm ductus is less responsive to high partial pressure of oxygen and therefore less likely to constrict after birth. A left-to-right shunt through the patent ductus arteriosis, developing usually in the second week of life in many premature, mechanically ventilated infants, can cause pulmonary hypertension and subsequent pulmonary edema. This would account for the increased oxygen demand and the chest radiograph findings in the absence of signs of infection seen in this infant.\n3.Pneumothoraces are common in mechanically ventilated newborns, particularly with high ventilator settings. However, a pneumothorax would most likely be visible on a chest radiograph as a fully radiolucent area in at least part of one lung field, and diaphragmatic and mediastinal shift could occur. It would not cause opacification of both lung fields and obscure the heart border as seen in this infant.\n4.Infection with bacterial pathogens such as Pseudomonas is common in patients on ventilators. Although this could account for increased respiratory distress and would not necessarily be found in a blood culture, it would be unlikely to manifest as pulmonary edema and generalized atelectasis and would likely cause some other sign of infection (e.g., sepsis with hypotension).\n5.Although newborns are susceptible to many viral pathogens, such pathogens are not the most likely cause of the child’s deterioration at this point. Although passive immunity is not as protective for premature infants as for full-term infants, many newborns may have at least partial protection against many viruses. Additionally, viral respiratory pathogens are unlikely to cause pulmonary edema.", "img": []}, {"id": "af39847bcb132e30", "m": "03", "letter": "C", "inMod": 2, "code": "C2", "q": "A newborn baby has recently been delivered. The midwife requests an urgent paediatric review of the baby because she cannot tell if the baby is male or female （ See picture below ）. The parents are asking what sex their baby is. What should you tell them?", "opts": ["A. You are unable to tell if the baby is male or female, and tell the parents it is likely to be a mixture of both sexes, i.e. ovotesticular disorder of sex development （DSD, or hermaphroditism）", "B. You are unable to tell right now and a detailed assessment of the baby including scans and blood tests will be needed before a specialist can tell them", "C. You are unable to tell right now but will be able to assign a sex as soon as you get the baby's chromosomes back", "D. You think it is likely to be raised as a girl so tell them the baby should be named as a female on the birth certificate pending the results", "E. You think it is likely to be a boy so tell them the child should be named as a male on the birth certificate pending the results"], "ans": "B", "ansText": "B. You are unable to tell right now and a detailed assessment of the baby including scans and blood tests will be needed before a specialist can tell them", "jx": "1.This is extremely rare. It is usually possible to assign the infant a sex after assessment of phenotype, sex hormones and ultrasound scans of internal structures and gonads are performed.\n2.Correct. A detailed assessment by medical, surgical and psychological specialists needs to be performed followed by a full discussion with the parents before the infant is assigned a sex.\n3.Sexuality is complex, and depends on more than the baby's phenotype, chromosomes and hormone levels.\n4.If there is abnormal sexual differentiation at birth, do not guess the infant's gender. A detailed assessment needs to be performed.\n5.If there is abnormal sexual differentiation at birth, do not guess the infant's gender. A detailed assessment needs to be performed.", "img": ["images/af39847bcb132e30_0.jpg"]}, {"id": "aefb8726291456ca", "m": "03", "letter": "C", "inMod": 3, "code": "C3", "q": "A 3-week-old neonate presents with fever, irritability, and poor feeding. Examination reveals a bulging fontanelle. Lumbar puncture shows WBC 1100/mm³ (90% neutrophils), low glucose (0.8 mmol/L), and high protein. What is the most appropriate antibiotic regimen for this baby?", "opts": ["A. Doxycycline", "B. Ampicillin + Gentamicin", "C. Vancomycin", "D. Acyclovir + Gentamicin", "E. Ceftriaxone"], "ans": "B", "ansText": "B. Ampicillin + Gentamicin", "jx": "Empiric neonatal meningitis therapy: Covers GBS, E. coli, Listeria Ampicillin covers GBS and Listeria Gentamicin covers Gram-negativesCeftriaxone avoided in neonates due to bilirubin displacement risk.", "img": []}, {"id": "18e85b93fa0ca16f", "m": "03", "letter": "C", "inMod": 4, "code": "C4", "q": "A 7-month-old male infant was preterm, born at 28 weeks' gestation, birthweight 970 g, and whose family is from Cambodia. He is seen in a paediatric clinic because of vomiting. He had been seen regularly by a doctor who was treating him for gastro-oesophageal reflux. He has always vomited but this has been getting worse and his mother has noticed his eye movements are not normal. His examination findings can be seen in picture below. What is the most likely underlying cause for these findings?", "opts": ["A. Aqueduct stenosis", "B. Hydrocephalus following intraventricular haemorrhage", "C. Meningitis", "D. Posterior fossa neoplasm", "E. Subarachnoid haemorrhage"], "ans": "B", "ansText": "B. Hydrocephalus following intraventricular haemorrhage", "jx": "1. Possible but in view of prematurity another diagnosis is more likely.\n2. Correct. This child has hydrocephalus, and the most likely underlying cause is intraventricular haemorrhage from his prematurity. This results in impairment of drainage and reabsorption of CSF leading to post-haemorrhagic hydrocephalus. The figure shows his large head and sun-setting eyes, which, together with the vomiting, are all clinical features of hydrocephalus. He will also have an increasing head circumference, which will cross centile lines. Monitoring with serial cranial ultrasound and head circumference measurements should have identified the development of hydrocephalus and allowed earlier treatment.\n3. There is no fever or clinical features of sepsis or meningitis, which makes an infection unlikely.\n4. The eyes show features of sun-setting, not a cranial nerve palsy or squint characteristic of posterior fossa neoplasms. The history is suggestive of post-haemorrhagic hydrocephalus.\n5. Not typical in preterm infants.", "img": ["images/18e85b93fa0ca16f_0.jpg"]}, {"id": "216d1469e933ec63", "m": "03", "letter": "C", "inMod": 5, "code": "C5", "q": "A newborn is screened for metabolic disorders, and the results indicate glucose-6-phosphate dehydrogenase (G6PD) deficiency. The healthcare provider advises the parents on management strategies. Which dietary advice is most important?", "opts": ["A. Avoid dairy products", "B. Avoid fava beans", "C. Avoid citrus fruits", "D. Avoid gluten containing food", "E. Avoid eggs"], "ans": "B", "ansText": "B. Avoid fava beans", "jx": "G6PD deficiency predisposes to oxidative hemolysis. Fava beans contain oxidant compounds triggering RBC destruction.Other listed foods are not associated with hemolytic crises.", "img": []}, {"id": "b07267fe0cb46d1a", "m": "03", "letter": "C", "inMod": 6, "code": "C6", "q": "A term baby appears limp at birth. The pediatric team quickly assesses the baby and finds a heart rate of 80 beats per minute and respiratory effort is absent. What is the immediate action that should be taken for this newborn?", "opts": ["A. Start Chest compressions", "B. Give Positive pressure ventilation", "C. Administer Adrenaline", "D. Administer facial Oxygen only", "E. Intubation"], "ans": "B", "ansText": "B. Give Positive pressure ventilation", "jx": "Ventilation is the most important step in neonatal resuscitation when HR <100 bpm and infant is apnoeic.", "img": []}, {"id": "83c5869b0078eca5", "m": "03", "letter": "C", "inMod": 7, "code": "C7", "q": "A newborn screening test identifies glucose-6-phosphate dehydrogenase (G6PD) deficiency in a male infant. He is otherwise well. What is the most important preventive measure for this child?", "opts": ["A. Avoid all medications", "B. Avoid fava beans and oxidant drugs", "C. Start prophylactic antibiotics", "D. Give high-protein diet", "E. Avoid vaccinations"], "ans": "B", "ansText": "B. Avoid fava beans and oxidant drugs", "jx": "A. Avoid all medications – Incorrect. Only specific oxidant drugs are contraindicated.B. Correct. G6PD protects red blood cells from oxidative damage. Deficiency leads to hemolysis when exposed to oxidative stress, including: Fava beans Sulfonamides Certain antimalarials Severe infectionsPreventing exposure reduces risk of hemolytic crisis.C. Prophylactic antibiotics – Incorrect. Not indicated unless specific infection risk.D. High-protein diet – Incorrect. Dietary protein has no protective role.E. Avoid vaccinations – Incorrect. Vaccinations are safe and recommended.", "img": []}, {"id": "5ab96844c985134a", "m": "03", "letter": "C", "inMod": 8, "code": "C8", "q": "Following a normal delivery, a new-born boy with Apgar scores of 7 and 8 is noted to have a soft, puffy swelling of the head with mild bruising. The swelling crosses the midline of the scalp. The delivering physician notes that the swelling corresponds to the area that presented during birth. Which of the following is the most likely diagnosis for the patient’s condition?", "opts": ["A. Caput succedaneum", "B. Cephalohematoma", "C. Craniosynostosis", "D. Hydrocephalus", "E. Molding"], "ans": "A", "ansText": "A. Caput succedaneum", "jx": "1.Correct. Caput succedaneum refers to the edematous area of the scalp that develops as a result of pressure from the cervix or birth canal during labor. It can also occur during vacuum assisted deliveries. The edema/hemorrhage is located in the subcutaneous tissue above the periosteum, thereby allowing it to cross suture lines. （Extacranial hemorrhage or edema in Newborn. ）2.Cephalohematoma occurs when one or more vessels rupture below the level of the periosteum, resulting in swelling of the affected area. The hematoma does not cross sutures given its location. It occurs in normal vaginal deliveries but is much more common following vacuum or forceps assisted births.\n3.Premature closure of the cranial sutures results in a bony deformity which may resemble swelling but is characterized by the absence of fontanelles and raised hard ridges along the involved sutures. The shape of the deformity depends on which sutures are involved.\n4.Hydrocephalus is a condition in which the ventricles dilate from an increased amount of cerebrospinal fluid in the ventricular and/or subarachnoid spaces. This causes an increase in intracranial pressure and presents with enlargement of the entire head. It is not associated with superficial edema and bruising.\n5.Molding occurs when the bones overlap in such a way as to decrease the diameter of the fetal skull. This often occurs during delivery as the infant’s head is soft and pliable and conforms to the shape of the birth canal. Molding is not a result of hemorrhage or edema.", "img": []}, {"id": "b7f0da3f2291d9c0", "m": "03", "letter": "C", "inMod": 9, "code": "C9", "q": "A full-term, neonate girl is born via spontaneous, vaginal delivery to a 29-year-old woman. The neonate’s Apgar scores are 9 and 10 at one and five minutes respectively. About an hour later, it is noted that whenever the neonate stops crying, she develops cyanosis while sucking her lips in and making harsh inspiratory efforts. A small catheter is unable to be passed through either nostril into the oropharynx. Which of the following is the most appropriate first step in management?", "opts": ["A. Administration of 100% O2 via non-rebreather mask", "B. Bronchoscopic examination", "C. Establishment of an oral airway", "D. Immediate surgical correction of the condition", "E. Tracheostomy and establishment of a tracheal airway"], "ans": "C", "ansText": "C. Establishment of an oral airway", "jx": "1.This child has choanal atresia. Neonates are obligate nasal breathers; neonates with choanal atresia are unable to sustain mouth breathing. Oxygen by mask would not help a neonate with this mechanical problem.\n2.Fiberoptic rhinoscopy, not bronchoscopy, would allow for visualization of the bony or membranous plate responsible for the choanal atresia. However the patient is having a cyanotic episode, and it is more important to secure the patients’s airway and breathing.\n3.Correct. This neonate has bilateral choanal atresia (or critical stenosis). The neonate becomes cyanotic when she stops crying because she has not yet learned to breathe effectively through her mouth at rest. In most infants, the establishment of a secure oral airway, which could be as simple as a feeding nipple with large holes in the tip or an orogastric tube that leaves the mouth propped open, is sufficient. After two to three weeks, most neonates with choanal atresia learn on their own how to breathe through the mouth and even how to coordinate this with feeding.\n4.Correction of bilateral choanal atresia is warranted, but it may be deferred for several months. After two to three weeks, most neonates with the condition learn to breathe through the mouth and to feed without the assistance of an oral airway or orogastric tube.\n5.Tracheostomy is not necessary in neonates with choanal atresia. The problem is the inability to coordinate breathing through the mouth, not a physical obstruction. A tube or oral airway that can prop the mouth open and allow the passage of air is usually sufficient.", "img": []}, {"id": "dd47ba9e7ecade46", "m": "03", "letter": "C", "inMod": 10, "code": "C10", "q": "A term infant born by elective caesarean section develops tachypnoea (RR 70/min) shortly after birth. Oxygen saturation is 94% in air. Chest X-ray shows fluid in the interlobar fissures and prominent vascular markings. What is the most likely diagnosis?", "opts": ["A. Meconium aspiration", "B. Respiratory distress syndrome", "C. Transient tachypnoea of the newborn", "D. Neonatal pneumonia", "E. Congenital diaphragmatic hernia"], "ans": "C", "ansText": "C. Transient tachypnoea of the newborn", "jx": "A. Meconium aspiration – Incorrect. Occurs in meconium-stained liquor; patchy infiltrates.B. RDS – Incorrect. Common in preterm infants; ground-glass appearance.C. TTN – Correct. Caused by delayed clearance of fetal lung fluid, common after caesarean delivery. Self-limiting over 24–72 hours.D. Pneumonia – Incorrect. Would have systemic signs.E. CDH – Incorrect. Scaphoid abdomen and bowel loops in chest.", "img": []}, {"id": "38480987c2d545f4", "m": "03", "letter": "C", "inMod": 11, "code": "C11", "q": "A term newborn is delivered via caesarean section. On initial examination, a unilateral cleft lip is noted. The infant is otherwise stable, pink, and breathing normally. The parents appear shocked and anxious. What is the most appropriate immediate action by the paediatrician?", "opts": ["A. Arrange urgent surgical repair", "B. Order cranial and abdominal ultrasound", "C. Discuss the finding sensitively with the parents", "D. Begin feeding via nasogastric tube", "E. Check electrolytes and pituitary function"], "ans": "C", "ansText": "C. Discuss the finding sensitively with the parents", "jx": "A. Urgent surgery – Incorrect. Cleft lip repair is typically done at ~3 months (rule of 10s). It is not an emergency.B. Imaging – Incorrect. Additional investigations depend on associated findings; not automatic.C. Discuss sensitively – Correct. The newborn is stable. The priority is: Reassurance Clear explanation Outline of management plan Emotional supportEarly compassionate communication reduces parental anxiety and builds trust.D. NG feeding – Incorrect. Most infants with isolated cleft lip can feed normally.E.Biochemistry and pituitary function– Incorrect. Bloods not required for isolated unilateral cleftlip.", "img": []}, {"id": "0fa431280cbb6377", "m": "03", "letter": "C", "inMod": 12, "code": "C12", "q": "A preterm infant in the neonatal intensive care unit is being prepared for feeding. The infant’s parents are hesitant about expressing breast milk. Which of the following is a unique benefit of breast milk in premature babies compared with formula milk?", "opts": ["A. Higher sodium content", "B. Reduced risk of necrotising eenterocolitis (NEC) risk", "C. Higher calorie density", "D. Faster weight gain", "E. Prevents gastro-oesophageal reflux"], "ans": "B", "ansText": "B. Reduced risk of necrotising eenterocolitis (NEC) risk", "jx": "Breast milk: Immunoglobulins Growth factors Protective against necrotising enterocolitisHuman milk contains immunological and trophic factors that protect the preterm gut, markedly reducing the incidence of NEC compared with formula-fed infants. Formula feeding increases gastrointestinal and allergic risks; it does not prevent reflux.", "img": []}, {"id": "9779e4553e0390ee", "m": "03", "letter": "C", "inMod": 13, "code": "C13", "q": "A newborn is diagnosed with G6PD deficiency after screening. The parents are concerned about dietary restrictions. What is a critical dietary restriction for this infant?", "opts": ["A. Avoid all diary products", "B. Avoid Fava beans", "C. Avoid Gluten containing food", "D. Avoid Citrus", "E. Avoid Eggs"], "ans": "B", "ansText": "B. Avoid Fava beans", "jx": "Fava beans trigger oxidative hemolysis in G6PD deficiency.Other foods are not associated with hemolytic crises.", "img": []}, {"id": "c396d1e389209197", "m": "03", "letter": "C", "inMod": 14, "code": "C14", "q": "A 30-week infant is on prolonged oxygen therapy for Respiratory Distress Syndrome. Which of the following is a known complication of excessive oxygen exposure?", "opts": ["A. Hypercapnia", "B. Retinopathy of prematurity (ROP)", "C. Congenital heart disease", "D. Metabolic alkalosis", "E. Bronchopulmonary dysplasia (BPD)"], "ans": "B", "ansText": "B. Retinopathy of prematurity (ROP)", "jx": "A. Hypercapnia – Incorrect.U nrelated.B. Retinopathy of prematurity (ROP) – Correct. High oxygen disrupts retinal vascular development → neovascularisation → risk of blindness.C. Congenital heart disease – Incorrect. U nrelated.D. Metabolic alkalosis – Incorrect. U nrelated.E. Bronchopulmonary dysplasia (BPD) – Incorrect.BPD is also oxygen-related but multifactorial. However ROP is specifically linked to oxygen toxicity.", "img": []}, {"id": "3f4f2b9bb13b1afa", "m": "03", "letter": "C", "inMod": 15, "code": "C15", "q": "A healthy 2-day-old term infant is noticed to be jaundice. The baby is feeding well and passing urine and stool normally. Total bilirubin is mildly elevated but below phototherapy threshold. What is the most likely cause?", "opts": ["A. Breast milk jaundice", "B. Physiological jaundice", "C. Hemolytic disease of the newborn", "D. Biliary atresia", "E. Neonatal sepsis"], "ans": "B", "ansText": "B. Physiological jaundice", "jx": "A. Breast milk jaundice – Incorrect. Appears after day 5–7 and can persist for weeks.B. Physiological jaundice – Correct. Appears after 24 hours, peaks day 3–5. Due to: Increased RBC breakdown Immature liver conjugationInfant is well → consistent with benign physiology.C. Hemolytic disease – Incorrect. Would present within first 24 hours with rapid rise in bilirubin.D. Biliary atresia – Incorrect. Presents with persistent conjugated jaundice, pale stools.E. Sepsis – Incorrect. Infant would appear unwell.", "img": []}, {"id": "cd373c88c51765f9", "m": "03", "letter": "C", "inMod": 16, "code": "C16", "q": "You were called to assess a newborn baby in the delivery suite. He looked mottled and felt cool. During examination, he was found to have poor perfusion with a central capillary refill time of 5 seconds and a heart rate of 150 beats per minute. What is the most likely cause of these findings?", "opts": ["A. Hypovolemic shock", "B. Anaphylactic shock", "C. Anaemia", "D. Cardiogenic shock", "E. Neurogenic shock"], "ans": "A", "ansText": "A. Hypovolemic shock", "jx": "Cool extremities and delayed capillary refill suggest hypovolemic shock in newborn neonates.", "img": []}, {"id": "cf4d138939be06d7", "m": "03", "letter": "C", "inMod": 17, "code": "C17", "q": "During heel-prick collection, the nurse prepares the dried blood spot card.Blood sample for newborn screening is collected via heel prick and placed on blood spot card. The healthcare provider must ensure quality of the sample for accurate results. What is an important consideration when collecting the dried blood spot sample?", "opts": ["A. Collect sample from the umbilical cord", "B. Ensure the whole circle is filled and the blood fully saturates through the card", "C. Ensure the baby is fasted before collection", "D. Collect within first hour of birth", "E. Overlapping blood drops on the card"], "ans": "B", "ansText": "B. Ensure the whole circle is filled and the blood fully saturates through the card", "jx": "B. Correct. The blood must soak completely through the filter paper circle: Ensures adequate volume Prevents false negatives Avoids repeat testingOther options incorrect: Umbilical cord blood not standard Overlapping drops cause uneven distribution First hour too early for some conditions Baby need to be fed for at least 2-3 days before testing, fasting not required", "img": []}, {"id": "ebdff16ac7d92ac3", "m": "03", "letter": "C", "inMod": 18, "code": "C18", "q": "A term newborn is delivered after prolonged labour with meconium-stained liquor. Apgar scores are 3 at 1 minute and 5 at 5 minutes. The infant required resuscitation and is now admitted to NICU. The team suspects hypoxic-ischaemic encephalopathy (HIE). Which physiological parameter is most critical to monitor closely in the immediate post-resuscitation period?", "opts": ["A. Heart rate", "B. Skin colour", "C. Feeding tolerance", "D. Stool frequency", "E. Weight"], "ans": "A", "ansText": "A. Heart rate", "jx": "A. Heart rate – Correct. Heart rate is the most important indicator of effective resuscitation and cardiovascular stability in neonates. In neonatal resuscitation: HR >100 bpm indicates adequate ventilation. HR <60 bpm requires chest compressions. HR is the primary determinant guiding interventions.Continuous monitoring ensures early detection of deterioration, arrhythmias, or persistent hypoxia.B. Skin colour – Incorrect. Colour can be misleading and affected by lighting or perfusion. Oxygen saturation and heart rate are more reliable.C. Feeding tolerance – Incorrect. Not immediately relevant in post-resuscitation stabilization.D. Stool frequency – Incorrect. Not a priority in the acute post-resuscitation period.E. Weight – Incorrect. Not relevant to acute monitoring.", "img": []}, {"id": "93f4383485e79ea6", "m": "03", "letter": "C", "inMod": 19, "code": "C19", "q": "During routine newborn exam, Ortolani and Barlow tests are performed. What are these tests designed to detect?", "opts": ["A. Leg length discrepancy", "B. Hip instability", "C. Neuromuscular tone", "D. Femoral nerve injury", "E. Spinal deformity"], "ans": "B", "ansText": "B. Hip instability", "jx": "A. Leg length discrepancy – Incorrect. Option unrelated.B. Hip instability – Correct. These manoeuvres detect developmental dysplasia of the hip (DDH).C. Neuromuscular tone – Incorrect. Option unrelated.D. Femoral nerve injury – Incorrect. Option unrelated.E. Spinal deformity – Incorrect.Option unrelated.", "img": []}, {"id": "653040bef7e443aa", "m": "03", "letter": "C", "inMod": 20, "code": "C20", "q": "You are asked to review a baby who is 24 hours old. He was born by vaginal delivery following a normal pregnancy. The midwife has noted that the baby’s feet look abnormal. On examination the feet are turned inwards but appear to be of a normal size. On passive movement of the foot you are able to manipulate it so that it can be fully dorsiflexed to touch the front of the lower leg (neutral position). What is the most likely diagnosis from the list given below?", "opts": ["A. Positional talipes equinovarus", "B. Talipes calcaneovalgus", "C. Talipes equinovarus", "D. Tarsal coalition", "E. Vertical talus"], "ans": "A", "ansText": "A. Positional talipes equinovarus", "jx": "1.Correct. This is a common problem and is caused by intrauterine compression. The foot is of normal size, the deformity is mild and can be corrected to the neutral position with passive manipulation.\n2.The foot would be everted and dorsiflexed. It results from intrauterine moulding and resolves.\n3. Talipes equinovarus is a fixed bony deformity, in which the foot is inverted and supinated. Passive movement to a normal, neutral position is not possible.\n4.Tarsal coalition is a diagnosis made in adolescent years with progressively more rigid feet with limited foot motion.\n5.Vertical talus is found in children with stiff, rocker-bottom feet who often have other neuromuscular disorders.", "img": []}, {"id": "13aeea8f6234650a", "m": "03", "letter": "C", "inMod": 21, "code": "C21", "q": "A paediatric resident is reviewing the babies on the postnatal ward. A term infant is found to have a total bilirubin level of 20 mg/dL at 72 hours of life. What is the appropriate management for this infant?", "opts": ["A. Continue to observe", "B. Initiate phototherapy", "C. Initiate exchange transfusion", "D. Increase feeds only", "E. Repeat serum bilirubin level in 6 hours"], "ans": "B", "ansText": "B. Initiate phototherapy", "jx": "At this level and age, phototherapy indicated to prevent kernicterus.Exchange transfusion reserved for higher levels or failure.", "img": ["images/13aeea8f6234650a_0.jpg"]}, {"id": "a32e6e7eec10f6b2", "m": "03", "letter": "C", "inMod": 22, "code": "C22", "q": "A 2-day-old infant develops jaundice. The baby is otherwise well. When does physiological jaundice typically appear?", "opts": ["A. Within first 12 hours", "B. Between 24 hours and 7 days", "C. After 2 weeks", "D. At 1 month", "E. Immediately at birth"], "ans": "B", "ansText": "B. Between 24 hours and 7 days", "jx": "B. Correct. Physiological jaundice: Appears after 24 hours Peaks day 3–5 (term infants) Resolves within 1–2 weeksEarly onset (<24h) is pathological.Other options are incorrect because: Onset before 24h → pathological After 2 weeks → persistent jaundice (needs evaluation)", "img": []}, {"id": "32d6d55ad0d1ccd4", "m": "03", "letter": "C", "inMod": 23, "code": "C23", "q": "A 24-hour-old infant with meconium-stained amniotic fluid is being monitored for respiratory distress. The infant shows signs of respiratory distress but is vigorous and responsive. What is the current recommendation regarding the management of this infant?", "opts": ["A. Routine endotracheal suctioning", "B. Immediate resuscitation with positive pressure ventilation", "C. Observation without intervention", "D. Prophylactic antibiotics", "E. Suctioning only if the infant is depressed"], "ans": "E", "ansText": "E. Suctioning only if the infant is depressed", "jx": "A. Routine endotracheal suctioning – Incorrect. B. Immediate resuscitation with positive pressure ventilation – Incorrect. C. Observation without intervention – Incorrect. D. Prophylactic antibiotics – Incorrect. E. Suctioning only if the infant is depressed – Correct.Current guidelines recommend that vigorous infants born with meconium-stained amniotic fluid do not require routine suctioning. Instead, suctioning is indicated only if the infant is depressed, as unnecessary suctioning can lead to complications.", "img": []}, {"id": "ddeaec56929f90c0", "m": "03", "letter": "C", "inMod": 24, "code": "C24", "q": "A 3-day-old infant is brought to the pediatric clinic for a routine check-up. The mother reports that the baby's skin has developed a yellowish tint over the past two days. The infant appears well, feeding normally, and has no other symptoms. What is the most likely diagnosis for this infant?", "opts": ["A. Physiological jaundice", "B. Hemolytic disease", "C. Biliary atresia", "D. Sepsis", "E. Breast milk jaundice"], "ans": "A", "ansText": "A. Physiological jaundice", "jx": "A. Correct. Appears after 24h, peaks day 3–5. Due to: Increased RBC turnover Immature conjugationInfant well → physiological.Others: Hemolytic disease → <24h onset Biliary atresia → conjugated jaundice + pale stools Sepsis → unwell infant Breast milk jaundice → later onset", "img": []}, {"id": "f7e4390429d43ee0", "m": "03", "letter": "C", "inMod": 25, "code": "C25", "q": "A 10-day-old baby has persistent jaundice and the mother mentions that the baby’s urine has been darker than usual. The pediatrician notes that the baby has pale stools. What condition should be excluded in this infant?", "opts": ["A. Congenital hypothyroidism", "B. Thalassaemia", "C. Biliary atresia", "D. Hemolytic disease", "E. Hepatitis"], "ans": "C", "ansText": "C. Biliary atresia", "jx": "Cholestatic (conjugated) jaundice signs: Pale stools Dark urineEarly diagnosis critical (Kasai procedure before 8 weeks).", "img": []}, {"id": "113d57aee4abc530", "m": "03", "letter": "C", "inMod": 26, "code": "C26", "q": "A 2 day old term baby born by caesarean section has lost 9% of his birth weight. The mother is anxious because she feels her milk has not yet “come in.” The baby is alert and feeding every 2 – 3 hours. What is the most appropriate advice to give the mother?", "opts": ["A. Start infant formula top up immediately due to severe weight loss", "B. Continue exclusive breastfeeding and reassure", "C. Establish a regular feeding pattern, to breast feed every 4 hours", "D. Give water after each breast feed", "E. Stop breastfeeding and switch to formula feed until milk supply increases"], "ans": "B", "ansText": "B. Continue exclusive breastfeeding and reassure", "jx": "Weight loss up to 10 % in the first 3 – 5 days is physiological , due to diuresis of extracellular fluid and meconium passage. Caesarean born babies may lose slightly more. Colostrum meets the infant’s needs. Frequent, on demand feeding and reassurance are appropriate—no formula or water is required for healthy newborns.", "img": []}, {"id": "47ff378d8a2ede7d", "m": "03", "letter": "C", "inMod": 27, "code": "C27", "q": "A 32-year-old woman delivers a term baby girl vaginally with a vacuum assist. Twelve hours later, a fluctuant boggy mass is noted over the occiput of the infant's scalp. Over the next 24 hours, the mass spreads across the entire calvarium and shifts with head position. Which of the following is the most likely diagnosis?", "opts": ["A. Caput succedaneum", "B. Cephalohematoma", "C. Leptomeningeal cyst", "D. Parietal skull fracture", "E. Subgaleal hematoma"], "ans": "E", "ansText": "E. Subgaleal hematoma", "jx": "1.A caput succedaneum is superficial subcutaneous tissue edema and sometimes hemorrhage that can cross suture lines. The amount of swelling is usually fixed and does not shift with gravity, which are features concerning for a subgaleal hematoma.\n2.Cephalohematoma is a subperiosteal bleed that rarely crosses suture lines or the midline. Cephalohematome usually is found over the parietal or occipital bone. This lesion crosses the midline, making cephalohematoma less likely.\n3.A leptomeningeal cyst develops after a skull fracture with dural tear as the cerebrospinal fluid pushes meninges through the skull defect. These take time to develop and would be unlikely in the neonatal period.\n4.A parietal skull fracture may not cause shifting midline swelling and is associated with cephalohematoma.\n5.Correct. A subgaleal hematoma is a hematoma that occurs under the galea aponeurotica and, like a caput, presents as diffuse scalp swelling that crosses suture lines. However, the virtual space that the blood fills causes the swelling to shift with gravity. Neonates can suffer massive blood loss as the bleeding expands over hours to days, requiring volume and blood product resuscitation in the neonatal intensive care unit.", "img": []}, {"id": "b003b569284a9a83", "m": "03", "letter": "C", "inMod": 28, "code": "C28", "q": "A 3-day-old infant on the postnatal ward was found to be nasal flaring and tachypnoea with a respiratory rate of 70 breaths per minute. What does this presentation most likely indicate?", "opts": ["A. Normal respiratory adaptation", "B. Respiratory distress", "C. Hypoglycaemia", "D. Hypothermia", "E. Gastro-oesophageal reflux"], "ans": "B", "ansText": "B. Respiratory distress", "jx": "Tachypnoea and nasal flaring are signs of respiratory distress.", "img": []}, {"id": "923f6a3f1c304889", "m": "03", "letter": "C", "inMod": 29, "code": "C29", "q": "A newborn is diagnosed with hypoxic ischemic encephalopathy (HIE) after experiencing perinatal asphyxia. The medical team is considering management strategies. What evidence-based treatment should be initiated promptly?", "opts": ["A. High-dose steroids", "B. IV fluids only", "C. Therapeutic hypothermia", "D. Nasogastric feeding", "E. Prophylactic antibiotics"], "ans": "C", "ansText": "C. Therapeutic hypothermia", "jx": "C. Correct. Therapeutic hypothermia: Initiated within 6 hours of birth Reduces cerebral metabolic demand Decreases apoptosis and inflammation Improves neurodevelopmental outcomesThis is standard of care for moderate–severe HIE.Other options: Steroids have no proven benefit Fluids alone insufficient Enteral feeding is not safe when the baby is unstable Antibiotics only if infection suspected", "img": []}, {"id": "3cc7947da7134063", "m": "03", "letter": "C", "inMod": 30, "code": "C30", "q": "A 34-year-old gravida 2 para 1 female comes into the emergency department in labor at 35 weeks' gestation. She has received inconsistent prenatal care. After 6 hours of labor, she vaginally delivers a 3200-g baby girl with APGAR scores of 9 and 10. The baby is doing well until 4 hours of life when she becomes lethargic and does not respond to stimulation. Laboratory data is notable for a white blood cell (WBC) count of 29,000/mcL, hematocrit of 51%, and platelet count of 249,000/mcL. A chest radiograph is unremarkable. Lumbar puncture and testing of cerebrospinal fluid shows glucose of 29 mg/dL, and WBC of 40 per mm3 with 92% polymorphonuclear cells. Which of the following interventions could have most effectively prevented this baby's condition?", "opts": ["A. Asking for a history for genital vesicles", "B. Giving intrapartum antibiotics", "C. Prenatal antiretroviral therapy", "D. Screening for zoonotic infection", "E. Vaccinating the mother"], "ans": "B", "ansText": "B. Giving intrapartum antibiotics", "jx": "1.Most women who have herpes simplex virus (HSV) infections are asymptomatic, and thus are unaware of their disease and cannot give a good history. Furthermore, primary HSV infections have a 30-fold increased risk of transmission, as compared to recurrent HSV infection. Having a history of genital vesicles would imply that a primary infection had already occurred, making transmission much less likely.\n2.Correct This newborn has early-onset neonatal sepsis from likely group B Streptococcus (GBS) infection. The most effective prevention of early-onset neonatal sepsis due to GBS is intrapartum antibiotics. Colonized mothers are asymptomatic and can transmit GBS to the neonate, especiallywith ascending infection after premature rupture of membranes or prolonged labor.Thus, mothersshould undergo routine GBS testing at 35-37 weeks' gestation, or during delivery if they experience preterm labor. They should receive intrapartum antibiotics if they have a positive culture OR if the GBS status is unknown at the time of delivery.\n3.Pregnant woman with HIV should receive antiretroviral therapy to suppress their viral load to prevent vertical HIV transmission. HIV in babies typically does not manifest until 2-3 months of age, and early signs include poor weight gain and recurrent infections.\n4.Mothers are often asymptomatic but sometimes have flu-like symptoms such as muscle aches and lymphadenopathy. To prevent toxoplasmosis infections, mothers are encouraged to avoid cat feces and undercooked meat. Congenital toxoplasmosis manifests with the classic triad of chorioretinitis, intracranial calcifications and hydrocephalus. Other manifestations include jaundice with hepatosplenomegaly, anemia, and thrombocytopenia. Routine screening for toxoplasmosis is not recommended in North America.\n5.Pregnant patients are routinely immunized with Tdap between 27 and 36 weeks' gestation. This is done to protect the neonate from developing pertussis.", "img": []}, {"id": "4d6f2544a25777f9", "m": "03", "letter": "C", "inMod": 31, "code": "C31", "q": "A newborn screening program has been expanded to include testing for several inborn errors of metabolism (IEM). The healthcare team is preparing to explain this to new parents. What is the primary purpose of newborn metabolic screening?", "opts": ["A. Diagnose all genetic diseases", "B. Provide immediate treatment for all conditions", "C. Detect serious but asymptomatic conditions early", "D. Replace routine vaccination", "E. Identify parental genetic status"], "ans": "C", "ansText": "C. Detect serious but asymptomatic conditions early", "jx": "A. Diagnose all genetic diseases – Incorrect. Does not detect all genetic diseases B. Provide immediate treatment for all conditions – Incorrect. Does not confirm diagnosis (needs follow-up testing) C. Detect serious but asymptomatic conditions early - Correct . Screening identifies conditions that: Are serious May not show symptoms at birth Have effective early treatment Cause irreversible damage if untreatedClassic examples: PKU, congenital hypothyroidism.D. Replace routine vaccination – Incorrect. Screening does not replace vaccines E. Identify parental genetic status – Incorrect.Screening is not designed for parental testing", "img": []}, {"id": "af69c126362d2747", "m": "03", "letter": "C", "inMod": 32, "code": "C32", "q": "An 8-month-old infant presents with constipation, poor feeding, hypotonia, macroglossia, prolonged neonatal jaundice, and developmental delay. What is the most likely diagnosis?", "opts": ["A. Congenital hypothyroidism", "B. Down syndrome", "C. Cystic fibrosis", "D. Phenylketonuria", "E. Turner syndrome"], "ans": "A", "ansText": "A. Congenital hypothyroidism", "jx": "A. Congenital hypothyroidism – Correct. Classic features: Hypotonia Macroglossia Constipation Prolonged jaundice Developmental delayUntreated → intellectual disability. Detected via newborn screening.B. Down syndrome – Incorrect. Also has hypotonia but includes dysmorphic features (epicanthic folds, single palmar crease).C. Cystic fibrosis – Incorrect. Presents with failure to thrive, recurrent chest infections.D. PKU – Incorrect. Causes intellectual disability if untreated but not macroglossia or constipation.E. Turner syndrome – Incorrect. Occurs in females; short stature and webbed neck.", "img": []}, {"id": "c0e6da1e60b42ba5", "m": "03", "letter": "C", "inMod": 33, "code": "C33", "q": "A pediatrician is discussing the implications of abnormal newborn metabolic screening results with a family. The parents are anxious about what this means for their child’s health. What should the pediatrician emphasize about the nature of the screening results?", "opts": ["A. It confirms disease", "B. Immediate treatment required", "C. Screening tests may have false positives and do not always confirm a diagnosis", "D. Only severe diseases are reported", "E. All positive results are treatable"], "ans": "C", "ansText": "C. Screening tests may have false positives and do not always confirm a diagnosis", "jx": "C. Correct. Screening tests are sensitive but not diagnostic. False positives occur. Confirmatory testing is required before diagnosis.Reassurance reduces parental anxiety.", "img": []}, {"id": "f98913c07bc334c8", "m": "03", "letter": "C", "inMod": 34, "code": "C34", "q": "A newborn was noticed to be jaundice at 18 hours of life, accompanied by poor feeding and lethargy. The mother reports no history of any infections during pregnancy. What is the most immediate concern regarding this infant's jaundice?", "opts": ["A. It is a normal physiological response", "B. It may indicate a serious pathological cause", "C. It is likely due to breastfeeding", "D. It is a normal response in breastfed babies", "E. It is a side effect of maternal opiate use during delivery"], "ans": "B", "ansText": "B. It may indicate a serious pathological cause", "jx": "Jaundice within first 24h is always pathological until proven otherwise: Hemolysis (ABO/Rh incompatibility) G6PD deficiency SepsisRequires urgent evaluation.", "img": []}, {"id": "b439a0817dcbcbf6", "m": "03", "letter": "C", "inMod": 35, "code": "C35", "q": "A newborn infant is found to have a heart rate of 50 beats per minute at birth. The team has already initiated positive pressure ventilation and the heart rate remains at 50 beats per minute. What is the next appropriate step in resuscitation?", "opts": ["A. Continue positive pressure ventilation", "B. Start chest compressions", "C. Administer adrenaline first", "D. Administer intravenous Fluids", "E. Provide additional oxygen"], "ans": "B", "ansText": "B. Start chest compressions", "jx": "If HR <60 bpm after adequate ventilation → initiate chest compressions.", "img": []}, {"id": "fc740282354a1ae7", "m": "03", "letter": "C", "inMod": 36, "code": "C36", "q": "A 29-week preterm infant develops tachypnoea, grunting, and intercostal recession within 1 hour of birth. CXR shows ground-glass appearance.Most likely diagnosis?", "opts": ["A. Meconium aspiration", "B. Respiratory distress syndrome", "C. Transient tachypnoea", "D. Congenital pneumonia", "E. Bronchopulmonary dysplasia"], "ans": "B", "ansText": "B. Respiratory distress syndrome", "jx": "A. Meconium aspiration – Incorrect. This diagnosis ruled out based on gestation and timing.B. Respiratory distress syndrome – Correct. Classic preterm + surfactant deficiency + ground glass.C. Transient tachypnoea – Incorrect. This diagnosis ruled out based on gestation and timing.D. Congenital pneumonia – Incorrect. This diagnosis ruled out based on gestation and timing.E. Bronchopulmonary dysplasia – Incorrect.This diagnosis ruled out based on gestation and timing.", "img": []}, {"id": "f8958fd9c1c67f77", "m": "03", "letter": "C", "inMod": 37, "code": "C37", "q": "A newborn exhibits grunting and tachypnoea. A chest X-ray reveals diffuse bilateral ground-glass opacities with air bronchograms. The infant was born at 30 weeks of gestation. What condition is most likely indicated by these findings?", "opts": ["A. Meconium aspiration syndrome", "B. Respiratory distress syndrome", "C. Neonatal pneumonia", "D. Transient tachypnoea of the newborn", "E. Congenital pneumonia"], "ans": "B", "ansText": "B. Respiratory distress syndrome", "jx": "A. Meconium aspiration syndrome – Incorrect. B. Respiratory distress syndrome – Correct. The presence of ground-glass opacities and air bronchograms in a preterm infant strongly indicates respiratory distress syndrome, resulting from surfactant deficiency. This condition is common in preterm infants and is characterized by poor lung expansion.C. Neonatal pneumonia – Incorrect. D. Transient tachypnoea of the newborn – Incorrect. E. Congenital pneumonia – Incorrect.", "img": []}, {"id": "43fe980f68c07572", "m": "04", "letter": "D", "inMod": 1, "code": "D1", "q": "You are asked to review an infant, who is 4 hours of age. His antenatal scan revealed a ventricular septal defect. Which of the following would be the most sensitive marker of heart failure?", "opts": ["A. Cool peripheries", "B. Cyanosis", "C. Gallop rhythm", "D. Pansystolic murmur", "E. Tachypnoea"], "ans": "E", "ansText": "E. Tachypnoea", "jx": "1.Cool peripheries are a sign of heart failure. However, they tend to occur relatively late and there a number of causes. In a 4-hour-old baby this would be an insensitive and nonspecific finding.\n2.Most cases of heart failure in babies are as a result of a left-to-right shunt. This does not result in cyanosis.\n3.A very specific sign that is present in babies with heart failure. However, it is not particularly sensitive and its absence certainly does not rule out heart failure.\n4.A heart murmur is a sign of flow across a resistance. The presence, or intensity of a murmur is not a good guide to the presence of heart failure. Babies with large septal defects are more likely to develop heart failure but these babies often have quiet or even inaudible murmurs.\n5.Correct. Whilst tachypnoea is not a particularly specific finding, it is a sensitive marker of heart failure. Babies with heart failure have tachypnoea. This question is postgraduate level of difficulty.", "img": []}, {"id": "074fb715b21fd84e", "m": "04", "letter": "D", "inMod": 2, "code": "D2", "q": "An infant is brought for a review at 2 weeks of age. He has only just regained his birthweight. His parents are concerned that his antenatally diagnosed septal defect is causing heart failure. Which would be the most specific marker of heart failure?", "opts": ["A. Peripheral cyanosis", "B. Gallop rhythm", "C. Loud pansystolic murmur", "D. Tachycardia", "E. Tachypnoea"], "ans": "B", "ansText": "B. Gallop rhythm", "jx": "1.Peripheral cyanosis (acrocyanosis) is a common finding in babies. It does occur in heart failure but would not be a specific finding.\n2.Correct. A third heart sound is a very specific marker of heart failure. Whilst it is not always present, if a third heart sound is present then it is likely that this baby has a degree of heart failure.\n3.A loud pansystolic murmur usually indicates that there is a small or medium-sized septal defect. Children with quieter murmurs are actually more likely to develop heart failure as softer murmurs are associated with larger defects.\n4.A sensitive marker of heart failure but there are so many possible causes that it is a nonspecific finding.\n5.A very sensitive marker of heart failure but there are so many possible causes that it is a rather unspecific finding. The wide range of normal can make this difficult to identify.", "img": []}, {"id": "89c7e894f6319588", "m": "04", "letter": "D", "inMod": 3, "code": "D3", "q": "A 3-year-old boy is brought to his physician with fever of 1-week duration. The child is irritable but can be calmed by his mother. He has not been ill recently. On examination, temperature is 40 °C (104 °F), respiratory rate is 21/min, pulse is 120/min, and blood pressure is 90/70 mm Hg. There is nonpurulent conjunctivitis, notable pharyngeal erythema, and dry, cracked lips (see first figure). The tongue is also erythematous and appears to have a rough surface. There are no signs of nuchal rigidity. Cervical adenopathy is appreciated bilaterally, and the hands and feet are noted to have 2+ pitting edema (see second figure). There is a fine maculopapular rash covering most of the child's trunk and the extremities. What is the most appropriate therapy for this child?", "opts": ["A. Anti-staphylococcal antibiotic", "B. Anti-streptococcal antibiotic", "C. Immune globulin", "D. Symptomatic treatment", "E. Systemic corticosteroid"], "ans": "C", "ansText": "C. Immune globulin", "jx": "1.This therapy would be appropriate in the case of staphylococcal scalded skin syndrome (SSSS). In SSSS, there is acute onset of skin tenderness and diffuse small red papules, followed by the development of large, easily ruptured bullae with positive Nikolsky sign. Desquamation of large areas of skin occurs in thick sheets. Typical sites of involvement include the face, neck, and trunk, including axillae and groin. Treatment includes parenteral antibiotics, such as dicloxacillin, to eradicate Staph aureus, and appropriate wound care to prevent secondary effects of loss of skin barrier.\n2.This therapy would be appropriate in the case of scarlet fever. The classic presentation of scarlet fever includes abrupt onset of fever, chills, headache, sore throat, and vomiting. Within 12-48 hours, an exanthem begins on the trunk and spreads peripherally or cephalocaudally. The skin can be pruritic but is not tender. Tender cervical adenopathy and inflamed tonsils and/or uvula are common. During the first 2 days, the tongue becomes white with erythematous papillae projections (\"white strawberry tongue\"). The white layer then peels off, leaving a bright red, shiny tongue with prominent papillae (\"red strawberry tongue\"). Desquamation occurs even without treatment, and unlike SSSS, skin is shed in fine thin flakes. Treatment is normally a 10-day course of penicillin, or clindamycin in penicillin-allergic children.\n3.Correct This patient has Kawasaki disease, which is an acuteinflammatory disorder with vasculitis of small to medium vessels that can lead to coronary artery aneurysms. It is characterized by fever for at least 5 days, nonexudative conjunctivitis, mouth/lip changes, erythema or swelling of the extremities, cervical lymphadenopathy, and rash. Intravenous immune globulin given in the first 10 days of illness reduces the risk of developing coronary aneurysms and has a generalized anti-inflammatory effect. Primary treatment for Kawasaki disease also includes high-dose aspirin.\n4.This therapy might be appropriate when treating symptoms of a viral etiology, such as hand, food, and mouth disease. Hand, foot, and mouth disease is caused by coxsackie A virus. Classic presentation is fever and oral vesicular lesions progressing to superficial ulcers, followed by a characteristic skin eruption on the hands and/or soles of the feet. In the case of Kawasaki disease, sequelae such as coronary artery aneurysms are too serious to rely on symptomatic treatment alone.\n5.Systemic corticosteroids have not been found to have a consistent benefit in Kawasaki disease. They can be added to the treatment regimen in patients with immune globulin resistance or those at high risk for coronary artery aneurysms.", "img": ["images/89c7e894f6319588_0.jpg"]}, {"id": "2d43a5c80cd32cf8", "m": "04", "letter": "D", "inMod": 4, "code": "D4", "q": "Vignette: A 2-month-old infant presents with poor feeding, fast breathing, and failure to gain weight. On examination, there is a pansystolic murmur best heard at the left lower sternal border. Chest X-ray shows cardiomegaly and increased pulmonary vascular markings. Question: What is the most likely underlying cardiac defect?", "opts": ["A. Atrial septal defect", "B. Ventricular septal defect", "C. Patent ductus arteriosus", "D. Tetralogy of Fallot", "E. Pulmonary stenosis"], "ans": "B", "ansText": "B. Ventricular septal defect", "jx": "Left-to-right shunt → heart failure after pulmonary vascular resistance falls.", "img": []}, {"id": "03229d26c0ef2949", "m": "04", "letter": "D", "inMod": 5, "code": "D5", "q": "Vignette: An 11-year-old boy presents with severe headache, vomiting, blurred vision, and confusion. BP is 180/120 mmHg. Fundoscopy reveals papilloedema. Question: What is the most appropriate management approach?", "opts": ["A. Oral ACE inhibitor", "B. IV sodium nitroprusside infusion", "C. Immediate rapid BP normalization", "D. Oral beta-blocker", "E. Brain MRI and lumbar puncture"], "ans": "B", "ansText": "B. IV sodium nitroprusside infusion", "jx": "This is hypertensive emergency with end-organ damage.Management: IV antihypertensive (nitroprusside or labetalol) Gradual reduction (≤25% in first 8 hours)Rapid normalization risks cerebral ischemia. Lumbar puncture should not be performed in a patient with hypertensive encephalitis and raised intracranial pressure.", "img": []}, {"id": "c052d65d457198f3", "m": "04", "letter": "D", "inMod": 6, "code": "D6", "q": "A 4-month-old boy, sees his general practitioner for an ear infection. On listening to his chest a heart murmur is heard. Which one of the following features most suggests that it requires further investigation?", "opts": ["A. A thrill", "B. Disappearance of murmur on lying flat", "C. Murmur maximal at the left sternal edge", "D. Sinus arrhythmia", "E. Systolic murmur"], "ans": "A", "ansText": "A. A thrill", "jx": "1.Correct. A thrill is a palpable murmur, i.e. a loud murmur. It always requires further investigation.\n2.The disappearance of the murmur on lying flat is characteristic of a venous hum, which is innocent.\n3.Murmurs at the left sternal edge may be innocent or pathological. Further investigation is not indicated if the features of an innocent murmur are fulfilled.\n4.Sinus arrhythmia is a variation in heart rate with respiration and is a normal finding in children.\n5. Systolic murmurs may be innocent or pathological.Hallmarks of an innocent ejection murmur (all have an ‘S’ , therefore innoSent ) are:• as ymptomatic patient• Soft blowing murmur• Systolic murmur only, not diastolic• left Sternal edge.Additional requirements are:• normal heart sounds with no added sounds• no parasternal thrill• no radiation.Further investigation is not indicated under these circumstances.", "img": []}, {"id": "0cab4a8dccb54706", "m": "04", "letter": "D", "inMod": 7, "code": "D7", "q": "A 3-month-old infant, presents with breathlessness and sweating on feeding. He has had several chest infections. You suspect heart failure. Which of the following is most likely to be correct regarding his heart failure?", "opts": ["A. Hepatomegaly is not a common feature at this age", "B. It is caused by Eisenmenger syndrome", "C. It is due to left heart obstruction", "D. It is due to a left-to-right shunt", "E. It is due to an increase in right-to-left shunt"], "ans": "D", "ansText": "D. It is due to a left-to-right shunt", "jx": "1.Hepatomegaly is an important clinical feature of heart failure in children at all ages. Percussion of the upper border of the liver will help discriminate between hepatomegaly and downward displacement of a liver from hyperexpansion of the chest..\n2.Eisenmenger syndrome causes cyanosis from pulmonary hypertension, and usually occurs in the second decade of life.\n3.Only in the first week of life is heart failure usually from left heart obstruction, e.g. coarctation of the aorta.\n4.Correct. After the 1st week of life, progressive heart failure is most likely due to a left-to-right shunt, most often from a ventricular septal defect.\n5.It is due to increasing left-to-right shunt.", "img": []}, {"id": "51eaf0ed7008eab9", "m": "04", "letter": "D", "inMod": 8, "code": "D8", "q": "Vignette: A 4-year-old girl is found to have persistently elevated blood pressure during a pre-operative assessment. She is not obese. Examination reveals diminished femoral pulses and a systolic murmur. Question: What is the most likely cause of her hypertension?", "opts": ["A. Essential hypertension", "B. Coarctation of the aorta", "C. Renal parenchymal disease", "D. Pheochromocytoma", "E. White-coat hypertension"], "ans": "B", "ansText": "B. Coarctation of the aorta", "jx": "A. Essential hypertension – Incorrect. More common in obese adolescents.B. Coarctation – Correct. Clues: Young child (<6 years) Secondary hypertension more likely Weak/delayed femoral pulses MurmurCoarctation causes upper limb hypertension with lower limb hypoperfusion.C. Renal disease – Incorrect. Common cause but murmur and pulse findings point to cardiac origin.D. Pheochromocytoma – Incorrect. Rare; episodic headache, sweating, palpitations.E. White-coat hypertension – Incorrect. Would not cause pulse discrepancy.", "img": []}, {"id": "4557fa7109466f93", "m": "04", "letter": "D", "inMod": 9, "code": "D9", "q": "Vignette: A 14-year-old overweight boy has mild persistent hypertension (average BP between the 95th–99th percentile). He is asymptomatic, with no organ damage. Question: What is the most appropriate first-line management strategy?", "opts": ["A. ACE inhibitor", "B. Beta-blocker", "C. Lifestyle modification", "D. Renal ultrasound", "E. Diuretics"], "ans": "C", "ansText": "C. Lifestyle modification", "jx": "Initial management for mild hypertension: Weight reduction Physical activity ≥60 min/day Reduce salt intake Healthy dietMedication reserved if: Stage 2 hypertension Target organ damage Failure of lifestyle therapy", "img": []}, {"id": "7965bb622a9a869f", "m": "04", "letter": "D", "inMod": 10, "code": "D10", "q": "A 6 weeks old infant is admitted directly from the cardiology clinic with heart failure. He has a large ventricular septal defect. The cardiologist has recommended treatment with furosemide and spironolactone. His mother wants to know why he has only now started to have problems. Which of the following statements provides the best explanation?", "opts": ["A. At birth and for the first few weeks the ductus arteriosus remained patent and this balanced the flow across the septal defect", "B. Pulmonary vascular resistance is increasing and blood is now flowing from right to left", "C. The left ventricle is now failing due to its progressive dilatation", "D. The pulmonary vascular resistance falls after birth and now flow from left to right across the septal defect is much greater", "E. Volume overload results in decreased return to the left ventricle and a reduction in cardiac output related to a reduced end-diastolic filling pressure"], "ans": "D", "ansText": "D. The pulmonary vascular resistance falls after birth and now flow from left to right across the septal defect is much greater", "jx": "1.A ventricular septal defect is not a ‘duct-dependent’ lesion. A widely open ductus will not prevent heart failure here.\n2.This is Eisenmenger syndrome and would not occur in a 6-week-old baby. It is a late complication of untreated ventricular septal defect/atrioventricular septal defect.\n3.Dilated cardiomyopathy is a very late change. In children with ventricular septal defect the heart remains healthy but heart failure occurs from volume overload.\n4.Correct. The pulmonary vascular resistance falls over the first few weeks of life. This increases the flow across the septal defect and leads to progressively worsening heart failure.\n5.Volume overload results in less efficient myocardial contraction, however end-diastolic filling pressure is increased. End-diastolic filling pressure is decreased in hypovolaemia.", "img": []}, {"id": "67235e540d1a0a31", "m": "04", "letter": "D", "inMod": 11, "code": "D11", "q": "A 4 weeks old infant is being assessed for poor feeding and breathlessness. As part of his investigation he has an ECG performed ( see picture below ). What is the most likely cardiac defect?", "opts": ["A. Atrial septal defect", "B. Atrioventricular septal defect", "C. Coarctation of the aorta", "D. Pulmonary stenosis", "E. Ventricular septal defect"], "ans": "B", "ansText": "B. Atrioventricular septal defect", "jx": "1.A superior axis is occasionally seen in a child with an ostium secundum atrial septal defect. It is more common to see complete or partial right bundle branch block. Some children with secundum atrial septal defect do not have abnormal ECG findings.\n2.Correct. This ECG shows a superior QRS axis. The easiest way to spot this is to look at the overall sum of the QRS complex in AVF. Here it is negative, this means that it is pointing upwards. There are very few conditions which result in a superior axis.\n3.If undetected and untreated, coarctation of the aorta leads to left ventricular hypertrophy. However in early life, the ECG may be normal or show both left and right ventricular hypertrophy.\n4.Pulmonary stenosis can lead to right ventricular hypertrophy and right-axis deviation. In early life this pattern is normal.\n5.The left-to-right shunt might eventually lead to right or combined ventricular hypertrophy. In babies the ECG is often normal and clinical examination and echocardiography are the best ways to diagnose this.", "img": ["images/67235e540d1a0a31_0.jpg"]}, {"id": "ec1e0bbab1b373c7", "m": "04", "letter": "D", "inMod": 12, "code": "D12", "q": "A 6 years old boy presents to the emergency department feeling sick and dizzy. He was brought to hospital by a paramedic crew who were called after he became unwell at school. His heart rate was noted to be very quick, at 260 beats/min and supraventricular tachycardia is diagnosed. He says he can feel his heart beating quickly and looks pale. He is crying, saying he wants his mother. Which of the following should be undertaken by the attending team?", "opts": ["A. Adenosine via a large bore intravenous line", "B. Bilateral carotid sinus massage", "C. Direct current cardioversion", "D. Reassure that it will resolve spontaneously", "E. Vagal stimulation manoeuvre"], "ans": "E", "ansText": "E. Vagal stimulation manoeuvre", "jx": "1.This is likely to be effective but should be tried only after vagal manoeuvres have been undertaken.\n2.Whilst this might work, it should not be undertaken bilaterally as this might be dangerous.\n3.This is painful and even synchronized shock requires a general anaesthetic first.\n4.He is symptomatic and it should be treated.\n5.Correct. Instruct him how to perform a Valsalva manoeuvre – ask him to put his thumb in his mouth and try to blow on it like a trumpet; this often works. Other vagal manoeuvres include carotid sinus massage and cold ice pack application to the face.", "img": []}, {"id": "6814676b16d50421", "m": "04", "letter": "D", "inMod": 13, "code": "D13", "q": "Vignette: A 6-month-old boy presents with bluish discoloration of lips and fingers noted since infancy, which worsens during crying. Cardiac examination reveals a harsh ejection systolic murmur along the left upper sternal border. ECG shows right ventricular hypertrophy. Question: What is the most likely diagnosis?", "opts": ["A. Transposition of the great arteries", "B. Tetralogy of Fallot", "C. Total anomalous pulmonary venous return", "D. Tricuspid atresia", "E. Pulmonary atresia"], "ans": "B", "ansText": "B. Tetralogy of Fallot", "jx": "Tetralogy of Fallot is the most common cause of cyanotic congenital heart disease beyond infancy. It features a harsh ejection systolic murmur (from RV outflow obstruction), cyanosis during crying, and ECG evidence of right ventricular hypertrophy.", "img": []}, {"id": "8c6174eca63c1f2b", "m": "04", "letter": "D", "inMod": 14, "code": "D14", "q": "Vignette: An otherwise healthy 10-year-old boy has elevated blood pressure readings during clinic visits (averaging in the 98th percentile), but his ambulatory blood pressure monitoring (ABPM) at home shows values below the 90th percentile. Question: What is the most appropriate diagnosis?", "opts": ["A. Primary hypertension", "B. Masked hypertension", "C. White-coat hypertension", "D. Secondary hypertension", "E. Prehypertension"], "ans": "C", "ansText": "C. White-coat hypertension", "jx": "White-coat hypertension = elevated clinic BP but normal ambulatory readings.Masked hypertension is the opposite pattern.", "img": []}, {"id": "223c2f7a4aa6421b", "m": "04", "letter": "D", "inMod": 15, "code": "D15", "q": "At 36 hours of life, a term female appears dusky and blue while feeding. Supplemental oxygen is given via nasal cannula, and she becomes tachypneic two hours later. On examination, pulse is 170 beats/min, respiratory rate is 80 breaths/min, blood pressure measurements of the right arm and right leg are 48/30 mm Hg and 52/32 mm Hg, respectively. Pulse oximetry reads 90% saturation on 4L supplemental oxygen. Hypoplastic left heart syndrome is diagnosed by a transthoracic echocardiogram. Which of the following abnormal heart sounds would be expected in this patient?", "opts": ["A. Continuous machine-like murmur, bounding pulses", "B. Continuous machine-like murmur, poor peripheral pulses", "C. Holosystolic murmur, poor peripheral pulses, quiet single S2", "D. Vague systolic murmur, precordial hyperactivity, loud single S2", "E. Vague systolic murmur, precordial hyperactivity, quiet single S2"], "ans": "D", "ansText": "D. Vague systolic murmur, precordial hyperactivity, loud single S2", "jx": "1.A typical patent ductus arteriosus (PDA) is a continuous, machine-likemurmur best heard over the left upper chest. If the PDA is moderate to large, pulses will be bounding as the parts of the large left sided stroke volume circulates back into the pulmonary arteries. This patient with hypoplastic left heart syndromeis becomingsicker because herductus arteriosus is not patent but closing.\n2.Same rationale as answer 13.Holosystolic murmur is typically heard with a ventricular septal defect (VSD) or with mitral or tricuspid regurgitation. Children with HLHS generally have a patent foramen ovale (PFO) or atrial septal defect (ASD) to allow left-to-right circulation. A loud, single S2 is heard (see answer D). Poor peripheral pulses are found in HLHS due to poor systemic circulation.\n4.Correct Infants with hypoplastic left heart syndrome develop signs of shock with cyanosis early in life (1-3 days) as the ductus arteriosus closes, which can accelerate with oxygen administration. The right ventricle has to pump to the pulmonary and systemic circulation through the PDA. The high stroke volumes cause an active precordium. The resulting pulmonary hypertension causes the loud S2. Often there is a vague, non-specific systolic murmur present. The closing ductus limits systemic circulation and causes poor pulses.\n5.In hypoplastic left heart syndrome, there is a loud, singleS2 from forceful pulmonic valve closure.", "img": []}, {"id": "37127f2dc30b3785", "m": "04", "letter": "D", "inMod": 16, "code": "D16", "q": "A 2-day-old infant is found to have a systolic murmur along the left sternal border during an examination. The infant was not cyanotic at birth and has not been cyanotic. The remainder of the physical examination is normal. An electrocardiogram (ECG) and chest radiograph are performed and no abnormalities are noted. Which of the following is the most likely diagnosis?", "opts": ["A. Patent ductus arteriosus (PDA)", "B. Tetralogy of Fallot (TOF)", "C. Transposition of the great vessels", "D. Tricuspid atresia", "E. Ventricular septal defect (VSD)"], "ans": "E", "ansText": "E. Ventricular septal defect (VSD)", "jx": "1.The murmur of a patent ductus arteriosus, also called persistent arterial duct, is typically continuous and described as “machine-like.” It is heard best in the left infraclavicular region. Theductus arteriosus is necessary during gestation to shunt blood from the pulmonary artery to the aorta, bypassing the unventilated lungs. At this time, the fetal pulmonary vascular resistance (PVR) is high (physiologic pulmonary hypertension), which allows the shunt to flow right to left. After the first breath of the neonate, the PVR drops and ductal flow reverses. The ductus then closes spontaneously over the next several hours or days in most individuals. If it remains patent in the 2nd-3rd week of life in the absence of other congenital cardiac lesions, it becomes pathologic and can lead to pulmonary hypertension and Eisenmenger syndrome. Clinically, patients with small PDAs will be asymptomatic, but those with larger shunts can have bounding pulses, wide pulse pressure due to decreased diastolic pressure, and signs of increasing heart failure.\n2.TOF is a congenital heart condition with four malformations: large VSD, right ventricular outflow tract obstruction due to pulmonary stenosis, overriding aorta, and right ventricular hypertrophy. The murmur is classically a harsh systolic ejection murmur - heard best in the pulmonary area but also audible throughout the chest - from turbulence across the right heart outflow obstruction. Clinical symptoms, namely cyanosis, are dependent on the degree of obstruction. If it is mild, ventricular shunting will be from left to right, and patients can remain acyanotic for many years. A bidirectional and then right-to-left shunt will emerge as the obstruction progresses, which causes cyanosislater on. Patientsborn with moderate or severe obstruction will have earlier right-to-left shunting and cyanosis. This obstruction can also worsen acutely in response to change in temperature, fever, illness, dehydration, or intense crying. Thus, patients often present with \"tetralogy spells,\"\" which include profound cyanosis, tachypnea, and dyspnea, and can be quickly life-threatening. Although the TOFconstellation includesa VSD, the TOF VSD is typically large, unrestrictive, and causes equalization of right- and left-heart pressures. Thus, it generates no sound.\n3.The most common type of transposition is called dextrotransposition and is characterized by atrioventricular concordance (atria and ventricles are correctly paired) and ventriculoarterial discordance (great vessels are incorrectly paired to ventricles). In other words, the aorta arises from the right ventricle, receives deoxygenated blood and returns it to the systemic circulation. The pulmonary artery arises from the left ventricle, receives oxygenated blood, and returns it to the lungs. As long as the arterial duct and/or foramen ovale remain patent, these two separate circulations can mix. But with closure of the natural shunts after birth, in the absence of other shunts like an ASD or VSD, transposition is associated with severe,progressive cyanosis and eventual death. Most neonates with this condition require immediate surgical correction, and IV administration of prostaglandin E1 can maintain ductal patency until the procedure is complete. These patients typically do not have chromosomal abnormalities but commonly have other anomalies like a VSD, pulmonary outflow tract obstruction, and/or coarctation. In patients without these additional anomalies, physical exam will include worsening cyanosis and a single loud second heart sound (S2).\n4.In tricuspid atresia, the tricuspid valve is either absent or permanently closed, blocking blood flow from the right atrium tothe right ventricle. These patients need a patent foramen ovale (PFO) or an ASD and a VSD or a PDA to survive. The PFO or ASD allows systemic blood to flow from the right to left atrium, mixing with oxygenated blood. If there is a VSD, blood from the left ventricle crosses into the right ventricle and pulmonary circulation to be oxygenated. If there is a PDA, blood from the aorta flows back into the pulmonary artery to be oxygenated. In either case, patients are cyanotic, have a small right ventricle, a normal or enlarged left ventricle, and decreased pulmonary blood flow. 50% develop symptoms by 24 hours of life. Auscultation can reveal a holosystolic VSD murmur or the continuous murmur of a PDA over the left lower sternal border, depending on which is present. EKG will typically show signs of left axis deviation, left ventricular hypertrophy, and right atrial enlargement.\n5.Correct VSD is the most common cardiac anomaly, occurring in 50% of all children with congenital heart disease, and in 20% as an isolated lesion. VSDs also have the highest recurrence rate and the highest association with teratogen exposure. Clinical presentation depends on the size: small VSDs are typically asymptomatic, and moderate to large VSDs can manifest with a holosystolic murmur and signs of congestive heart failure. Chest x-ray and ECG will typically be normal. Echocardiography is the appropriate test toconfirm the diagnosis as well as the size and location of the defect, although many isolated VSDs go undetected. Overall, about 40% of VSDs close spontaneously in the first year, and 60% resolve by age\n5.Large defects are associated with much higher mortality; those with moderate to large VSDs should undergo surgical repair before age 1 year to avoid progression to right shunting. An acyanotic infant with a systolic murmur and a normal exam, EKG, and CXR is a classic presentation for a small VSD.", "img": []}, {"id": "6d90611c2616604d", "m": "04", "letter": "D", "inMod": 17, "code": "D17", "q": "Vignette: A 5-year-old girl is brought in for evaluation of an incidentally identified heart murmur during a routine health check. She is asymptomatic, with normal growth and activity. The murmur is soft (grade 2/6), midsystolic, best heard at the left sternal border, and decreases when standing upright. Question: What is the most appropriate next step in management?", "opts": ["A. Echocardiogram", "B. ECG", "C. Reassure parents and discharge with no further investigation", "D. Antibiotic prophylaxis for infective endocarditis", "E. Restrict exercise till next review in 3 months"], "ans": "C", "ansText": "C. Reassure parents and discharge with no further investigation", "jx": "Innocent murmur characteristics: Soft Systolic Changes with posture No symptoms", "img": []}, {"id": "5ac9207c4916214a", "m": "04", "letter": "D", "inMod": 18, "code": "D18", "q": "Vignette: A newborn develops respiratory distress and poor perfusion within hours of birth. There is weak femoral pulse, differential cyanosis (pink upper body, blue lower limbs), and metabolic acidosis. Chest X-ray shows pulmonary congestion.Question: Which congenital heart defect is most consistent with this presentation?", "opts": ["A. Coarctation of the aorta", "B. Hypoplastic left heart syndrome", "C. Patent ductus arteriosus", "D. Atrial septal defect", "E. Pulmonary stenosis"], "ans": "B", "ansText": "B. Hypoplastic left heart syndrome", "jx": "Hypoplastic left heart syndrome presents early with shock and poor perfusion after ductal closure because systemic circulation depends on a patent ductus arteriosus. Differential cyanosis and weak femoral pulses indicate duct-dependent systemic circulation.", "img": []}, {"id": "e33dd01ec340351c", "m": "05", "letter": "E", "inMod": 1, "code": "E1", "q": "Vignette: A 3-year-old boy presents with salivation, sweating, vomiting, diarrhea, and bradycardia after playing in his grandfather's farm shed. His pupils are constricted, and he is wheezing. Question: What is the most appropriate antidote for this poisoning?", "opts": ["A. Atropine", "B. Naloxone", "C. Diazepam only", "D. Flumazenil", "E. Methylene blue"], "ans": "A", "ansText": "A. Atropine", "jx": "Cholinergic toxidrome (SLUDGE): Salivation Lacrimation Urination Diarrhea GI upset EmesisAtropine blocks muscarinic receptors. Pralidoxime may also be used.This is a cholinergic toxidrome (SLUDGE: salivation, lacrimation, urination, defecation, GI upset, emesis), typically seen after organophosphate or carbamate exposure . Atropine is the antidote; it competitively blocks muscarinic acetylcholine receptors, reducing secretions and bronchoconstriction. Severe cases may also require pralidoxime (2-PAM) to reactivate acetylcholinesterase.", "img": []}, {"id": "813d4ba7ceb8e75e", "m": "05", "letter": "E", "inMod": 2, "code": "E2", "q": "Vignette: A 5-month-old infant was accidentally given 15 mL of paracetamol syrup three times daily instead of 1.5 mL for two days. He now presents with vomiting and lethargy. Liver enzymes are elevated. Question: What is the specific antidote?", "opts": ["A. Naloxone", "B. N-acetylcysteine", "C. Activated charcoal only", "D. Sodium bicarbonate", "E. Atropine"], "ans": "B", "ansText": "B. N-acetylcysteine", "jx": "A. Naloxone – Incorrect. Antidote for opioid overdose.B. N-acetylcysteine (NAC) – Correct. Paracetamol toxicity causes accumulation of NAPQI, a toxic metabolite that depletes glutathione and causes hepatocellular necrosis.NAC: Replenishes glutathione Prevents liver injury Should be given promptly if overdose suspectedC. Activated charcoal – Incorrect. Useful within 1–2 hours of ingestion, but not antidote.D. Sodium bicarbonate – Incorrect. Used in TCA toxicity or severe metabolic acidosis.E. Atropine – Incorrect. Used in organophosphate poisoning.", "img": []}, {"id": "fda2c10965ba842f", "m": "05", "letter": "E", "inMod": 3, "code": "E3", "q": "Vignette: A 9-month-old presents with shallow breathing, pinpoint pupils, and decreased consciousness after ingesting unknown cough mixture. Question: Which antidote should be administered immediately?", "opts": ["A. Flumazenil", "B. Atropine", "C. Naloxone", "D. Physostigmine", "E. Methylene blue"], "ans": "C", "ansText": "C. Naloxone", "jx": "Classic opioid triad: CNS depression Respiratory depression Pinpoint pupilsNaloxone is a competitive opioid receptor antagonist that reverses respiratory depression rapidly.Other options: Flumazenil → benzodiazepine toxicity Atropine → cholinergic poisoning Physostigmine → anticholinergic toxicity Methylene blue → methemoglobinemia", "img": []}, {"id": "e8e823ee6dbed0b0", "m": "05", "letter": "E", "inMod": 4, "code": "E4", "q": "Vignette: Two siblings present with slate-gray cyanosis and chocolate-colored lips after eating spinach soup. Their blood appears brown and does not turn red on exposure to air. Arterial blood gas shows normal PaO ₂. Question: What is the most appropriate treatment?", "opts": ["A. Oxygen only", "B. Hydroxocobalamin", "C. Sodium nitrite", "D. Methylene blue", "E. Activated charcoal"], "ans": "D", "ansText": "D. Methylene blue", "jx": "Methemoglobinemia: Iron oxidised to Fe³⁺ Cannot bind oxygen Chocolate-coloured bloodMethylene blue reduces Fe³⁺ back to Fe²⁺.Oxygen alone insufficient.The features are typical of methemoglobinemia , in which haemoglobin is oxidized to ferric iron (Fe³⁺) and cannot carry oxygen. Methylene blue acts as an electron donor via NADPH-methemoglobin reductase, converting methemoglobin back to functional haemoglobin . Oxygen alone is ineffective because the problem is with haemoglobin structure, not oxygen supply.", "img": []}, {"id": "1b42d3d07df2aca6", "m": "05", "letter": "E", "inMod": 5, "code": "E5", "q": "Vignette: A 6-year-old boy visiting his grandfather suddenly develops vomiting, abdominal pain and bradycardia. ECG shows AV block and laboratory investigation identified a serum potassium of 6.5 mmol/L. Question: What is the most suitable antidote?", "opts": ["A. Calcium gluconate", "B. Digoxin-specific Fab fragments", "C. Magnesium sulfate", "D. Sodium bicarbonate", "E. Atropine alone"], "ans": "B", "ansText": "B. Digoxin-specific Fab fragments", "jx": "Digoxin toxicity: Arrhythmias AV block HyperkalaemiaFab fragments bind circulating digoxin and neutralize toxicity.This is classical digoxin poisoning presenting with arrhythmia, hyperkalaemia , and AV block . Digoxin-specific antibody fragments (Fab) bind and neutralize circulating digoxin, reversing toxicity. Calcium should be avoided due to risk of \"stone heart\" (precipitating severe arrhythmia).Calcium is avoided (“stone heart” risk).", "img": []}, {"id": "d4f8d5d5348ebe40", "m": "
