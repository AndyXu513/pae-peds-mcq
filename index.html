<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>儿科 MCQ 刷题 · PAE session 1</title>
<style>
:root{
  --bg:#F4F7FA; --card:#fff; --ink:#0E2841; --muted:#6B7A8C;
  --teal:#156082; --teal-d:#0E4560; --teal-l:#E8F1F6;
  --green:#01AD56; --green-l:#EAF9F1; --red:#C00000; --red-l:#FDECEC;
  --amber:#E97132; --border:#E1E8EF; --shadow:0 1px 2px rgba(14,40,65,.06),0 8px 24px rgba(14,40,65,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:18px;
  padding:12px 22px; background:rgba(255,255,255,.9); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15.5px;letter-spacing:.2px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-l)}
.sub{font-size:12px;color:var(--muted);font-weight:450;margin-left:-4px}
.bar{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.track{flex:1;height:7px;border-radius:99px;background:#E6EDF3;overflow:hidden;min-width:60px}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),#2E8BA8);transition:width .35s ease}
.nums{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.nums b{color:var(--ink);font-weight:650}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtn{
  font-size:12.5px;padding:7px 13px;border-radius:9px;border:1px solid var(--border);
  background:#fff;color:var(--ink);transition:.16s;white-space:nowrap
}
.hbtn:hover{border-color:#C9D6E2;background:#FBFDFE}
.hbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.hbtn.danger:hover{border-color:var(--red);color:var(--red)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1180px;margin:0 auto;min-height:calc(100vh - 57px)}
aside{padding:18px 12px 40px 22px;border-right:1px solid transparent;position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto}
.cat{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 11px;margin-bottom:2px;border-radius:9px;font-size:13.2px;color:#3D5165;transition:.14s
}
.cat:hover{background:#EBF1F6}
.cat.on{background:var(--teal-l);color:var(--teal-d);font-weight:650}
.cat .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.on .cnt{color:var(--teal)}
.cat .cnt .dn{color:var(--green)}
.cat .bar2{width:0;height:3px;border-radius:2px;background:var(--teal);opacity:.5}
.cathead{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#95A3B3;padding:6px 11px 8px;font-weight:650}

/* ---------- stage ---------- */
section{padding:26px 30px 80px;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
  background:var(--teal-l);color:var(--teal-d);white-space:nowrap
}
.qnum{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.state{margin-left:auto;font-size:12px;font-weight:650}
.state.ok{color:var(--green)} .state.no{color:var(--red)}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:26px 28px 24px;box-shadow:var(--shadow)}
.stem{font-size:16.5px;line-height:1.72;margin:0 0 6px;font-weight:480;letter-spacing:.05px}
.stem em{font-style:normal;background:linear-gradient(transparent 62%,#FFF1D6 62%);padding:0 1px}
.figure{margin:16px 0 4px;display:flex;flex-wrap:wrap;gap:12px}
.figure img{max-width:340px;max-height:320px;border-radius:10px;border:1px solid var(--border);background:#fff}

.opts{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 15px;border:1.5px solid var(--border);border-radius:11px;background:#fff;
  font-size:14.6px;line-height:1.55;transition:.15s;color:var(--ink)
}
.opt:hover:not(.locked){border-color:#B9CBD9;background:#FBFDFF;transform:translateY(-1px)}
.opt .k{
  flex:0 0 25px;height:25px;border-radius:7px;background:#F0F4F8;color:#52657A;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;margin-top:1px
}
.opt .t{flex:1}
.opt.locked{cursor:default}
.opt.pick{border-color:var(--teal);background:var(--teal-l)}
.opt.pick .k{background:var(--teal);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-l)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt .mark{font-weight:800;font-size:14px;margin-left:4px}

/* ---------- explanation ---------- */
.jx{
  margin-top:20px;border-radius:12px;border:1px solid #DDE9F1;background:linear-gradient(180deg,#F7FBFD,#F2F8FB);
  padding:0 18px;overflow:hidden;max-height:0;opacity:0;transition:max-height .4s ease,opacity .3s ease,padding .3s ease
}
.jx.open{max-height:4000px;opacity:1;padding:16px 18px}
.jx .ans{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--green);margin-bottom:10px;font-size:14.5px}
.jx .ans span{font-weight:650;color:var(--ink)}
.jx .ans i{font-style:normal;font-size:11.5px;background:var(--green);color:#fff;padding:2px 7px;border-radius:5px;font-weight:650}
.jx .lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#7A8CA0;font-weight:700;margin:2px 0 6px}
.jx p{margin:0;font-size:14.1px;line-height:1.75;color:#33475C;white-space:pre-wrap}

/* ---------- footer nav ---------- */
.nav{display:flex;align-items:center;gap:10px;margin-top:22px}
.nav .spacer{flex:1}
.nbtn{
  padding:11px 18px;border-radius:11px;border:1px solid var(--border);background:#fff;font-size:13.5px;
  font-weight:560;transition:.15s;display:flex;align-items:center;gap:7px
}
.nbtn:hover:not(:disabled){border-color:#B9CBD9;background:#FBFDFF}
.nbtn:disabled{opacity:.4;cursor:not-allowed}
.nbtn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nbtn.primary:hover{background:var(--teal-d)}
.nbtn.ghost{font-size:12.5px;color:var(--muted);padding:9px 12px}
.kbd{font-size:11px;color:#9AAABA;margin-top:10px;letter-spacing:.02em}
.kbd kbd{background:#EDF2F6;border-radius:4px;padding:1px 5px;font-family:inherit;font-size:10.5px;color:#5A6E82}

.empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:14px}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:650}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% 10%,#EAF3F8 0%,#DDE9F2 40%,#C9DCEA 100%);padding:20px}
.gate.hide{display:none}
.gatebox{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:34px 30px 28px;
  box-shadow:0 24px 60px rgba(14,40,65,.18),0 2px 6px rgba(14,40,65,.08);text-align:center;
  animation:pop .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.gatebox.shake{animation:shk .38s}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.gatebox .ic{font-size:34px;line-height:1;margin-bottom:10px}
.gatebox h2{margin:0 0 4px;font-size:17px;font-weight:700;letter-spacing:.2px}
.gatebox .gq{margin:14px 0 16px;font-size:19px;font-weight:650;color:var(--teal-d);line-height:1.5}
.gatebox input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;
  font-size:15px;text-align:center;outline:none;transition:.15s;font-family:inherit}
.gatebox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(21,96,130,.12)}
.gatebox button{width:100%;margin-top:12px;padding:12px;border-radius:11px;background:var(--teal);color:#fff;
  font-size:14.5px;font-weight:650;transition:.15s}
.gatebox button:hover{background:var(--teal-d)}
.gmsg{min-height:18px;font-size:12.5px;color:var(--red);margin-top:9px}
.ghint{font-size:11.5px;color:#98A6B6;margin-top:12px}
.gok{color:var(--green);font-size:13px;font-weight:650;margin-top:9px;min-height:18px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);z-index:150;
  background:#0E2841;color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;
  display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(14,40,65,.28);
  opacity:0;pointer-events:none;transition:.28s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:rgba(255,255,255,.16);color:#fff;padding:5px 11px;border-radius:7px;font-size:12.5px}
#toast button:hover{background:rgba(255,255,255,.28)}

@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr);width:100%;max-width:100%}
  aside{position:static;max-height:none;border-right:none;padding:12px 14px;display:flex;gap:6px;overflow-x:auto;white-space:nowrap;min-width:0;max-width:100%}
  aside .cathead{display:none}
  .cat{width:auto;margin:0;flex-shrink:0;padding:7px 12px;background:#fff;border:1px solid var(--border)}
  .cat .cnt{margin-left:6px}
  section{padding:16px 14px 60px;min-width:0;max-width:100%}
  header{padding:10px 12px;gap:8px;flex-wrap:nowrap;min-width:0}
  .brand{font-size:13.5px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis}
  .brand .sub,.track,.nums{display:none}
  .hbtns{gap:6px}
  .hbtn{padding:6px 10px;font-size:12px}
  .card{padding:18px 15px;overflow-wrap:anywhere}
  .stem{font-size:15px;overflow-wrap:anywhere}
  .opt{font-size:14px;padding:11px 12px}
  .figure img{max-width:100%;height:auto}
  .nav{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatebox" id="gatebox">
    <div class="ic">🎫</div>
    <h2>进门先对暗号</h2>
    <p class="gq">龙大彭于晏是谁？</p>
    <input id="gateInput" placeholder="输入答案后回车" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="gateBtn">进入刷题</button>
    <div class="gmsg" id="gateMsg"></div>
    <div class="ghint">答对了才放你进去 😉</div>
  </div>
</div>

<div id="toast"><span id="toastMsg"></span><button id="toastUndo">撤销</button></div>

<header>
  <div class="brand"><span class="dot"></span>儿科 MCQ 刷题<span class="sub">PAE session 1 · 按课件模块排序</span></div>
  <div class="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="nums">已答 <b id="done">0</b>/<b id="total">0</b> · 正确率 <b id="acc">—</b></div>
  </div>
  <div class="hbtns">
    <button class="hbtn" id="btnWrong">错题本</button>
    <button class="hbtn danger" id="btnReset">清空记录</button>
  </div>
</header>

<main>
  <aside id="cats"></aside>
  <section id="stage"></section>
</main>

<script>
const DATA = {"modules": [{"c": "01", "t": "01 呼吸系统"}, {"c": "02", "t": "02 感染与免疫接种"}, {"c": "03", "t": "03 新生儿"}, {"c": "04", "t": "04 心血管"}, {"c": "05", "t": "05 急救与重症"}, {"c": "06", "t": "06 肾脏与泌尿"}, {"c": "07", "t": "07 神经系统"}, {"c": "08", "t": "08 内分泌·生长与青春期"}, {"c": "09", "t": "09 营养与消化"}, {"c": "10", "t": "10 血液与肿瘤"}, {"c": "11", "t": "11 风湿免疫"}, {"c": "12", "t": "12 发育·行为与社会儿科"}, {"c": "13", "t": "13 遗传与代谢"}, {"c": "14", "t": "14 临床技能与沟通"}], "questions": [{"id": "7005494d26e5f214", "m": "01", "n": 2, "q": "A 10-month-old boy presents to the emergency department with a 2-day history of fever and runny nose. He has been otherwise well. During the night he gradually developed a barking cough in association with a loud noise on inspiration. On examination he has a temperature of 38°C and noisy inspiration accompanied by marked sternal recession ( see picture below ). His capillary refill time is normal.Select the ONE most likely diagnosis from the list below.", "opts": ["A. Acute epiglottitis", "B. Anaphylaxis", "C. Bronchiolitis", "D. Laryngeal foreign body", "E. Laryngotracheobronchitis (croup)"], "ans": "E", "ansText": "E. Laryngotracheobronchitis (croup)", "jx": "1. Epiglottitis would present with a shorter history, and the child would be extremely unwell (toxic). It is also very rare in countries with Haemophilus influenzae type b immunization. (But not in China)2. Anaphylaxis may cause stridor but also causes other symptoms, usually including an urticarial rash. It would not cause a fever.3. Bronchiolitis causes wheeze and crepitations rather than stridor as in this child.4. The child has a fever and a gradual onset of symptoms.5. Correct. Laryngotracheobronchitis (croup) is mucosal inflammation and increased secretions affecting the upper airway. Croup occurs from 6 months to 6 years of age. Fever suggests infection. Inspiratory noises suggest upper airway obstruction.", "img": ["images/7005494d26e5f214_0.jpg"]}, {"id": "4b63c0b39dd16246", "m": "01", "n": 5, "q": "A 10-year-old girl, has frequent attacks of asthma. She attends the emergency department with increasing difficulty in breathing over the last 12 hours. Initial observation shows that she is anxious, sitting upright, has a marked tracheal tug and is unable to complete a sentence.Which of the following statements is most likely to be correct?", "opts": ["A. Her asthma attack is of moderate severity", "B. Her condition is likely to improve if she is encouraged to lie flat", "C. Her oxygen saturation should be measured", "D. She should be taken promptly to the X-ray department for a chest X-ray", "E. The lack of wheeze should make you consider a panic attack"], "ans": "C", "ansText": "C. Her oxygen saturation should be measured", "jx": "1. Sarah's attack is severe as she is unable to complete a sentence.2. Sitting upright assists lung mechanics and enables her to use her accessory muscles.3. Correct. Oxygen saturation should be measured to further assess the severity of the asthma attack and to guide treatment.4. The priority is to treat Sarah's asthma. If a chest X-ray is indicated, then a portable X-ray machine should be brought to any patient who is significantly unwell.5. The absence of wheeze implies that little air is moving in and out of the chest and would indicate severe bronchoconstriction.", "img": []}, {"id": "7ce9fc0a49431c10", "m": "01", "n": 16, "q": "A 3-year-old boy presents to the emergency department in severe respiratory distress. The parents have been trying to calm him and make him feel better using warm baths and home remedies for the past several hours, with no improvement. He has been refusing to eat since his symptoms began a few hours ago. They tell the attending that their son is not fully immunized. On examination, the child is febrile with a temperature of 40.5°C (104.9°F). He is leaning forward with his chin hyperextended, and he is drooling with his tongue protruding from his mouth. There is an audible inspiratory stridor with associated coughing, and he has subcostal and intercostal retractions.Which of the following is the most appropriate initial step in management?", "opts": ["A. Albuterol treatment and monitor response", "B. Broad-spectrum IV antibiotics", "C. Corticosteroid treatment", "D. Prepare to intubate", "E. Racemic epinephrine treatment"], "ans": "D", "ansText": "D. Prepare to intubate", "jx": "1. Albuterol, also known as salbutamol, is a beta-2-agonist that relaxes bronchial smooth muscles. It is used to treat bronchospasm of any etiology, including asthma or COPD. Side effects to monitor include tachycardia, hypokalemia, and arrhythmia. This patient has airway inflammation rather than bronchospasm, so albuterol is not indicated.2. Antibiotics such as cefotaxime, ceftriaxone, or meropenem should be given in suspected epiglottitis, pending culture and susceptibility reports, because 10-40% of H. influenzae type b cases are resistant to ampicillin. However, the first priority in epiglottitis is always securing an airway, and vascular access should not be attempted because the added stress can be detrimental to the airway. After an artificial airway is established, antibiotics should be initiated and continued for at least 10 days. Epiglottitis typically resolves after a few days of antibiotics, and then the patient can be extubated.Antibiotics, with or without surgical drainage, are also important in the case of retropharyngeal abscess (RPA) or peritonsillar abscess (PTA). RPA and PTA must also be considered in a patient with respiratory distress, stridor, fever, and drooling. However, both RPA and PTA typically have slower disease progression.3. Corticosteroids are indicated for laryngotracheobronchitis, or croup — a viral infection of the upper respiratory tract that can lead to upper airway occlusion due to swelling. A patient with croup can tolerate eating, unlike this patient, because the point of irritation is below the level of the glottis, and neither food nor fluid will cause direct irritation of the subglottic tissues. Even in mild croup, the anti-inflammatory action of oral corticosteroids has been shown to reduce hospitalization time and frequency, and alsi decrease the need for subsequent interventions, such as epinephrine administration. However, corticosteroids, like epinephrine, are ineffective in epiglottitis.4. Correct The patient most likely has epiglottitis from a Haemophilus influenza type B infection. The clinical triad of drooling, dysphagia, and distress is a classic presentation of a swollen epiglottis. Other typical signs that are seen in this patient include high fever, stridor, tongue protrusion, refusal to eat, and chest retractions while breathing. This patient also has an incomplete immunization history which makes this bacterium more likely. Because a swollen epiglottis could close a patient’s airway at any moment, the first step in suspected epiglottitis is to ensure airway patency with endotracheal or nasotracheal intubation, or, less commonly, tracheostomy. As many as 6% of children without an artificial airway die from epiglottitis, compared to <1% with an artificial airway. All patients should also receive 100% humidified oxygen by mask en route to the operating room or intensive care unit, unless the mask causes excessive agitation.If the diagnosis is unclear and the patient is not in respiratory distress, a lateral neck radiograph can be taken to confirm the diagnosis. It will show a markedly thickened epiglottis (white arrow), which is referred to as the thumb sign. It may also show aryepiglottic fold thickening (black arrow).5. Racemic epinephrine, given in nebulized form, is useful for less urgent cases of airway edema and obstruction. It stimulates alpha and beta-adrenergic receptors to produce vascular smooth muscle contraction, which decreases capillary blood flow and shrinks upper respiratory mucosa. Racemic epinephrine was historically chosen over 1-epinephrine to minimize anticipated cardiovascular side effects of tachycardia and hypertension. It is indicated for croup and acute laryngeal swelling due to allergy. However, racemic epinephrine, like corticosteroids, is ineffective in epiglottitis. Epiglottitis is a true medical emergency that requires urgent, expert airway management.", "img": []}, {"id": "06d412a0d1748b12", "m": "01", "n": 17, "q": "A 3-year-old boy, is seen by his general practitioner because of recurrent wheezing associated with upper respiratory tract infections.Which of the following features most supports the diagnosis of asthma?", "opts": ["A. Daytime cough", "B. Finger clubbing", "C. Peak-flow variability diary", "D. Persistent moist cough", "E. The presence of symptoms between coughs and colds"], "ans": "E", "ansText": "E. The presence of symptoms between coughs and colds", "jx": "1. Nocturnal cough is classically experienced with asthma. A cough that always resolves during sleep is likely to be habitual (psychogenic).2. Clubbing suggests suppurative lung disease or congenital heart disease.3. He is too young to perform peak flow reliably.4. This suggests persistent bacterial bronchitis.5. Correct. The presence of interval symptoms and atopic conditions (eczema/hay fever) helps to distinguish asthma from viral-induced wheeze.", "img": []}, {"id": "b60ee8a8d5c697da", "m": "01", "n": 20, "q": "A 4-year-old boy, presents to his family doctor with a history of eczema, rhinitis, chronic nocturnal cough and intermittent wheeze. Asthma is suspected and a bronchodilator is prescribed.How should his bronchodilator be delivered?", "opts": ["A. Dry powder inhaler", "B. Metered dose inhaler (MDI)", "C. Metered dose inhaler with spacer", "D. Nebulizer", "E. Syrup"], "ans": "C", "ansText": "C. Metered dose inhaler with spacer", "jx": "1. Dry powder inhalers are not appropriate for use in children less than 6 years of age.2. Children should be prescribed a MDI with spacer as they cannot co-ordinate a MDI alone. It is always preferable to use a spacer, even in adults as delivery is more reliable.3. Correct. The best mode of delivery is direct to the lungs. Children under 5 years of age should be prescribed a MDI with spacer as they cannot co-ordinate a MDI alone.4. Nebulizers provide very effective delivery of bronchodilators. However, home nebulizers are driven with air. Air-driven nebulizers are less safe than MDI and spacers as they result in greater degrees of hypoxia. They are also more expensive. In hospital the nebulizers are driven by oxygen to offset the risk of hypoxia.5. Syrup should not be used as it results in high blood levels and unacceptable side-effects.", "img": []}, {"id": "0411a6637bf14aea", "m": "01", "n": 21, "q": "A 5-month-old Caucasian infant, is admitted to hospital with breathing problems and poor feeding. On examination he has a respiratory rate of 50 breaths/min. On auscultation of the chest he has widespread crackles. He has moderate intercostal recession, and oxygen saturation of 92% in air. He was born at term with a birthweight of 3.6 kg (50th centile). His weight is now 5.2 kg (<0.4th centile). This is his first admission to hospital but he ‘is always chesty’.You suspect a diagnosis of cystic fibrosis. When he is stabilized, which would be the most appropriate investigation to perform?", "opts": ["A. Genetic screening for cystic fibrosis", "B. Heel prick for immunoreactive trypsin", "C. Measurement of faecal elastase", "D. Measurement of serum bilirubin", "E. Sweat test"], "ans": "E", "ansText": "E. Sweat test", "jx": "1. Phe508del is the most common mutation in cystic fibrosis, but is not diagnostic as some children with cystic fibrosis will have a different mutation. Even screening for the most common mutations will miss some affected children. If the sweat test is positive or borderline, then genetic screening is helpful in determining prognosis. Some mutations are associated with milder disease or may be amenable to treatment.2. Immunoreactive trypsin remains high (elevated) only for a few weeks before returning to normal levels. This test is used for newborn screening.3. Children with untreated cystic fibrosis will have low faecal elastase and faltering weight. This confirms pancreatic insufficiency. However, cystic fibrosis is not the only cause for this and a sweat test will still be required.4. Cystic fibrosis can cause prolonged jaundice (>14 days of age), but this is not specific.5. Correct. Abnormal function of the sweat glands results in excessive concentrations of sodium and chloride in the sweat, and this is the basis of the essential diagnostic test for cystic fibrosis.", "img": []}, {"id": "f28b12e342c62f69", "m": "01", "n": 30, "q": "An 18-month-old girl, presents to her family doctor with coryza, cough and a mild fever for 3 days. She feeds poorly and is unsettled at night. Her respiratory rate is normal and there is no chest recession.What is the most likely diagnosis?", "opts": ["A. Bronchiolitis", "B. Frontal sinusitis", "C. Pneumonia (lower respiratory tract infection)", "D. Tonsillitis", "E. Upper respiratory tract infection"], "ans": "E", "ansText": "E. Upper respiratory tract infection", "jx": "1. Her chest has no abnormal signs on auscultation. With bronchiolitis, you would expect to hear crepitations and wheeze, and to see signs of respiratory distress.2. This is unusual in children of this age because frontal sinuses do not develop until late childhood.3. Young children with pneumonia can sometimes present without chest signs on auscultation, but there would be respiratory distress including a raised respiratory rate.4. Examination of the oropharynx would show intense inflammation of the tonsils, often with a purulent exudate.5. Correct. This child has an upper respiratory tract infection, most likely a common cold.", "img": []}, {"id": "4caff390021c5386", "m": "01", "n": 37, "q": "Vignette: A 1-year-old ex-premature girl is brought to the emergency department with shortness of breath, rhinorrhoea, tachypnoea and audible expiratory wheeze. SpO₂ is 91% on room air. On auscultation, widespread wheeze and diffuse crepitations were present in both lung fields. She had similar episodes with previous viral illnesses.Question: Which of the following is the most likely diagnosis?", "opts": ["A. Croup", "B. Asthma", "C. Bronchiolitis", "D. Pneumonia", "E. Foreign body"], "ans": "C", "ansText": "C. Bronchiolitis", "jx": "Bronchiolitis is common in infants and presents after a viral prodrome (e.g. coryza, low-grade fever) with wheeze, crepitations, and respiratory distress. Viral-induced asthma is rare below 12 months. Pneumonia usually has focal chest signs and higher fever.", "img": []}, {"id": "6b0e98f1f7b0fbff", "m": "01", "n": 38, "q": "Vignette: A 14-year-old girl newly diagnosed with asthma was given a short-acting bronchodilator (Ventolin) by her paediatrician, which she uses 1–2 times per month for symptom relief. You are reviewing her asthma control and treatment regimen.Question: Which of the following medications would be most appropriate to add if her cough persists?", "opts": ["A. Oral Antibiotics", "B. Inhaled corticosteroid", "C. Oral Antihistamines", "D. Oral Mucolytics", "E. Oral leukotriene modifier"], "ans": "B", "ansText": "B. Inhaled corticosteroid", "jx": "ICS treats airway inflammation — cornerstone of persistent asthma management.", "img": []}, {"id": "5eb455d7e9e9baf3", "m": "01", "n": 39, "q": "Vignette: A 14-year-old girl presents with a chronic dry cough lasting over six months. The cough worsens with laughter and weather changes but is not associated with nocturnal symptoms or exercise limitation. Examination shows normal growth, no clubbing, and a clear chest. Her father smokes, and she has allergic rhinitis.Question: What is the most likely diagnosis?", "opts": ["A. Pneumonia", "B. Tuberculosis", "C. Asthma", "D. Bronchiectasis", "E. Chronic aspiration"], "ans": "C", "ansText": "C. Asthma", "jx": "Cough-variant asthma: Dry cough Triggered by cold/laughter Atopy history Normal baseline examBronchiectasis → wet cough. TB → systemic symptoms.", "img": []}, {"id": "1c0da9da68833e3d", "m": "01", "n": 50, "q": "Vignette: A 5-year-old girl presents to the emergency department with severe wheezing, tachypnoea (RR 40 breaths per min) and oxygen saturation 93% in air. She has multiple previous hospital admissions for asthma exacerbations.Question: Which is the first medicine that should be administered for this patient?", "opts": ["A. Oral steroids", "B. Nebulised salbutamol", "C. IV magnesium", "D. IV antibiotics", "E. IV Antihistamine"], "ans": "B", "ansText": "B. Nebulised salbutamol", "jx": "First-line for acute asthma: inhaled SABA.Steroids are added but not first bronchodilator.", "img": []}, {"id": "7a081df2c6542cd7", "m": "01", "n": 51, "q": "Vignette: A 6 year old boy presents with frequent asthma exacerbations despite medication. His mother reports the family lives in a small apartment shared with his grandparents, who smoke indoors.Question: What additional history would be most helpful in assessing his risk factors?", "opts": ["A. Confirm his Immunization status", "B. Ask about school performance", "C. Ask about home ventilation, smoke exposure and housing condition", "D. Ask about recent foreign travel", "E. Ask about potential food triggers"], "ans": "C", "ansText": "C. Ask about home ventilation, smoke exposure and housing condition", "jx": "A complete social and environmental history helps identify triggers and modifiable risk factors (e.g., smoke exposure). Home conditions, family routines, and caregiver practices directly influence paediatric health.Poorly controlled asthma is a risk factor for having severe food allergy", "img": []}, {"id": "8130380d6aa74b05", "m": "01", "n": 55, "q": "Vignette: A 7-year-old boy known to have asthma is admitted to the emergency department with shortness of breath. He is tachypnoeic (RR 30/min), has SpO₂ 91% on room air, suprasternal retractions, and diffuse expiratory wheeze. He is tired and reluctant to talk.Question: What is the most likely severity of his asthma attack?", "opts": ["A. Mild", "B. Moderate", "C. Severe asthma", "D. Life-threatening", "E. Viral cough"], "ans": "C", "ansText": "C. Severe asthma", "jx": "Severe features: SpO₂ <94% Unable to complete sentences Marked recessionLife-threatening = silent chest, altered consciousness.", "img": []}, {"id": "b3c4af58394517b3", "m": "01", "n": 65, "q": "Vignette: An 18-month-old boy woke up from sleep with a barking cough and breathlessness. On arrival to the emergency department, he has a low-grade fever but remains alert and playful. Oxygen saturation is 94% on room air. On examination, he has a barking cough, hoarse voice and an inspiratory stridor.Question: Which of the following is the most appropriate initial management?", "opts": ["A. Intubation and intravenous antibiotics", "B. Nebulised adrenaline and intravenous hydrocortisone", "C. Oral dexamethasone and minimal handling", "D. Chest X-ray", "E. Nebulised salbutamol"], "ans": "C", "ansText": "C. Oral dexamethasone and minimal handling", "jx": "Croup is a clinical diagnosis, typically caused by a viral laryngotracheitis leading to airway oedema. Management aims to reduce inflammation (e.g. dexamethasone) and avoid agitation (minimal handling). Nebulised adrenaline is reserved for moderate to severe respiratory distress. Investigations like CXR add no value and may aggravate distress.", "img": []}, {"id": "a4f85c8a6b7e9472", "m": "02", "n": 1, "q": "6-month-old with itchy red patches on cheeks/extensors. A 6-month-old baby presents with dry, itchy, red patches on the cheeks and extensor surfaces of the arms and legs. There is a family history of allergic rhinitis. What is the most appropriate first-line management for this condition?", "opts": ["A. Oral coticosteroids", "B. Emollients and topical corticosteroids", "C. Antibiotic ointment", "D. Phototherapy", "E. Oral Antihistamines only"], "ans": "B", "ansText": "B. Emollients and topical corticosteroids", "jx": "Core treatment:Barrier repair (emollients)Anti-inflammatory controlThe baby has atopic eczema, a common inflammatory skin condition associated with atopy. Management includes skin hydration using emollients and control of inflammation with topical corticosteroids. Systemic steroids or antibiotics are reserved for severe or infected cases.", "img": ["images/a4f85c8a6b7e9472_0.jpg"]}, {"id": "14377f150e0c2ecf", "m": "02", "n": 3, "q": "A 10-month-old infant, has been unsettled and febrile with a runny nose for 2 days. Her family doctor examines her ear canal and the tympanic membrane appears as in the picture below.What is the most likely diagnosis?", "opts": ["A. Acute otitis externa", "B. Cholesteatoma", "C. Chronic otitis externa", "D. Foreign body in the external ear canal", "E. Otitis media with effusion"], "ans": "E", "ansText": "E. Otitis media with effusion", "jx": "1. Acute otitis externa is an infection of the outer ear canal, not of the tympanic membrane.2. A rare problem in children. The two most common symptoms are persistent, often smelly, discharge from the affected ear and gradual loss of hearing in the affected ear.3. Chronic otitis externa is an infection of the outer ear canal, not of the tympanic membrane. Fiona's history is only 2 days long and therefore not chronic.4. She has symptoms of an upper respiratory tract infection and fever, and no foreign body is seen on examination.5. Correct. Here the ear drum is dull and bulging.", "img": ["images/14377f150e0c2ecf_0.jpg"]}, {"id": "ce4a9758d90c6d38", "m": "02", "n": 4, "q": "A 10-year-old boy presents with an intensely itchy rash, especially at night. Examination reveals excoriated papules and burrow marks on his hands, wrists, and between the fingers. The itching has spread to other family members. What is the most appropriate treatment?", "opts": ["A. Oral Antibiotics", "B. Topical corticosteroids", "C. Topical Permethrin for child and household members", "D. Topical Antifungal cream", "E. Oral antihistamine"], "ans": "C", "ansText": "C. Topical Permethrin for child and household members", "jx": "Treat patient and close contacts simultaneously.The nocturnal itch and distribution are classic for scabies caused by Sarcoptes scabiei. Treatment involves topical permethrin (or other scabicides) applied to the whole body (below the neck in older children, entire body in infants), and all close contacts must be treated simultaneously to prevent reinfestation.", "img": ["images/ce4a9758d90c6d38_0.jpg"]}, {"id": "5ed5660065eb4371", "m": "02", "n": 6, "q": "A 12-year-old boy develops fever and malaise followed by a rapidly progressing rash with blistering and painful erosions involving the oral mucosa and conjunctiva. He recently started taking an anticonvulsant for seizures. What is the most likely diagnosis?", "opts": ["A. Urticaria", "B. Erythema multiforme minor", "C. Stevens-Johnson syndrome", "D. Toxic epidermal necrolysis", "E. Morbiliform drug-induced exanthem"], "ans": "C", "ansText": "C. Stevens-Johnson syndrome", "jx": "Drug-induced severe mucocutaneous reaction (<10% BSA). TEN involves >30%.", "img": ["images/5ed5660065eb4371_0.jpg"]}, {"id": "6652e00fab409056", "m": "02", "n": 13, "q": "A 3-month-old infant presents with a raised, bright red lesion on the forehead that has enlarged rapidly over several weeks. The lesion was first noticed at 3 weeks of age. It is soft and compressible.What is the most likely diagnosis?", "opts": ["A. Capillary haemangioma (infantile haemangioma)", "B. Cavernous haemangioma", "C. Keloid", "D. Neurofibroma", "E. Dermoid cyst"], "ans": "A", "ansText": "A. Capillary haemangioma (infantile haemangioma)", "jx": "A. Infantile haemangioma – Correct. Features: Not always obvious at birth Rapid growth phase Bright red (“strawberry”) Spontaneous involution over yearsB. Cavernous haemangioma – Incorrect. Deeper, bluish lesion, not superficial bright red.C. Keloid – Incorrect. Scar tissue after trauma.D. Neurofibroma – Incorrect. Soft skin nodules associated with NF1.E. Dermoid cyst – Incorrect. Firm subcutaneous mass, not vascular.", "img": []}, {"id": "77c16465c64e2a48", "m": "02", "n": 22, "q": "A 5-year-old child presents with multiple small, umbilicated, flesh-colored papules on the trunk and arms. The lesions are not itchy or painful. The child’s sibling also has similar lesions. What is the most likely cause of this skin condition?", "opts": ["A. Bacterial infection", "B. Fungal infection", "C. Viral infection", "D. Allergic reaction", "E. Autoimmune condition"], "ans": "C", "ansText": "C. Viral infection", "jx": "Molluscum contagiosum is caused by poxvirus and spread by direct contact. It presents as umbilicated papules and is self-limiting. Awareness of its contagious nature and avoidance of shared items (towels, toys) are important preventive measures.", "img": ["images/77c16465c64e2a48_0.jpg"]}, {"id": "32402d20bd9e605e", "m": "02", "n": 25, "q": "A 6-month-old infant is brought to clinic because of a flat, pink patch at the nape of the neck present since birth. It becomes more noticeable when the baby cries. It has faded slightly since birth.What is the most likely diagnosis?", "opts": ["A. Port-wine stain", "B. Mongolian spot", "C. Salmon patch (nevus simplex)", "D. Infantile haemangioma", "E. Naevus sebaceous"], "ans": "C", "ansText": "C. Salmon patch (nevus simplex)", "jx": "A. Port-wine stain – Incorrect. Port-wine stains are permanent capillary malformations, darker red/purple, do not fade, and may be associated with Sturge-Weber syndrome if in trigeminal distribution.C. Salmon patch – Correct. Nevus simplex (“stork bite”) is a common benign capillary vascular lesion: Present at birth Flat, pink Often on nape of neck or glabella Becomes more prominent with crying Fades with timeB. Mongolian spot – Incorrect. These are bluish-grey patches over the sacrum, due to dermal melanocytosis — not pink vascular lesions.D. Infantile haemangioma – Incorrect. These are raised, proliferative lesions that enlarge rapidly after birth before involuting.E. Naevus sebaceous – Incorrect. Typically involves the scalp but can present on the face and upper body. Lesion is well circumscribed plaques. Benign and malignant tumours may arise in these naevi.", "img": []}, {"id": "7ca442f6a34bd02a", "m": "02", "n": 26, "q": "A 9-month-old infant is brought to the clinic for a persistent rash in the diaper area. What is the most likely diagnosis?", "opts": ["A. Candida infection", "B. Irritant dermatitis", "C. Seborrhoeic dermatitis", "D. Psoriasis", "E. Atopic eczema"], "ans": "B", "ansText": "B. Irritant dermatitis", "jx": "Candida involves skin folds + satellite lesions.Irritant napkin dermatitis commonly affects areas in direct contact with urine or feces, sparing the skin folds. The absence of satellite pustules differentiates it from Candida napkin dermatitis, which involves intertriginous areas with satellite lesions.", "img": ["images/7ca442f6a34bd02a_0.jpg"]}, {"id": "764c3b3638dbd03b", "m": "02", "n": 27, "q": "A newborn has a large unilateral red-purple stain covering the forehead and upper eyelid in the distribution of the ophthalmic branch of the trigeminal nerve.Which condition is most strongly associated with this lesion?", "opts": ["A. Infantile haemangioma", "B. Sturge-Weber syndrome", "C. Neurofibromatosis type 1", "D. Erythema toxicum", "E. Seborrhoeic dermatitis"], "ans": "B", "ansText": "B. Sturge-Weber syndrome", "jx": "A. Infantile haemangioma – Incorrect. Raised lesion appearing after birth, not a flat congenital capillary malformation.B. Sturge-Weber syndrome – Correct. Facial port-wine stain in V1 distribution is associated with: Leptomeningeal angiomas Seizures Developmental delay GlaucomaC. NF1 – Incorrect. Associated with café-au-lait spots, not port-wine stains.D. Erythema toxicum – Incorrect. Benign transient neonatal pustular rash.E. Seborrhoeic dermatitis – Incorrect. Yellow greasy scales on scalp.", "img": []}, {"id": "bf4b1cb57ebd43de", "m": "02", "n": 28, "q": "A previously well 8-year-old boy presents to the emergency department with a fever and arthralgia for 2 days, which is getting worse. On examination, he is noticed to have a painful, raised rash on his shins (Figure).Which of the following is the most likely cause?", "opts": ["A. Football injuries", "B. Henoch– Schönlein purpura", "C. Herpes simplex infection", "D. Mycoplasma pneumoniae infection", "E. Streptococcal infection"], "ans": "E", "ansText": "E. Streptococcal infection", "jx": "1. Injury alone would not explain the fever or arthralgia. The appearance here is not typical of bruising.2. Whilst joints are painful, the skin rash seen in HSP is not usually painful. The rash of HSP is characteristically seen over the buttocks.3. Herpes simplex can cause erythema multiforme. Erythema multiforme usually develops rapidly and often starts on the hands or feet. It initially consists of small red spots which may develop into raised patches a few centimetres in size with a dark red centre with a blister or crust surrounded by a pale pink ring and a darker outermost ring, giving them a target, or ‘bulls-eye’ appearance. They are sometimes itchy.4. Mycoplasma pneumoniae can cause erythema multiforme.5. Correct. This boy has erythema nodosum and the causes include streptococcal infection, primary tuberculosis, inflammatory bowel disease, drug reaction or idiopathic. It is usually painful upon palpation.", "img": ["images/bf4b1cb57ebd43de_0.jpg"]}, {"id": "630c53a68ff1b03f", "m": "02", "n": 36, "q": "Many rashes in childhood are itchy and can cause a lot of discomfort for the child.Which of the following rashes is least likely to be itchy?", "opts": ["A. Atopic eczema", "B. Chickenpox", "C. Infantile seborrhoeic dermatitis", "D. Pityriasis rosea", "E. Scabies"], "ans": "C", "ansText": "C. Infantile seborrhoeic dermatitis", "jx": "1. A key feature of eczema is itch. This causes the child to scratch, which exacerbates the condition and predisposes to local infection.2. This is very itchy, particularly in the healing phase. Scratching can lead to permanent scarring and is often treated with calamine lotion.3. Correct. The causes of itchy rashes are: atopic eczema, chickenpox, urticaria, allergic reactions, contact dermatitis, insect bites, scabies, fungal infections and pityriasis rosea. All the conditions listed in the question are itchy other than seborrhoeic dermatitis, which is not itchy.4. A typical feature is itch.5. If the itch is shared between household members, always consider scabies. Indeed, any persistent itchy rash should be considered as scabies until this has been excluded.", "img": []}, {"id": "dd7f479bf1f6d5ce", "m": "02", "n": 45, "q": "Vignette: A 3-year-old presents with fever 39°C for 48 hours. He is well and alert but miserable with reduced appetite. No vomiting, dislike of light or rash. No recent foreign travel and infection contactQuestion: Most likely cause?", "opts": ["A. Bacterial meningitis", "B. Viral infection", "C. Teething", "D. Heat exposure", "E. Malaria"], "ans": "B", "ansText": "B. Viral infection", "jx": "In well-appearing child in this age group with short duration fever and no focal signs → viral most likely.Teething does not cause high fever.", "img": []}, {"id": "60f7b2df34522796", "m": "02", "n": 47, "q": "Vignette: A 4-year-old presents to the emergency department with fever 40.5°C, lethargy and reduced interaction with parents. No clear focus identified during examination.Question: What must be urgently assessed?", "opts": ["A. Hydration status", "B. Skin rash", "C. Signs of meningitis", "D. Blood glucose level", "E. Travel history"], "ans": "C", "ansText": "C. Signs of meningitis", "jx": "High fever + lethargy → rule out CNS infection immediately.Other assessments important but secondary.", "img": []}, {"id": "0def1bfa4eae5527", "m": "02", "n": 63, "q": "Vignette: A well-appearing 6-month-old has fever 38.8°C. He has been feeding and playing normally. There are no significant respiratory or abdominal symptoms. Question: What is the most appropriate initial management for this infant?", "opts": ["A. Administer antibiotics", "B. Perform lumbar puncture", "C. Provide antipyretics and observation", "D. Admit for IV fluids", "E. Perform a full blood count and CRP"], "ans": "C", "ansText": "C. Provide antipyretics and observation", "jx": "Well child with mild fever → supportive care.", "img": []}, {"id": "718256dd28c140ed", "m": "03", "n": 33, "q": "An 800-g (1 lb 8 oz) newborn girl born at 28 weeks’ gestation is mechanically ventilated in a neonatal intensive care unit secondary to respiratory distress. After 1 week, her need for supplemental oxygen and ventilatory support has decreased, as measured by improvements in arterial blood gases and pH. She is maintained on low ventilator settings. However, at 2 weeks of age, her condition deteriorates, and her need for supplemental oxygen again increases. Physical examination is positive for bilateral, scattered crackles and rales on pulmonary auscultation as well as a systolic murmur. Blood cultures show no growth. A complete blood count shows a white blood count of 10,000/mm3, with 72% polymorphonuclear neutrophils and 12% lymphocytes. The infant remains afebrile. A chest radiograph reveals complete opacification of both lung fields, obscuring the heart borders and outline of the diaphragm.Which of the following is the likely cause of the deterioration of the patient’s condition?", "opts": ["A. Closure of the ductus arteriosus", "B. Development of a left-to-right shunt", "C. Development of a pneumothorax", "D. Exposure to a bacterial respiratory pathogen", "E. Exposure to a viral respiratory pathogen"], "ans": "B", "ansText": "B. Development of a left-to-right shunt", "jx": "1.Closure of the ductus arteriosus causes hypoxemia in children with certain heart or circulatory defects (e.g., parallel circulation). However, supplemental oxygen would be unlikely to help in these cases, and cyanosis would be present. It is more likely in this case that the child’s initial respiratory distress was caused by lung immaturity than by a congenital heart defect.2.Correct Patent ductus arteriosus is a common problem in premature infants because the smooth muscle in the wall of the preterm ductus is less responsive to high partial pressure of oxygen and therefore less likely to constrict after birth. A left-to-right shunt through the patent ductus arteriosis, developing usually in the second week of life in many premature, mechanically ventilated infants, can cause pulmonary hypertension and subsequent pulmonary edema. This would account for the increased oxygen demand and the chest radiograph findings in the absence of signs of infection seen in this infant.3.Pneumothoraces are common in mechanically ventilated newborns, particularly with high ventilator settings. However, a pneumothorax would most likely be visible on a chest radiograph as a fully radiolucent area in at least part of one lung field, and diaphragmatic and mediastinal shift could occur. It would not cause opacification of both lung fields and obscure the heart border as seen in this infant.4.Infection with bacterial pathogens such as Pseudomonas is common in patients on ventilators. Although this could account for increased respiratory distress and would not necessarily be found in a blood culture, it would be unlikely to manifest as pulmonary edema and generalized atelectasis and would likely cause some other sign of infection (e.g., sepsis with hypotension).5.Although newborns are susceptible to many viral pathogens, such pathogens are not the most likely cause of the child’s deterioration at this point. Although passive immunity is not as protective for premature infants as for full-term infants, many newborns may have at least partial protection against many viruses. Additionally, viral respiratory pathogens are unlikely to cause pulmonary edema.", "img": []}, {"id": "4c7a36162a699619", "m": "03", "n": 71, "q": "You are asked to review an infant, who is 4 hours of age. His antenatal scan revealed a ventricular septal defect.Which of the following would be the most sensitive marker of heart failure?", "opts": ["A. Cool peripheries", "B. Cyanosis", "C. Gallop rhythm", "D. Pansystolic murmur", "E. Tachypnoea"], "ans": "E", "ansText": "E. Tachypnoea", "jx": "1.Cool peripheries are a sign of heart failure. However, they tend to occur relatively late and there a number of causes. In a 4-hour-old baby this would be an insensitive and nonspecific finding.2.Most cases of heart failure in babies are as a result of a left-to-right shunt. This does not result in cyanosis.3.A very specific sign that is present in babies with heart failure. However, it is not particularly sensitive and its absence certainly does not rule out heart failure.4.A heart murmur is a sign of flow across a resistance. The presence, or intensity of a murmur is not a good guide to the presence of heart failure. Babies with large septal defects are more likely to develop heart failure but these babies often have quiet or even inaudible murmurs.5.Correct. Whilst tachypnoea is not a particularly specific finding, it is a sensitive marker of heart failure. Babies with heart failure have tachypnoea. This question is postgraduate level of difficulty.", "img": []}, {"id": "64a7ea3d664b156a", "m": "04", "n": 11, "q": "A 2-day-old infant is found to have a systolic murmur along the left sternal border during an examination. The infant was not cyanotic at birth and has not been cyanotic. The remainder of the physical examination is normal. An electrocardiogram (ECG) and chest radiograph are performed and no abnormalities are noted.Which of the following is the most likely diagnosis?", "opts": ["A. Patent ductus arteriosus (PDA)", "B. Tetralogy of Fallot (TOF)", "C. Transposition of the great vessels", "D. Tricuspid atresia", "E. Ventricular septal defect (VSD)"], "ans": "E", "ansText": "E. Ventricular septal defect (VSD)", "jx": "1.The murmur of a patent ductus arteriosus, also called persistent arterial duct, is typically continuous and described as “machine-like.” It is heard best in the left infraclavicular region. Theductus arteriosus is necessary during gestation to shunt blood from the pulmonary artery to the aorta, bypassing the unventilated lungs. At this time, the fetal pulmonary vascular resistance (PVR) is high (physiologic pulmonary hypertension), which allows the shunt to flow right to left. After the first breath of the neonate, the PVR drops and ductal flow reverses. The ductus then closes spontaneously over the next several hours or days in most individuals. If it remains patent in the 2nd-3rd week of life in the absence of other congenital cardiac lesions, it becomes pathologic and can lead to pulmonary hypertension and Eisenmenger syndrome. Clinically, patients with small PDAs will be asymptomatic, but those with larger shunts can have bounding pulses, wide pulse pressure due to decreased diastolic pressure, and signs of increasing heart failure.2.TOF is a congenital heart condition with four malformations: large VSD, right ventricular outflow tract obstruction due to pulmonary stenosis, overriding aorta, and right ventricular hypertrophy. The murmur is classically a harsh systolic ejection murmur - heard best in the pulmonary area but also audible throughout the chest - from turbulence across the right heart outflow obstruction. Clinical symptoms, namely cyanosis, are dependent on the degree of obstruction. If it is mild, ventricular shunting will be from left to right, and patients can remain acyanotic for many years. A bidirectional and then right-to-left shunt will emerge as the obstruction progresses, which causes cyanosislater on. Patientsborn with moderate or severe obstruction will have earlier right-to-left shunting and cyanosis. This obstruction can also worsen acutely in response to change in temperature, fever, illness, dehydration, or intense crying. Thus, patients often present with \"tetralogy spells,\"\" which include profound cyanosis, tachypnea, and dyspnea, and can be quickly life-threatening. Although the TOFconstellation includesa VSD, the TOF VSD is typically large, unrestrictive, and causes equalization of right- and left-heart pressures. Thus, it generates no sound.3.The most common type of transposition is called dextrotransposition and is characterized by atrioventricular concordance (atria and ventricles are correctly paired) and ventriculoarterial discordance (great vessels are incorrectly paired to ventricles). In other words, the aorta arises from the right ventricle, receives deoxygenated blood and returns it to the systemic circulation. The pulmonary artery arises from the left ventricle, receives oxygenated blood, and returns it to the lungs. As long as the arterial duct and/or foramen ovale remain patent, these two separate circulations can mix. But with closure of the natural shunts after birth, in the absence of other shunts like an ASD or VSD, transposition is associated with severe,progressive cyanosis and eventual death. Most neonates with this condition require immediate surgical correction, and IV administration of prostaglandin E1 can maintain ductal patency until the procedure is complete. These patients typically do not have chromosomal abnormalities but commonly have other anomalies like a VSD, pulmonary outflow tract obstruction, and/or coarctation. In patients without these additional anomalies, physical exam will include worsening cyanosis and a single loud second heart sound (S2).4.In tricuspid atresia, the tricuspid valve is either absent or permanently closed, blocking blood flow from the right atrium tothe right ventricle. These patients need a patent foramen ovale (PFO) or an ASD and a VSD or a PDA to survive. The PFO or ASD allows systemic blood to flow from the right to left atrium, mixing with oxygenated blood. If there is a VSD, blood from the left ventricle crosses into the right ventricle and pulmonary circulation to be oxygenated. If there is a PDA, blood from the aorta flows back into the pulmonary artery to be oxygenated. In either case, patients are cyanotic, have a small right ventricle, a normal or enlarged left ventricle, and decreased pulmonary blood flow. 50% develop symptoms by 24 hours of life. Auscultation can reveal a holosystolic VSD murmur or the continuous murmur of a PDA over the left lower sternal border, depending on which is present. EKG will typically show signs of left axis deviation, left ventricular hypertrophy, and right atrial enlargement.5.Correct VSD is the most common cardiac anomaly, occurring in 50% of all children with congenital heart disease, and in 20% as an isolated lesion. VSDs also have the highest recurrence rate and the highest association with teratogen exposure. Clinical presentation depends on the size: small VSDs are typically asymptomatic, and moderate to large VSDs can manifest with a holosystolic murmur and signs of congestive heart failure. Chest x-ray and ECG will typically be normal. Echocardiography is the appropriate test toconfirm the diagnosis as well as the size and location of the defect, although many isolated VSDs go undetected. Overall, about 40% of VSDs close spontaneously in the first year, and 60% resolve by age 5.Large defects are associated with much higher mortality; those with moderate to large VSDs should undergo surgical repair before age 1 year to avoid progression to right shunting. An acyanotic infant with a systolic murmur and a normal exam, EKG, and CXR is a classic presentation for a small VSD.", "img": []}, {"id": "c6ccbe8520f9473f", "m": "04", "n": 14, "q": "A 3-month-old infant, presents with breathlessness and sweating on feeding. He has had several chest infections. You suspect heart failure.Which of the following is most likely to be correct regarding his heart failure?", "opts": ["A. Hepatomegaly is not a common feature at this age", "B. It is caused by Eisenmenger syndrome", "C. It is due to left heart obstruction", "D. It is due to a left-to-right shunt", "E. It is due to an increase in right-to-left shunt"], "ans": "D", "ansText": "D. It is due to a left-to-right shunt", "jx": "1.Hepatomegaly is an important clinical feature of heart failure in children at all ages. Percussion of the upper border of the liver will help discriminate between hepatomegaly and downward displacement of a liver from hyperexpansion of the chest..2.Eisenmenger syndrome causes cyanosis from pulmonary hypertension, and usually occurs in the second decade of life.3.Only in the first week of life is heart failure usually from left heart obstruction, e.g. coarctation of the aorta.4.Correct. After the 1st week of life, progressive heart failure is most likely due to a left-to-right shunt, most often from a ventricular septal defect.5.It is due to increasing left-to-right shunt.", "img": []}, {"id": "ecc98fc2ac65514a", "m": "04", "n": 15, "q": "A 3-year-old boy is brought to his physician with fever of 1-week duration. The child is irritable but can be calmed by his mother. He has not been ill recently. On examination, temperature is 40 °C (104 °F), respiratory rate is 21/min, pulse is 120/min, and blood pressure is 90/70 mm Hg. There is nonpurulent conjunctivitis, notable pharyngeal erythema, and dry, cracked lips (see first figure). The tongue is also erythematous and appears to have a rough surface. There are no signs of nuchal rigidity. Cervical adenopathy is appreciated bilaterally, and the hands and feet are noted to have 2+ pitting edema (see second figure). There is a fine maculopapular rash covering most of the child's trunk and the extremities.What is the most appropriate therapy for this child?", "opts": ["A. Anti-staphylococcal antibiotic", "B. Anti-streptococcal antibiotic", "C. Immune globulin", "D. Symptomatic treatment", "E. Systemic corticosteroid"], "ans": "C", "ansText": "C. Immune globulin", "jx": "1.This therapy would be appropriate in the case of staphylococcal scalded skin syndrome (SSSS). In SSSS, there is acute onset of skin tenderness and diffuse small red papules, followed by the development of large, easily ruptured bullae with positive Nikolsky sign. Desquamation of large areas of skin occurs in thick sheets. Typical sites of involvement include the face, neck, and trunk, including axillae and groin. Treatment includes parenteral antibiotics, such as dicloxacillin, to eradicate Staph aureus, and appropriate wound care to prevent secondary effects of loss of skin barrier.2.This therapy would be appropriate in the case of scarlet fever. The classic presentation of scarlet fever includes abrupt onset of fever, chills, headache, sore throat, and vomiting. Within 12-48 hours, an exanthem begins on the trunk and spreads peripherally or cephalocaudally. The skin can be pruritic but is not tender. Tender cervical adenopathy and inflamed tonsils and/or uvula are common. During the first 2 days, the tongue becomes white with erythematous papillae projections (\"white strawberry tongue\"). The white layer then peels off, leaving a bright red, shiny tongue with prominent papillae (\"red strawberry tongue\"). Desquamation occurs even without treatment, and unlike SSSS, skin is shed in fine thin flakes. Treatment is normally a 10-day course of penicillin, or clindamycin in penicillin-allergic children.3.Correct This patient has Kawasaki disease, which is an acuteinflammatory disorder with vasculitis of small to medium vessels that can lead to coronary artery aneurysms. It is characterized by fever for at least 5 days, nonexudative conjunctivitis, mouth/lip changes, erythema or swelling of the extremities, cervical lymphadenopathy, and rash. Intravenous immune globulin given in the first 10 days of illness reduces the risk of developing coronary aneurysms and has a generalized anti-inflammatory effect. Primary treatment for Kawasaki disease also includes high-dose aspirin.4.This therapy might be appropriate when treating symptoms of a viral etiology, such as hand, food, and mouth disease. Hand, foot, and mouth disease is caused by coxsackie A virus. Classic presentation is fever and oral vesicular lesions progressing to superficial ulcers, followed by a characteristic skin eruption on the hands and/or soles of the feet. In the case of Kawasaki disease, sequelae such as coronary artery aneurysms are too serious to rely on symptomatic treatment alone.5.Systemic corticosteroids have not been found to have a consistent benefit in Kawasaki disease. They can be added to the treatment regimen in patients with immune globulin resistance or those at high risk for coronary artery aneurysms.", "img": ["images/ecc98fc2ac65514a_0.jpg"]}, {"id": "c6937df97edcd1f8", "m": "04", "n": 18, "q": "A 4 weeks old infant is being assessed for poor feeding and breathlessness. As part of his investigation he has an ECG performed ( see picture below ).What is the most likely cardiac defect?", "opts": ["A. Atrial septal defect", "B. Atrioventricular septal defect", "C. Coarctation of the aorta", "D. Pulmonary stenosis", "E. Ventricular septal defect"], "ans": "B", "ansText": "B. Atrioventricular septal defect", "jx": "1.A superior axis is occasionally seen in a child with an ostium secundum atrial septal defect. It is more common to see complete or partial right bundle branch block. Some children with secundum atrial septal defect do not have abnormal ECG findings.2.Correct. This ECG shows a superior QRS axis. The easiest way to spot this is to look at the overall sum of the QRS complex in AVF. Here it is negative, this means that it is pointing upwards. There are very few conditions which result in a superior axis.3.If undetected and untreated, coarctation of the aorta leads to left ventricular hypertrophy. However in early life, the ECG may be normal or show both left and right ventricular hypertrophy.4.Pulmonary stenosis can lead to right ventricular hypertrophy and right-axis deviation. In early life this pattern is normal.5.The left-to-right shunt might eventually lead to right or combined ventricular hypertrophy. In babies the ECG is often normal and clinical examination and echocardiography are the best ways to diagnose this.", "img": ["images/c6937df97edcd1f8_0.jpg"]}, {"id": "3ccbe089d8b1da60", "m": "04", "n": 19, "q": "A 4-month-old boy, sees his general practitioner for an ear infection. On listening to his chest a heart murmur is heard.Which one of the following features most suggests that it requires further investigation?", "opts": ["A. A thrill", "B. Disappearance of murmur on lying flat", "C. Murmur maximal at the left sternal edge", "D. Sinus arrhythmia", "E. Systolic murmur"], "ans": "A", "ansText": "A. A thrill", "jx": "1.Correct. A thrill is a palpable murmur, i.e. a loud murmur. It always requires further investigation.2.The disappearance of the murmur on lying flat is characteristic of a venous hum, which is innocent.3.Murmurs at the left sternal edge may be innocent or pathological. Further investigation is not indicated if the features of an innocent murmur are fulfilled.4.Sinus arrhythmia is a variation in heart rate with respiration and is a normal finding in children.5. Systolic murmurs may be innocent or pathological.Hallmarks of an innocent ejection murmur (all have an ‘S’ , therefore innoSent ) are:• as ymptomatic patient• Soft blowing murmur• Systolic murmur only, not diastolic• left Sternal edge.Additional requirements are:• normal heart sounds with no added sounds• no parasternal thrill• no radiation.Further investigation is not indicated under these circumstances.", "img": []}, {"id": "cb60ed64af58b246", "m": "04", "n": 23, "q": "A 6 weeks old infant is admitted directly from the cardiology clinic with heart failure. He has a large ventricular septal defect. The cardiologist has recommended treatment with furosemide and spironolactone. His mother wants to know why he has only now started to have problems.Which of the following statements provides the best explanation?", "opts": ["A. At birth and for the first few weeks the ductus arteriosus remained patent and this balanced the flow across the septal defect", "B. Pulmonary vascular resistance is increasing and blood is now flowing from right to left", "C. The left ventricle is now failing due to its progressive dilatation", "D. The pulmonary vascular resistance falls after birth and now flow from left to right across the septal defect is much greater", "E. Volume overload results in decreased return to the left ventricle and a reduction in cardiac output related to a reduced end-diastolic filling pressure"], "ans": "D", "ansText": "D. The pulmonary vascular resistance falls after birth and now flow from left to right across the septal defect is much greater", "jx": "1.A ventricular septal defect is not a ‘duct-dependent’ lesion. A widely open ductus will not prevent heart failure here.2.This is Eisenmenger syndrome and would not occur in a 6-week-old baby. It is a late complication of untreated ventricular septal defect/atrioventricular septal defect.3.Dilated cardiomyopathy is a very late change. In children with ventricular septal defect the heart remains healthy but heart failure occurs from volume overload.4.Correct. The pulmonary vascular resistance falls over the first few weeks of life. This increases the flow across the septal defect and leads to progressively worsening heart failure.5.Volume overload results in less efficient myocardial contraction, however end-diastolic filling pressure is increased. End-diastolic filling pressure is decreased in hypovolaemia.", "img": []}, {"id": "0dfe59a300c73e1a", "m": "04", "n": 24, "q": "A 6 years old boy presents to the emergency department feeling sick and dizzy. He was brought to hospital by a paramedic crew who were called after he became unwell at school. His heart rate was noted to be very quick, at 260 beats/min and supraventricular tachycardia is diagnosed. He says he can feel his heart beating quickly and looks pale. He is crying, saying he wants his mother.Which of the following should be undertaken by the attending team?", "opts": ["A. Adenosine via a large bore intravenous line", "B. Bilateral carotid sinus massage", "C. Direct current cardioversion", "D. Reassure that it will resolve spontaneously", "E. Vagal stimulation manoeuvre"], "ans": "E", "ansText": "E. Vagal stimulation manoeuvre", "jx": "1.This is likely to be effective but should be tried only after vagal manoeuvres have been undertaken.2.Whilst this might work, it should not be undertaken bilaterally as this might be dangerous.3.This is painful and even synchronized shock requires a general anaesthetic first.4.He is symptomatic and it should be treated.5.Correct. Instruct him how to perform a Valsalva manoeuvre – ask him to put his thumb in his mouth and try to blow on it like a trumpet; this often works. Other vagal manoeuvres include carotid sinus massage and cold ice pack application to the face.", "img": []}, {"id": "d19bbfc73b8e86b2", "m": "04", "n": 34, "q": "An infant is brought for a review at 2 weeks of age. He has only just regained his birthweight. His parents are concerned that his antenatally diagnosed septal defect is causing heart failure.Which would be the most specific marker of heart failure?", "opts": ["A. Peripheral cyanosis", "B. Gallop rhythm", "C. Loud pansystolic murmur", "D. Tachycardia", "E. Tachypnoea"], "ans": "B", "ansText": "B. Gallop rhythm", "jx": "1.Peripheral cyanosis (acrocyanosis) is a common finding in babies. It does occur in heart failure but would not be a specific finding.2.Correct. A third heart sound is a very specific marker of heart failure. Whilst it is not always present, if a third heart sound is present then it is likely that this baby has a degree of heart failure.3.A loud pansystolic murmur usually indicates that there is a small or medium-sized septal defect. Children with quieter murmurs are actually more likely to develop heart failure as softer murmurs are associated with larger defects.4.A sensitive marker of heart failure but there are so many possible causes that it is a nonspecific finding.5.A very sensitive marker of heart failure but there are so many possible causes that it is a rather unspecific finding. The wide range of normal can make this difficult to identify.", "img": []}, {"id": "6c37d2844cffa082", "m": "04", "n": 35, "q": "At 36 hours of life, a term female appears dusky and blue while feeding. Supplemental oxygen is given via nasal cannula, and she becomes tachypneic two hours later. On examination, pulse is 170 beats/min, respiratory rate is 80 breaths/min, blood pressure measurements of the right arm and right leg are 48/30 mm Hg and 52/32 mm Hg, respectively. Pulse oximetry reads 90% saturation on 4L supplemental oxygen. Hypoplastic left heart syndrome is diagnosed by a transthoracic echocardiogram.Which of the following abnormal heart sounds would be expected in this patient?", "opts": ["A. Continuous machine-like murmur, bounding pulses", "B. Continuous machine-like murmur, poor peripheral pulses", "C. Holosystolic murmur, poor peripheral pulses, quiet single S2", "D. Vague systolic murmur, precordial hyperactivity, loud single S2", "E. Vague systolic murmur, precordial hyperactivity, quiet single S2"], "ans": "D", "ansText": "D. Vague systolic murmur, precordial hyperactivity, loud single S2", "jx": "1.A typical patent ductus arteriosus (PDA) is a continuous, machine-likemurmur best heard over the left upper chest. If the PDA is moderate to large, pulses will be bounding as the parts of the large left sided stroke volume circulates back into the pulmonary arteries. This patient with hypoplastic left heart syndromeis becomingsicker because herductus arteriosus is not patent but closing.2.Same rationale as answer 13.Holosystolic murmur is typically heard with a ventricular septal defect (VSD) or with mitral or tricuspid regurgitation. Children with HLHS generally have a patent foramen ovale (PFO) or atrial septal defect (ASD) to allow left-to-right circulation. A loud, single S2 is heard (see answer D). Poor peripheral pulses are found in HLHS due to poor systemic circulation.4.Correct Infants with hypoplastic left heart syndrome develop signs of shock with cyanosis early in life (1-3 days) as the ductus arteriosus closes, which can accelerate with oxygen administration. The right ventricle has to pump to the pulmonary and systemic circulation through the PDA. The high stroke volumes cause an active precordium. The resulting pulmonary hypertension causes the loud S2. Often there is a vague, non-specific systolic murmur present. The closing ductus limits systemic circulation and causes poor pulses.5.In hypoplastic left heart syndrome, there is a loud, singleS2 from forceful pulmonic valve closure.", "img": []}, {"id": "e51cf7c48f6569e2", "m": "04", "n": 40, "q": "Vignette: A 14-year-old overweight boy has mild persistent hypertension (average BP between the 95th–99th percentile). He is asymptomatic, with no organ damage.Question: What is the most appropriate first-line management strategy?", "opts": ["A. ACE inhibitor", "B. Beta-blocker", "C. Lifestyle modification", "D. Renal ultrasound", "E. Diuretics"], "ans": "C", "ansText": "C. Lifestyle modification", "jx": "Initial management for mild hypertension: Weight reduction Physical activity ≥60 min/day Reduce salt intake Healthy dietMedication reserved if: Stage 2 hypertension Target organ damage Failure of lifestyle therapy", "img": []}, {"id": "7d24e6097354c3f2", "m": "04", "n": 41, "q": "Vignette: A 2-month-old infant presents with poor feeding, fast breathing, and failure to gain weight. On examination, there is a pansystolic murmur best heard at the left lower sternal border. Chest X-ray shows cardiomegaly and increased pulmonary vascular markings.Question: What is the most likely underlying cardiac defect?", "opts": ["A. Atrial septal defect", "B. Ventricular septal defect", "C. Patent ductus arteriosus", "D. Tetralogy of Fallot", "E. Pulmonary stenosis"], "ans": "B", "ansText": "B. Ventricular septal defect", "jx": "Left-to-right shunt → heart failure after pulmonary vascular resistance falls.", "img": []}, {"id": "b741dd040db19dfc", "m": "04", "n": 43, "q": "Vignette: A 3-year-old boy presents to the emergency department with palpitations and irritability. His heart rate is 240 bpm, regular. This is the trace on the cardiac monitor.Question: What is the most appropriate next step in management?", "opts": ["A. Intravenous Adenosine", "B. Intravenous Verapamil", "C. Digoxin infusion", "D. Asynchornised Cardioversion", "E. Intravenous Propranolol"], "ans": "A", "ansText": "A. Intravenous Adenosine", "jx": "Adenosine terminates AV nodal re-entrant tachycardia.Verapamil contraindicated in infants.", "img": ["images/b741dd040db19dfc_0.jpg"]}, {"id": "f3dbf242801be189", "m": "04", "n": 46, "q": "Vignette: A 4-year-old girl is found to have persistently elevated blood pressure during a pre-operative assessment. She is not obese. Examination reveals diminished femoral pulses and a systolic murmur.Question: What is the most likely cause of her hypertension?", "opts": ["A. Essential hypertension", "B. Coarctation of the aorta", "C. Renal parenchymal disease", "D. Pheochromocytoma", "E. White-coat hypertension"], "ans": "B", "ansText": "B. Coarctation of the aorta", "jx": "A. Essential hypertension – Incorrect. More common in obese adolescents.B. Coarctation – Correct. Clues: Young child (<6 years) Secondary hypertension more likely Weak/delayed femoral pulses MurmurCoarctation causes upper limb hypertension with lower limb hypoperfusion.C. Renal disease – Incorrect. Common cause but murmur and pulse findings point to cardiac origin.D. Pheochromocytoma – Incorrect. Rare; episodic headache, sweating, palpitations.E. White-coat hypertension – Incorrect. Would not cause pulse discrepancy.", "img": []}, {"id": "50167faaf175b52e", "m": "04", "n": 49, "q": "Vignette: A 5-year-old girl is brought in for evaluation of an incidentally identified heart murmur during a routine health check. She is asymptomatic, with normal growth and activity. The murmur is soft (grade 2/6), midsystolic, best heard at the left sternal border, and decreases when standing upright.Question: What is the most appropriate next step in management?", "opts": ["A. Echocardiogram", "B. ECG", "C. Reassure parents and discharge with no further investigation", "D. Antibiotic prophylaxis for infective endocarditis", "E. Restrict exercise till next review in 3 months"], "ans": "C", "ansText": "C. Reassure parents and discharge with no further investigation", "jx": "Innocent murmur characteristics: Soft Systolic Changes with posture No symptoms", "img": []}, {"id": "34f8b32946049d52", "m": "04", "n": 52, "q": "Vignette: A 6-month-old boy presents with bluish discoloration of lips and fingers noted since infancy, which worsens during crying. Cardiac examination reveals a harsh ejection systolic murmur along the left upper sternal border. ECG shows right ventricular hypertrophy.Question: What is the most likely diagnosis?", "opts": ["A. Transposition of the great arteries", "B. Tetralogy of Fallot", "C. Total anomalous pulmonary venous return", "D. Tricuspid atresia", "E. Pulmonary atresia"], "ans": "B", "ansText": "B. Tetralogy of Fallot", "jx": "Tetralogy of Fallot is the most common cause of cyanotic congenital heart disease beyond infancy. It features a harsh ejection systolic murmur (from RV outflow obstruction), cyanosis during crying, and ECG evidence of right ventricular hypertrophy.", "img": []}, {"id": "5ac9207c4916214a", "m": "04", "n": 60, "q": "Vignette: A newborn develops respiratory distress and poor perfusion within hours of birth. There is weak femoral pulse, differential cyanosis (pink upper body, blue lower limbs), and metabolic acidosis. Chest X-ray shows pulmonary congestion.Question: Which congenital heart defect is most consistent with this presentation?", "opts": ["A. Coarctation of the aorta", "B. Hypoplastic left heart syndrome", "C. Patent ductus arteriosus", "D. Atrial septal defect", "E. Pulmonary stenosis"], "ans": "B", "ansText": "B. Hypoplastic left heart syndrome", "jx": "Hypoplastic left heart syndrome presents early with shock and poor perfusion after ductal closure because systemic circulation depends on a patent ductus arteriosus. Differential cyanosis and weak femoral pulses indicate duct-dependent systemic circulation.", "img": []}, {"id": "4b887abd3323c2bf", "m": "04", "n": 64, "q": "Vignette: An 11-year-old boy presents with severe headache, vomiting, blurred vision, and confusion. BP is 180/120 mmHg. Fundoscopy reveals papilloedema.Question: What is the most appropriate management approach?", "opts": ["A. Oral ACE inhibitor", "B. IV sodium nitroprusside infusion", "C. Immediate rapid BP normalization", "D. Oral beta-blocker", "E. Brain MRI and lumbar puncture"], "ans": "B", "ansText": "B. IV sodium nitroprusside infusion", "jx": "This is hypertensive emergency with end-organ damage.Management: IV antihypertensive (nitroprusside or labetalol) Gradual reduction (≤25% in first 8 hours)Rapid normalization risks cerebral ischemia. Lumbar puncture should not be performed in a patient with hypertensive encephalitis and raised intracranial pressure.", "img": []}, {"id": "5dd22c83d357049f", "m": "04", "n": 67, "q": "Vignette: An otherwise healthy 10-year-old boy has elevated blood pressure readings during clinic visits (averaging in the 98th percentile), but his ambulatory blood pressure monitoring (ABPM) at home shows values below the 90th percentile.Question: What is the most appropriate diagnosis?", "opts": ["A. Primary hypertension", "B. Masked hypertension", "C. White-coat hypertension", "D. Secondary hypertension", "E. Prehypertension"], "ans": "C", "ansText": "C. White-coat hypertension", "jx": "White-coat hypertension = elevated clinic BP but normal ambulatory readings.Masked hypertension is the opposite pattern.", "img": []}, {"id": "86d42b0a9f6c5aba", "m": "05", "n": 44, "q": "Vignette: A 3-year-old boy presents with salivation, sweating, vomiting, diarrhea, and bradycardia after playing in his grandfather's farm shed. His pupils are constricted, and he is wheezing.Question: What is the most appropriate antidote for this poisoning?", "opts": ["A. Atropine", "B. Naloxone", "C. Diazepam only", "D. Flumazenil", "E. Methylene blue"], "ans": "A", "ansText": "A. Atropine", "jx": "Cholinergic toxidrome (SLUDGE): Salivation Lacrimation Urination Diarrhea GI upset EmesisAtropine blocks muscarinic receptors. Pralidoxime may also be used.This is a cholinergic toxidrome (SLUDGE: salivation, lacrimation, urination, defecation, GI upset, emesis), typically seen after organophosphate or carbamate exposure . Atropine is the antidote; it competitively blocks muscarinic acetylcholine receptors, reducing secretions and bronchoconstriction. Severe cases may also require pralidoxime (2-PAM) to reactivate acetylcholinesterase.", "img": []}, {"id": "63c9f883544793cd", "m": "05", "n": 48, "q": "Vignette: A 5-month-old infant was accidentally given 15 mL of paracetamol syrup three times daily instead of 1.5 mL for two days. He now presents with vomiting and lethargy. Liver enzymes are elevated.Question: What is the specific antidote?", "opts": ["A. Naloxone", "B. N-acetylcysteine", "C. Activated charcoal only", "D. Sodium bicarbonate", "E. Atropine"], "ans": "B", "ansText": "B. N-acetylcysteine", "jx": "A. Naloxone – Incorrect. Antidote for opioid overdose.B. N-acetylcysteine (NAC) – Correct. Paracetamol toxicity causes accumulation of NAPQI, a toxic metabolite that depletes glutathione and causes hepatocellular necrosis.NAC: Replenishes glutathione Prevents liver injury Should be given promptly if overdose suspectedC. Activated charcoal – Incorre
